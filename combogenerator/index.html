<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combinatore EC0 · NTC</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#F4F6F7;
    --surface:#FFFFFF;
    --surface-2:#EBEFF1;
    --ink:#17222B;
    --muted:#5C6B76;
    --line:#D6DEE2;
    --accent:#1B5C82;
    --accent-soft:#E4EEF3;
    --accent-ink:#0E3A52;
    --ok:#2F7D5C;
    --ok-soft:#E4F2EA;
    --warn:#8A5E12;
    --warn-soft:#FBF0DC;
    --crit:#B0443A;
    --crit-soft:#FAE6E3;
    --shadow: 0 1px 2px rgba(23,34,43,.06), 0 6px 16px rgba(23,34,43,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E161C;
      --surface:#14202A;
      --surface-2:#1B2933;
      --ink:#E7EEF2;
      --muted:#93A6B1;
      --line:#26363F;
      --accent:#6FB6DD;
      --accent-soft:#1D3745;
      --accent-ink:#D9EDF8;
      --ok:#57B98C;
      --ok-soft:#173226;
      --warn:#D8A64B;
      --warn-soft:#332608;
      --crit:#E17567;
      --crit-soft:#3A1D1A;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E161C;
    --surface:#14202A;
    --surface-2:#1B2933;
    --ink:#E7EEF2;
    --muted:#93A6B1;
    --line:#26363F;
    --accent:#6FB6DD;
    --accent-soft:#1D3745;
    --accent-ink:#D9EDF8;
    --ok:#57B98C;
    --ok-soft:#173226;
    --warn:#D8A64B;
    --warn-soft:#332608;
    --crit:#E17567;
    --crit-soft:#3A1D1A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:14.5px; line-height:1.5;
  }
  h1,h2,h3{font-family:'IBM Plex Sans',sans-serif; text-wrap:balance; margin:0;}
  .mono{font-family:'IBM Plex Mono','SFMono-Regular',monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}

  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 20px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .topbar .brand{display:flex; align-items:baseline; gap:10px; margin-right:auto;}
  .topbar h1{font-size:17px; font-weight:700; letter-spacing:.2px;}
  .topbar .sub{color:var(--muted); font-size:12.5px;}
  .seg{
    display:inline-flex; background:var(--surface-2); border:1px solid var(--line);
    border-radius:8px; padding:2px; gap:2px;
  }
  .seg button{
    border:0; background:transparent; color:var(--muted); font:inherit; font-weight:600;
    font-size:12.5px; padding:6px 12px; border-radius:6px; cursor:pointer;
  }
  .seg button.active{background:var(--accent); color:#fff;}

  .layout{
    display:grid; grid-template-columns:340px 1fr; gap:20px;
    max-width:1320px; margin:0 auto; padding:20px;
    align-items:start;
  }
  @media (max-width:880px){ .layout{grid-template-columns:1fr;} }

  .panel{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow);
  }
  aside.panel{ position:sticky; top:70px; max-height:calc(100vh - 90px); overflow:auto; }
  @media (max-width:880px){ aside.panel{ position:static; max-height:none; } }

  .block{ padding:16px 16px; border-bottom:1px solid var(--line); }
  .block:last-child{ border-bottom:0; }
  .block h3{ font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:10px; }

  label.field{ display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); margin-bottom:10px; }
  label.field:last-child{ margin-bottom:0; }
  select, input[type="text"], input[type="number"]{
    font:inherit; font-size:13.5px; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:7px; padding:7px 9px; width:100%;
  }
  input[type="number"]{ font-family:'IBM Plex Mono',monospace; }
  select:focus, input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .checkline{ display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:8px; }
  .checkline input{ width:15px; height:15px; }
  .checkline .valInput{ width:110px; margin-left:auto; }

  .rowcard{
    background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
    padding:10px; margin-bottom:8px;
  }
  .rowcard .rline{ display:flex; gap:6px; margin-bottom:6px; }
  .rowcard .rline:last-child{ margin-bottom:0; }
  .rowcard input, .rowcard select{ background:var(--surface); }
  .rowcard input.f-gruppo, .rowcard input.f-gruppo-sol, .rowcard input.f-gruppo-esc{ font-size:12px; }
  .rowcard .psi3{ display:flex; gap:6px; }
  .rowcard .psi3 label{ font-size:10px; color:var(--muted); display:flex; flex-direction:column; gap:2px; text-align:center; }
  .rowcard .psi3 input{ width:52px; text-align:center; padding:5px 2px; }
  .iconbtn{
    border:1px solid var(--line); background:var(--surface); color:var(--crit);
    border-radius:7px; width:30px; flex:0 0 30px; cursor:pointer; font-size:15px; line-height:1;
  }
  .iconbtn:hover{ background:var(--crit-soft); }
  .addbtn{
    width:100%; padding:8px; border-radius:8px; border:1px dashed var(--line);
    background:transparent; color:var(--accent); font:inherit; font-weight:600; font-size:12.5px;
    cursor:pointer; margin-top:2px;
  }
  .addbtn:hover{ background:var(--accent-soft); }
  .empty-hint{ color:var(--muted); font-size:12px; padding:4px 2px 8px; }

  main{ display:flex; flex-direction:column; gap:18px; min-width:0; }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); padding:18px 18px 16px;
  }
  .card > header{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; flex-wrap:wrap; }
  .card > header h2{ font-size:15.5px; }
  .card > header .eq-ref{ color:var(--muted); font-size:11.5px; }
  .card .note{ color:var(--muted); font-size:12px; margin:6px 0 12px; }

  .combo{
    border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-top:10px;
    display:flex; flex-direction:column; gap:6px; background:var(--surface);
  }
  .combo.governs-max{ border-color:var(--ok); background:var(--ok-soft); }
  .combo.governs-min{ border-color:var(--accent); background:var(--accent-soft); }
  .combo header{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .combo .tag{ font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; }
  .pill{
    font-size:10px; font-weight:600; padding:1px 7px; border-radius:99px; white-space:nowrap;
  }
  .pill-sfav{ background:var(--crit-soft); color:var(--crit); }
  .pill-fav{ background:var(--ok-soft); color:var(--ok); }
  .pill-acc{ background:var(--accent-soft); color:var(--accent-ink); }
  .pill-alt{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
  .chip{
    font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:2px 8px; border-radius:99px; background:var(--accent-soft); color:var(--accent-ink);
    margin-left:auto;
  }
  .chip.ok{ background:var(--ok); color:#fff; }
  .combo .formula{ font-size:13.5px; overflow-x:auto; white-space:nowrap; padding-bottom:2px; }
  .combo .subst{ font-size:12.5px; color:var(--muted); overflow-x:auto; white-space:nowrap; }
  .combo .result{ font-size:15px; font-weight:600; }
  .combo .result .missing{ color:var(--muted); font-weight:500; font-style:italic; font-size:12.5px; }

  .riepilogo .counts{ display:flex; flex-wrap:wrap; gap:6px 14px; margin:8px 0 2px; font-size:12.5px; color:var(--muted); }
  .riepilogo .counts .cnt{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .riepilogo .counts em{ font-style:normal; color:var(--ink); font-family:'IBM Plex Sans',sans-serif; }
  .alert{ font-size:12px; line-height:1.5; padding:9px 11px; border-radius:8px; margin-top:10px; border:1px solid; }
  .alert.warn{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn); }
  .alert.crit{ background:var(--crit-soft); color:var(--crit); border-color:var(--crit); }

  .summary-line{ font-size:12.5px; color:var(--muted); margin:6px 0 2px; }
  .summary-line strong{ color:var(--ink); font-family:'IBM Plex Mono',monospace; }
  details.combolist{ margin-top:10px; }
  details.combolist > summary{
    cursor:pointer; list-style:none; font-size:12.5px; font-weight:600; color:var(--accent);
    padding:6px 2px;
  }
  details.combolist > summary::-webkit-details-marker{ display:none; }
  details.combolist > summary::before{ content:"▸ "; }
  details.combolist[open] > summary::before{ content:"▾ "; }

  details.reftable{ border:1px solid var(--line); border-radius:12px; background:var(--surface); box-shadow:var(--shadow); }
  details.reftable > summary{ cursor:pointer; padding:14px 18px; font-weight:600; font-size:13.5px; list-style:none; display:flex; justify-content:space-between; }
  details.reftable > summary::-webkit-details-marker{ display:none; }
  details.reftable > summary::after{ content:"+"; color:var(--muted); font-weight:400; }
  details.reftable[open] > summary::after{ content:"–"; }
  .reftable .refbody{ padding:0 18px 18px; }
  table.tbl{ border-collapse:collapse; width:100%; font-size:12.5px; }
  table.tbl th, table.tbl td{ border:1px solid var(--line); padding:6px 9px; text-align:center; }
  table.tbl th{ background:var(--surface-2); font-weight:600; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  table.tbl td:first-child, table.tbl th:first-child{ text-align:left; }
  .tblwrap{ overflow-x:auto; margin-bottom:14px; }
  .tblwrap h4{ font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:600; }

  footer.src{ color:var(--muted); font-size:11.5px; padding:6px 4px 30px; line-height:1.7; }
  footer.src strong{ color:var(--ink); }

  /* --- Vista matrice: righe = combinazioni, colonne = casi di carico --- */
  .matrixhead{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0 8px; }
  .matrixhead .hint{ color:var(--muted); font-size:11.5px; }
  .copybtn{
    border:1px solid var(--line); background:var(--surface-2); color:var(--accent);
    font:inherit; font-weight:600; font-size:12px; padding:6px 12px; border-radius:7px; cursor:pointer;
    white-space:nowrap;
  }
  .copybtn:hover{ background:var(--accent-soft); border-color:var(--accent); }
  .copybtn.done{ background:var(--ok-soft); color:var(--ok); border-color:var(--ok); }
  .matrixwrap{ overflow:auto; max-height:72vh; border:1px solid var(--line); border-radius:9px; }
  table.matrix{
    border-collapse:separate; border-spacing:0; width:100%;
    font-family:'IBM Plex Mono','SFMono-Regular',monospace; font-variant-numeric:tabular-nums;
    font-size:12px; white-space:nowrap;
  }
  table.matrix th, table.matrix td{
    border-right:1px solid var(--line); border-bottom:1px solid var(--line);
    padding:5px 10px; text-align:right;
  }
  table.matrix th:last-child, table.matrix td:last-child{ border-right:0; }
  table.matrix thead th{
    background:var(--surface-2); color:var(--muted); font-weight:600; font-size:11px;
    font-family:'IBM Plex Sans',sans-serif; letter-spacing:.02em;
    position:sticky; top:0; z-index:2;
  }
  table.matrix th:first-child, table.matrix td:first-child{
    position:sticky; left:0; text-align:left; font-weight:600;
    background:var(--surface); z-index:1;
  }
  table.matrix thead th:first-child{ background:var(--surface-2); z-index:3; }
  table.matrix tbody tr:nth-child(even) td,
  table.matrix tbody tr:nth-child(even) td:first-child{ background:var(--surface-2); }
  table.matrix td.zero{ color:var(--muted); opacity:.4; }
  table.matrix td.res{ color:var(--accent-ink); font-weight:600; }
  table.matrix tbody tr:last-child td{ border-bottom:0; }

  /* --- Footer di pagina: disclaimer + link donazione --- */
  .sitefooter{
    max-width:1320px; margin:0 auto; padding:16px 20px 28px;
    display:flex; align-items:center; justify-content:center; gap:16px; flex-wrap:wrap;
    text-align:center;
  }
  .sitefooter p{ font-size:11.5px; color:var(--muted); line-height:1.5; margin:0; max-width:760px; }
  .sitefooter .coffee-link{
    display:inline-flex; align-items:center; gap:6px; flex:0 0 auto;
    border:1px solid var(--line); border-radius:8px; padding:6px 13px;
    color:var(--ink); text-decoration:none; font-weight:600; font-size:12.5px;
    background:var(--surface); white-space:nowrap;
  }
  .sitefooter .coffee-link:hover{ border-color:var(--accent); color:var(--accent); }

  /* --- Report per la stampa / PDF --- */
  .reportbtn{
    border:1px solid var(--accent); background:var(--accent); color:#fff;
    font:inherit; font-weight:600; font-size:12.5px; padding:7px 14px; border-radius:8px; cursor:pointer;
  }
  .reportbtn:hover{ filter:brightness(1.1); }
  #report{ display:none; }

  @media print{
    /* Palette chiara forzata: il tema scuro sprecherebbe inchiostro e renderebbe illeggibile la stampa. */
    :root, :root[data-theme="dark"], :root:not([data-theme="light"]){
      --bg:#fff; --surface:#fff; --surface-2:#f1f3f4; --ink:#000; --muted:#3d4a52;
      --line:#8a969c; --accent:#1B5C82; --accent-soft:#eaf1f5; --accent-ink:#0E3A52;
      --ok:#2F7D5C; --crit:#B0443A; --shadow:none;
    }
    @page{ size:A4; margin:15mm 12mm; }
    .topbar, .layout, .sitefooter{ display:none !important; }
    #report{ display:block !important; }
    body{ background:#fff; color:#000; font-size:9pt; }
  }

  #report h1{ font-size:17pt; letter-spacing:-.2px; margin-bottom:2mm; }
  #report .rmeta{ font-size:8.5pt; color:var(--muted); margin:0 0 5mm; padding-bottom:3mm; border-bottom:1.2pt solid var(--accent); }
  #report h2{
    font-size:12pt; margin:7mm 0 2mm; padding-bottom:1mm;
    border-bottom:0.6pt solid var(--line); break-after:avoid; page-break-after:avoid;
  }
  #report h3{ font-size:9.5pt; margin:4mm 0 1.5mm; break-after:avoid; page-break-after:avoid; }
  #report h3 .reqref{ font-weight:400; color:var(--muted); font-size:8pt; font-family:'IBM Plex Mono',monospace; }
  #report .rnote{ font-size:8pt; color:var(--muted); margin:1mm 0 2mm; line-height:1.45; }
  #report .rsummary{ font-size:8.5pt; margin:1mm 0 2mm; }
  #report .rlist{ font-size:8.5pt; margin:1mm 0 2mm; padding-left:5mm; }
  #report .rlist li{ margin-bottom:.8mm; }
  #report .rsection{ margin-bottom:5mm; }
  table.rtbl{
    width:100%; border-collapse:collapse; margin-bottom:3mm;
    font-family:'IBM Plex Mono','SFMono-Regular',monospace; font-variant-numeric:tabular-nums; font-size:7.5pt;
  }
  table.rtbl th, table.rtbl td{ border:0.4pt solid var(--line); padding:1mm 1.6mm; text-align:right; }
  table.rtbl th{ background:var(--surface-2); font-weight:600; font-family:'IBM Plex Sans',sans-serif; }
  table.rtbl th:first-child, table.rtbl td:first-child{ text-align:left; }
  table.rtbl th.lft, table.rtbl td.lft{ text-align:left; }
  .sublab{ font-size:0.82em; color:var(--muted); align-self:center; margin-right:auto; }
  .badge-exp{ display:inline-block; margin-left:8px; padding:1px 7px; border-radius:999px;
    font-size:0.72em; font-weight:600; letter-spacing:0.02em; vertical-align:middle;
    background:#fdf0d5; color:#7a4b00; border:1px solid #e5c07b; }
  @media print { .badge-exp{ background:#fff !important; color:#000 !important; } }
  /* l'intestazione si ripete su ogni pagina e nessuna riga viene spezzata a metà */
  table.rtbl thead{ display:table-header-group; }
  table.rtbl tr{ break-inside:avoid; page-break-inside:avoid; }

  /* --- selettore di lingua, guida --- */
  /* il selettore non deve occupare una riga intera quando la topbar va a capo */
  .langsel{ font:inherit; font-size:0.86rem; padding:5px 8px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer;
    width:auto; flex:0 0 auto; max-width:150px; }
  .guidabtn{ font:inherit; font-size:0.86rem; font-weight:600; padding:6px 12px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; }
  .guidabtn:hover{ background:var(--surface-2); }
  .helpbtn{ appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--muted);
    width:18px; height:18px; min-width:18px; border-radius:50%; font-size:11px; font-weight:700;
    line-height:1; cursor:pointer; padding:0; margin-left:6px; vertical-align:middle; }
  .helpbtn:hover{ background:var(--accent); color:#fff; border-color:var(--accent); }
  h3 .helpbtn{ margin-left:8px; }

  .guida-overlay{ position:fixed; inset:0; background:rgba(15,22,30,0.55); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; overflow:auto; }
  .guida-overlay[hidden]{ display:none; }
  .guida-panel{ background:var(--surface); color:var(--text); border:1px solid var(--line);
    border-radius:14px; width:min(980px,100%); max-height:calc(100vh - 48px);
    display:flex; flex-direction:column; overflow:hidden; box-shadow:0 18px 48px rgba(0,0,0,0.28); }
  .guida-head{ display:flex; align-items:center; gap:12px; padding:14px 18px;
    border-bottom:1px solid var(--line); }
  .guida-head h2{ margin:0; font-size:1.05rem; flex:1; }
  .guida-close{ appearance:none; border:0; background:transparent; color:var(--muted);
    font-size:24px; line-height:1; cursor:pointer; padding:0 4px; }
  .guida-close:hover{ color:var(--text); }
  .guida-nav{ display:flex; flex-wrap:wrap; gap:6px; padding:10px 18px;
    border-bottom:1px solid var(--line); background:var(--surface-2); }
  .guida-nav button{ font:inherit; font-size:0.8rem; padding:4px 10px; border-radius:999px;
    border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; }
  .guida-nav button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .guida-body{ padding:18px; overflow:auto; line-height:1.6; }
  .guida-body h3{ margin:22px 0 8px; font-size:0.95rem; }
  .guida-body h3:first-child{ margin-top:0; }
  .guida-body p{ margin:0 0 10px; max-width:72ch; }
  .guida-body ul{ margin:0 0 12px; padding-left:20px; max-width:72ch; }
  .guida-body li{ margin-bottom:6px; }
  .guida-body code{ font-family:var(--mono); font-size:0.9em; background:var(--surface-2); padding:1px 5px; border-radius:4px; }
  .guida-body .gnote{ border-left:3px solid var(--accent); background:var(--surface-2);
    padding:10px 12px; margin:0 0 12px; max-width:72ch; }
  @media print { .guida-overlay{ display:none !important; } }
</style>
</head>
<body>


<div class="topbar">
  <div class="brand">
    <h1>Combinatore EC0 · NTC · ASCE</h1>
    <span class="sub" id="brandSub"></span>
  </div>
  <div class="seg" id="segNormativa" role="group" data-i18n-aria="aria.normativa">
    <button data-val="NTC2018">NTC 2018</button>
    <button data-val="EC0" data-i18n="seg.ec0"></button>
    <button data-val="ASCE722">ASCE 7-22</button>
    <button data-val="ASCE716">ASCE 7-16</button>
  </div>
  <div class="seg" id="segVista" role="group" data-i18n-aria="aria.vista">
    <button data-val="testo" data-i18n="seg.testo"></button>
    <button data-val="matrice" data-i18n="seg.matrice"></button>
  </div>
  <select id="selLingua" class="langsel" aria-label="Language"></select>
  <button id="btnGuida" class="guidabtn" data-i18n="btn.guida" data-i18n-title="btn.guidaTitle"></button>
  <button id="btnReport" class="reportbtn" data-i18n="btn.report" data-i18n-title="btn.reportTitle"></button>
</div>

<div id="guidaOverlay" class="guida-overlay" hidden>
  <div class="guida-panel" role="dialog" aria-modal="true" aria-labelledby="guidaTitolo">
    <header class="guida-head">
      <h2 id="guidaTitolo" data-i18n="guida.titolo"></h2>
      <button id="btnGuidaChiudi" class="guida-close" data-i18n-title="guida.chiudi">×</button>
    </header>

, a scopo informativo. Non sostituisce il giudizio professionale di un ingegnere qualificato, né le verifiche di legge o la revisione tecnica del progetto. L'autore non si assume alcuna responsabilità per l'uso dei risultati contenuti in questo documento in un progetto reale o in qualsiasi altra applicazione: l'uso è interamente a proprio rischio, previa verifica indipendente.", "esempio.perm": "G1 — peso proprio", "esempio.var": "Q1 — esercizio", "g.ascecarichi.b": "<p>Ogni caso di carico va associato al suo tipo normativo, perché è il tipo a determinare quale coefficiente riceve in ciascuna equazione:</p><ul><li><strong>D</strong> permanente · <strong>L</strong> variabile di piano · <strong>L<sub>r</sub></strong> variabile di copertura</li><li><strong>S</strong> neve · <strong>R</strong> pioggia · <strong>W</strong> vento · <strong>W<sub>T</sub></strong> tornado (solo 7-22)</li><li><strong>F</strong> fluidi a pressione e altezza definite: prende lo stesso coefficiente di D</li><li><strong>H</strong> spinta del terreno o dell'acqua di falda: vedi sotto</li></ul><p>Per i casi <strong>H</strong> la norma distingue tre situazioni e lo strumento te le fa scegliere caso per caso: spinta che <em>accresce</em> l'effetto principale (1,6H allo Strength Design, 1,0H all'ASD); spinta <em>permanente e resistente</em> (0,9H / 0,6H); spinta <em>resistente ma non permanente</em>, che va posta a zero. Quale sia quella corretta dipende dalla verifica in esame.</p><div class=\"gnote\"><strong>La neve cambia significato fra le due edizioni.</strong> In 7-16 S è il valore nominale; in 7-22 le mappe sono state ricalibrate a livello ultimo, quindi S vale già di più e nelle equazioni porta coefficienti diversi. Attenzione quando importi i carichi da un modello FEM.</div>", "g.ascecarichi.t": "ASCE 7 — tipi di carico", "g.asceecc.b": "<p><strong>Fattore su L ridotto (§2.3.1 Ecc. 1).</strong> Nelle combinazioni 3 e 4 il coefficiente su L può valere 0,5 anziché 1,0 dove il carico variabile tabellare L<sub>0</sub> non supera 100 psf (4,79 kN/m²). Sono <strong>escluse</strong> le autorimesse e gli ambienti di pubblico assembramento. La casella va spuntata solo dopo aver verificato che il caso rientri.</p><p><strong>Eccezione tornado.</strong> In ASCE 7-22, dove si usa il carico W<sub>T</sub>, la neve esce dalla combinazione: il tornado è un fenomeno di stagione calda e la neve non è concomitante. Lo strumento lo applica sia allo Strength Design (comb. 4a, §2.3.1 Ecc. 3) sia all'ASD (comb. 6a, §2.4.1).</p><div class=\"gnote\">La differenza fra le edizioni nelle parentesi non è cosmetica. 7-16 scrive 1,6(L<sub>r</sub> o S o R), con un solo coefficiente per il gruppo; 7-22 scrive (1,6L<sub>r</sub> o 1,0S o 1,6R), con un coefficiente per alternativa, perché la neve è già a livello ultimo.</div>", "g.asceecc.t": "ASCE 7 — eccezioni applicate", "g.ascemetodo.b": "<p>Il motore americano è costruito in modo <strong>completamente diverso</strong> da quello europeo, e la differenza non è solo nei coefficienti.</p><p>ASCE 7 non ha una regola generativa: ha una <strong>lista fissa di equazioni</strong>. La concomitanza fra i carichi è già scritta dentro l'equazione, non esiste alcuna azione dominante che ruota e <strong>non esistono i coefficienti ψ</strong>. Le categorie A÷H delle NTC qui non servono a nulla.</p><p>L'unica combinatoria è l'espansione delle parentesi «oppure»: una combinazione come 1,2D + 1,6(L<sub>r</sub> oppure S oppure R) genera tante righe quante sono le alternative, ma solo per i tipi di carico che hai effettivamente inserito.</p><p><strong>LRFD</strong> (§2.3) e <strong>ASD</strong> (§2.4) sono metodi alternativi. Nelle combinazioni ASD il fattore 0,75 sui carichi di accompagnamento è già moltiplicato nei coefficienti mostrati: 0,75 × 0,6W compare come 0,45W.</p><div class=\"gnote\">Con le combinazioni ASD di base <strong>non è ammesso alcun aumento delle tensioni ammissibili</strong>.</div>", "g.ascemetodo.t": "ASCE 7 — come funziona", "g.asceorto.b": "<p>La casella 100/30 fa ruotare le due componenti orizzontali: una al 100% e l'altra al 30%, con tutte le combinazioni di segno. Con due componenti inserite si ottengono otto schemi per ogni equazione sismica.</p><div class=\"gnote\"><strong>Non è una regola da applicare sempre.</strong> Il §12.5 distingue la procedura direzionale indipendente (§12.5.1.1) dalla combinazione ortogonale (§12.5.1.2), e quale si applichi dipende dalla categoria di progetto sismico e dalla configurazione della struttura (§12.5.3, §12.5.4). Lo strumento non lo decide: verifica l'applicabilità prima di spuntare la casella.</div>", "g.asceorto.t": "ASCE 7 — effetti ortogonali", "g.ascerho.b": "<p>Sono due parametri che <strong>lo strumento non determina</strong> e non può determinare: dipendono dal sistema strutturale e dalla categoria di progetto sismico.</p><p><strong>ρ — redundancy factor (§12.3.4).</strong> Va ricavato secondo il §12.3.4, che in diversi casi impone ρ = 1,3. Lo strumento non verifica le condizioni che consentono ρ = 1,0: usa il valore che inserisci così com'è. Se lo lasci vuoto assume 1,0 e lo segnala.</p><p><strong>Ω<sub>0</sub> — fattore di sovraresistenza.</strong> È tabellato nella Tab. 12.2-1 in funzione del sistema resistente. Serve alle combinazioni con E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub>, richieste per certi elementi. Ω<sub>0</sub> = 1 non equivale automaticamente ad «assenza di sovraresistenza».</p><div class=\"gnote\">Il §12.4.3 consente di limitare E<sub>mh</sub> al valore derivante dalla capacità dell'elemento che plasticizza. <strong>Quel limite non è applicato</strong> dallo strumento.</div>", "g.ascerho.t": "ASCE 7 — ρ e Ω₀", "g.ascesisma.b": "<p>In ASCE 7 l'azione sismica non è un dato unico. L'effetto E si compone di due parti:</p><ul><li><strong>E<sub>h</sub> = ρ·Q<sub>E</sub></strong> — l'effetto orizzontale, dove Q<sub>E</sub> è quello che ottieni dall'analisi</li><li><strong>E<sub>v</sub> = 0,2·S<sub>DS</sub>·D</strong> — l'effetto verticale, che <em>non</em> è un carico separato: è proporzionale al permanente</li></ul><p>Per questo E<sub>v</sub> non compare come colonna: viene incorporato nel coefficiente delle azioni di tipo D, sommato nelle combinazioni 6, 8 e 9 e sottratto nelle 7 e 10. Alle azioni di tipo F non viene applicato.</p><p>Se lasci S<sub>DS</sub> vuoto, E<sub>v</sub> viene assunto pari a zero e lo strumento te lo segnala. La casella «E<sub>v</sub> = 0» serve a dichiarare quella scelta esplicitamente, come ammesso per le fondazioni con le alternative IBC e nei casi del §12.4.2.2.</p><div class=\"gnote\">Q<sub>Ex</sub> e Q<sub>Ey</sub> devono essere effetti già ottenuti dall'analisi e riferiti alla <strong>medesima grandezza di risposta</strong>.</div>", "g.ascesisma.t": "ASCE 7 — sisma", "g.doppiosegno.b": "<p>Sono azioni presenti in <em>ogni</em> combinazione, con coefficiente fisso e con entrambi i versi. Ogni azione a doppio segno raddoppia il numero di combinazioni: n azioni lo moltiplicano per 2ⁿ.</p><p>Il caso tipico sono le <strong>imperfezioni geometriche equivalenti</strong> (EN 1993-1-1 §5.3), che vanno applicate nel verso che aggrava l'effetto in esame. Se il valore deriva da carichi già amplificati (F = φ·N<sub>Ed</sub>) il coefficiente allo SLU è 1 e agli SLE vale tipicamente 1/γ<sub>Q</sub>.</p><div class=\"gnote\">Il coefficiente e l'applicabilità a ciascuno stato limite <strong>restano una scelta del progettista</strong>: il trattamento delle imperfezioni dipende dal metodo di analisi e dal modello adottato.</div>", "g.doppiosegno.t": "Azioni a doppio segno (±)", "g.ecazioni.b": "<p>Ogni azione permanente ha un tipo: <strong>G1</strong> strutturale, <strong>G2</strong> non strutturale, <strong>P</strong> precompressione. Il tipo determina i coefficienti parziali applicati.</p><p>Il campo <strong>gruppo di origine</strong> serve al principio della sorgente unica (EN 1990 §6.4.3.2(4)): le azioni permanenti che derivano dalla stessa origine fisica devono prendere <em>tutte</em> γ<sub>sup</sub> oppure <em>tutte</em> γ<sub>inf</sub>, mai versi misti. Scrivendo lo stesso nome di gruppo su più azioni, queste si muovono insieme e contano come una sola nella combinatoria.</p><p>Per la precompressione il coefficiente γ<sub>P</sub> è posto pari a 1,0 salvo diversa valutazione specifica (NTC 2018 §2.6.1; per γ<sub>P</sub>=1,2 su ancoraggi locali si veda anche §4.1.8.1.1).</p>", "g.ecazioni.t": "EC0 / NTC — azioni permanenti", "g.eccezionale.b": "<p>Il valore A<sub>d</sub> (urto, esplosione, incendio) va definito dall'analisi specifica dell'azione eccezionale: lo strumento non lo determina.</p><p>Con <strong>NTC 2018</strong> l'eq. 2.5.6 impone ψ<sub>2</sub> per <em>tutte</em> le variabili, senza variabile dominante.</p><p>Con <strong>EN 1990</strong> puoi scegliere: eq. 6.11b con ψ<sub>2</sub> per tutte, oppure eq. 6.11a con una variabile dominante a ψ<sub>1</sub>, che rappresenta la verifica «durante» l'evento — per esempio un incendio in corso.</p>", "g.eccezionale.t": "Combinazione eccezionale", "g.ecgruppi.b": "<p>Le azioni variabili hanno <strong>due campi di gruppo indipendenti</strong>, che servono a cose diverse.</p><ul><li><strong>Gruppo solidale</strong>: le azioni con lo stesso nome sono sempre attive insieme e con lo stesso ruolo, come se fossero una sola azione. Esempio: la neve calcolata automaticamente e quella applicata a mano su una parte di copertura.</li><li><strong>Gruppo esclusivo</strong>: le azioni con lo stesso nome sono alternative fra loro, al più una attiva per combinazione. Esempio: vento in direzione X e vento in direzione Y, oppure dilatazione e contrazione termica.</li></ul><p>I due livelli si combinano: un gruppo solidale può essere <em>una delle alternative</em> di un gruppo esclusivo. Assegnare azioni dello stesso gruppo solidale a gruppi esclusivi diversi è incoerente e lo strumento lo segnala in rosso.</p><div class=\"gnote\"><strong>Le due caselle di indipendenza</strong> decidono quante combinazioni nascono. Disattivandole si ottiene l'insieme minimo (tutte le permanenti sfavorevoli, tutte le variabili attive a rotazione della dominante); attivandole ogni azione può anche essere favorevole o esclusa, e il numero di combinazioni cresce come 2ⁿ. Con il gruppo esclusivo e l'indipendenza disattivata, una delle alternative è <em>sempre</em> presente.</div>", "g.ecgruppi.t": "EC0 / NTC — gruppi di variabili", "g.ecminima.b": "<p>È una combinazione di comodo: permanenti nel verso favorevole con i γ minimi, variabili tutte nulle. Serve a esplorare il minimo dell'inviluppo, tipicamente per i problemi di sollevamento.</p><div class=\"gnote\"><strong>Non sostituisce una verifica EQU.</strong> In una verifica di equilibrio ogni azione va classificata come stabilizzante o destabilizzante rispetto allo specifico meccanismo, e anche le variabili possono essere stabilizzanti. Questa utility non lo fa al posto tuo.</div>", "g.ecminima.t": "EC0 / NTC — combinazione minima", "g.ecnorma.b": "<p>Il motore europeo è <strong>generativo</strong>: applica la regola γ<sub>G</sub>·G + γ<sub>Q</sub>·Q<sub>k1</sub> + Σ γ<sub>Q</sub>·ψ<sub>0</sub>·Q<sub>ki</sub> facendo ruotare l'azione dominante fra tutte le variabili attive.</p><p>Con <strong>NTC 2018</strong> scegli l'approccio dalla Tab. 2.6.I: EQU per l'equilibrio, A1 per le verifiche strutturali (il caso più comune per gli edifici), A2 per le geotecniche.</p><p>Con <strong>EN 1990 generico</strong> scegli l'equazione: 6.10 unica, oppure l'inviluppo 6.10a/6.10b. In 6.10b le permanenti sfavorevoli sono ridotte dal fattore ξ, qui posto pari a 0,85 come raccomandato dal CEN: <strong>l'Annesso Nazionale applicabile può fissarne uno diverso</strong>, verificalo.</p><div class=\"gnote\">Con l'approccio A2 lo strumento applica solo i coefficienti sulle azioni. Una verifica geotecnica completa richiede anche i coefficienti sui parametri del terreno (M1/M2) e sulle resistenze (R1/R2/R3), che non vengono generati.</div>", "g.ecnorma.t": "EC0 / NTC — approccio", "g.ecsisma.b": "<p>Inserisci gli effetti sismici Ex, Ey ed Ez già ottenuti dall'analisi. Con una sola direzione compilata si ottengono le due combinazioni ±E.</p><p>Con più direzioni, di default ciascuna è considerata separatamente. Spuntando la <strong>regola del 30%</strong> (NTC 2018 §7.3.5) le componenti vengono ruotate: una a coefficiente 1,00 e le altre a 0,30, con tutte le combinazioni di segno.</p><div class=\"gnote\">Ex, Ey ed Ez devono essere effetti riferiti alla <strong>medesima grandezza di verifica</strong>. Lo strumento somma scalari: non sta facendo una composizione vettoriale delle azioni sismiche.</div>", "g.ecsisma.t": "EC0 / NTC — sisma", "g.export.b": "<p>La <strong>vista Matrice</strong> mette i casi di carico in colonna e le combinazioni in riga, con i coefficienti nelle celle. Il pulsante di copia esporta tutto in formato TSV: si incolla direttamente in Excel o nei software FEM che importano testo tabulato. La tabella a video è troncata per prestazioni, ma la copia contiene sempre tutte le combinazioni.</p><p>Il <strong>separatore decimale</strong> vale per la vista matrice e per la copia: virgola per Excel italiano, punto per i software FEM e per Excel in lingua inglese.</p><p>I coefficienti sono esportati con quattro decimali, perché sono prodotti di più fattori: ξ·γ<sub>G</sub> vale 1,1475 e arrotondarlo a 1,15 introdurrebbe un errore.</p><p>Il <strong>Report PDF</strong> compone un documento con normativa, ipotesi di generazione, casi di carico, coefficienti, equazioni utilizzate per esteso e tutte le combinazioni, poi apre la finestra di stampa del browser: scegli «Salva come PDF». Riportando le equazioni per esteso, il documento è verificabile da chi lo riceve senza avere lo strumento aperto.</p>", "g.export.t": "Esportare i risultati", "g.ibc.b": "<p>Dal 2021 l'IBC ha cancellato dal §1605 le proprie copie delle combinazioni di resistenza e delle ASD di base, rimandando ad ASCE 7. Quello che ha conservato è il set <strong>alternativo</strong> ASD, eq. 16-1 ÷ 16-6, che questo strumento genera su richiesta. L'edizione segue quella ASCE scelta: 7-16 → IBC 2021, 7-22 → IBC 2024.</p><p>Il fattore ω è stato <strong>eliminato</strong> dall'IBC 2021: il vento entra semplicemente come 0,6W.</p><p>L'aumento di 1/3 delle tensioni ammissibili non è concesso dall'IBC in proprio: il §1605.2 rimanda alla norma di materiale. AISC 360 (acciaio) e TMS 402 (muratura) lo hanno eliminato, ACI 318 non prevede l'ASD. In pratica resta per il legno, dove però il meccanismo è il fattore C<sub>D</sub> dell'NDS, e per le portanze geotecniche.</p><div class=\"gnote\"><strong>Questa sezione è marcata come sperimentale.</strong> Le equazioni 16-1 ÷ 16-4 sono verificate; le 16-5 e 16-6 contengono un'interpretazione dello strumento sul trattamento di E<sub>v</sub>. Confrontale con l'edizione ufficiale dell'IBC prima di usarle in un calcolo.</div>", "g.ibc.t": "IBC — combinazioni ASD alternative", "g.limiti.b": "<p>Vale la pena essere espliciti sui confini.</p><ul><li><strong>Non determina i carichi.</strong> Valori caratteristici, effetti sismici, azioni eccezionali: li inserisci tu, ricavati dall'analisi.</li><li><strong>Non esegue le verifiche</strong> di resistenza, stabilità o esercizio.</li><li><strong>Somma valori scalari</strong> riferiti alla stessa grandezza. Non compone vettori.</li><li><strong>Non sa se un caso di carico sia pertinente</strong> allo scenario: espande le alternative previste dall'equazione per i tipi che hai inserito, ma l'applicabilità resta una tua valutazione.</li><li><strong>Per ASCE 7 copre il nucleo del Chapter 2</strong>: combinazioni di base (§2.3.1, §2.4.1) e sismiche (§2.3.6, §2.4.5). Restano fuori alluvione (§2.3.2 / §2.4.2), ghiaccio atmosferico (§2.3.3 / §2.4.3), effetti autotensionanti T (§2.3.4 / §2.4.4), carichi non specificati (§2.3.5), eventi straordinari (§2.5) e integrità strutturale (§2.6).</li><li><strong>Per le verifiche geotecniche</strong> applica solo i coefficienti sulle azioni, non quelli sui parametri del terreno né sulle resistenze.</li></ul><div class=\"gnote\">Due punti normativi recenti provengono da fonti istituzionali ma non dal testo ASCE a pagamento: il coefficiente 0,1S nella combinazione 9 del §2.4.5 di 7-22 (presentazione ufficiale ICC sul 2024 IBC / ASCE 7-22, e presentazione SEAU) e l'Eccezione 3 del §2.3.1 sull'uso di W<sub>T</sub> (guida NIST/FEMA sui carichi da tornado). Se il progetto lo richiede, riscontrali sulla copia ufficiale.</div>", "g.limiti.t": "Cosa lo strumento non fa", "g.start.b": "<p>Lo strumento genera le combinazioni di carico per le verifiche strutturali. Non calcola i carichi e non esegue le verifiche: combina valori che gli fornisci tu.</p><ul><li><strong>Scegli la normativa</strong> in alto: NTC 2018, EN 1990 generico, ASCE 7-22 o ASCE 7-16. Il pannello a sinistra cambia di conseguenza, perché i due mondi funzionano in modo diverso.</li><li><strong>Inserisci i casi di carico</strong> con il loro valore caratteristico.</li><li><strong>Leggi i risultati</strong> a destra: si aggiornano a ogni modifica, non c'è nessun pulsante «genera».</li><li><strong>Esporta</strong> con la vista Matrice (copia TSV per Excel o per il software FEM) oppure con il Report PDF.</li></ul><div class=\"gnote\"><strong>Lo strumento somma valori scalari.</strong> Tutti i valori inseriti devono riferirsi alla medesima grandezza di verifica: combinare una reazione con un momento non ha significato. Se ti serve l'inviluppo su più grandezze, esegui una sessione per grandezza.</div><p>I dati restano nel tuo browser e non vengono inviati a nessun server. Chiudendo e riaprendo la pagina li ritrovi.</p>", "g.start.t": "Primi passi", "guida.chiudi": "Chiudi", "guida.titolo": "Guida all'uso", "help.apri": "Apri la guida su questo argomento", "hint.asce": "Nessun caso di carico inserito.", "hint.doppioSegno": "Nessuna azione a doppio segno inserita.", "hint.matrice": "Colonne = casi di carico · righe = combinazioni · celle = coefficienti. Incolla in Excel o nel software FEM.", "hint.permanenti": "Nessuna azione permanente inserita.", "hint.variabili": "Nessuna azione variabile inserita.", "lbl.approccioEC": "Equazione (EN 1990 Annex A1)", "lbl.approccioNTC": "Approccio (Tab. 2.6.I NTC 2018)", "lbl.decimale": "Separatore decimale (vista matrice e copia)", "lbl.dominante": "{nome} dominante", "lbl.eccNtc": "Ad + permanenti + variabili a ψ2", "lbl.metodo": "Metodo", "lbl.nessunoParen": "(nessuno)", "lbl.ruoloH": "Ruolo di H", "lbl.soloPermanenti": "solo permanenti", "lbl.tuttiPsi2": "Tutte le variabili a ψ2", "lbl.unicaVariabile": "unica variabile", "lbl.unita": "Unità di misura (solo visualizzazione)", "msg.valoriMancanti": "inserisci tutti i valori caratteristici per il risultato numerico", "nota.f": "I casi di tipo F prendono lo stesso fattore del permanente D, come prescritto dalle note al §2.3.1 / §2.4.1.", "nota.h": "Per i casi di tipo H la norma distingue tre situazioni: la spinta che accresce l'effetto principale (1,6H allo Strength Design, 1,0H all'ASD), quella permanente e resistente (0,9H / 0,6H) e quella resistente ma non permanente, che va posta a zero. Quale sia quella corretta dipende dalla verifica in esame e resta una valutazione del progettista.", "nota.hRuoli": "Ruolo assegnato ai casi H:", "nota.lRidotta": "Applicata l'Eccezione 1 del §2.3.1: fattore su L pari a 0,5 nelle combinazioni 3 e 4.", "nota.parentesi722": "In 7-22 le parentesi non sono più fattorizzate come gruppo: la neve è già a livello ultimo, quindi ogni alternativa porta il proprio coefficiente.", "nota.tornadoASD": "<strong>Eccezione tornado applicata:</strong> nella combinazione 6a, dove si usa W<sub>T</sub>, la parentesi 0,75(L<sub>r</sub> o 0,7S o R) si riduce a 0,75(L<sub>r</sub> o R) — il tornado è un fenomeno di stagione calda e la neve non è concomitante.", "nota.tornadoLRFD": "<strong>Eccezione 3 del §2.3.1 applicata:</strong> nella combinazione 4a, dove si usa W<sub>T</sub>, la parentesi (0,5L<sub>r</sub> o 0,3S o 0,5R) si riduce a 0,5(L<sub>r</sub> o R) — il tornado è un fenomeno di stagione calda e la neve non è concomitante.", "nota.troncElenco": "Elenco troncato a {cap} combinazioni su {tot} per prestazioni; il massimo e il minimo sopra restano calcolati sull'insieme completo.", "nota.troncMatrice": "Tabella troncata a {cap} righe su {tot} per prestazioni; il pulsante di copia esporta comunque tutte le combinazioni.", "note.asceCarichi": "Ogni caso è associato a un tipo normativo: il coefficiente lo decide l'equazione, non tu. Puoi inserire più casi dello stesso tipo: prendono lo stesso coefficiente e restano colonne distinte nella matrice.", "note.asceSis": "In ASCE 7 il sisma non è un dato unico: E si compone di E<sub>h</sub> = ρ·Q<sub>E</sub> e E<sub>v</sub> = 0,2·S<sub>DS</sub>·D. Inserisci l'effetto Q<sub>E</sub> dell'analisi e i parametri qui sotto.", "note.doppioSegno": "Azioni presenti in <em>ogni</em> combinazione con coefficiente fisso e verso ±. Caso tipico: le imperfezioni geometriche equivalenti (EN 1993-1-1 §5.3). Il coefficiente e l'applicabilità a ciascuno stato limite restano una scelta del progettista.", "note.ds": "Le azioni a doppio segno ({g}) entrano in ogni combinazione con entrambi i versi.", "note.geoA2": "Questi sono solo i coefficienti sulle azioni (Tab. 2.6.I, colonna A2); una verifica GEO completa richiede anche i coefficienti sui parametri geotecnici (M1/M2) e sulle resistenze (R1/R2/R3), non generati da questo strumento.", "note.gruppiEsc": "Gruppi esclusivi ({g}): le alternative del gruppo si escludono a vicenda, al più una attiva per combinazione.", "note.gruppiPerm": "Le azioni permanenti della stessa origine ({g}) prendono tutte γ,sup oppure tutte γ,inf (EN 1990 §6.4.3.2(4)).", "note.gruppiSol": "Gruppi solidali ({g}): le azioni del gruppo sono sempre attive insieme e con lo stesso ruolo, come fossero una sola azione.", "note.metodo": "LRFD e ASD sono metodi di progetto <strong>alternativi</strong>: «Entrambi» genera i due insiemi per confronto o per documentazione, non perché una verifica vada condotta con tutti e due.", "note.omega": "Ω<sub>0</sub> è il <strong>fattore di sovraresistenza</strong> tabellato in Tab. 12.2-1. Lo strumento non lo determina e non applica il limite di capacità del §12.4.3.", "note.orto": "Il 100/30 <strong>non è una regola universale</strong>: il §12.5 distingue procedura direzionale indipendente e combinazione ortogonale, e quale si applichi dipende dalla categoria di progetto sismico e dalla configurazione della struttura.", "note.permIndip": "Ogni azione permanente è considerata favorevole o sfavorevole indipendentemente dalle altre.", "note.rho": "ρ è il <strong>redundancy factor</strong>: va determinato secondo §12.3.4. Lo strumento <strong>non verifica</strong> le condizioni che consentono ρ = 1,0 e non lo sceglie al posto tuo.", "note.sismica": "Compila una sola direzione per una combinazione semplice (±E), oppure più direzioni: di default vengono considerate separatamente.", "note.tutteComb": "Vengono generate tutte le combinazioni risultanti (disattivabile nel pannello a sinistra).", "note.unTerzo": "L'aumento di 1/3 delle tensioni ammissibili è ammesso <em>solo</em> con le alternative IBC e <em>solo</em> se lo consente la norma di materiale: AISC 360 e TMS 402 lo hanno eliminato, ACI 318 non prevede l'ASD.", "note.varFond": "Ogni azione variabile può essere dominante, di accompagnamento (ψ0) oppure favorevole ed esclusa (0), indipendentemente dalle altre.", "note.varFreq": "Ogni azione variabile può essere dominante (ψ1), di accompagnamento (ψ2) oppure favorevole ed esclusa, indipendentemente dalle altre.", "note.varNoDom": "Ogni azione variabile può essere attiva (ψ2) oppure favorevole ed esclusa, indipendentemente dalle altre.", "note.varRara": "Ogni azione variabile può essere dominante (valore pieno), di accompagnamento (ψ0) oppure favorevole ed esclusa, indipendentemente dalle altre.", "opt.G1": "G1 — strutturale", "opt.G2": "G2 — non strutturale", "opt.P": "P — precompressione", "opt.both": "Entrambi (LRFD + ASD)", "opt.punto": "Punto — software FEM / Excel con locale inglese", "opt.virgola": "Virgola — Excel con locale europea", "ph.ad": "valore Ad", "ph.ex": "valore Ex", "ph.ey": "valore Ey (opz.)", "ph.ez": "valore Ez (opz.)", "ph.gruppo": "gruppo — azioni della stessa origine (opzionale)", "ph.gruppoEsc": "gruppo esclusivo (alternative)", "ph.gruppoSol": "gruppo solidale (sempre insieme)", "ph.nomeDs": "Nome (es. Imperfezioni)", "ph.nomePerm": "Nome (es. Peso proprio)", "ph.nomeVar": "Nome (es. Carico di esercizio)", "ph.omega": "da Tab. 12.2-1", "ph.qex": "effetto sisma X", "ph.qey": "effetto sisma Y (opz.)", "ph.rho": "da §12.3.4", "ph.sds": "es. 0.85", "ph.valCar": "valore car.", "ph.valCarQk": "valore car. Qk", "ph.valore": "valore", "psi.ec.A": "A — Ambienti residenziali", "psi.ec.B": "B — Uffici", "psi.ec.C": "C — Ambienti suscettibili di affollamento", "psi.ec.D": "D — Ambienti ad uso commerciale", "psi.ec.E": "E — Magazzini, uso industriale", "psi.ec.F": "F — Traffico veicoli ≤ 30 kN", "psi.ec.G": "G — Traffico 30 kN < veicoli ≤ 160 kN", "psi.ec.H": "H — Coperture", "psi.ec.custom": "Personalizzata (ψ manuali)", "psi.ec.neve_altri": "Neve — altri paesi CEN", "psi.ec.neve_nordic": "Neve — Finlandia, Islanda, Norvegia, Svezia", "psi.ec.temperatura": "Variazioni termiche", "psi.ec.vento": "Vento", "psi.ntc.A": "A — Ambienti residenziali", "psi.ntc.B": "B — Uffici", "psi.ntc.C": "C — Ambienti suscettibili di affollamento", "psi.ntc.D": "D — Ambienti ad uso commerciale", "psi.ntc.E": "E — Biblioteche, archivi, magazzini, uso industriale", "psi.ntc.F": "F — Rimesse, parcheggi (veicoli ≤ 30 kN)", "psi.ntc.G": "G — Rimesse, parcheggi (veicoli > 30 kN)", "psi.ntc.H": "H — Coperture (sola manutenzione)", "psi.ntc.custom": "Personalizzata (ψ manuali)", "psi.ntc.neve_gt1000": "Neve (quota > 1000 m s.l.m.)", "psi.ntc.neve_le1000": "Neve (quota ≤ 1000 m s.l.m.)", "psi.ntc.temperatura": "Variazioni termiche", "psi.ntc.vento": "Vento", "ref.asce.assunzioni": "Assunzioni dello strumento: combina valori scalari riferiti alla medesima grandezza di verifica; E_v è incorporato nel coefficiente delle azioni D e non applicato a quelle di tipo F; i casi H entrano con il ruolo scelto dal progettista fra i tre previsti dalla norma (1,6H / 1,0H se accrescono l'effetto, 0,9H / 0,6H se permanenti e resistenti, zero se resistenti ma non permanenti); il limite di capacità su E_mh del §12.4.3 non è applicato; non sono generate le combinazioni con F_a (alluvione), D_i / W_i (ghiaccio) né gli effetti autotensionanti T; i dati restano solo in questo browser (nessun invio a server).", "ref.asce.fonti": "ASCE/SEI 7-16 e ASCE/SEI 7-22, Cap. 2 (§2.3 Strength Design, §2.4 Allowable Stress Design) e Cap. 12 (§12.4, §12.5, Tab. 12.2-1) — IBC §1605.2 per le combinazioni ASD alternative — ASCE 7-22 Cap. 32 per il carico tornado W_T.", "ref.asce.prov": "Provenienza delle modifiche 7-22 più recenti: il coefficiente 0,1S nella combinazione 9 del §2.4.5 dalla presentazione ufficiale ICC sul 2024 IBC / ASCE 7-22 e da quella SEAU; l'Eccezione 3 del §2.3.1 sull'uso di W_T dalla guida NIST/FEMA sui carichi da tornado. Nessuna delle due letta sul testo ASCE a pagamento.", "ref.ec.assunzioni": "Assunzioni dello strumento: combina valori scalari riferiti alla medesima grandezza di verifica; i valori caratteristici inseriti si intendono già nel verso che produce l'effetto più gravoso per la verifica in esame; il coefficiente γP per la precompressione è impostato pari a 1,0 salvo diversa valutazione specifica (NTC 2018 §2.6.1); i dati restano solo in questo browser (nessun invio a server).", "ref.psi": "Coefficienti ψ per categoria di azione variabile", "ref.simboli": "Simboli", "ref.titoloAsce": "Equazioni e simboli utilizzati", "ref.titoloEc": "Tabelle dei coefficienti utilizzati", "rep.asce.assunzioni": "<strong>Assunzioni dello strumento:</strong> lo strumento combina valori SCALARI che devono riferirsi tutti alla medesima grandezza di verifica; i valori inseriti si intendono già espressi nel verso che produce l'effetto più gravoso per la verifica in esame. E<sub>v</sub> = 0,2·S<sub>DS</sub>·D è incorporato nel coefficiente delle azioni di tipo D e non è applicato alle azioni di tipo F. Per i casi di tipo H il ruolo è scelto dal progettista caso per caso fra i tre previsti dalla norma: spinta che accresce l'effetto principale (1,6H allo Strength Design, 1,0H all'ASD), spinta permanente e resistente (0,9H / 0,6H) e spinta resistente ma non permanente, che viene posta a zero; il ruolo adottato è riportato sopra insieme ai casi di carico. Resta a carico del progettista anche l'applicabilità di ciascun caso di carico alla situazione in esame: lo strumento espande le alternative previste dall'equazione per i tipi inseriti, ma non sa se un dato carico sia pertinente allo scenario. Il limite di capacità su E<sub>mh</sub> previsto dal §12.4.3 non è applicato. Non sono generate le combinazioni con carichi di alluvione (F<sub>a</sub>, §2.3.2), ghiaccio atmosferico (D<sub>i</sub>, W<sub>i</sub>, §2.3.3) né gli effetti autotensionanti T (§2.3.4 / §2.4.4). Lo strumento genera le combinazioni dei carichi: non sostituisce le verifiche di resistenza né la determinazione dei carichi stessi.", "rep.asce.diff": "<strong>Differenze 7-16 → 7-22 recepite:</strong> le mappe di neve al suolo sono state ricalibrate a livello ultimo per categoria di rischio, quindi in Chapter 2 le parentesi «oppure» non sono più fattorizzate come gruppo e la neve porta il proprio coefficiente — 1,6(L<sub>r</sub> o S o R) diventa (1,6L<sub>r</sub> o 1,0S o 1,6R) e 0,5(…) diventa (0,5L<sub>r</sub> o 0,3S o 0,5R); nelle ASD la neve compare come 0,7S. La neve di accompagnamento nelle combinazioni sismiche di resistenza passa da 0,2S a 0,15S. È introdotto il carico tornado W<sub>T</sub>, come alternativa a W nelle sole combinazioni in cui il vento è azione principale.", "rep.asce.fonti": "ASCE/SEI 7-16 e ASCE/SEI 7-22, <em>Minimum Design Loads and Associated Criteria for Buildings and Other Structures</em>, Cap. 2 (§2.3 Strength Design, §2.4 Allowable Stress Design) e Cap. 12 (§12.4 effetti sismici, §12.5 effetti ortogonali, Tab. 12.2-1 per Ω<sub>0</sub>) — International Building Code, §1605.2 (combinazioni ASD alternative). Il carico tornado W<sub>T</sub> è introdotto da ASCE 7-22, Cap. 32.", "rep.asce.prov": "<strong>Provenienza delle due modifiche 7-22 più recenti:</strong> il coefficiente 0,1S nella combinazione 9 del §2.4.5 (era 0,75S) proviene dalla presentazione ufficiale ICC sul 2024 IBC / ASCE 7-22 e da quella SEAU sulle modifiche di 7-22; l'Eccezione 3 del §2.3.1 sull'uso di W<sub>T</sub> dalla guida NIST/FEMA sui carichi da tornado di ASCE 7-22. Nessuna delle due è stata letta sul testo ASCE a pagamento: se il progetto lo richiede, riscontrale sulla copia ufficiale.", "rep.avvertenza": "Avvertenza:", "rep.casiCarico": "Casi di carico", "rep.coefNorma": "Coefficienti di normativa", "rep.coefParziali": "Coefficienti parziali γ (favorevole / sfavorevole)", "rep.coefPsi": "Coefficienti di combinazione ψ per categoria", "rep.combGenerate": "Combinazioni generate", "rep.compSis": "Componente sismica", "rep.compSismiche": "Componenti sismiche", "rep.ec.assunzioni": "<strong>Assunzioni dello strumento:</strong> lo strumento combina valori SCALARI che devono riferirsi tutti alla medesima grandezza di verifica; i valori caratteristici inseriti si intendono già espressi nel verso che produce l'effetto più gravoso per la verifica in esame, e la classificazione favorevole/sfavorevole è responsabilità del progettista per ciascuna verifica; il coefficiente γP per la precompressione è assunto pari a 1,0 salvo diversa valutazione specifica (NTC 2018 §2.6.1). Lo strumento genera le combinazioni delle azioni: non sostituisce le verifiche di resistenza, né, per le verifiche geotecniche, i coefficienti sui parametri del terreno e sulle resistenze.", "rep.ec.fonti": "D.M. 17 gennaio 2018 (NTC 2018), Cap. 2.5–2.6, Tab. 2.5.I e Tab. 2.6.I — EN 1990:2002+A1:2005 (Eurocodice 0), Annex A1, Tab. A1.1 e A1.2(B) — EN 1993-1-1 §5.3 per le imperfezioni geometriche equivalenti.", "rep.ec.transizione": "È in corso la transizione alla seconda generazione degli Eurocodici (EN 1990:2023); alla data odierna le NTC 2018 restano il riferimento cogente in Italia. Verificare sempre l'edizione applicabile nel proprio contesto normativo.", "rep.eccSis": "Azioni eccezionali e sismiche", "rep.equazioni": "Equazioni di combinazione utilizzate", "rep.ev.nonInserito": "0 (S_DS non inserito)", "rep.ev.zero": "0 (assunto esplicitamente)", "rep.fonti": "Fonti e assunzioni", "rep.fontiLbl": "Fonti:", "rep.generato": "Generato il {d}", "rep.gruppiIncoerenti": "le azioni del gruppo solidale «{sol}» risultano assegnate a gruppi esclusivi diversi ({esc}); è stato usato il gruppo esclusivo del primo membro. Verificare l'assegnazione dei gruppi.", "rep.gruppoOrigine": "Le azioni permanenti appartenenti allo stesso gruppo di origine ({g}) sono considerate un'unica azione: prendono tutte γ,sup oppure tutte γ,inf, mai versi misti (EN 1990 §6.4.3.2(4)).", "rep.inUso": "(in uso)", "rep.ipotesi": "Ipotesi di generazione", "rep.lblApproccio": "Approccio", "rep.lblEquazione": "Equazione", "rep.matriceTroncataPdf": "Riportate le prime {cap} combinazioni su {tot}. L'elenco completo è esportabile in formato TSV dal pulsante \"Copia tabella\" nella vista Matrice.", "rep.max": "{n} combinazioni — massimo <strong>{v}</strong> ({id})", "rep.metodo": "Metodo", "rep.min": "minimo <strong>{v}</strong> ({id})", "rep.normEC": "EN 1990 (Eurocodice 0) — valori raccomandati Annex A1", "rep.normNTC": "NTC 2018 — D.M. 17 gennaio 2018", "rep.normativa": "Normativa di riferimento", "rep.notaDoppioSegno": "Presenti in ogni combinazione con entrambi i versi: n azioni a doppio segno moltiplicano per 2<sup>n</sup> il numero di combinazioni. Il verso va scelto come quello che aggrava l'effetto in esame. Caso tipico: imperfezioni geometriche equivalenti secondo EN 1993-1-1 §5.3; se il valore deriva da carichi già amplificati (F = φ·N<sub>Ed</sub>) il coefficiente allo SLU è 1,0 e agli SLE vale tipicamente 1/γ<sub>Q</sub>. Il coefficiente e l'applicabilità a ciascuno stato limite restano una scelta del progettista.", "rep.notaVariabili": "γQ = {gq} allo stato limite ultimo per le azioni sfavorevoli; le azioni variabili favorevoli sono escluse dalla combinazione (γQ,fav = 0). <em>Gruppo solidale</em>: azioni sempre attive insieme e con lo stesso ruolo, contate come una sola azione. <em>Gruppo esclusivo</em>: alternative fra loro, al più una attiva per combinazione; le alternative possono essere anche interi gruppi solidali.", "rep.opz.doppioSegno": "Azioni a doppio segno incluse in ogni combinazione con entrambi i versi (×2 per ciascuna)", "rep.opz.ecc": "Combinazione eccezionale inclusa", "rep.opz.eccDom": "variabile dominante a ψ1 (eq. 6.11a)", "rep.opz.ibc": "Incluse le combinazioni ASD alternative dell'IBC §1605.2 ({ed}), senza il fattore ω, eliminato dall'IBC 2021.", "rep.opz.lRidotta": "Applicata l'Eccezione 1 del §2.3.1: fattore su L pari a 0,5 nelle combinazioni 3 e 4 (ammessa dove L₀ ≤ 100 psf, escluse autorimesse e ambienti di pubblico assembramento).", "rep.opz.listaFissa": "Combinazioni da lista fissa di equazioni: nessuna azione dominante a rotazione, nessun coefficiente ψ (concetti che ASCE 7 non usa).", "rep.opz.minima": "Inclusa la combinazione minima automatica (utility per sollevamento)", "rep.opz.omega": "Generate anche le combinazioni con sovraresistenza, E_mh = Ω₀·Q_E con Ω₀ = {om}.", "rep.opz.ortoOff": "Componenti sismiche considerate separatamente (±ciascuna), senza combinazione ortogonale.", "rep.opz.ortoOn": "Regola ortogonale 100/30 applicata tra Q_Ex e Q_Ey (§12.5.3), con tutte le combinazioni di segno.", "rep.opz.parentesi": "Parentesi «oppure» espanse in tutte le alternative compatibili con i casi di carico inseriti; equazioni che producono la stessa combinazione numerica sono fuse in una riga sola, con l'elenco dei numeri di equazione.", "rep.opz.permBlocco": "Permanenti trattate a blocco unico (tutte sfavorevoli)", "rep.opz.permIndip": "Classificazione indipendente favorevole/sfavorevole per ogni azione permanente o gruppo di origine (2ⁿ combinazioni)", "rep.opz.r30off": "regola del 30% NON applicata, componenti considerate singolarmente", "rep.opz.r30on": "regola del 30% applicata (§7.3.5)", "rep.opz.sisEc": "Combinazione sismica inclusa", "rep.opz.sismica": "Combinazioni sismiche incluse: E_h = ρ·Q_E con ρ = {rho}; E_v = {ev}.", "rep.opz.varIndip": "Variabili con stato indipendente (dominante / accompagnamento / esclusa)", "rep.opz.varSempre": "Variabili sempre attive, dominante a rotazione", "rep.perimetro.b": "Sono generate le combinazioni di base (§2.3.1 Strength Design, §2.4.1 Allowable Stress Design) e quelle sismiche (§2.3.6, §2.4.5, incluse quelle con sovraresistenza).", "rep.perimetro.ibc": "Sono incluse anche le combinazioni ASD alternative dell'IBC §1605.2.", "rep.perimetro.no": "NON sono generate le restanti combinazioni del Chapter 2: {sez}. Se una di queste è pertinente al progetto, va aggiunta a parte.", "rep.perimetro.t": "Perimetro di questo documento.", "rep.titoloAsce": "Combinazioni dei carichi", "rep.titoloEc": "Combinazioni delle azioni", "rep.unita": "Unità", "rep.xiNota": "Nell'equazione 6.10b il coefficiente sfavorevole è ulteriormente ridotto dal fattore ξ = {xi} (non applicato alle azioni di tipo P).", "ruoloH.breve.resist": "permanente e resistente", "ruoloH.breve.sfav": "accresce l'effetto", "ruoloH.breve.zero": "resistente non permanente, escluso", "ruoloH.resist": "permanente e resistente (0,9H / 0,6H)", "ruoloH.sfav": "accresce l'effetto principale (1,6H / 1,0H)", "ruoloH.zero": "resistente ma non permanente (H = 0)", "sec.asceOmega.n": "E<sub>h</sub> sostituito da E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub> con Ω<sub>0</sub> = {om} (da Tab. 12.2-1, dipende dal sistema resistente scelto). Il §12.4.3 consente di limitare E<sub>mh</sub> al valore derivante dalla capacità dell'elemento che plasticizza: quel limite non è applicato qui.", "sec.asceOmega.t": "{m} — Combinazioni sismiche con sovraresistenza", "sec.asceSis.n": "E<sub>h</sub> = ρ·Q<sub>E</sub> con ρ = {rho}; E<sub>v</sub> = 0,2·S<sub>DS</sub>·D {ev}: E<sub>v</sub> è incorporato nel coefficiente delle azioni D (sommato nelle combinazioni 6/8/9, sottratto nelle 7/10). Neve di accompagnamento a {neve}.", "sec.asceSis.t": "{m} — Combinazioni sismiche", "sec.asd.n": "Combinazioni ai carichi di esercizio. Il fattore 0,75 sui carichi di accompagnamento è già moltiplicato nei coefficienti mostrati (es. 0,75 × 0,6W = 0,45W). Con queste combinazioni di base NON è ammesso alcun aumento delle tensioni ammissibili.", "sec.asd.t": "ASD — Combinazioni alle tensioni ammissibili", "sec.ecc.n": "Il valore di Ad (es. urto, esplosione, incendio) va definito dall'analisi specifica dell'azione eccezionale.", "sec.ecc.nDom": "Variabile dominante a ψ1 (situazione «durante» l'evento accidentale) a rotazione tra le variabili attive, le altre a ψ2.", "sec.ecc.t": "Combinazione eccezionale", "sec.freq.n": "Per stati limite di esercizio reversibili.", "sec.freq.t": "SLE — Combinazione frequente", "sec.ibc.ed16": "Edizione allineata ad ASCE 7-16, neve nominale.", "sec.ibc.ed22": "Edizione allineata ad ASCE 7-22, quindi la neve compare come 0,7S.", "sec.ibc.evZero": "Per il dimensionamento delle fondazioni con queste combinazioni l'IBC consente E<sub>v</sub> = 0 (casella nel pannello a sinistra).", "sec.ibc.n1": "<strong>Questa sezione non è ancora validata puntualmente</strong> e va confrontata con l'edizione ufficiale dell'IBC prima di usarla in un calcolo: le equazioni 16-1 ÷ 16-4 sono confermate da più fonti, mentre le 16-5 e 16-6 contengono un'interpretazione dello strumento sul trattamento di E<sub>v</sub>.", "sec.ibc.n2": "Set alternativo conservato dall'IBC quando le combinazioni di resistenza e le ASD di base sono state cancellate dal §1605 e rimandate ad ASCE 7. Il fattore ω è stato ELIMINATO nell'IBC 2021: il vento entra come 0,6W.", "sec.ibc.n3": "L'aumento di 1/3 delle tensioni ammissibili non è concesso dall'IBC in proprio: il §1605.2 rimanda alla norma di materiale, e AISC 360 (acciaio) e TMS 402 (muratura) lo hanno eliminato, mentre ACI 318 non prevede l'ASD.", "sec.ibc.sis": "Nelle eq. 16-5 e 16-6 il sisma entra come E/1,4; in 16-6 E<sub>v</sub> è stato sottratto al permanente, interpretazione coerente con la combinazione 10 di ASCE 7 — <strong>da verificare</strong> se nel tuo caso governa.", "sec.ibc.t": "ASD alternative — {ed}", "sec.lrfd.n": "Lista fissa di equazioni: la concomitanza è già contenuta nell'equazione, non esiste variabile dominante e non esistono coefficienti ψ. Le parentesi «oppure» sono espanse in tutte le alternative compatibili con i casi di carico inseriti.", "sec.lrfd.t": "LRFD — Combinazioni di resistenza", "sec.min.eq": "utility per sollevamento / inviluppo", "sec.min.n": "Azioni permanenti nel verso favorevole (γ minimi), azioni variabili nulle (γQ,fav = 0). È una combinazione di comodo per esplorare il minimo dell'inviluppo: NON sostituisce la definizione completa di una verifica EQU, dove ogni azione va classificata come stabilizzante o destabilizzante rispetto allo specifico meccanismo, e anche le variabili possono essere stabilizzanti.", "sec.min.t": "SLU — Combinazione minima automatica", "sec.qp.n": "Per effetti a lungo termine ed aspetto della struttura.", "sec.qp.t": "SLE — Combinazione quasi permanente", "sec.rara.n": "Per stati limite di esercizio irreversibili.", "sec.rara.t": "SLE — Combinazione caratteristica (rara)", "sec.riepilogo": "Riepilogo", "sec.riepilogoTot": "{n} combinazioni generate", "sec.sintesi": "{n} combinazioni generate — massimo <strong>{max}</strong> · minimo <strong>{min}</strong>", "sec.sis.n": "I valori di Ex, Ey, Ez vanno determinati con l'analisi sismica e devono essere effetti riferiti alla MEDESIMA grandezza di verifica: lo strumento somma scalari.", "sec.sis.t": "Combinazione sismica", "sec.slu.n": "Azioni permanenti e variabili nel verso sfavorevole per l'effetto in esame. Approccio: {ap}.", "sec.slu.n610ab": "Inviluppo tra 6.10a (variabili tutte ridotte da ψ0) e 6.10b (permanenti sfavorevoli ridotte dal fattore ξ = {xi}, variabile dominante a valore pieno). Il valore di ξ è quello raccomandato dal CEN in EN 1990: l'Annesso Nazionale applicabile può fissarne uno diverso — verificare.", "sec.slu.t": "SLU — Combinazione fondamentale", "seg.ec0": "EC0 generico", "seg.matrice": "Matrice", "seg.testo": "Testo", "sim.eh": "Effetto sismico orizzontale = ρ·Q_E (eq. 12.4-3)", "sim.emh": "Effetto sismico orizzontale con sovraresistenza = Ω₀·Q_E (eq. 12.4-7)", "sim.ev": "Effetto sismico verticale = 0,2·S_DS·D (eq. 12.4-4a)", "sis.evNonCalc": "non calcolabile (S<sub>DS</sub> mancante), assunto pari a zero", "sis.evSds": "con S<sub>DS</sub> = {sds}", "sis.evZero": "assunto pari a zero su richiesta", "sis.fonte01S": "Il coefficiente 0,1 sulla neve nella combinazione 9 (era 0,75S in 7-16) è riportato dalla presentazione ufficiale ICC sul 2024 IBC / ASCE 7-22 e dalla presentazione SEAU sulle modifiche di 7-22.", "sis.nessuna": "Inserisci almeno Ex per generare la combinazione.", "sis.ortoOff": "Componenti considerate separatamente (±ciascuna): spunta la regola 100/30 nel pannello a sinistra per combinarle.", "sis.ortoOn": "Regola ortogonale 100/30 applicata (§12.5.3), con tutte le combinazioni di segno.", "sis.qeScalari": "I valori Q<sub>E</sub> devono essere effetti riferiti alla MEDESIMA grandezza di verifica.", "sis.r30off": "Regola del 30% non applicata: ogni componente inserita è considerata singolarmente (±ciascuna), senza sommarla alle altre.", "sis.r30on": "Regola del 30% applicata alle componenti inserite (NTC 2018 §7.3.5): a rotazione una componente ha coefficiente 1,00 e le altre 0,30, con tutte le combinazioni di segno.", "sis.una": "Generate le due combinazioni ±E.", "sub.ascePerimetro": "combinazioni di base e sismiche (Chapter 2 core)", "sub.ec": "Combinazioni delle azioni — Eurocodice 0", "tag.minima": "Permanenti favorevoli, variabili nulle", "tipo.D": "D — Permanente (dead)", "tipo.F": "F — Fluidi a pressione e altezza definite", "tipo.H": "H — Spinta del terreno / acqua di falda", "tipo.L": "L — Variabile di piano (live)", "tipo.Lr": "Lr — Variabile di copertura (roof live)", "tipo.R": "R — Pioggia (rain)", "tipo.S": "S — Neve (snow)", "tipo.S.16": "S — Neve (snow) — valore nominale, trattamento 7-16", "tipo.S.22": "S — Neve (snow) — valore a livello ultimo, trattamento 7-22", "tipo.W": "W — Vento (wind)", "tipo.Wt": "Wt — Tornado (solo 7-22)", "ttl.csle": "Coefficiente agli stati limite di esercizio, sismico ed eccezionale", "ttl.cslu": "Coefficiente allo stato limite ultimo", "ttl.gruppo": "EN 1990 §6.4.3.2(4): le azioni permanenti della stessa origine prendono tutte γ,sup oppure tutte γ,inf. Le azioni con lo stesso nome di gruppo vengono trattate come un'unica azione.", "ttl.gruppoEsc": "Azioni alternative fra loro: al più una attiva per combinazione (es. vento +X / −X). Può contenere anche interi gruppi solidali.", "ttl.gruppoSol": "Azioni sempre attive insieme e con lo stesso ruolo: il gruppo conta come una sola azione distribuita su più casi di carico (es. neve su falde diverse).", "ttl.rimuovi": "Rimuovi"},
    en: {"appr.610": "Eq. 6.10 — single combination", "appr.610ab": "Eq. 6.10a / 6.10b — envelope", "appr.A1": "Approach 1 / A1 — STR (the most common for buildings)", "appr.A2": "Approach 2 / A2 — GEO", "appr.EQU": "EQU — Equilibrium", "aria.normativa": "Reference standard", "aria.vista": "Results view", "asce.nonCoperto": "§2.3.2 / §2.4.2 (flood loads F<sub>a</sub>), §2.3.3 / §2.4.3 (atmospheric ice D<sub>i</sub> and W<sub>i</sub>), §2.3.4 / §2.4.4 (self-straining effects T), §2.3.5 (loads not specified), §2.5 (extraordinary events) and §2.6 (structural integrity)", "av.gruppiIncoerenti": "Inconsistent configuration: the actions of the tied group \"{sol}\" belong to different exclusive groups ({esc}). A tied group is a single action and cannot be an alternative to itself: the exclusive group of the first member is used. Correct the assignment.", "av.nessunCaso": "No load cases entered: add at least one in the left-hand panel.", "av.nessunD": "No case of type D (dead): every ASCE equation contains D, so the combinations are incomplete.", "av.omegaMancante": "Overstrength required but Ω<sub>0</sub> not entered (Tab. 12.2-1): the combinations with Ω<sub>0</sub> have not been generated.", "av.omegaUno": "Ω<sub>0</sub> = 1 is not automatically the same as \"no overstrength\": check the value in Tab. 12.2-1 for the seismic force-resisting system adopted.", "av.qeMancante": "Seismic combinations active but no Q<sub>E</sub> value entered.", "av.rhoMancante": "ρ not entered: it has been taken as 1.0. This is an engineering value, not a harmless default — it must be determined in accordance with §12.3.4, which in several cases requires ρ = 1.3.", "av.sdsMancante": "S<sub>DS</sub> not entered: E<sub>v</sub> has been taken as zero. Enter S<sub>DS</sub> or tick \"E<sub>v</sub> = 0\" explicitly.", "av.troppeComb": "{n} combinations in total. Check that the independence of the actions represents physically possible scenarios: actions that cannot coexist should be put in an exclusive group, actions that are always concurrent in a tied group.", "av.wtSu716": "A case of type Wt (tornado) is present, but the tornado load exists only in ASCE 7-22: with 7-16 selected it is ignored.", "badge.alt": "alternative not active", "badge.dom": "leading", "badge.fav": "↓ fav.", "badge.omessa": "omitted (favourable)", "badge.sfav": "↑ unfav.", "badge.sperimentale": "⚠ experimental — check applicability", "blk.approccio": "Design approach", "blk.asceCarichi": "Load cases", "blk.asceMetodo": "Design method", "blk.doppioSegno": "Double-sign actions (±)", "blk.eccezionale": "Accidental action", "blk.output": "Presentation of results", "blk.permanenti": "Permanent actions", "blk.sismica": "Seismic action", "blk.variabili": "Variable actions", "btn.addAsce": "+ Add load case", "btn.addDs": "+ Add double-sign action", "btn.addPerm": "+ Add permanent action", "btn.addVar": "+ Add variable action", "btn.coffee": "☕ Buy me a coffee", "btn.copiaBloccata": "Copy blocked by the browser", "btn.copiaTsv": "Copy table (TSV)", "btn.copiato": "Copied ✓", "btn.guida": "Guide", "btn.guidaTitle": "Opens the guide to using the tool", "btn.mostraTutte": "Show all {n} combinations", "btn.report": "PDF Report", "btn.reportTitle": "Assembles the report and opens the print dialog: choose \"Save as PDF\"", "chip.max": "Maximum", "chip.min": "Minimum", "chk.asceEvZero": "E<sub>v</sub> = 0 (permitted for the design of foundations with the IBC alternative combinations, and in the cases of §12.4.2.2)", "chk.asceIbc": "Include the <em>alternative</em> ASD combinations of the IBC (§1605.2)", "chk.asceLrid": "Factor on L reduced to 0.5 in combinations 3 and 4 — permitted where L<sub>0</sub> ≤ 100 psf (4.79 kN/m²), <strong>excluding</strong> garages and areas of public assembly (§2.3.1 Exc. 1)", "chk.asceOmega": "Also generate the overstrength combinations (E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub>, §12.4.3)", "chk.asceOrto": "Apply the 100/30 orthogonal procedure between Q<sub>Ex</sub> and Q<sub>Ey</sub>", "chk.asceSis": "Include the seismic combinations (§2.3.6 / §2.4.5)", "chk.domPsi1": "Leading variable action at ψ1 instead of ψ2 (EN 1990 eq. 6.11a — verification \"during\" the event, e.g. fire in progress)", "chk.eccezionale": "Accidental — Ad", "chk.minima": "Include the automatic minimum combination (uplift utility)", "chk.permIndip": "Independent favourable/unfavourable classification for each permanent action or source group (2ⁿ combinations)", "chk.regola30": "Apply the 30% rule between the components (§7.3.5)", "chk.sismica": "Include the seismic combination", "chk.varIndip": "Favourable/unfavourable classification per individual variable action (includes the case with the action omitted)", "col.categoria": "Category", "col.coefSLE": "SLS / seismic / accid. factor", "col.coefSLU": "ULS factor", "col.combinazione": "Combination", "col.componente": "Component", "col.descrTipo": "Type description", "col.descrizione": "Description", "col.eqOmega": "With overstrength — E_mh = Ω₀·Q_E (§12.4.3)", "col.eqSismica": "Seismic equation", "col.equazione": "Equation", "col.gammaFav": "γ favourable", "col.gammaSfav": "γ unfavourable", "col.grEsc": "Exclusive gr.", "col.grSol": "Tied gr.", "col.gruppoOrigine": "Group (source)", "col.n": "No.", "col.nome": "Name", "col.risultato": "Result", "col.significato": "Meaning", "col.simbolo": "Symbol", "col.tipo": "Type", "col.valCar": "Characteristic value", "col.valore": "Value", "cong.oppure": "or", "disclaimer.footer": "Provided as-is, without any warranty. Results are for informational purposes only: always verify them independently before using them in a real project. This tool does not replace the professional judgement of a qualified engineer nor mandatory code checks.", "disclaimer.report": "This report is generated automatically by a free tool, for informational purposes only. It does not replace the professional judgement of a qualified engineer, mandatory code checks, or technical review of the project. The author accepts no liability for any use of the results contained in this document in a real project or any other application: use is entirely at your own risk, subject to independent verification.", "esempio.perm": "G1 — self-weight", "esempio.var": "Q1 — imposed load", "g.ascecarichi.b": "<p>Each load case must be assigned its code load type, because it is the type that determines which factor it receives in each equation:</p><ul><li><strong>D</strong> dead · <strong>L</strong> floor live · <strong>L<sub>r</sub></strong> roof live</li><li><strong>S</strong> snow · <strong>R</strong> rain · <strong>W</strong> wind · <strong>W<sub>T</sub></strong> tornado (7-22 only)</li><li><strong>F</strong> fluids with well-defined pressures and maximum heights: takes the same factor as D</li><li><strong>H</strong> lateral earth pressure or ground water pressure: see below</li></ul><p>For <strong>H</strong> cases the standard distinguishes three situations and the tool lets you choose case by case: pressure that <em>adds to</em> the primary effect (1.6H in Strength Design, 1.0H in ASD); pressure that is <em>permanent and resists</em> the effect (0.9H / 0.6H); pressure that <em>resists but is not permanent</em>, which must be set to zero. Which one is correct depends on the check in hand.</p><div class=\"gnote\"><strong>Snow changes meaning between the two editions.</strong> In 7-16, S is the nominal value; in 7-22 the maps have been recalibrated to the ultimate level, so S is already larger and carries different factors in the equations. Take care when importing loads from a FEM model.</div>", "g.ascecarichi.t": "ASCE 7 — load types", "g.asceecc.b": "<p><strong>Reduced factor on L (§2.3.1 Exc. 1).</strong> In combinations 3 and 4 the factor on L may be 0.5 instead of 1.0 where the tabulated live load L<sub>0</sub> does not exceed 100 psf (4.79 kN/m²). Garages and areas of public assembly are <strong>excluded</strong>. Tick the box only after checking that the case qualifies.</p><p><strong>Tornado exception.</strong> In ASCE 7-22, where the load W<sub>T</sub> is used, snow drops out of the combination: a tornado is a warm-season phenomenon and snow is not concurrent. The tool applies this both in Strength Design (comb. 4a, §2.3.1 Exc. 3) and in ASD (comb. 6a, §2.4.1).</p><div class=\"gnote\">The difference between the editions inside the brackets is not cosmetic. 7-16 writes 1.6(L<sub>r</sub> or S or R), with a single factor for the group; 7-22 writes (1.6L<sub>r</sub> or 1.0S or 1.6R), with one factor per alternative, because snow is already at the ultimate level.</div>", "g.asceecc.t": "ASCE 7 — exceptions applied", "g.ascemetodo.b": "<p>The American engine is built in a <strong>completely different</strong> way from the European one, and the difference is not only in the factors.</p><p>ASCE 7 has no generative rule: it has a <strong>fixed list of equations</strong>. The concurrency of the loads is already written into the equation, there is no leading action that rotates and <strong>there are no ψ factors</strong>. The NTC categories A to H are of no use here.</p><p>The only combinatorics is the expansion of the \"or\" brackets: a combination such as 1.2D + 1.6(L<sub>r</sub> or S or R) generates as many rows as there are alternatives, but only for the load types you have actually entered.</p><p><strong>LRFD</strong> (§2.3) and <strong>ASD</strong> (§2.4) are alternative methods. In the ASD combinations the 0.75 factor on the companion loads is already multiplied into the factors shown: 0.75 × 0.6W appears as 0.45W.</p><div class=\"gnote\">With the basic ASD combinations <strong>no increase in allowable stresses is permitted</strong>.</div>", "g.ascemetodo.t": "ASCE 7 — how it works", "g.asceorto.b": "<p>The 100/30 checkbox rotates the two horizontal components: one at 100% and the other at 30%, with every combination of signs. With two components entered you get eight cases for each seismic equation.</p><div class=\"gnote\"><strong>It is not a rule to be applied in every case.</strong> §12.5 distinguishes the independent directional procedure (§12.5.1.1) from the orthogonal combination procedure (§12.5.1.2), and which of the two applies depends on the seismic design category and on the configuration of the structure (§12.5.3, §12.5.4). The tool does not decide this: check the applicability before ticking the box.</div>", "g.asceorto.t": "ASCE 7 — orthogonal effects", "g.ascerho.b": "<p>These are two parameters that <strong>the tool does not determine</strong> and cannot determine: they depend on the structural system and on the seismic design category.</p><p><strong>ρ — redundancy factor (§12.3.4).</strong> It must be derived in accordance with §12.3.4, which in several cases requires ρ = 1.3. The tool does not check the conditions that permit ρ = 1.0: it uses the value you enter exactly as it stands. If you leave it empty it assumes 1.0 and says so.</p><p><strong>Ω<sub>0</sub> — overstrength factor.</strong> It is tabulated in Tab. 12.2-1 as a function of the seismic force-resisting system. It is needed for the combinations with E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub>, required for certain elements. Ω<sub>0</sub> = 1 is not automatically the same as \"no overstrength\".</p><div class=\"gnote\">§12.4.3 allows E<sub>mh</sub> to be limited to the value derived from the capacity of the yielding element. <strong>That limit is not applied</strong> by the tool.</div>", "g.ascerho.t": "ASCE 7 — ρ and Ω₀", "g.ascesisma.b": "<p>In ASCE 7 the seismic action is not a single input. The effect E is made up of two parts:</p><ul><li><strong>E<sub>h</sub> = ρ·Q<sub>E</sub></strong> — the horizontal effect, where Q<sub>E</sub> is what you obtain from the analysis</li><li><strong>E<sub>v</sub> = 0.2·S<sub>DS</sub>·D</strong> — the vertical effect, which is <em>not</em> a separate load: it is proportional to the dead load</li></ul><p>For this reason E<sub>v</sub> does not appear as a column: it is absorbed into the factor on the D-type actions, added in combinations 6, 8 and 9 and subtracted in 7 and 10. It is not applied to F-type actions.</p><p>If you leave S<sub>DS</sub> empty, E<sub>v</sub> is taken as zero and the tool tells you so. The \"E<sub>v</sub> = 0\" checkbox is there to state that choice explicitly, as permitted for foundations with the IBC alternative combinations and in the cases of §12.4.2.2.</p><div class=\"gnote\">Q<sub>Ex</sub> and Q<sub>Ey</sub> must be effects already obtained from the analysis and referred to the <strong>same response quantity</strong>.</div>", "g.ascesisma.t": "ASCE 7 — seismic action", "g.doppiosegno.b": "<p>These are actions present in <em>every</em> combination, with a fixed factor and in both senses. Each double-sign action doubles the number of combinations: n actions multiply it by 2ⁿ.</p><p>The typical case is <strong>equivalent geometric imperfections</strong> (EN 1993-1-1 §5.3), which must be applied in the sense that worsens the effect under examination. If the value derives from loads that are already factored (F = φ·N<sub>Ed</sub>) the factor at ULS is 1 and at SLS it is typically 1/γ<sub>Q</sub>.</p><div class=\"gnote\">The factor and its applicability to each limit state <strong>remain the designer's choice</strong>: the treatment of imperfections depends on the method of analysis and on the model adopted.</div>", "g.doppiosegno.t": "Double-sign actions (±)", "g.ecazioni.b": "<p>Every permanent action has a type: <strong>G1</strong> structural, <strong>G2</strong> non-structural, <strong>P</strong> prestress. The type determines the partial factors applied.</p><p>The <strong>source group</strong> field serves the single-source principle (EN 1990 §6.4.3.2(4)): permanent actions arising from the same physical source must <em>all</em> take γ<sub>sup</sub> or <em>all</em> take γ<sub>inf</sub>, never mixed senses. By writing the same group name on several actions, they move together and count as one in the combinatoric
