s.</p><p>For prestress the factor γ<sub>P</sub> is taken as 1.0 unless a specific assessment says otherwise (NTC 2018 §2.6.1; see also §4.1.8.1.1 for γ<sub>P</sub>=1.2 on local anchorages).</p>", "g.ecazioni.t": "EC0 / NTC — permanent actions", "g.eccezionale.b": "<p>The value A<sub>d</sub> (impact, explosion, fire) must be defined by the specific analysis of the accidental action: the tool does not determine it.</p><p>With <strong>NTC 2018</strong>, eq. 2.5.6 imposes ψ<sub>2</sub> on <em>all</em> the variable actions, with no leading variable action.</p><p>With <strong>EN 1990</strong> you can choose: eq. 6.11b with ψ<sub>2</sub> for all of them, or eq. 6.11a with a leading variable action at ψ<sub>1</sub>, which represents the verification \"during\" the event — for example a fire in progress.</p>", "g.eccezionale.t": "Accidental combination", "g.ecgruppi.b": "<p>Variable actions have <strong>two independent group fields</strong>, which serve different purposes.</p><ul><li><strong>Tied group</strong>: actions with the same name are always active together and in the same role, as if they were a single action. Example: snow computed automatically and snow applied by hand over part of a roof.</li><li><strong>Exclusive group</strong>: actions with the same name are mutually alternative, at most one active per combination. Example: wind in the X direction and wind in the Y direction, or thermal expansion and contraction.</li></ul><p>The two levels combine: a tied group can be <em>one of the alternatives</em> of an exclusive group. Assigning actions of the same tied group to different exclusive groups is inconsistent and the tool flags it in red.</p><div class=\"gnote\"><strong>The two independence checkboxes</strong> decide how many combinations are produced. Turning them off gives the minimum set (all permanent actions unfavourable, all variable actions active with the leading one rotating); turning them on lets each action also be favourable or omitted, and the number of combinations grows as 2ⁿ. With an exclusive group and independence turned off, one of the alternatives is <em>always</em> present.</div>", "g.ecgruppi.t": "EC0 / NTC — groups of variable actions", "g.ecminima.b": "<p>This is a convenience combination: permanent actions in the favourable sense with the minimum γ values, all variable actions set to zero. It serves to explore the lower bound of the envelope, typically for uplift problems.</p><div class=\"gnote\"><strong>It does not replace an EQU check.</strong> In an equilibrium check every action must be classified as stabilising or destabilising with respect to the specific mechanism, and variable actions can be stabilising too. This utility does not do that for you.</div>", "g.ecminima.t": "EC0 / NTC — minimum combination", "g.ecnorma.b": "<p>The European engine is <strong>generative</strong>: it applies the rule γ<sub>G</sub>·G + γ<sub>Q</sub>·Q<sub>k1</sub> + Σ γ<sub>Q</sub>·ψ<sub>0</sub>·Q<sub>ki</sub>, rotating the leading variable action through all the active variable actions.</p><p>With <strong>NTC 2018</strong> you choose the approach from Tab. 2.6.I: EQU for equilibrium, A1 for structural checks (the most common case for buildings), A2 for geotechnical checks.</p><p>With <strong>generic EN 1990</strong> you choose the equation: 6.10 on its own, or the 6.10a/6.10b envelope. In 6.10b the unfavourable permanent actions are reduced by the factor ξ, taken here as 0.85 as recommended by CEN: <strong>the applicable National Annex may set a different value</strong>, so check it.</p><div class=\"gnote\">With approach A2 the tool applies only the partial factors on the actions. A complete geotechnical check also requires the partial factors on the ground parameters (M1/M2) and on the resistances (R1/R2/R3), which are not generated.</div>", "g.ecnorma.t": "EC0 / NTC — approach", "g.ecsisma.b": "<p>Enter the seismic effects Ex, Ey and Ez already obtained from the analysis. With a single direction filled in you get the two combinations ±E.</p><p>With more than one direction, by default each is treated separately. Ticking the <strong>30% rule</strong> (NTC 2018 §7.3.5) rotates the components: one at a factor of 1.00 and the others at 0.30, with every combination of signs.</p><div class=\"gnote\">Ex, Ey and Ez must be effects referred to the <strong>same design quantity</strong>. The tool sums scalars: it is not performing a vector composition of the seismic actions.</div>", "g.ecsisma.t": "EC0 / NTC — seismic action", "g.export.b": "<p>The <strong>Matrix view</strong> puts the load cases in columns and the combinations in rows, with the factors in the cells. The copy button exports everything in TSV format: it pastes straight into Excel or into FEM software that imports tab-separated text. The on-screen table is truncated for performance, but the copy always contains all the combinations.</p><p>The <strong>decimal separator</strong> applies to the matrix view and to the copy: comma for Italian Excel, point for FEM software and for English-language Excel.</p><p>The factors are exported with four decimal places, because they are products of several factors: ξ·γ<sub>G</sub> is 1.1475 and rounding it to 1.15 would introduce an error.</p><p>The <strong>PDF Report</strong> assembles a document with the standard, the generation assumptions, the load cases, the factors, the equations used written out in full and all the combinations, then opens the browser print dialog: choose \"Save as PDF\". Because the equations are written out in full, the document can be checked by whoever receives it without having the tool open.</p>", "g.export.t": "Exporting the results", "g.ibc.b": "<p>Since 2021 the IBC has deleted from §1605 its own copies of the strength combinations and of the basic ASD combinations, referring instead to ASCE 7. What it has kept is the <strong>alternative</strong> ASD set, eq. 16-1 ÷ 16-6, which this tool generates on request. The edition follows the ASCE edition selected: 7-16 → IBC 2021, 7-22 → IBC 2024.</p><p>The ω factor was <strong>removed</strong> in IBC 2021: wind simply enters as 0.6W.</p><p>The one-third increase in allowable stresses is not granted by the IBC in its own right: §1605.2 refers to the material standard. AISC 360 (steel) and TMS 402 (masonry) have removed it, and ACI 318 does not provide for ASD. In practice it survives for timber, where the mechanism is however the C<sub>D</sub> factor of the NDS, and for geotechnical bearing capacities.</p><div class=\"gnote\"><strong>This section is marked as experimental.</strong> Equations 16-1 ÷ 16-4 have been verified; 16-5 and 16-6 contain an interpretation by the tool of the treatment of E<sub>v</sub>. Check them against the official IBC edition before using them in a calculation.</div>", "g.ibc.t": "IBC — alternative ASD combinations", "g.limiti.b": "<p>It is worth being explicit about the boundaries.</p><ul><li><strong>It does not determine the loads.</strong> Characteristic values, seismic effects, accidental actions: you enter them, derived from the analysis.</li><li><strong>It does not perform the checks</strong> for strength, stability or serviceability.</li><li><strong>It sums scalar values</strong> referred to the same quantity. It does not compose vectors.</li><li><strong>It does not know whether a load case is relevant</strong> to the scenario: it expands the alternatives provided by the equation for the types you have entered, but applicability remains your own judgement.</li><li><strong>For ASCE 7 it covers the core of Chapter 2</strong>: basic combinations (§2.3.1, §2.4.1) and seismic combinations (§2.3.6, §2.4.5). Left out are flood (§2.3.2 / §2.4.2), atmospheric ice (§2.3.3 / §2.4.3), self-straining effects T (§2.3.4 / §2.4.4), loads not specified (§2.3.5), extraordinary events (§2.5) and structural integrity (§2.6).</li><li><strong>For geotechnical checks</strong> it applies only the partial factors on the actions, not those on the ground parameters or on the resistances.</li></ul><div class=\"gnote\">Two recent code points come from institutional sources but not from the paid ASCE text: the 0.1S factor in combination 9 of §2.4.5 of 7-22 (official ICC presentation on the 2024 IBC / ASCE 7-22, and SEAU presentation) and Exception 3 of §2.3.1 on the use of W<sub>T</sub> (NIST/FEMA guidance on tornado loads). If the project requires it, check them against the official copy.</div>", "g.limiti.t": "What the tool does not do", "g.start.b": "<p>The tool generates the load combinations for structural design checks. It does not calculate the loads and does not perform the checks: it combines values that you supply.</p><ul><li><strong>Choose the standard</strong> at the top: NTC 2018, generic EN 1990, ASCE 7-22 or ASCE 7-16. The left-hand panel changes accordingly, because the two worlds work in different ways.</li><li><strong>Enter the load cases</strong> with their characteristic value.</li><li><strong>Read the results</strong> on the right: they update with every change, there is no \"generate\" button.</li><li><strong>Export</strong> with the Matrix view (copy TSV for Excel or for FEM software) or with the PDF Report.</li></ul><div class=\"gnote\"><strong>The tool sums scalar values.</strong> All the values entered must refer to the same design quantity: combining a reaction with a moment is meaningless. If you need the envelope over several quantities, run one session per quantity.</div><p>The data stays in your browser and is not sent to any server. Close the page and reopen it and you will find it again.</p>", "g.start.t": "First steps", "guida.chiudi": "Close", "guida.titolo": "User guide", "help.apri": "Open the guide on this topic", "hint.asce": "No load cases entered.", "hint.doppioSegno": "No double-sign actions entered.", "hint.matrice": "Columns = load cases · rows = combinations · cells = factors. Paste into Excel or into FEM software.", "hint.permanenti": "No permanent actions entered.", "hint.variabili": "No variable actions entered.", "lbl.approccioEC": "Equation (EN 1990 Annex A1)", "lbl.approccioNTC": "Approach (Tab. 2.6.I NTC 2018)", "lbl.decimale": "Decimal separator (matrix view and copy)", "lbl.dominante": "{nome} leading", "lbl.eccNtc": "Ad + permanent + variable actions at ψ2", "lbl.metodo": "Method", "lbl.nessunoParen": "(none)", "lbl.ruoloH": "Role of H", "lbl.soloPermanenti": "permanent only", "lbl.tuttiPsi2": "All variable actions at ψ2", "lbl.unicaVariabile": "single variable action", "lbl.unita": "Units (display only)", "msg.valoriMancanti": "enter all the characteristic values for the numerical result", "nota.f": "Cases of type F take the same factor as the dead load D, as prescribed by the notes to §2.3.1 / §2.4.1.", "nota.h": "For cases of type H the standard distinguishes three situations: pressure that adds to the primary effect (1.6H in Strength Design, 1.0H in ASD), pressure that is permanent and resisting (0.9H / 0.6H) and pressure that resists but is not permanent, which must be set to zero. Which one is correct depends on the check in hand and remains an assessment for the designer.", "nota.hRuoli": "Role assigned to the H cases:", "nota.lRidotta": "Exception 1 of §2.3.1 applied: factor on L equal to 0.5 in combinations 3 and 4.", "nota.parentesi722": "In 7-22 the brackets are no longer factorised as a group: snow is already at the ultimate level, so each alternative carries its own factor.", "nota.tornadoASD": "<strong>Tornado exception applied:</strong> in combination 6a, where W<sub>T</sub> is used, the bracket 0.75(L<sub>r</sub> or 0.7S or R) reduces to 0.75(L<sub>r</sub> or R) — a tornado is a warm-season phenomenon and snow is not concurrent.", "nota.tornadoLRFD": "<strong>Exception 3 of §2.3.1 applied:</strong> in combination 4a, where W<sub>T</sub> is used, the bracket (0.5L<sub>r</sub> or 0.3S or 0.5R) reduces to 0.5(L<sub>r</sub> or R) — a tornado is a warm-season phenomenon and snow is not concurrent.", "nota.troncElenco": "List truncated to {cap} combinations out of {tot} for performance; the maximum and minimum above are still computed over the complete set.", "nota.troncMatrice": "Table truncated to {cap} rows out of {tot} for performance; the copy button exports all the combinations anyway.", "note.asceCarichi": "Each case is assigned a code load type: the factor is set by the equation, not by you. You can enter several cases of the same type: they take the same factor and remain separate columns in the matrix.", "note.asceSis": "In ASCE 7 the earthquake is not a single input: E is made up of E<sub>h</sub> = ρ·Q<sub>E</sub> and E<sub>v</sub> = 0.2·S<sub>DS</sub>·D. Enter the Q<sub>E</sub> effect from the analysis and the parameters below.", "note.doppioSegno": "Actions present in <em>every</em> combination with a fixed factor and both senses ±. Typical case: equivalent geometric imperfections (EN 1993-1-1 §5.3). The factor and its applicability to each limit state remain the designer's choice.", "note.ds": "Double-sign actions ({g}) enter every combination with both senses.", "note.geoA2": "These are only the partial factors on the actions (Tab. 2.6.I, column A2); a complete GEO check also requires the partial factors on the ground parameters (M1/M2) and on the resistances (R1/R2/R3), which are not generated by this tool.", "note.gruppiEsc": "Exclusive groups ({g}): the alternatives in the group are mutually exclusive, at most one active per combination.", "note.gruppiPerm": "Permanent actions from the same source ({g}) all take γ,sup or all take γ,inf (EN 1990 §6.4.3.2(4)).", "note.gruppiSol": "Tied groups ({g}): the actions in the group are always active together and in the same role, as if they were a single action.", "note.metodo": "LRFD and ASD are <strong>alternative</strong> design methods: \"Both\" generates the two sets for comparison or for documentation, not because a design check should be carried out with both.", "note.omega": "Ω<sub>0</sub> is the <strong>overstrength factor</strong> tabulated in Tab. 12.2-1. The tool does not determine it and does not apply the capacity limit of §12.4.3.", "note.orto": "The 100/30 procedure <strong>is not a universal rule</strong>: §12.5 distinguishes the independent directional procedure from the orthogonal combination procedure, and which of the two applies depends on the seismic design category and on the configuration of the structure.", "note.permIndip": "Each permanent action is considered favourable or unfavourable independently of the others.", "note.rho": "ρ is the <strong>redundancy factor</strong>: it must be determined in accordance with §12.3.4. The tool <strong>does not check</strong> the conditions that permit ρ = 1.0 and does not choose it for you.", "note.sismica": "Fill in a single direction for a simple combination (±E), or several directions: by default they are treated separately.", "note.tutteComb": "All the resulting combinations are generated (can be switched off in the left-hand panel).", "note.unTerzo": "The one-third increase in allowable stresses is permitted <em>only</em> with the IBC alternative combinations and <em>only</em> where the material standard allows it: AISC 360 and TMS 402 have removed it, and ACI 318 does not provide for ASD.", "note.varFond": "Each variable action can be leading, companion (ψ0) or favourable and excluded (0), independently of the others.", "note.varFreq": "Each variable action can be leading (ψ1), companion (ψ2) or favourable and excluded, independently of the others.", "note.varNoDom": "Each variable action can be active (ψ2) or favourable and excluded, independently of the others.", "note.varRara": "Each variable action can be leading (full value), companion (ψ0) or favourable and excluded, independently of the others.", "opt.G1": "G1 — structural", "opt.G2": "G2 — non-structural", "opt.P": "P — prestress", "opt.both": "Both (LRFD + ASD)", "opt.punto": "Point — FEM software / English-locale Excel", "opt.virgola": "Comma — European-locale Excel", "ph.ad": "Ad value", "ph.ex": "Ex value", "ph.ey": "Ey value (opt.)", "ph.ez": "Ez value (opt.)", "ph.gruppo": "group — actions from the same source (optional)", "ph.gruppoEsc": "exclusive group (alternatives)", "ph.gruppoSol": "tied group (always together)", "ph.nomeDs": "Name (e.g. Imperfections)", "ph.nomePerm": "Name (e.g. Self-weight)", "ph.nomeVar": "Name (e.g. Imposed load)", "ph.omega": "from Tab. 12.2-1", "ph.qex": "seismic effect X", "ph.qey": "seismic effect Y (opt.)", "ph.rho": "from §12.3.4", "ph.sds": "e.g. 0.85", "ph.valCar": "char. value", "ph.valCarQk": "char. value Qk", "ph.valore": "value", "psi.ec.A": "A — Domestic, residential areas", "psi.ec.B": "B — Office areas", "psi.ec.C": "C — Congregation areas", "psi.ec.D": "D — Shopping areas", "psi.ec.E": "E — Storage areas", "psi.ec.F": "F — Traffic area, vehicle weight ≤ 30 kN", "psi.ec.G": "G — Traffic area, 30 kN < vehicle weight ≤ 160 kN", "psi.ec.H": "H — Roofs", "psi.ec.custom": "Custom (manual ψ)", "psi.ec.neve_altri": "Snow — other CEN Member States", "psi.ec.neve_nordic": "Snow — Finland, Iceland, Norway, Sweden", "psi.ec.temperatura": "Temperature variations", "psi.ec.vento": "Wind", "psi.ntc.A": "A — Residential areas", "psi.ntc.B": "B — Offices", "psi.ntc.C": "C — Areas subject to crowding", "psi.ntc.D": "D — Commercial areas", "psi.ntc.E": "E — Libraries, archives, storage areas, industrial use", "psi.ntc.F": "F — Garages and car parks (vehicles ≤ 30 kN)", "psi.ntc.G": "G — Garages and car parks (vehicles > 30 kN)", "psi.ntc.H": "H — Roofs (maintenance access only)", "psi.ntc.custom": "Custom (manual ψ)", "psi.ntc.neve_gt1000": "Snow (altitude > 1000 m a.s.l.)", "psi.ntc.neve_le1000": "Snow (altitude ≤ 1000 m a.s.l.)", "psi.ntc.temperatura": "Temperature variations", "psi.ntc.vento": "Wind", "ref.asce.assunzioni": "Assumptions made by the tool: it combines scalar values referred to the same design quantity; E_v is absorbed into the factor on the D actions and is not applied to those of type F; H cases enter with the role chosen by the designer among the three provided by the standard (1.6H / 1.0H if they add to the effect, 0.9H / 0.6H if permanent and resisting, zero if resisting but not permanent); the capacity limit on E_mh of §12.4.3 is not applied; the combinations with F_a (flood), D_i / W_i (ice) and the self-straining effects T are not generated; the data stays only in this browser (nothing is sent to a server).", "ref.asce.fonti": "ASCE/SEI 7-16 and ASCE/SEI 7-22, Chap. 2 (§2.3 Strength Design, §2.4 Allowable Stress Design) and Chap. 12 (§12.4, §12.5, Tab. 12.2-1) — IBC §1605.2 for the alternative ASD combinations — ASCE 7-22 Chap. 32 for the tornado load W_T.", "ref.asce.prov": "Provenance of the most recent 7-22 changes: the 0.1S factor in combination 9 of §2.4.5 from the official ICC presentation on the 2024 IBC / ASCE 7-22 and from the SEAU one; Exception 3 of §2.3.1 on the use of W_T from the NIST/FEMA guidance on tornado loads. Neither of the two has been read in the paid ASCE text.", "ref.ec.assunzioni": "Assumptions made by the tool: it combines scalar values referred to the same design quantity; the characteristic values entered are understood to be already in the sense that produces the most onerous effect for the check under examination; the factor γP for prestress is set to 1.0 unless a specific assessment says otherwise (NTC 2018 §2.6.1); the data stays only in this browser (nothing is sent to a server).", "ref.psi": "ψ factors by category of variable action", "ref.simboli": "Symbols", "ref.titoloAsce": "Equations and symbols used", "ref.titoloEc": "Tables of the factors used", "rep.asce.assunzioni": "<strong>Assumptions made by the tool:</strong> the tool combines SCALAR values which must all refer to the same design quantity; the values entered are understood to be already expressed in the sense that produces the most onerous effect for the check under examination. E<sub>v</sub> = 0.2·S<sub>DS</sub>·D is absorbed into the factor on the actions of type D and is not applied to actions of type F. For cases of type H the role is chosen by the designer case by case among the three provided by the standard: pressure that adds to the primary effect (1.6H in Strength Design, 1.0H in ASD), permanent and resisting pressure (0.9H / 0.6H) and pressure that resists but is not permanent, which is set to zero; the role adopted is reported above together with the load cases. It also remains the designer's responsibility to establish the applicability of each load case to the situation under examination: the tool expands the alternatives provided by the equation for the types entered, but it does not know whether a given load is relevant to the scenario. The capacity limit on E<sub>mh</sub> provided by §12.4.3 is not applied. The combinations with flood loads (F<sub>a</sub>, §2.3.2), atmospheric ice (D<sub>i</sub>, W<sub>i</sub>, §2.3.3) and the self-straining effects T (§2.3.4 / §2.4.4) are not generated. The tool generates the load combinations: it does not replace the strength checks, nor the determination of the loads themselves.", "rep.asce.diff": "<strong>Differences 7-16 → 7-22 taken into account:</strong> the ground snow maps have been recalibrated to the ultimate level by risk category, so in Chapter 2 the \"or\" brackets are no longer factorised as a group and snow carries its own factor — 1.6(L<sub>r</sub> or S or R) becomes (1.6L<sub>r</sub> or 1.0S or 1.6R) and 0.5(…) becomes (0.5L<sub>r</sub> or 0.3S or 0.5R); in the ASD combinations snow appears as 0.7S. The companion snow in the strength seismic combinations goes from 0.2S to 0.15S. The tornado load W<sub>T</sub> is introduced, as an alternative to W only in the combinations where wind is the principal action.", "rep.asce.fonti": "ASCE/SEI 7-16 and ASCE/SEI 7-22, <em>Minimum Design Loads and Associated Criteria for Buildings and Other Structures</em>, Chap. 2 (§2.3 Strength Design, §2.4 Allowable Stress Design) and Chap. 12 (§12.4 seismic effects, §12.5 orthogonal effects, Tab. 12.2-1 for Ω<sub>0</sub>) — International Building Code, §1605.2 (alternative ASD combinations). The tornado load W<sub>T</sub> is introduced by ASCE 7-22, Chap. 32.", "rep.asce.prov": "<strong>Provenance of the two most recent 7-22 changes:</strong> the 0.1S factor in combination 9 of §2.4.5 (previously 0.75S) comes from the official ICC presentation on the 2024 IBC / ASCE 7-22 and from the SEAU presentation on the changes in 7-22; Exception 3 of §2.3.1 on the use of W<sub>T</sub> comes from the NIST/FEMA guidance on the tornado loads of ASCE 7-22. Neither of the two has been read in the paid ASCE text: if the project requires it, check them against the official copy.", "rep.avvertenza": "Warning:", "rep.casiCarico": "Load cases", "rep.coefNorma": "Code factors", "rep.coefParziali": "Partial factors γ (favourable / unfavourable)", "rep.coefPsi": "Combination factors ψ by category", "rep.combGenerate": "Combinations generated", "rep.compSis": "Seismic component", "rep.compSismiche": "Seismic components", "rep.ec.assunzioni": "<strong>Assumptions made by the tool:</strong> the tool combines SCALAR values which must all refer to the same design quantity; the characteristic values entered are understood to be already expressed in the sense that produces the most onerous effect for the check under examination, and the favourable/unfavourable classification is the designer's responsibility for each check; the factor γP for prestress is taken as 1.0 unless a specific assessment says otherwise (NTC 2018 §2.6.1). The tool generates the combinations of actions: it does not replace the strength checks, nor, for geotechnical checks, the partial factors on the ground parameters and on the resistances.", "rep.ec.fonti": "Italian Ministerial Decree of 17 January 2018 (NTC 2018), Chap. 2.5–2.6, Tab. 2.5.I and Tab. 2.6.I — EN 1990:2002+A1:2005 (Eurocode 0), Annex A1, Tab. A1.1 and A1.2(B) — EN 1993-1-1 §5.3 for the equivalent geometric imperfections.", "rep.ec.transizione": "The transition to the second generation of the Eurocodes (EN 1990:2023) is under way; at today's date NTC 2018 remains the binding reference in Italy. Always check which edition applies in your own regulatory context.", "rep.eccSis": "Accidental and seismic actions", "rep.equazioni": "Combination equations used", "rep.ev.nonInserito": "0 (S_DS not entered)", "rep.ev.zero": "0 (explicitly assumed)", "rep.fonti": "Sources and assumptions", "rep.fontiLbl": "Sources:", "rep.generato": "Generated on {d}", "rep.gruppiIncoerenti": "the actions of the tied group \"{sol}\" are assigned to different exclusive groups ({esc}); the exclusive group of the first member has been used. Check the group assignment.", "rep.gruppoOrigine": "Permanent actions belonging to the same source group ({g}) are considered a single action: they all take γ,sup or all take γ,inf, never mixed senses (EN 1990 §6.4.3.2(4)).", "rep.inUso": "(in use)", "rep.ipotesi": "Generation assumptions", "rep.lblApproccio": "Approach", "rep.lblEquazione": "Equation", "rep.matriceTroncataPdf": "The first {cap} combinations out of {tot} are shown. The complete list can be exported as TSV from the \"Copy table\" button in the Matrix view.", "rep.max": "{n} combinations — maximum <strong>{v}</strong> ({id})", "rep.metodo": "Method", "rep.min": "minimum <strong>{v}</strong> ({id})", "rep.normEC": "EN 1990 (Eurocode 0) — recommended values of Annex A1", "rep.normNTC": "NTC 2018 — Italian Ministerial Decree of 17 January 2018", "rep.normativa": "Reference standard", "rep.notaDoppioSegno": "Present in every combination with both senses: n double-sign actions multiply the number of combinations by 2<sup>n</sup>. The sense must be chosen as the one that worsens the effect under examination. Typical case: equivalent geometric imperfections to EN 1993-1-1 §5.3; if the value derives from loads that are already factored (F = φ·N<sub>Ed</sub>) the factor at ULS is 1.0 and at SLS it is typically 1/γ<sub>Q</sub>. The factor and its applicability to each limit state remain the designer's choice.", "rep.notaVariabili": "γQ = {gq} at the ultimate limit state for unfavourable actions; favourable variable actions are excluded from the combination (γQ,fav = 0). <em>Tied group</em>: actions always active together and in the same role, counted as a single action. <em>Exclusive group</em>: mutually alternative, at most one active per combination; the alternatives can themselves be whole tied groups.", "rep.opz.doppioSegno": "Double-sign actions included in every combination with both senses (×2 for each)", "rep.opz.ecc": "Accidental combination included", "rep.opz.eccDom": "leading variable action at ψ1 (eq. 6.11a)", "rep.opz.ibc": "The alternative ASD combinations of IBC §1605.2 ({ed}) are included, without the ω factor, removed in IBC 2021.", "rep.opz.lRidotta": "Exception 1 of §2.3.1 applied: factor on L equal to 0.5 in combinations 3 and 4 (permitted where L₀ ≤ 100 psf, garages and areas of public assembly excluded).", "rep.opz.listaFissa": "Combinations from a fixed list of equations: no leading action rotating, no ψ factors (concepts that ASCE 7 does not use).", "rep.opz.minima": "Automatic minimum combination included (uplift utility)", "rep.opz.omega": "The combinations with overstrength are also generated, E_mh = Ω₀·Q_E with Ω₀ = {om}.", "rep.opz.ortoOff": "Seismic components considered separately (± each), without orthogonal combination.", "rep.opz.ortoOn": "100/30 orthogonal procedure applied between Q_Ex and Q_Ey (§12.5.3), with every combination of signs.", "rep.opz.parentesi": "\"Or\" brackets expanded into all the alternatives compatible with the load cases entered; equations that produce the same numerical combination are merged into a single row, with the list of equation numbers.", "rep.opz.permBlocco": "Permanent actions treated as a single block (all unfavourable)", "rep.opz.permIndip": "Independent favourable/unfavourable classification for each permanent action or source group (2ⁿ combinations)", "rep.opz.r30off": "30% rule NOT applied, components considered individually", "rep.opz.r30on": "30% rule applied (§7.3.5)", "rep.opz.sisEc": "Seismic combination included", "rep.opz.sismica": "Seismic combinations included: E_h = ρ·Q_E with ρ = {rho}; E_v = {ev}.", "rep.opz.varIndip": "Variable actions with independent status (leading / companion / excluded)", "rep.opz.varSempre": "Variable actions always active, with the leading one rotating", "rep.perimetro.b": "The basic combinations (§2.3.1 Strength Design, §2.4.1 Allowable Stress Design) and the seismic combinations (§2.3.6, §2.4.5, including those with overstrength) are generated.", "rep.perimetro.ibc": "The alternative ASD combinations of IBC §1605.2 are also included.", "rep.perimetro.no": "The remaining combinations of Chapter 2 are NOT generated: {sez}. If any of these is relevant to the project, it must be added separately.", "rep.perimetro.t": "Scope of this document.", "rep.titoloAsce": "Load combinations", "rep.titoloEc": "Combinations of actions", "rep.unita": "Units", "rep.xiNota": "In equation 6.10b the unfavourable factor is further reduced by the factor ξ = {xi} (not applied to actions of type P).", "ruoloH.breve.resist": "permanent and resisting", "ruoloH.breve.sfav": "adds to the effect", "ruoloH.breve.zero": "resisting but not permanent, excluded", "ruoloH.resist": "permanent and resisting (0.9H / 0.6H)", "ruoloH.sfav": "adds to the primary effect (1.6H / 1.0H)", "ruoloH.zero": "resisting but not permanent (H = 0)", "sec.asceOmega.n": "E<sub>h</sub> replaced by E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub> with Ω<sub>0</sub> = {om} (from Tab. 12.2-1, depends on the force-resisting system chosen). §12.4.3 allows E<sub>mh</sub> to be limited to the value derived from the capacity of the yielding element: that limit is not applied here.", "sec.asceOmega.t": "{m} — Seismic combinations with overstrength", "sec.asceSis.n": "E<sub>h</sub> = ρ·Q<sub>E</sub> with ρ = {rho}; E<sub>v</sub> = 0.2·S<sub>DS</sub>·D {ev}: E<sub>v</sub> is absorbed into the factor on the D actions (added in combinations 6/8/9, subtracted in 7/10). Companion snow at {neve}.", "sec.asceSis.t": "{m} — Seismic combinations", "sec.asd.n": "Combinations at service load level. The 0.75 factor on the companion loads is already multiplied into the factors shown (e.g. 0.75 × 0.6W = 0.45W). With these basic combinations NO increase in allowable stresses is permitted.", "sec.asd.t": "ASD — Allowable stress combinations", "sec.ecc.n": "The value of Ad (e.g. impact, explosion, fire) must be defined by the specific analysis of the accidental action.", "sec.ecc.nDom": "Leading variable action at ψ1 (the situation \"during\" the accidental event), rotating through the active variable actions, the others at ψ2.", "sec.ecc.t": "Accidental combination", "sec.freq.n": "For reversible serviceability limit states.", "sec.freq.t": "SLS — Frequent combination", "sec.ibc.ed16": "Edition aligned with ASCE 7-16, nominal snow.", "sec.ibc.ed22": "Edition aligned with ASCE 7-22, so snow appears as 0.7S.", "sec.ibc.evZero": "For the design of foundations with these combinations the IBC permits E<sub>v</sub> = 0 (checkbox in the left-hand panel).", "sec.ibc.n1": "<strong>This section has not yet been validated point by point</strong> and must be compared with the official IBC edition before being used in a calculation: equations 16-1 ÷ 16-4 are confirmed by several sources, while 16-5 and 16-6 contain an interpretation by the tool of the treatment of E<sub>v</sub>.", "sec.ibc.n2": "Alternative set retained by the IBC when the strength combinations and the basic ASD combinations were deleted from §1605 and referred to ASCE 7. The ω factor was REMOVED in IBC 2021: wind enters as 0.6W.", "sec.ibc.n3": "The one-third increase in allowable stresses is not granted by the IBC in its own right: §1605.2 refers to the material standard, and AISC 360 (steel) and TMS 402 (masonry) have removed it, while ACI 318 does not provide for ASD.", "sec.ibc.sis": "In eq. 16-5 and 16-6 the earthquake enters as E/1.4; in 16-6 E<sub>v</sub> has been subtracted from the dead load, an interpretation consistent with combination 10 of ASCE 7 — <strong>to be checked</strong> if it governs in your case.", "sec.ibc.t": "Alternative ASD — {ed}", "sec.lrfd.n": "Fixed list of equations: the concurrency is already contained in the equation, there is no leading action and there are no ψ factors. The \"or\" brackets are expanded into all the alternatives compatible with the load cases entered.", "sec.lrfd.t": "LRFD — Strength combinations", "sec.min.eq": "uplift / envelope utility", "sec.min.n": "Permanent actions in the favourable sense (minimum γ), variable actions set to zero (γQ,fav = 0). It is a convenience combination for exploring the lower bound of the envelope: it does NOT replace the full definition of an EQU check, where every action must be classified as stabilising or destabilising with respect to the specific mechanism, and variable actions can be stabilising too.", "sec.min.t": "ULS — Automatic minimum combination", "sec.qp.n": "For long-term effects and the appearance of the structure.", "sec.qp.t": "SLS — Quasi-permanent combination", "sec.rara.n": "For irreversible serviceability limit states.", "sec.rara.t": "SLS — Characteristic (rare) combination", "sec.riepilogo": "Summary", "sec.riepilogoTot": "{n} combinations generated", "sec.sintesi": "{n} combinations generated — maximum <strong>{max}</strong> · minimum <strong>{min}</strong>", "sec.sis.n": "The values of Ex, Ey, Ez must be determined by the seismic analysis and must be effects referred to the SAME design quantity: the tool sums scalars.", "sec.sis.t": "Seismic combination", "sec.slu.n": "Permanent and variable actions in the sense unfavourable for the effect under examination. Approach: {ap}.", "sec.slu.n610ab": "Envelope of 6.10a (all variable actions reduced by ψ0) and 6.10b (unfavourable permanent actions reduced by the factor ξ = {xi}, leading variable action at full value). The value of ξ is the one recommended by CEN in EN 1990: the applicable National Annex may set a different one — check it.", "sec.slu.t": "ULS — Fundamental combination", "seg.ec0": "Generic EC0", "seg.matrice": "Matrix", "seg.testo": "Text", "sim.eh": "Horizontal seismic effect = ρ·Q_E (eq. 12.4-3)", "sim.emh": "Horizontal seismic effect with overstrength = Ω₀·Q_E (eq. 12.4-7)", "sim.ev": "Vertical seismic effect = 0.2·S_DS·D (eq. 12.4-4a)", "sis.evNonCalc": "not computable (S<sub>DS</sub> missing), taken as zero", "sis.evSds": "with S<sub>DS</sub> = {sds}", "sis.evZero": "taken as zero on request", "sis.fonte01S": "The 0.1 factor on snow in combination 9 (it was 0.75S in 7-16) is reported by the official ICC presentation on the 2024 IBC / ASCE 7-22 and by the SEAU presentation on the changes in 7-22.", "sis.nessuna": "Enter at least Ex to generate the combination.", "sis.ortoOff": "Components considered separately (± each): tick the 100/30 rule in the left-hand panel to combine them.", "sis.ortoOn": "100/30 orthogonal procedure applied (§12.5.3), with every combination of signs.", "sis.qeScalari": "The Q<sub>E</sub> values must be effects referred to the SAME design quantity.", "sis.r30off": "30% rule not applied: each component entered is considered on its own (± each), without summing it with the others.", "sis.r30on": "30% rule applied to the components entered (NTC 2018 §7.3.5): in rotation one component takes a factor of 1.00 and the others 0.30, with every combination of signs.", "sis.una": "The two combinations ±E have been generated.", "sub.ascePerimetro": "basic and seismic combinations (Chapter 2 core)", "sub.ec": "Combinations of actions — Eurocode 0", "tag.minima": "Permanent actions favourable, variable actions zero", "tipo.D": "D — Dead", "tipo.F": "F — Fluids with well-defined pressures and maximum heights", "tipo.H": "H — Lateral earth pressure / ground water pressure", "tipo.L": "L — Floor live", "tipo.Lr": "Lr — Roof live", "tipo.R": "R — Rain", "tipo.S": "S — Snow", "tipo.S.16": "S — Snow — nominal value, 7-16 treatment", "tipo.S.22": "S — Snow — ultimate-level value, 7-22 treatment", "tipo.W": "W — Wind", "tipo.Wt": "Wt — Tornado (7-22 only)", "ttl.csle": "Factor at the serviceability, seismic and accidental limit states", "ttl.cslu": "Factor at the ultimate limit state", "ttl.gruppo": "EN 1990 §6.4.3.2(4): permanent actions from the same source all take γ,sup or all take γ,inf. Actions with the same group name are treated as a single action.", "ttl.gruppoEsc": "Mutually alternative actions: at most one active per combination (e.g. wind +X / −X). It can also contain whole tied groups.", "ttl.gruppoSol": "Actions always active together and in the same role: the group counts as a single action distributed over several load cases (e.g. snow on different roof slopes).", "ttl.rimuovi": "Remove"},
    fr: {"appr.610": "Eq. 6.10 — combinaison unique", "appr.610ab": "Eq. 6.10a / 6.10b — enveloppe", "appr.A1": "Approche 1 / A1 — STR (la plus courante pour les bâtiments)", "appr.A2": "Approche 2 / A2 — GEO", "appr.EQU": "EQU — Équilibre", "aria.normativa": "Norme de référence", "aria.vista": "Vue des résultats", "asce.nonCoperto": "§2.3.2 / §2.4.2 (charges d'inondation F<sub>a</sub>), §2.3.3 / §2.4.3 (givre atmosphérique D<sub>i</sub> et W<sub>i</sub>), §2.3.4 / §2.4.4 (effets d'auto-contrainte T), §2.3.5 (charges non spécifiées), §2.5 (événements extraordinaires) et §2.6 (intégrité structurale)", "av.gruppiIncoerenti": "Configuration incohérente : les actions du groupe solidaire « {sol} » appartiennent à des groupes exclusifs différents ({esc}). Un groupe solidaire est une seule action et ne peut pas être alternatif à lui-même : le groupe exclusif du premier membre est utilisé. Corrigez l'affectation.", "av.nessunCaso": "Aucun cas de charge saisi : ajoutez-en au moins un dans le panneau de gauche.", "av.nessunD": "Aucun cas de type D (permanent) : toutes les équations ASCE contiennent D, les combinaisons sont donc incomplètes.", "av.omegaMancante": "Surrésistance demandée mais Ω<sub>0</sub> non saisi (Tab. 12.2-1) : les combinaisons avec Ω<sub>0</sub> n'ont pas été générées.", "av.omegaUno": "Ω<sub>0</sub> = 1 n'équivaut pas automatiquement à une « absence de surrésistance » : vérifiez la valeur dans la Tab. 12.2-1 pour le système résistant adopté.", "av.qeMancante": "Combinaisons sismiques actives mais aucune valeur Q<sub>E</sub> saisie.", "av.rhoMancante": "ρ non saisi : il a été pris égal à 1,0. C'est une valeur d'ingénierie, non un défaut anodin — il doit être déterminé selon le §12.3.4, qui impose ρ = 1,3 dans plusieurs cas.", "av.sdsMancante": "S<sub>DS</sub> non saisi : E<sub>v</sub> a été pris égal à zéro. Saisissez S<sub>DS</sub> ou cochez explicitement « E<sub>v</sub> = 0 ».", "av.troppeComb": "{n} combinaisons au total. Vérifiez que l'indépendance des actions représente des scénarios physiquement possibles : les actions qui ne peuvent pas coexister doivent être placées dans un groupe exclusif, les actions toujours concomitantes dans un groupe solidaire.", "av.wtSu716": "Un cas de type Wt (tornade) est présent, mais la charge tornade n'existe que dans l'ASCE 7-22 : avec 7-16 sélectionnée, il est ignoré.", "badge.alt": "alternative non active", "badge.dom": "dominante", "badge.fav": "↓ fav.", "badge.omessa": "omise (favorable)", "badge.sfav": "↑ défav.", "badge.sperimentale": "⚠ expérimental — vérifier l'applicabilité", "blk.approccio": "Approche de calcul", "blk.asceCarichi": "Cas de charge", "blk.asceMetodo": "Méthode de dimensionnement", "blk.doppioSegno": "Actions à double signe (±)", "blk.eccezionale": "Action accidentelle", "blk.output": "Présentation des résultats", "blk.permanenti": "Actions permanentes", "blk.sismica": "Action sismique", "blk.variabili": "Actions variables", "btn.addAsce": "+ Ajouter un cas de charge", "btn.addDs": "+ Ajouter une action à double signe", "btn.addPerm": "+ Ajouter une action permanente", "btn.addVar": "+ Ajouter une action variable", "btn.coffee": "☕ Offrez-moi un café", "btn.copiaBloccata": "Copie bloquée par le navigateur", "btn.copiaTsv": "Copier le tableau (TSV)", "btn.copiato": "Copié ✓", "btn.guida": "Guide", "btn.guidaTitle": "Ouvre le guide d'utilisation de l'outil", "btn.mostraTutte": "Afficher les {n} combinaisons", "btn.report": "Rapport PDF", "btn.reportTitle": "Compose le rapport et ouvre la fenêtre d'impression : choisissez « Enregistrer au format PDF »", "chip.max": "Maximum", "chip.min": "Minimum", "chk.asceEvZero": "E<sub>v</sub> = 0 (admis pour le dimensionnement des fondations avec les alternatives IBC, et dans les cas du §12.4.2.2)", "chk.asceIbc": "Inclure les combinaisons ASD <em>alternatives</em> de l'IBC (§1605.2)", "chk.asceLrid": "Coefficient sur L réduit à 0,5 dans les combinaisons 3 et 4 — admis lorsque L<sub>0</sub> ≤ 100 psf (4,79 kN/m²), <strong>hors</strong> garages et locaux de rassemblement du public (§2.3.1 Exc. 1)", "chk.asceOmega": "Générer aussi les combinaisons avec surrésistance (E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub>, §12.4.3)", "chk.asceOrto": "Appliquer la procédure orthogonale 100/30 entre Q<sub>Ex</sub> et Q<sub>Ey</sub>", "chk.asceSis": "Inclure les combinaisons sismiques (§2.3.6 / §2.4.5)", "chk.domPsi1": "Action variable dominante à ψ1 au lieu de ψ2 (EN 1990 eq. 6.11a — vérification « pendant » l'événement, p. ex. incendie en cours)", "chk.eccezionale": "Accidentelle — Ad", "chk.minima": "Inclure la combinaison minimale automatique (utilitaire pour le soulèvement)", "chk.permIndip": "Classification indépendante favorable/défavorable pour chaque action permanente ou groupe d'origine (2ⁿ combinaisons)", "chk.regola30": "Appliquer la règle des 30 % entre les composantes (§7.3.5)", "chk.sismica": "Inclure la combinaison sismique", "chk.varIndip": "Variables favorables/défavorables action par action (inclut le cas exclu)", "col.categoria": "Catégorie", "col.coefSLE": "Coefficient ELS / sismique / accid.", "col.coefSLU": "Coefficient ELU", "col.combinazione": "Combinaison", "col.componente": "Composante", "col.descrTipo": "Description du type", "col.descrizione": "Description", "col.eqOmega": "Avec surrésistance — E_mh = Ω₀·Q_E (§12.4.3)", "col.eqSismica": "Équation sismique", "col.equazione": "Équation", "col.gammaFav": "γ favorable", "col.gammaSfav": "γ défavorable", "col.grEsc": "Gr. exclusif", "col.grSol": "Gr. solidaire", "col.gruppoOrigine": "Groupe (origine)", "col.n": "N°", "col.nome": "Nom", "col.risultato": "Résultat", "col.significato": "Signification", "col.simbolo": "Symbole", "col.tipo": "Type", "col.valCar": "Valeur caractéristique", "col.valore": "Valeur", "cong.oppure": "ou", "disclaimer.footer": "Fourni tel quel, sans aucune garantie. Les résultats sont donnés à titre informatif : vérifiez-les toujours de manière indépendante avant de les utiliser dans un projet réel. Cet outil ne remplace pas le jugement professionnel d'un ingénieur qualifié ni les vérifications réglementaires obligatoires.", "disclaimer.report": "Ce rapport est généré automatiquement par un outil gratuit, à titre informatif. Il ne remplace pas le jugement professionnel d'un ingénieur qualifié, ni les vérifications réglementaires obligatoires, ni la révision technique du projet. L'auteur n'assume aucune responsabilité quant à l'utilisation des résultats contenus dans ce document dans un projet réel ou toute autre application : l'utilisation se fait entièrement à vos risques, sous réserve d'une vérification indépendante.", "esempio.perm": "G1 — poids propre", "esempio.var": "Q1 — exploitation", "g.ascecarichi.b": "<p>Chaque cas de charge doit être associé à son type normatif, car c'est le type qui détermine quel coefficient il reçoit dans chaque équation :</p><ul><li><strong>D</strong> permanente · <strong>L</strong> variable de plancher · <strong>L<sub>r</sub></strong> variable de toiture</li><li><strong>S</strong> neige · <strong>R</strong> pluie · <strong>W</strong> vent · <strong>W<sub>T</sub></strong> tornade (7-22 uniquement)</li><li><strong>F</strong> fluides de pression et de hauteur définies : prend le même coefficient que D</li><li><strong>H</strong> poussée des terres ou de la nappe phréatique : voir ci-dessous</li></ul><p>Pour les cas <strong>H</strong>, la norme distingue trois situations et l'outil vous les fait choisir cas par cas : poussée qui <em>accroît</em> l'effet principal (1,6H au Strength Design, 1,0H à l'ASD) ; poussée <em>permanente et résistante</em> (0,9H / 0,6H) ; poussée <em>résistante mais non permanente</em>, qui doit être prise nulle. Laquelle est la bonne dépend de la vérification examinée.</p><div class=\"gnote\"><strong>La neige change de signification entre les deux éditions.</strong> Dans 7-16, S est la valeur nominale ; dans 7-22, les cartes ont été recalibrées au niveau ultime, donc S vaut déjà davantage et porte dans les équations des coefficients différents. Attention lorsque vous importez les charges depuis un modèle FEM.</div>", "g.ascecarichi.t": "ASCE 7 — types de charge", "g.asceecc.b": "<p><strong>Coefficient sur L réduit (§2.3.1 Exc. 1).</strong> Dans les combinaisons 3 et 4, le coefficient sur L peut valoir 0,5 au lieu de 1,0 lorsque la charge variable tabulée L<sub>0</sub> ne dépasse pas 100 psf (4,79 kN/m²). Les garages et les locaux de rassemblement du public en sont <strong>exclus</strong>. La case ne doit être cochée qu'après avoir vérifié que le cas entre bien dans ce champ.</p><p><strong>Exception tornade.</strong> Dans l'ASCE 7-22, là où la charge W<sub>T</sub> est utilisée, la neige sort de la combinaison : la tornade est un phénomène de saison chaude et la neige n'est pas concomitante. L'outil l'applique aussi bien au Strength Design (comb. 4a, §2.3.1 Exc. 3) qu'à l'ASD (comb. 6a, §2.4.1).</p><div class=\"gnote\">La différence entre les éditions dans les parenthèses n'est pas cosmétique. 7-16 écrit 1,6(L<sub>r</sub> ou S ou R), avec un seul coefficient pour le groupe ; 7-22 écrit (1,6L<sub>r</sub> ou 1,0S ou 1,6R), avec un coefficient par alternative, parce que la neige est déjà au niveau ultime.</div>", "g.asceecc.t": "ASCE 7 — exceptions appliquées", "g.ascemetodo.b": "<p>Le moteur américain est construit d'une manière <strong>complètement différente</strong> de l'européen, et la différence ne tient pas qu'aux coefficients.</p><p>L'ASCE 7 n'a pas de règle générative : il a une <strong>liste fixe d'équations</strong>. La concomitance entre les charges est déjà écrite dans l'équation, il n'existe aucune action dominante qui tourne et <strong>les coefficients ψ n'existent pas</strong>. Les catégories A÷H des NTC ne servent ici à rien.</p><p>La seule combinatoire est le développement des parenthèses « ou » : une combinaison telle que 1,2D + 1,6(L<sub>r</sub> ou S ou R) engendre autant de lignes qu'il y a d'alternatives, mais seulement pour les types de charge que vous avez effectivement saisis.</p><p><strong>LRFD</strong> (§2.3) et <strong>ASD</strong> (§2.4) sont des méthodes alternatives. Dans les combinaisons ASD, le facteur 0,75 sur les charges d'accompagnement est déjà multiplié dans les coefficients affichés : 0,75 × 0,6W apparaît comme 0,45W.</p><div class=\"gnote\">Avec les combinaisons ASD de base, <strong>aucune augmentation des contraintes admissibles n'est permise</strong>.</div>", "g.ascemetodo.t": "ASCE 7 — comment ça fonctionne", "g.asceorto.b": "<p>La case 100/30 fait tourner les deux composantes horizontales : une à 100 % et l'autre à 30 %, avec toutes les combinaisons de signe. Avec deux composantes saisies, on obtient huit schémas pour chaque équation sismique.</p><div class=\"gnote\"><strong>Ce n'est pas une règle à appliquer systématiquement.</strong> Le §12.5 distingue la procédure directionnelle indépendante (§12.5.1.1) de la combinaison orthogonale (§12.5.1.2), et laquelle s'applique dépend de la catégorie de conception sismique et de la configuration de la structure (§12.5.3, §12.5.4). L'outil ne le décide pas : vérifiez l'applicabilité avant de cocher la case.</div>", "g.asceorto.t": "ASCE 7 — effets orthogonaux", "g.ascerho.b": "<p>Ce sont deux paramètres que <strong>l'outil ne détermine pas</strong> et ne peut pas déterminer : ils dépendent du système structural et de la catégorie de conception sismique.</p><p><strong>ρ — redundancy factor (§12.3.4).</strong> Il doit être obtenu selon le §12.3.4, qui impose ρ = 1,3 dans plusieurs cas. L'outil ne vérifie pas les conditions qui permettent ρ = 1,0 : il utilise telle quelle la valeur que vous saisissez. Si vous le laissez vide, il prend 1,0 et le signale.</p><p><strong>Ω<sub>0</sub> — facteur de surrésistance.</strong> Il est tabulé dans la Tab. 12.2-1 en fonction du système résistant. Il sert aux combinaisons avec E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub>, exigées pour certains éléments. Ω<sub>0</sub> = 1 n'équivaut pas automatiquement à une « absence de surrésistance ».</p><div class=\"gnote\">Le §12.4.3 permet de limiter E<sub>mh</sub> à la valeur découlant de la capacité de l'élément qui plastifie. <strong>Cette limite n'est pas appliquée</strong> par l'outil.</div>", "g.ascerho.t": "ASCE 7 — ρ et Ω₀", "g.ascesisma.b": "<p>Dans l'ASCE 7, l'action sismique n'est pas une donnée unique. L'effet E se compose de deux parties :</p><ul><li><strong>E<sub>h</sub> = ρ·Q<sub>E</sub></strong> — l'effet horizontal, où Q<sub>E</sub> est celui que vous obtenez de l'analyse</li><li><strong>E<sub>v</sub> = 0,2·S<sub>DS</sub>·D</strong> — l'effet vertical, qui <em>n'est pas</em> une charge distincte : il est proportionnel à l'action permanente</li></ul><p>C'est pourquoi E<sub>v</sub> n'apparaît pas comme colonne : il est incorporé dans le coefficient des actions de type D, ajouté dans les combinaisons 6, 8 et 9 et soustrait dans les 7 et 10. Il n'est pas appliqué aux actions de type F.</p><p>Si vous laissez S<sub>DS</sub> vide, E<sub>v</sub> est pris égal à zéro et l'outil vous le signale. La case « E<sub>v</sub> = 0 » sert à déclarer ce choix explicitement, comme admis pour les fondations avec les alternatives IBC et dans les cas du §12.4.2.2.</p><div class=\"gnote\">Q<sub>Ex</sub> et Q<sub>Ey</sub> doivent être des effets déjà obtenus par l'analyse et rapportés à la <strong>même grandeur de réponse</strong>.</div>", "g.ascesisma.t": "ASCE 7 — séisme", "g.doppiosegno.b": "<p>Ce sont des actions présentes dans <em>chaque</em> combinaison, avec un coefficient fixe et dans les deux sens. Chaque action à double signe double le nombre de combinaisons : n actions le multiplient par 2ⁿ.</p><p>Le cas typique est celui des <strong>imperfections géométriques équivalentes</strong> (EN 1993-1-1 §5.3), qui doivent être appliquées dans le sens qui aggrave l'effet examiné. Si la valeur découle de charges déjà pondérées (F = φ·N<sub>Ed</sub>), le coefficient à l'état limite ultime (ELU) vaut 1 et aux états limites de service (ELS) il vaut typiquement 1/γ<sub>Q</sub>.</p><div class=\"gnote\">Le coefficient et l'applicabilité à chaque état limite <strong>restent un choix du projeteur</strong> : le traitement des imperfections dépend de la méthode d'analyse et du modèle adopté.</div>", "g.doppiosegno.t": "Actions à double signe (±)", "g.ecazioni.b": "<p>Chaque action permanente a un type : <strong>G1</strong> structurale, <strong>G2</strong> non structurale, <strong>P</strong> précontrainte. Le type détermine les coefficients partiels appliqués.</p><p>Le champ <strong>groupe d'origine</strong> sert au principe de la source unique (EN 1990 §6.4.3.2(4)) : les actions permanentes qui proviennent de la même origine physique doivent prendre <em>toutes</em> γ<sub>sup</sub> ou <em>toutes</em> γ<sub>inf</sub>, jamais des sens mixtes. En inscrivant le même nom de groupe sur plusieurs actions, celles-ci évoluent ensemble et comptent pour une seule dans la combinatoire.</p><p>Pour la précontrainte, le coefficient γ<sub>P</sub> est pris égal à 1,0 sauf évaluation spécifique différente (NTC 2018 §2.6.1 ; voir aussi §4.1.8.1.1 pour γ<sub>P</sub>=1,2 sur les ancrages locaux).</p>", "g.ecazioni.t": "EC0 / NTC — actions permanentes", "g.eccezionale.b": "<p>La valeur A<sub>d</sub> (choc, explosion, incendie) doit être définie par l'analyse spécifique de l'action accidentelle : l'outil ne la détermine pas.</p><p>Avec les <strong>NTC 2018</strong>, l'eq. 2.5.6 impose ψ<sub>2</sub> pour <em>toutes</em> les variables, sans action variable dominante.</p><p>Avec <strong>EN 1990</strong>, vous pouvez choisir : eq. 6.11b avec ψ<sub>2</sub> pour toutes, ou eq. 6.11a avec une action variable dominante à ψ<sub>1</sub>, qui représente la vérification « pendant » l'événement — par exemple un incendie en cours.</p>", "g.eccezionale.t": "Combinaison accidentelle", "g.ecgruppi.b": "<p>Les actions variables disposent de <strong>deux champs de groupe indépendants</strong>, qui servent à des choses différentes.</p><ul><li><strong>Groupe solidaire</strong> : les actions portant le même nom sont toujours actives ensemble et avec le même rôle, comme s'il s'agissait d'une seule action. Exemple : la neige calculée automatiquement et celle appliquée à la main sur une partie de la toiture.</li><li><strong>Groupe exclusif</strong> : les actions portant le même nom sont alternatives entre elles, au plus une active par combinaison. Exemple : vent en direction X et vent en direction Y, ou dilatation et contraction thermique.</li></ul><p>Les deux niveaux se combinent : un groupe solidaire peut être <em>l'une des alternatives</em> d'un groupe exclusif. Affecter des actions du même groupe solidaire à des groupes exclusifs différents est incohérent et l'outil le signale en rouge.</p><div class=\"gnote\"><strong>Les deux cases d'indépendance</strong> décident du nombre de combinaisons engendrées. En les désactivant, on obtient l'ensemble minimal (toutes les actions permanentes défavorables, toutes les variables actives avec rotation de la dominante) ; en les activant, chaque action peut aussi être favorable ou exclue, et le nombre de combinaisons croît en 2ⁿ. Avec le groupe exclusif et l'indépendance désactivée, l'une des alternatives est <em>toujours</em> présente.</div>", "g.ecgruppi.t": "EC0 / NTC — groupes de variables", "g.ecminima.b": "<p>C'est une combinaison de commodité : actions permanentes dans le sens favorable avec les γ minimaux, variables toutes nulles. Elle sert à explorer le minimum de l'enveloppe, typiquement pour les problèmes de soulèvement.</p><div class=\"gnote\"><strong>Elle ne remplace pas une vérification EQU.</strong> Dans une vérification d'équilibre, chaque action doit être classée comme stabilisatrice ou déstabilisatrice vis-à-vis du mécanisme considéré, et les variables aussi peuvent être stabilisatrices. Cet utilitaire ne le fait pas à votre place.</div>", "g.ecminima.t": "EC0 / NTC — combinaison minimale", "g.ecnorma.b": "<p>Le moteur européen est <strong>génératif</strong> : il applique la règle γ<sub>G</sub>·G + γ<sub>Q</sub>·Q<sub>k1</sub> + Σ γ<sub>Q</sub>·ψ<sub>0</sub>·Q<sub>ki</sub> en faisant tourner l'action variable dominante parmi toutes les variables actives.</p><p>Avec les <strong>NTC 2018</strong>, choisissez l'approche dans la Tab. 2.6.I : EQU pour l'équilibre, A1 pour les vérifications structurales (le cas le plus courant pour les bâtiments), A2 pour les vérifications géotechniques.</p><p>Avec <strong>EN 1990 générique</strong>, choisissez l'équation : 6.10 seule, ou l'enveloppe 6.10a/6.10b. En 6.10b, les actions permanentes défavorables sont réduites par le facteur ξ, pris ici égal à 0,85 comme recommandé par le CEN : <strong>l'Annexe Nationale applicable peut en fixer un autre</strong>, vérifiez-le.</p><div class=\"gnote\">Avec l'approche A2, l'outil applique seulement les coefficients sur les actions. Une vérification géotechnique complète exige aussi les coefficients sur les paramètres du sol (M1/M2) et sur les résistances (R1/R2/R3), qui ne sont pas générés.</div>", "g.ecnorma.t": "EC0 / NTC — approche", "g.ecsisma.b": "<p>Saisissez les effets sismiques Ex, Ey et Ez déjà obtenus par l'analyse. Avec une seule direction renseignée, on obtient les deux combinaisons ±E.</p><p>Avec plusieurs directions, chacune est par défaut considérée séparément. En cochant la <strong>règle des 30 %</strong> (NTC 2018 §7.3.5), les composantes sont permutées : une au coefficient 1,00 et les autres à 0,30, avec toutes les combinaisons de signe.</p><div class=\"gnote\">Ex, Ey et Ez doivent être des effets rapportés à la <strong>même grandeur de vérification</strong>. L'outil additionne des scalaires : il ne réalise pas une composition vectorielle des actions sismiques.</div>", "g.ecsisma.t": "EC0 / NTC — séisme", "g.export.b": "<p>La <strong>vue Matrice</strong> place les cas de charge en colonne et les combinaisons en ligne, avec les coefficients dans les cellules. Le bouton de copie exporte le tout au format TSV : il se colle directement dans Excel ou dans les logiciels FEM qui importent du texte tabulé. Le tableau à l'écran est tronqué pour des raisons de performance, mais la copie contient toujours toutes les combinaisons.</p><p>Le <strong>séparateur décimal</strong> vaut pour la vue matrice et pour la copie : virgule pour Excel français, point pour les logiciels FEM et pour Excel en langue anglaise.</p><p>Les coefficients sont exportés avec quatre décimales, parce qu'ils sont des produits de plusieurs facteurs : ξ·γ<sub>G</sub> vaut 1,1475 et l'arrondir à 1,15 introduirait une erreur.</p><p>Le <strong>Rapport PDF</strong> compose un document avec la norme, les hypothèses de génération, les cas de charge, les coefficients, les équations utilisées in extenso et toutes les combinaisons, puis ouvre la fenêtre d'impression du navigateur : choisissez « Enregistrer au format PDF ». Parce qu'il reporte les équations in extenso, le document est vérifiable par celui qui le reçoit sans disposer de l'outil.</p>", "g.export.t": "Exporter les résultats", "g.ibc.b": "<p>Depuis 2021, l'IBC a supprimé du §1605 ses propres copies des combinaisons de résistance et des ASD de base, en renvoyant à l'ASCE 7. Ce qu'il a conservé, c'est le jeu <strong>alternatif</strong> ASD, eq. 16-1 ÷ 16-6, que cet outil génère à la demande. L'édition suit celle de l'ASCE choisie : 7-16 → IBC 2021, 7-22 → IBC 2024.</p><p>Le facteur ω a été <strong>supprimé</strong> de l'IBC 2021 : le vent entre simplement comme 0,6W.</p><p>L'augmentation de 1/3 des contraintes admissibles n'est pas accordée par l'IBC lui-même : le §1605.2 renvoie à la norme de matériau. AISC 360 (acier) et TMS 402 (maçonnerie) l'ont supprimée, ACI 318 ne prévoit pas l'ASD. En pratique, elle subsiste pour le bois, où le mécanisme est toutefois le facteur C<sub>D</sub> de la NDS, et pour les portances géotechniques.</p><div class=\"gnote\"><strong>Cette section est marquée comme expérimentale.</strong> Les équations 16-1 ÷ 16-4 sont vérifiées ; les 16-5 et 16-6 contiennent une interprétation de l'outil sur le traitement de E<sub>v</sub>. Confrontez-les à l'édition officielle de l'IBC avant de les utiliser dans un calcul.</div>", "g.ibc.t": "IBC — combinaisons ASD alternatives", "g.limiti.b": "<p>Il vaut la peine d'être explicite sur les limites.</p><ul><li><strong>Il ne détermine pas les charges.</strong> Valeurs caractéristiques, effets sismiques, actions accidentelles : c'est vous qui les saisissez, tirées de l'analyse.</li><li><strong>Il n'effectue pas les vérifications</strong> de résistance, de stabilité ou de service.</li><li><strong>Il additionne des valeurs scalaires</strong> rapportées à la même grandeur. Il ne compose pas de vecteurs.</li><li><strong>Il ne sait pas si un cas de charge est pertinent</strong> pour le scénario : il développe les alternatives prévues par l'équation pour les types que vous avez saisis, mais l'applicabilité reste votre appréciation.</li><li><strong>Pour l'ASCE 7, il couvre le noyau du Chapter 2</strong> : combinaisons de base (§2.3.1, §2.4.1) et sismiques (§2.3.6, §2.4.5). Restent en dehors l'inondation (§2.3.2 / §2.4.2), le givre atmosphérique (§2.3.3 / §2.4.3), les effets d'auto-contrainte T (§2.3.4 / §2.4.4), les charges non spécifiées (§2.3.5), les événements extraordinaires (§2.5) et l'intégrité structurale (§2.6).</li><li><strong>Pour les vérifications géotechniques</strong>, il applique seulement les coefficients sur les actions, ni ceux sur les paramètres du sol ni ceux sur les résistances.</li></ul><div class=\"gnote\">Deux points normatifs récents proviennent de sources institutionnelles mais non du texte ASCE payant : le coefficient 0,1S dans la combinaison 9 du §2.4.5 de 7-22 (présentation officielle ICC sur l'IBC 2024 / ASCE 7-22, et présentation SEAU) et l'Exception 3 du §2.3.1 sur l'usage de W<sub>T</sub> (guide NIST/FEMA sur les charges de tornade). Si le projet l'exige, recoupez-les avec la copie officielle.</div>", "g.limiti.t": "Ce que l'outil ne fait pas", "g.start.b": "<p>L'outil génère les combinaisons d'actions pour les vérifications structurales. Il ne calcule pas les charges et n'effectue pas les vérifications : il combine les valeurs que vous lui fournissez.</p><ul><li><strong>Choisissez la norme</strong> en haut : NTC 2018, EN 1990 générique, ASCE 7-22 ou ASCE 7-16. Le panneau de gauche change en conséquence, car les deux mondes fonctionnent différemment.</li><li><strong>Saisissez les cas de charge</strong> avec leur valeur caractéristique.</li><li><strong>Lisez les résultats</strong> à droite : ils se mettent à jour à chaque modification, il n'y a aucun bouton « générer ».</li><li><strong>Exportez</strong> avec la vue Matrice (copie TSV pour Excel ou pour le logiciel FEM) ou avec le Rapport PDF.</li></ul><div class=\"gnote\"><strong>L'outil additionne des valeurs scalaires.</strong> Toutes les valeurs saisies doivent se rapporter à la même grandeur de vérification : combiner une réaction avec un moment n'a aucun sens. S'il vous faut l'enveloppe sur plusieurs grandeurs, menez une session par grandeur.</div><p>Les données restent dans votre navigateur et ne sont envoyées à aucun serveur. Si vous fermez puis rouvrez la page, vous les retrouvez.</p>", "g.start.t": "Premiers pas", "guida.chiudi": "Fermer", "guida.titolo": "Guide d'utilisation", "help.apri": "Ouvrir le guide sur ce sujet", "hint.asce": "Aucun cas de charge saisi.", "hint.doppioSegno": "Aucune action à double signe saisie.", "hint.matrice": "Colonnes = cas de charge · lignes = combinaisons · cellules = coefficients. Collez dans Excel ou dans le logiciel FEM.", "hint.permanenti": "Aucune action permanente saisie.", "hint.variabili": "Aucune action variable saisie.", "lbl.approccioEC": "Équation (EN 1990 Annex A1)", "lbl.approccioNTC": "Approche (Tab. 2.6.I NTC 2018)", "lbl.decimale": "Séparateur décimal (vue matrice et copie)", "lbl.dominante": "{nome} dominante", "lbl.eccNtc": "Ad + permanentes + actions variables à ψ2", "lbl.metodo": "Méthode", "lbl.nessunoParen": "(aucun)", "lbl.ruoloH": "Rôle de H", "lbl.soloPermanenti": "permanentes seules", "lbl.tuttiPsi2": "Toutes les actions variables à ψ2", "lbl.unicaVariabile": "action variable unique", "lbl.unita": "Unité de mesure (affichage uniquement)", "msg.valoriMancanti": "saisissez toutes les valeurs caractéristiques pour obtenir le résultat numérique", "nota.f": "Les cas de type F prennent le même coefficient que le permanent D, comme le prescrivent les notes au §2.3.1 / §2.4.1.", "nota.h": "Pour les cas de type H, la norme distingue trois situations : la poussée qui accroît l'effet principal (1,6H au Strength Design, 1,0H à l'ASD), celle qui est permanente et résistante (0,9H / 0,6H) et celle qui est résistante mais non permanente, qui doit être prise nulle. Laquelle est la bonne dépend de la vérification examinée et reste une appréciation du projeteur.", "nota.hRuoli": "Rôle attribué aux cas H :", "nota.lRidotta": "Exception 1 du §2.3.1 appliquée : coefficient sur L égal à 0,5 dans les combinaisons 3 et 4.", "nota.parentesi722": "Dans 7-22, les parenthèses ne sont plus factorisées comme groupe : la neige est déjà au niveau ultime, donc chaque alternative porte son propre coefficient.", "nota.tornadoASD": "<strong>Exception tornade appliquée :</strong> dans la combinaison 6a, où l'on utilise W<sub>T</sub>, la parenthèse 0,75(L<sub>r</sub> ou 0,7S ou R) se réduit à 0,75(L<sub>r</sub> ou R) — la tornade est un phénomène de saison chaude et la neige n'est pas concomitante.", "nota.tornadoLRFD": "<strong>Exception 3 du §2.3.1 appliquée :</strong> dans la combinaison 4a, où l'on utilise W<sub>T</sub>, la parenthèse (0,5L<sub>r</sub> ou 0,3S ou 0,5R) se réduit à 0,5(L<sub>r</sub> ou R) — la tornade est un phénomène de saison chaude et la neige n'est pas concomitante.", "nota.troncElenco": "Liste tronquée à {cap} combinaisons sur {tot} pour des raisons de performance ; le maximum et le minimum ci-dessus restent calculés sur l'ensemble complet.", "nota.troncMatrice": "Tableau tronqué à {cap} lignes sur {tot} pour des raisons de performance ; le bouton de copie exporte néanmoins toutes les combinaisons.", "note.asceCarichi": "Chaque cas est associé à un type normatif : c'est l'équation qui décide du coefficient, pas vous. Vous pouvez saisir plusieurs cas du même type : ils reçoivent le même coefficient et restent des colonnes distinctes dans la matrice.", "note.asceSis": "Dans l'ASCE 7, le séisme n'est pas une donnée unique : E se compose de E<sub>h</sub> = ρ·Q<sub>E</sub> et E<sub>v</sub> = 0,2·S<sub>DS</sub>·D. Saisissez l'effet Q<sub>E</sub> issu de l'analyse et les paramètres ci-dessous.", "note.doppioSegno": "Actions présentes dans <em>chaque</em> combinaison, avec un coefficient fixe et dans les deux sens ±. Cas typique : les imperfections géométriques équivalentes (EN 1993-1-1 §5.3). Le coefficient et l'applicabilité à chaque état limite restent un choix du projeteur.", "note.ds": "Les actions à double signe ({g}) entrent dans chaque combinaison avec les deux sens.", "note.geoA2": "Ce ne sont que les coefficients sur les actions (Tab. 2.6.I, colonne A2) ; une vérification GEO complète exige aussi les coefficients sur les paramètres géotechniques (M1/M2) et sur les résistances (R1/R2/R3), non générés par cet outil.", "note.gruppiEsc": "Groupes exclusifs ({g}) : les alternatives du groupe s'excluent mutuellement, au plus une active par combinaison.", "note.gruppiPerm": "Les actions permanentes de la même origine ({g}) prennent toutes γ,sup ou toutes γ,inf (EN 1990 §6.4.3.2(4)).", "note.gruppiSol": "Groupes solidaires ({g}) : les actions du groupe sont toujours actives ensemble et avec le même rôle, comme s'il s'agissait d'une seule action.", "note.metodo": "LRFD et ASD sont des méthodes de dimensionnement <strong>alternatives</strong> : « Les deux » génère les deux ensembles pour comparaison ou pour documentation, non parce qu'une vérification devrait être menée avec les deux à la fois.", "note.omega": "Ω<sub>0</sub> est le <strong>facteur de surrésistance</strong> tabulé dans la Tab. 12.2-1. L'outil ne le détermine pas et n'applique pas la limite de capacité du §12.4.3.", "note.orto": "Le 100/30 <strong>n'est pas une règle universelle</strong> : le §12.5 distingue la procédure directionnelle indépendante et la combinaison orthogonale, et laquelle s'applique dépend de la catégorie de conception sismique et de la configuration de la structure.", "note.permIndip": "Chaque action permanente est considérée favorable ou défavorable indépendamment des autres.", "note.rho": "ρ est le <strong>redundancy factor</strong> : il doit être déterminé selon le §12.3.4. L'outil <strong>ne vérifie pas</strong> les conditions qui permettent ρ = 1,0 et ne le choisit pas à votre place.", "note.sismica": "Renseignez une seule direction pour une combinaison simple (±E), ou plusieurs directions : par défaut, elles sont considérées séparément.", "note.tutteComb": "Toutes les combinaisons résultantes sont générées (désactivable dans le panneau de gauche).", "note.unTerzo": "L'augmentation de 1/3 des contraintes admissibles est permise <em>uniquement</em> avec les alternatives IBC et <em>uniquement</em> si la norme de matériau l'autorise : AISC 360 et TMS 402 l'ont supprimée, ACI 318 ne prévoit pas l'ASD.", "note.varFond": "Chaque action variable peut être dominante, d'accompagnement (ψ0) ou favorable et exclue (0), indépendamment des autres.", "note.varFreq": "Chaque action variable peut être dominante (ψ1), d'accompagnement (ψ2) ou favorable et exclue, indépendamment des autres.", "note.varNoDom": "Chaque action variable peut être active (ψ2) ou favorable et exclue, indépendamment des autres.", "note.varRara": "Chaque action variable peut être dominante (valeur pleine), d'accompagnement (ψ0) ou favorable et exclue, indépendamment des autres.", "opt.G1": "G1 — structurale", "opt.G2": "G2 — non structurale", "opt.P": "P — précontrainte", "opt.both": "Les deux (LRFD + ASD)", "opt.punto": "Point — logiciel FEM / Excel en locale anglaise", "opt.virgola": "Virgule — Excel en locale européenne", "ph.ad": "valeur Ad", "ph.ex": "valeur Ex", "ph.ey": "valeur Ey (opt.)", "ph.ez": "valeur Ez (opt.)", "ph.gruppo": "groupe — actions de la même origine (facultatif)", "ph.gruppoEsc": "groupe exclusif (alternatives)", "ph.gruppoSol": "groupe solidaire (toujours ensemble)", "ph.nomeDs": "Nom (p. ex. Imperfections)", "ph.nomePerm": "Nom (p. ex. Poids propre)", "ph.nomeVar": "Nom (p. ex. Charge d'exploitation)", "ph.omega": "d'après Tab. 12.2-1", "ph.qex": "effet sismique X", "ph.qey": "effet sismique Y (opt.)", "ph.rho": "d'après §12.3.4", "ph.sds": "ex. 0.85", "ph.valCar": "valeur car.", "ph.valCarQk": "valeur car. Qk", "ph.valore": "valeur", "psi.ec.A": "Catégorie A — Habitation, zones résidentielles", "psi.ec.B": "Catégorie B — Bureaux", "psi.ec.C": "Catégorie C — Lieux de réunion", "psi.ec.D": "Catégorie D — Commerces", "psi.ec.E": "Catégorie E — Aires de stockage", "psi.ec.F": "Catégorie F — Zones de trafic, véhicules ≤ 30 kN", "psi.ec.G": "Catégorie G — Zones de trafic, 30 kN < véhicules ≤ 160 kN", "psi.ec.H": "Catégorie H — Toits", "psi.ec.custom": "Personnalisée (ψ manuels)", "psi.ec.neve_altri": "Neige — autres pays CEN", "psi.ec.neve_nordic": "Neige — Finlande, Islande, Norvège, Suède", "psi.ec.temperatura": "Variations thermiques", "psi.ec.vento": "Vent", "psi.ntc.A": "A — Locaux résidentiels", "psi.ntc.B": "B — Bureaux", "psi.ntc.C": "C — Locaux susceptibles de rassemblement du public", "psi.ntc.D": "D — Locaux à usage commercial", "psi.ntc.E": "E — Bibliothèques, archives, entrepôts, usage industriel", "psi.ntc.F": "F — Remises, parcs de stationnement (véhicules ≤ 30 kN)", "psi.ntc.G": "G — Remises, parcs de stationnement (véhicules > 30 kN)", "psi.ntc.H": "H — Toitures (entretien uniquement)", "psi.ntc.custom": "Personnalisée (ψ manuels)", "psi.ntc.neve_gt1000": "Neige (altitude > 1000 m)", "psi.ntc.neve_le1000": "Neige (altitude ≤ 1000 m)", "psi.ntc.temperatura": "Variations thermiques", "psi.ntc.vento": "Vent", "ref.asce.assunzioni": "Hypothèses de l'outil : il combine des valeurs scalaires rapportées à la même grandeur de vérification ; E_v est incorporé dans le coefficient des actions D et n'est pas appliqué à celles de type F ; les cas H entrent avec le rôle choisi par le projeteur parmi les trois prévus par la norme (1,6H / 1,0H s'ils accroissent l'effet, 0,9H / 0,6H s'ils sont permanents et résistants, zéro s'ils sont résistants mais non permanents) ; la limite de capacité sur E_mh du §12.4.3 n'est pas appliquée ; ne sont pas générées les combinaisons avec F_a (inondation), D_i / W_i (givre) ni les effets d'auto-contrainte T ; les données restent uniquement dans ce navigateur (aucun envoi à un serveur).", "ref.asce.fonti": "ASCE/SEI 7-16 et ASCE/SEI 7-22, Chap. 2 (§2.3 Strength Design, §2.4 Allowable Stress Design) et Chap. 12 (§12.4, §12.5, Tab. 12.2-1) — IBC §1605.2 pour les combinaisons ASD alternatives — ASCE 7-22 Chap. 32 pour la charge tornade W_T.", "ref.asce.prov": "Provenance des modifications 7-22 les plus récentes : le coefficient 0,1S dans la combinaison 9 du §2.4.5 provient de la présentation officielle ICC sur le 2024 IBC / ASCE 7-22 et de celle de la SEAU ; l'Exception 3 du §2.3.1 sur l'usage de W_T provient du guide NIST/FEMA sur les charges de tornade. Aucune des deux n'a été lue sur le texte ASCE payant.", "ref.ec.assunzioni": "Hypothèses de l'outil : il combine des valeurs scalaires rapportées à la même grandeur de vérification ; les valeurs caractéristiques saisies sont réputées déjà exprimées dans le sens qui produit l'effet le plus défavorable pour la vérification examinée ; le coefficient γP pour la précontrainte est fixé à 1,0 sauf évaluation spécifique différente (NTC 2018 §2.6.1) ; les données restent uniquement dans ce navigateur (aucun envoi à un serveur).", "ref.psi": "Coefficients ψ par catégorie d'action variable", "ref.simboli": "Symboles", "ref.titoloAsce": "Équations et symboles utilisés", "ref.titoloEc": "Tableaux des coefficients utilisés", "rep.asce.assunzioni": "<strong>Hypothèses de l'outil :</strong> l'outil combine des valeurs SCALAIRES qui doivent toutes se rapporter à la même grandeur de vérification ; les valeurs saisies sont réputées déjà exprimées dans le sens qui produit l'effet le plus défavorable pour la vérification examinée. E<sub>v</sub> = 0,2·S<sub>DS</sub>·D est incorporé dans le coefficient des actions de type D et n'est pas appliqué aux actions de type F. Pour les cas de type H, le rôle est choisi par le projeteur cas par cas parmi les trois prévus par la norme : poussée qui accroît l'effet principal (1,6H au Strength Design, 1,0H à l'ASD), poussée permanente et résistante (0,9H / 0,6H) et poussée résistante mais non permanente, qui est prise nulle ; le rôle adopté est reporté ci-dessus avec les cas de charge. L'applicabilité de chaque cas de charge à la situation examinée reste elle aussi à la charge du projeteur : l'outil développe les alternatives prévues par l'équation pour les types saisis, mais il ne sait pas si une charge donnée est pertinente pour le scénario. La limite de capacité sur E<sub>mh</sub> prévue par le §12.4.3 n'est pas appliquée. Ne sont pas générées les combinaisons avec charges d'inondation (F<sub>a</sub>, §2.3.2), givre atmosphérique (D<sub>i</sub>, W<sub>i</sub>, §2.3.3), ni les effets d'auto-contrainte T (§2.3.4 / §2.4.4). L'outil génère les combinaisons des charges : il ne remplace ni les vérifications de résistance ni la détermination des charges elles-mêmes.", "rep.asce.diff": "<strong>Différences 7-16 → 7-22 prises en compte :</strong> les cartes de neige au sol ont été recalibrées au niveau ultime par catégorie de risque, donc dans le Chapter 2 les parenthèses « ou » ne sont plus factorisées comme groupe et la neige porte son propre coefficient — 1,6(L<sub>r</sub> ou S ou R) devient (1,6L<sub>r</sub> ou 1,0S ou 1,6R) et 0,5(…) devient (0,5L<sub>r</sub> ou 0,3S ou 0,5R) ; dans les ASD, la neige apparaît comme 0,7S. La neige d'accompagnement dans les combinaisons sismiques de résistance passe de 0,2S à 0,15S. La charge tornade W<sub>T</sub> est introduite, comme alternative à W dans les seules combinaisons où le vent est l'action principale.", "rep.asce.fonti": "ASCE/SEI 7-16 et ASCE/SEI 7-22, <em>Minimum Design Loads and Associated Criteria for Buildings and Other Structures</em>, Chap. 2 (§2.3 Strength Design, §2.4 Allowable Stress Design) et Chap. 12 (§12.4 effets sismiques, §12.5 effets orthogonaux, Tab. 12.2-1 pour Ω<sub>0</sub>) — International Building Code, §1605.2 (combinaisons ASD alternatives). La charge tornade W<sub>T</sub> est introduite par l'ASCE 7-22, Chap. 32.", "rep.asce.prov": "<strong>Provenance des deux modifications 7-22 les plus récentes :</strong> le coefficient 0,1S dans la combinaison 9 du §2.4.5 (0,75S auparavant) provient de la présentation officielle ICC sur le 2024 IBC / ASCE 7-22 et de celle de la SEAU sur les modifications de 7-22 ; l'Exception 3 du §2.3.1 sur l'usage de W<sub>T</sub> provient du guide NIST/FEMA sur les charges de tornade de l'ASCE 7-22. Aucune des deux n'a été lue sur le texte ASCE payant : si le projet l'exige, recoupez-les avec la copie officielle.", "rep.avvertenza": "Avertissement :", "rep.casiCarico": "Cas de charge", "rep.coefNorma": "Coefficients normatifs", "rep.coefParziali": "Coefficients partiels γ (favorable / défavorable)", "rep.coefPsi": "Coefficients de combinaison ψ par catégorie", "rep.combGenerate": "Combinaisons générées", "rep.compSis": "Composante sismique", "rep.compSismiche": "Composantes sismiques", "rep.ec.assunzioni": "<strong>Hypothèses de l'outil :</strong> l'outil combine des valeurs SCALAIRES qui doivent toutes se rapporter à la même grandeur de vérification ; les valeurs caractéristiques saisies sont réputées déjà exprimées dans le sens qui produit l'effet le plus défavorable pour la vérification examinée, et la classification favorable/défavorable relève de la responsabilité du projeteur pour chaque vérification ; le coefficient γP pour la précontrainte est pris égal à 1,0 sauf évaluation spécifique différente (NTC 2018 §2.6.1). L'outil génère les combinaisons des actions : il ne remplace pas les vérifications de résistance, ni, pour les vérifications géotechniques, les coefficients sur les paramètres du sol et sur les résistances.", "rep.ec.fonti": "D.M. 17 gennaio 2018 (NTC 2018), Chap. 2.5–2.6, Tab. 2.5.I et Tab. 2.6.I — EN 1990:2002+A1:2005 (Eurocode 0), Annex A1, Tab. A1.1 et A1.2(B) — EN 1993-1-1 §5.3 pour les imperfections géométriques équivalentes.", "rep.ec.transizione": "La transition vers la deuxième génération des Eurocodes (EN 1990:2023) est en cours ; à ce jour, les NTC 2018 restent la référence contraignante en Italie. Vérifiez toujours l'édition applicable dans votre propre contexte normatif.", "rep.eccSis": "Actions accidentelles et sismiques", "rep.equazioni": "Équations de combinaison utilisées", "rep.ev.nonInserito": "0 (S_DS non saisi)", "rep.ev.zero": "0 (assumé explicitement)", "rep.fonti": "Sources et hypothèses", "rep.fontiLbl": "Sources :", "rep.generato": "Généré le {d}", "rep.gruppiIncoerenti": "les actions du groupe solidaire « {sol} » sont affectées à des groupes exclusifs différents ({esc}) ; le groupe exclusif du premier membre a été utilisé. Vérifier l'affectation des groupes.", "rep.gruppoOrigine": "Les actions permanentes appartenant au même groupe d'origine ({g}) sont considérées comme une seule action : elles prennent toutes γ,sup ou toutes γ,inf, jamais des sens mixtes (EN 1990 §6.4.3.2(4)).", "rep.inUso": "(en usage)", "rep.ipotesi": "Hypothèses de génération", "rep.lblApproccio": "Approche", "rep.lblEquazione": "Équation", "rep.matriceTroncataPdf": "Sont indiquées les {cap} premières combinaisons sur {tot}. La liste complète est exportable au format TSV depuis le bouton « Copier le tableau » dans la vue Matrice.", "rep.max": "{n} combinaisons — maximum <strong>{v}</strong> ({id})", "rep.metodo": "Méthode", "rep.min": "minimum <strong>
