{v}</strong> ({id})", "rep.normEC": "EN 1990 (Eurocode 0) — valeurs recommandées de l'Annex A1", "rep.normNTC": "NTC 2018 — D.M. 17 gennaio 2018", "rep.normativa": "Norme de référence", "rep.notaDoppioSegno": "Présentes dans chaque combinaison avec les deux sens : n actions à double signe multiplient par 2<sup>n</sup> le nombre de combinaisons. Le sens doit être choisi comme celui qui aggrave l'effet examiné. Cas typique : imperfections géométriques équivalentes selon l'EN 1993-1-1 §5.3 ; si la valeur découle de charges déjà amplifiées (F = φ·N<sub>Ed</sub>), le coefficient à l'ELU vaut 1,0 et aux ELS il vaut typiquement 1/γ<sub>Q</sub>. Le coefficient et l'applicabilité à chaque état limite restent un choix du projeteur.", "rep.notaVariabili": "γQ = {gq} à l'état limite ultime pour les actions défavorables ; les actions variables favorables sont exclues de la combinaison (γQ,fav = 0). <em>Groupe solidaire</em> : actions toujours actives ensemble et avec le même rôle, comptées comme une seule action. <em>Groupe exclusif</em> : alternatives entre elles, au plus une active par combinaison ; les alternatives peuvent être aussi des groupes solidaires entiers.", "rep.opz.doppioSegno": "Actions à double signe incluses dans chaque combinaison avec les deux sens (×2 pour chacune)", "rep.opz.ecc": "Combinaison accidentelle incluse", "rep.opz.eccDom": "action variable dominante à ψ1 (eq. 6.11a)", "rep.opz.ibc": "Combinaisons ASD alternatives de l'IBC §1605.2 incluses ({ed}), sans le facteur ω, supprimé par l'IBC 2021.", "rep.opz.lRidotta": "Exception 1 du §2.3.1 appliquée : coefficient sur L égal à 0,5 dans les combinaisons 3 et 4 (admise lorsque L₀ ≤ 100 psf, garages et locaux de rassemblement du public exclus).", "rep.opz.listaFissa": "Combinaisons issues d'une liste fixe d'équations : aucune action dominante à tour de rôle, aucun coefficient ψ (des notions que l'ASCE 7 n'utilise pas).", "rep.opz.minima": "Combinaison minimale automatique incluse (utilitaire pour le soulèvement)", "rep.opz.omega": "Les combinaisons avec surrésistance sont également générées, E_mh = Ω₀·Q_E avec Ω₀ = {om}.", "rep.opz.ortoOff": "Composantes sismiques considérées séparément (±chacune), sans combinaison orthogonale.", "rep.opz.ortoOn": "Règle orthogonale 100/30 appliquée entre Q_Ex et Q_Ey (§12.5.3), avec toutes les combinaisons de signe.", "rep.opz.parentesi": "Parenthèses « ou » développées en toutes les alternatives compatibles avec les cas de charge saisis ; les équations qui produisent la même combinaison numérique sont fusionnées en une seule ligne, avec la liste des numéros d'équation.", "rep.opz.permBlocco": "Actions permanentes traitées en bloc unique (toutes défavorables)", "rep.opz.permIndip": "Classification indépendante favorable/défavorable pour chaque action permanente ou groupe d'origine (2ⁿ combinaisons)", "rep.opz.r30off": "règle des 30 % NON appliquée, composantes considérées séparément", "rep.opz.r30on": "règle des 30 % appliquée (§7.3.5)", "rep.opz.sisEc": "Combinaison sismique incluse", "rep.opz.sismica": "Combinaisons sismiques incluses : E_h = ρ·Q_E avec ρ = {rho} ; E_v = {ev}.", "rep.opz.varIndip": "Variables à état indépendant (dominante / accompagnement / exclue)", "rep.opz.varSempre": "Variables toujours actives, dominante à tour de rôle", "rep.perimetro.b": "Sont générées les combinaisons de base (§2.3.1 Strength Design, §2.4.1 Allowable Stress Design) et les combinaisons sismiques (§2.3.6, §2.4.5, y compris celles avec surrésistance).", "rep.perimetro.ibc": "Sont également incluses les combinaisons ASD alternatives de l'IBC §1605.2.", "rep.perimetro.no": "NE sont PAS générées les autres combinaisons du Chapter 2 : {sez}. Si l'une d'elles est pertinente pour le projet, elle doit être ajoutée à part.", "rep.perimetro.t": "Périmètre de ce document.", "rep.titoloAsce": "Combinaisons des charges", "rep.titoloEc": "Combinaisons des actions", "rep.unita": "Unité", "rep.xiNota": "Dans l'équation 6.10b, le coefficient défavorable est encore réduit par le facteur ξ = {xi} (non appliqué aux actions de type P).", "ruoloH.breve.resist": "permanente et résistante", "ruoloH.breve.sfav": "accroît l'effet", "ruoloH.breve.zero": "résistante non permanente, exclue", "ruoloH.resist": "permanente et résistante (0,9H / 0,6H)", "ruoloH.sfav": "accroît l'effet principal (1,6H / 1,0H)", "ruoloH.zero": "résistante mais non permanente (H = 0)", "sec.asceOmega.n": "E<sub>h</sub> remplacé par E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub> avec Ω<sub>0</sub> = {om} (d'après la Tab. 12.2-1, dépend du système résistant choisi). Le §12.4.3 permet de limiter E<sub>mh</sub> à la valeur découlant de la capacité de l'élément qui plastifie : cette limite n'est pas appliquée ici.", "sec.asceOmega.t": "{m} — Combinaisons sismiques avec surrésistance", "sec.asceSis.n": "E<sub>h</sub> = ρ·Q<sub>E</sub> avec ρ = {rho} ; E<sub>v</sub> = 0,2·S<sub>DS</sub>·D {ev} : E<sub>v</sub> est incorporé dans le coefficient des actions D (ajouté dans les combinaisons 6/8/9, soustrait dans les 7/10). Neige d'accompagnement à {neve}.", "sec.asceSis.t": "{m} — Combinaisons sismiques", "sec.asd.n": "Combinaisons aux charges de service. Le facteur 0,75 sur les charges d'accompagnement est déjà multiplié dans les coefficients affichés (p. ex. 0,75 × 0,6W = 0,45W). Avec ces combinaisons de base, AUCUNE augmentation des contraintes admissibles n'est permise.", "sec.asd.t": "ASD — Combinaisons aux contraintes admissibles", "sec.ecc.n": "La valeur de Ad (p. ex. choc, explosion, incendie) doit être définie par l'analyse spécifique de l'action accidentelle.", "sec.ecc.nDom": "Action variable dominante à ψ1 (situation « pendant » l'événement accidentel) à tour de rôle parmi les variables actives, les autres à ψ2.", "sec.ecc.t": "Combinaison accidentelle", "sec.freq.n": "Pour les états limites de service réversibles.", "sec.freq.t": "ELS — Combinaison fréquente", "sec.ibc.ed16": "Édition alignée sur l'ASCE 7-16, neige nominale.", "sec.ibc.ed22": "Édition alignée sur l'ASCE 7-22, la neige apparaît donc comme 0,7S.", "sec.ibc.evZero": "Pour le dimensionnement des fondations avec ces combinaisons, l'IBC permet E<sub>v</sub> = 0 (case dans le panneau de gauche).", "sec.ibc.n1": "<strong>Cette section n'est pas encore validée point par point</strong> et doit être confrontée à l'édition officielle de l'IBC avant d'être utilisée dans un calcul : les équations 16-1 ÷ 16-4 sont confirmées par plusieurs sources, tandis que les 16-5 et 16-6 contiennent une interprétation de l'outil sur le traitement de E<sub>v</sub>.", "sec.ibc.n2": "Jeu alternatif conservé par l'IBC lorsque les combinaisons de résistance et les ASD de base ont été supprimées du §1605 et renvoyées à l'ASCE 7. Le facteur ω a été SUPPRIMÉ dans l'IBC 2021 : le vent entre comme 0,6W.", "sec.ibc.n3": "L'augmentation de 1/3 des contraintes admissibles n'est pas accordée par l'IBC lui-même : le §1605.2 renvoie à la norme de matériau, et AISC 360 (acier) et TMS 402 (maçonnerie) l'ont supprimée, tandis qu'ACI 318 ne prévoit pas l'ASD.", "sec.ibc.sis": "Dans les eq. 16-5 et 16-6, le séisme entre comme E/1,4 ; en 16-6, E<sub>v</sub> a été soustrait du permanent, interprétation cohérente avec la combinaison 10 de l'ASCE 7 — <strong>à vérifier</strong> si elle gouverne dans votre cas.", "sec.ibc.t": "ASD alternatives — {ed}", "sec.lrfd.n": "Liste fixe d'équations : la concomitance est déjà contenue dans l'équation, il n'existe pas d'action dominante et les coefficients ψ n'existent pas. Les parenthèses « ou » sont développées en toutes les alternatives compatibles avec les cas de charge saisis.", "sec.lrfd.t": "LRFD — Combinaisons de résistance", "sec.min.eq": "utilitaire pour soulèvement / enveloppe", "sec.min.n": "Actions permanentes dans le sens favorable (γ minimaux), actions variables nulles (γQ,fav = 0). C'est une combinaison de commodité pour explorer le minimum de l'enveloppe : elle NE remplace PAS la définition complète d'une vérification EQU, où chaque action doit être classée comme stabilisatrice ou déstabilisatrice vis-à-vis du mécanisme considéré, et où les variables aussi peuvent être stabilisatrices.", "sec.min.t": "ELU — Combinaison minimale automatique", "sec.qp.n": "Pour les effets à long terme et l'aspect de la structure.", "sec.qp.t": "ELS — Combinaison quasi permanente", "sec.rara.n": "Pour les états limites de service irréversibles.", "sec.rara.t": "ELS — Combinaison caractéristique (rare)", "sec.riepilogo": "Récapitulatif", "sec.riepilogoTot": "{n} combinaisons générées", "sec.sintesi": "{n} combinaisons générées — maximum <strong>{max}</strong> · minimum <strong>{min}</strong>", "sec.sis.n": "Les valeurs de Ex, Ey, Ez doivent être déterminées par l'analyse sismique et doivent être des effets rapportés à la MÊME grandeur de vérification : l'outil additionne des scalaires.", "sec.sis.t": "Combinaison sismique", "sec.slu.n": "Actions permanentes et variables dans le sens défavorable pour l'effet examiné. Approche : {ap}.", "sec.slu.n610ab": "Enveloppe entre 6.10a (variables toutes réduites par ψ0) et 6.10b (permanentes défavorables réduites par le facteur ξ = {xi}, action variable dominante à valeur pleine). La valeur de ξ est celle recommandée par le CEN dans l'EN 1990 : l'Annexe Nationale applicable peut en fixer une autre — à vérifier.", "sec.slu.t": "ELU — Combinaison fondamentale", "seg.ec0": "EC0 générique", "seg.matrice": "Matrice", "seg.testo": "Texte", "sim.eh": "Effet sismique horizontal = ρ·Q_E (eq. 12.4-3)", "sim.emh": "Effet sismique horizontal avec surrésistance = Ω₀·Q_E (eq. 12.4-7)", "sim.ev": "Effet sismique vertical = 0,2·S_DS·D (eq. 12.4-4a)", "sis.evNonCalc": "non calculable (S<sub>DS</sub> manquant), pris égal à zéro", "sis.evSds": "avec S<sub>DS</sub> = {sds}", "sis.evZero": "pris égal à zéro sur demande", "sis.fonte01S": "Le coefficient 0,1 sur la neige dans la combinaison 9 (0,75S dans 7-16) est rapporté par la présentation officielle ICC sur le 2024 IBC / ASCE 7-22 et par la présentation SEAU sur les modifications de 7-22.", "sis.nessuna": "Saisissez au moins Ex pour générer la combinaison.", "sis.ortoOff": "Composantes considérées séparément (±chacune) : cochez la règle 100/30 dans le panneau de gauche pour les combiner.", "sis.ortoOn": "Règle orthogonale 100/30 appliquée (§12.5.3), avec toutes les combinaisons de signe.", "sis.qeScalari": "Les valeurs Q<sub>E</sub> doivent être des effets rapportés à la MÊME grandeur de vérification.", "sis.r30off": "Règle des 30 % non appliquée : chaque composante saisie est considérée séparément (±chacune), sans l'additionner aux autres.", "sis.r30on": "Règle des 30 % appliquée aux composantes saisies (NTC 2018 §7.3.5) : à tour de rôle, une composante a le coefficient 1,00 et les autres 0,30, avec toutes les combinaisons de signe.", "sis.una": "Les deux combinaisons ±E sont générées.", "sub.ascePerimetro": "combinaisons de base et sismiques (Chapter 2 core)", "sub.ec": "Combinaisons d'actions — Eurocode 0", "tag.minima": "Actions permanentes favorables, actions variables nulles", "tipo.D": "D — Permanente (dead)", "tipo.F": "F — Fluides de pression et de hauteur définies", "tipo.H": "H — Poussée des terres / nappe phréatique", "tipo.L": "L — Variable de plancher (live)", "tipo.Lr": "Lr — Variable de toiture (roof live)", "tipo.R": "R — Pluie (rain)", "tipo.S": "S — Neige (snow)", "tipo.S.16": "S — Neige (snow) — valeur nominale, traitement 7-16", "tipo.S.22": "S — Neige (snow) — valeur au niveau ultime, traitement 7-22", "tipo.W": "W — Vent (wind)", "tipo.Wt": "Wt — Tornade (7-22 uniquement)", "ttl.csle": "Coefficient aux états limites de service, sismique et accidentel", "ttl.cslu": "Coefficient à l'état limite ultime", "ttl.gruppo": "EN 1990 §6.4.3.2(4) : les actions permanentes de la même origine prennent toutes γ,sup ou toutes γ,inf. Les actions portant le même nom de groupe sont traitées comme une seule action.", "ttl.gruppoEsc": "Actions alternatives entre elles : au plus une active par combinaison (p. ex. vent +X / −X). Peut contenir aussi des groupes solidaires entiers.", "ttl.gruppoSol": "Actions toujours actives ensemble et avec le même rôle : le groupe compte comme une seule action répartie sur plusieurs cas de charge (p. ex. neige sur des versants de toiture différents).", "ttl.rimuovi": "Supprimer"},
    es: {"appr.610": "Eq. 6.10 — combinación única", "appr.610ab": "Eq. 6.10a / 6.10b — envolvente", "appr.A1": "Enfoque 1 / A1 — STR (el más habitual en edificación)", "appr.A2": "Enfoque 2 / A2 — GEO", "appr.EQU": "EQU — Equilibrio", "aria.normativa": "Normativa de referencia", "aria.vista": "Vista de los resultados", "asce.nonCoperto": "§2.3.2 / §2.4.2 (cargas de inundación F<sub>a</sub>), §2.3.3 / §2.4.3 (hielo atmosférico D<sub>i</sub> y W<sub>i</sub>), §2.3.4 / §2.4.4 (efectos autotensionantes T), §2.3.5 (cargas no especificadas), §2.5 (sucesos extraordinarios) y §2.6 (integridad estructural)", "av.gruppiIncoerenti": "Configuración incoherente: las acciones del grupo solidario «{sol}» pertenecen a grupos exclusivos distintos ({esc}). Un grupo solidario es una sola acción y no puede ser alternativo a sí mismo: se utiliza el grupo exclusivo del primer miembro. Corrige la asignación.", "av.nessunCaso": "No se ha introducido ningún caso de carga: añade al menos uno en el panel de la izquierda.", "av.nessunD": "Ningún caso de tipo D (permanente): todas las ecuaciones ASCE contienen D, las combinaciones resultan incompletas.", "av.omegaMancante": "Sobrerresistencia requerida pero Ω<sub>0</sub> no introducido (Tab. 12.2-1): las combinaciones con Ω<sub>0</sub> no se han generado.", "av.omegaUno": "Ω<sub>0</sub> = 1 no equivale automáticamente a «ausencia de sobrerresistencia»: comprueba el valor en la Tab. 12.2-1 para el sistema resistente adoptado.", "av.qeMancante": "Combinaciones sísmicas activas pero ningún valor Q<sub>E</sub> introducido.", "av.rhoMancante": "ρ no introducido: se ha tomado igual a 1,0. Es un valor de decisión ingenieril, no un valor por defecto inocuo — debe determinarse según §12.3.4, que en varios casos impone ρ = 1,3.", "av.sdsMancante": "S<sub>DS</sub> no introducido: E<sub>v</sub> se ha tomado igual a cero. Introduce S<sub>DS</sub> o marca explícitamente «E<sub>v</sub> = 0».", "av.troppeComb": "{n} combinaciones totales. Comprueba que la independencia de las acciones represente escenarios físicamente posibles: las acciones que no pueden coexistir deben ponerse en un grupo exclusivo, las siempre concomitantes en un grupo solidario.", "av.wtSu716": "Hay un caso de tipo Wt (tornado), pero la carga de tornado solo existe en ASCE 7-22: con 7-16 seleccionada se ignora.", "badge.alt": "alternativa no activa", "badge.dom": "dominante", "badge.fav": "↓ fav.", "badge.omessa": "omitida (favorable)", "badge.sfav": "↑ desfav.", "badge.sperimentale": "⚠ experimental — comprueba la aplicabilidad", "blk.approccio": "Enfoque de comprobación", "blk.asceCarichi": "Casos de carga", "blk.asceMetodo": "Método de proyecto", "blk.doppioSegno": "Acciones de doble signo (±)", "blk.eccezionale": "Acción accidental", "blk.output": "Presentación de los resultados", "blk.permanenti": "Acciones permanentes", "blk.sismica": "Acción sísmica", "blk.variabili": "Acciones variables", "btn.addAsce": "+ Añadir caso de carga", "btn.addDs": "+ Añadir acción de doble signo", "btn.addPerm": "+ Añadir acción permanente", "btn.addVar": "+ Añadir acción variable", "btn.coffee": "☕ Invítame a un café", "btn.copiaBloccata": "Copia bloqueada por el navegador", "btn.copiaTsv": "Copiar tabla (TSV)", "btn.copiato": "Copiado ✓", "btn.guida": "Guía", "btn.guidaTitle": "Abre la guía de uso de la herramienta", "btn.mostraTutte": "Mostrar todas las {n} combinaciones", "btn.report": "Informe PDF", "btn.reportTitle": "Compone el informe y abre la ventana de impresión: elige «Guardar como PDF»", "chip.max": "Máximo", "chip.min": "Mínimo", "chk.asceEvZero": "E<sub>v</sub> = 0 (admitido para el dimensionamiento de las cimentaciones con las alternativas IBC, y en los casos del §12.4.2.2)", "chk.asceIbc": "Incluir las combinaciones ASD <em>alternativas</em> del IBC (§1605.2)", "chk.asceLrid": "Factor sobre L reducido a 0,5 en las combinaciones 3 y 4 — admitido donde L<sub>0</sub> ≤ 100 psf (4,79 kN/m²), <strong>excluidos</strong> los aparcamientos y los locales de pública concurrencia (§2.3.1 Exc. 1)", "chk.asceOmega": "Generar también las combinaciones con sobrerresistencia (E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub>, §12.4.3)", "chk.asceOrto": "Aplicar el procedimiento ortogonal 100/30 entre Q<sub>Ex</sub> y Q<sub>Ey</sub>", "chk.asceSis": "Incluir las combinaciones sísmicas (§2.3.6 / §2.4.5)", "chk.domPsi1": "Variable dominante con ψ1 en lugar de ψ2 (EN 1990 eq. 6.11a — comprobación «durante» el suceso, p. ej. incendio en curso)", "chk.eccezionale": "Accidental — Ad", "chk.minima": "Incluir combinación mínima automática (utilidad para levantamiento)", "chk.permIndip": "Clasificación independiente favorable/desfavorable para cada acción permanente o grupo de origen (2ⁿ combinaciones)", "chk.regola30": "Aplicar la regla del 30% entre las componentes (§7.3.5)", "chk.sismica": "Incluir combinación sísmica", "chk.varIndip": "Variables favorables/desfavorables por acción individual (incluye el caso excluido)", "col.categoria": "Categoría", "col.coefSLE": "Coeficiente ELS / sísmica / accid.", "col.coefSLU": "Coeficiente ELU", "col.combinazione": "Combinación", "col.componente": "Componente", "col.descrTipo": "Descripción del tipo", "col.descrizione": "Descripción", "col.eqOmega": "Con sobrerresistencia — E_mh = Ω₀·Q_E (§12.4.3)", "col.eqSismica": "Ecuación sísmica", "col.equazione": "Ecuación", "col.gammaFav": "γ favorable", "col.gammaSfav": "γ desfavorable", "col.grEsc": "Gr. exclusivo", "col.grSol": "Gr. solidario", "col.gruppoOrigine": "Grupo (origen)", "col.n": "N.º", "col.nome": "Nombre", "col.risultato": "Resultado", "col.significato": "Significado", "col.simbolo": "Símbolo", "col.tipo": "Tipo", "col.valCar": "Valor característico", "col.valore": "Valor", "cong.oppure": "o", "disclaimer.footer": "Proporcionado tal cual, sin garantía alguna. Los resultados se ofrecen solo con fines informativos: verifícalos siempre de forma independiente antes de usarlos en un proyecto real. Esta herramienta no sustituye el juicio profesional de un ingeniero cualificado ni las verificaciones normativas obligatorias.", "disclaimer.report": "Este informe se genera automáticamente mediante una herramienta gratuita, únicamente con fines informativos. No sustituye el juicio profesional de un ingeniero cualificado, ni las verificaciones normativas obligatorias, ni la revisión técnica del proyecto. El autor no asume ninguna responsabilidad por el uso de los resultados contenidos en este documento en un proyecto real o en cualquier otra aplicación: el uso es enteramente bajo tu propio riesgo, sujeto a verificación independiente.", "esempio.perm": "G1 — peso propio", "esempio.var": "Q1 — sobrecarga de uso", "g.ascecarichi.b": "<p>Cada caso de carga debe asociarse a su tipo normativo, porque es el tipo el que determina qué coeficiente recibe en cada ecuación:</p><ul><li><strong>D</strong> permanente · <strong>L</strong> sobrecarga de uso de planta · <strong>L<sub>r</sub></strong> sobrecarga de cubierta</li><li><strong>S</strong> nieve · <strong>R</strong> lluvia · <strong>W</strong> viento · <strong>W<sub>T</sub></strong> tornado (solo 7-22)</li><li><strong>F</strong> fluidos con presión y altura definidas: recibe el mismo coeficiente que D</li><li><strong>H</strong> empuje del terreno o del agua freática: véase más abajo</li></ul><p>Para los casos <strong>H</strong> la norma distingue tres situaciones y la herramienta te las hace elegir caso por caso: empuje que <em>incrementa</em> el efecto principal (1,6H en Strength Design, 1,0H en ASD); empuje <em>permanente y resistente</em> (0,9H / 0,6H); empuje <em>resistente pero no permanente</em>, que debe ponerse a cero. Cuál es la correcta depende de la comprobación en estudio.</p><div class=\"gnote\"><strong>La nieve cambia de significado entre las dos ediciones.</strong> En 7-16 S es el valor nominal; en 7-22 los mapas se han recalibrado a nivel último, por lo que S ya vale más y en las ecuaciones lleva coeficientes distintos. Atención al importar las cargas de un modelo FEM.</div>", "g.ascecarichi.t": "ASCE 7 — tipos de carga", "g.asceecc.b": "<p><strong>Factor sobre L reducido (§2.3.1 Exc. 1).</strong> En las combinaciones 3 y 4 el coeficiente sobre L puede valer 0,5 en lugar de 1,0 donde la sobrecarga de uso tabulada L<sub>0</sub> no supera 100 psf (4,79 kN/m²). Quedan <strong>excluidos</strong> los aparcamientos y los locales de pública concurrencia. La casilla debe marcarse solo después de haber comprobado que el caso encaja.</p><p><strong>Excepción tornado.</strong> En ASCE 7-22, donde se usa la carga W<sub>T</sub>, la nieve sale de la combinación: el tornado es un fenómeno de estación cálida y la nieve no es concomitante. La herramienta lo aplica tanto al Strength Design (comb. 4a, §2.3.1 Exc. 3) como al ASD (comb. 6a, §2.4.1).</p><div class=\"gnote\">La diferencia entre las ediciones en los paréntesis no es cosmética. 7-16 escribe 1,6(L<sub>r</sub> o S o R), con un solo coeficiente para el grupo; 7-22 escribe (1,6L<sub>r</sub> o 1,0S o 1,6R), con un coeficiente por alternativa, porque la nieve ya está a nivel último.</div>", "g.asceecc.t": "ASCE 7 — excepciones aplicadas", "g.ascemetodo.b": "<p>El motor americano está construido de forma <strong>completamente distinta</strong> al europeo, y la diferencia no está solo en los coeficientes.</p><p>ASCE 7 no tiene una regla generativa: tiene una <strong>lista fija de ecuaciones</strong>. La concomitancia entre las cargas ya está escrita dentro de la ecuación, no existe ninguna acción dominante que rote y <strong>no existen los coeficientes ψ</strong>. Las categorías A÷H de las NTC aquí no sirven para nada.</p><p>La única combinatoria es la expansión de los paréntesis «o»: una combinación como 1,2D + 1,6(L<sub>r</sub> o S o R) genera tantas filas como alternativas haya, pero solo para los tipos de carga que hayas introducido realmente.</p><p><strong>LRFD</strong> (§2.3) y <strong>ASD</strong> (§2.4) son métodos alternativos. En las combinaciones ASD el factor 0,75 sobre las cargas concomitantes ya está multiplicado en los coeficientes mostrados: 0,75 × 0,6W aparece como 0,45W.</p><div class=\"gnote\">Con las combinaciones ASD básicas <strong>no se admite ningún aumento de las tensiones admisibles</strong>.</div>", "g.ascemetodo.t": "ASCE 7 — cómo funciona", "g.asceorto.b": "<p>La casilla 100/30 hace rotar las dos componentes horizontales: una al 100% y la otra al 30%, con todas las combinaciones de signo. Con dos componentes introducidas se obtienen ocho esquemas para cada ecuación sísmica.</p><div class=\"gnote\"><strong>No es una regla que deba aplicarse siempre.</strong> El §12.5 distingue el procedimiento direccional independiente (§12.5.1.1) de la combinación ortogonal (§12.5.1.2), y cuál de los dos se aplique depende de la categoría de diseño sísmico y de la configuración de la estructura (§12.5.3, §12.5.4). La herramienta no lo decide: comprueba la aplicabilidad antes de marcar la casilla.</div>", "g.asceorto.t": "ASCE 7 — efectos ortogonales", "g.ascerho.b": "<p>Son dos parámetros que <strong>la herramienta no determina</strong> ni puede determinar: dependen del sistema estructural y de la categoría de diseño sísmico.</p><p><strong>ρ — redundancy factor (§12.3.4).</strong> Debe obtenerse según el §12.3.4, que en varios casos impone ρ = 1,3. La herramienta no comprueba las condiciones que permiten ρ = 1,0: usa el valor que introduces tal cual. Si lo dejas vacío asume 1,0 y lo señala.</p><p><strong>Ω<sub>0</sub> — factor de sobrerresistencia.</strong> Está tabulado en la Tab. 12.2-1 en función del sistema resistente. Se necesita para las combinaciones con E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub>, exigidas para ciertos elementos. Ω<sub>0</sub> = 1 no equivale automáticamente a «ausencia de sobrerresistencia».</p><div class=\"gnote\">El §12.4.3 permite limitar E<sub>mh</sub> al valor derivado de la capacidad del elemento que plastifica. <strong>Ese límite no está aplicado</strong> por la herramienta.</div>", "g.ascerho.t": "ASCE 7 — ρ y Ω₀", "g.ascesisma.b": "<p>En ASCE 7 la acción sísmica no es un dato único. El efecto E se compone de dos partes:</p><ul><li><strong>E<sub>h</sub> = ρ·Q<sub>E</sub></strong> — el efecto horizontal, donde Q<sub>E</sub> es el que obtienes del análisis</li><li><strong>E<sub>v</sub> = 0,2·S<sub>DS</sub>·D</strong> — el efecto vertical, que <em>no</em> es una carga separada: es proporcional a la permanente</li></ul><p>Por eso E<sub>v</sub> no aparece como columna: se incorpora al coeficiente de las acciones de tipo D, sumado en las combinaciones 6, 8 y 9 y restado en las 7 y 10. A las acciones de tipo F no se les aplica.</p><p>Si dejas S<sub>DS</sub> vacío, E<sub>v</sub> se toma igual a cero y la herramienta te lo señala. La casilla «E<sub>v</sub> = 0» sirve para declarar esa elección de forma explícita, como se admite para las cimentaciones con las alternativas IBC y en los casos del §12.4.2.2.</p><div class=\"gnote\">Q<sub>Ex</sub> y Q<sub>Ey</sub> deben ser efectos ya obtenidos del análisis y referidos a la <strong>misma magnitud de respuesta</strong>.</div>", "g.ascesisma.t": "ASCE 7 — sismo", "g.doppiosegno.b": "<p>Son acciones presentes en <em>todas</em> las combinaciones, con coeficiente fijo y con ambos sentidos. Cada acción de doble signo duplica el número de combinaciones: n acciones lo multiplican por 2ⁿ.</p><p>El caso típico son las <strong>imperfecciones geométricas equivalentes</strong> (EN 1993-1-1 §5.3), que deben aplicarse en el sentido que agrava el efecto en estudio. Si el valor procede de cargas ya mayoradas (F = φ·N<sub>Ed</sub>) el coeficiente en ELU es 1 y en los ELS vale típicamente 1/γ<sub>Q</sub>.</p><div class=\"gnote\">El coeficiente y la aplicabilidad a cada estado límite <strong>siguen siendo una decisión del proyectista</strong>: el tratamiento de las imperfecciones depende del método de análisis y del modelo adoptado.</div>", "g.doppiosegno.t": "Acciones de doble signo (±)", "g.ecazioni.b": "<p>Cada acción permanente tiene un tipo: <strong>G1</strong> estructural, <strong>G2</strong> no estructural, <strong>P</strong> pretensado. El tipo determina los coeficientes parciales aplicados.</p><p>El campo <strong>grupo de origen</strong> sirve para el principio de la fuente única (EN 1990 §6.4.3.2(4)): las acciones permanentes que proceden del mismo origen físico deben tomar <em>todas</em> γ<sub>sup</sub> o bien <em>todas</em> γ<sub>inf</sub>, nunca sentidos mixtos. Si escribes el mismo nombre de grupo en varias acciones, estas se mueven juntas y cuentan como una sola en la combinatoria.</p><p>Para el pretensado el coeficiente γ<sub>P</sub> se fija en 1,0 salvo evaluación específica distinta (NTC 2018 §2.6.1; véase también §4.1.8.1.1 para γ<sub>P</sub>=1,2 en anclajes locales).</p>", "g.ecazioni.t": "EC0 / NTC — acciones permanentes", "g.eccezionale.b": "<p>El valor A<sub>d</sub> (impacto, explosión, incendio) debe definirse mediante el análisis específico de la acción accidental: la herramienta no lo determina.</p><p>Con <strong>NTC 2018</strong> la eq. 2.5.6 impone ψ<sub>2</sub> para <em>todas</em> las variables, sin acción variable dominante.</p><p>Con <strong>EN 1990</strong> puedes elegir: eq. 6.11b con ψ<sub>2</sub> para todas, o bien eq. 6.11a con una variable dominante con ψ<sub>1</sub>, que representa la comprobación «durante» el suceso — por ejemplo un incendio en curso.</p>", "g.eccezionale.t": "Combinación accidental", "g.ecgruppi.b": "<p>Las acciones variables tienen <strong>dos campos de grupo independientes</strong>, que sirven para cosas distintas.</p><ul><li><strong>Grupo solidario</strong>: las acciones con el mismo nombre están siempre activas juntas y con el mismo papel, como si fueran una sola acción. Ejemplo: la nieve calculada automáticamente y la aplicada a mano sobre una parte de la cubierta.</li><li><strong>Grupo exclusivo</strong>: las acciones con el mismo nombre son alternativas entre sí, como máximo una activa por combinación. Ejemplo: viento en dirección X y viento en dirección Y, o dilatación y contracción térmica.</li></ul><p>Los dos niveles se combinan: un grupo solidario puede ser <em>una de las alternativas</em> de un grupo exclusivo. Asignar acciones del mismo grupo solidario a grupos exclusivos distintos es incoherente y la herramienta lo señala en rojo.</p><div class=\"gnote\"><strong>Las dos casillas de independencia</strong> deciden cuántas combinaciones se generan. Al desactivarlas se obtiene el conjunto mínimo (todas las permanentes desfavorables, todas las variables activas con rotación de la dominante); al activarlas cada acción puede ser también favorable o quedar excluida, y el número de combinaciones crece como 2ⁿ. Con el grupo exclusivo y la independencia desactivada, una de las alternativas está <em>siempre</em> presente.</div>", "g.ecgruppi.t": "EC0 / NTC — grupos de variables", "g.ecminima.b": "<p>Es una combinación de conveniencia: permanentes en el sentido favorable con los γ mínimos, variables todas nulas. Sirve para explorar el mínimo de la envolvente, típicamente en los problemas de levantamiento.</p><div class=\"gnote\"><strong>No sustituye a una comprobación EQU.</strong> En una comprobación de equilibrio cada acción debe clasificarse como estabilizadora o desestabilizadora respecto al mecanismo concreto, y también las variables pueden ser estabilizadoras. Esta utilidad no lo hace por ti.</div>", "g.ecminima.t": "EC0 / NTC — combinación mínima", "g.ecnorma.b": "<p>El motor europeo es <strong>generativo</strong>: aplica la regla γ<sub>G</sub>·G + γ<sub>Q</sub>·Q<sub>k1</sub> + Σ γ<sub>Q</sub>·ψ<sub>0</sub>·Q<sub>ki</sub> haciendo rotar la acción dominante entre todas las variables activas.</p><p>Con <strong>NTC 2018</strong> eliges el Enfoque de Proyecto en la Tab. 2.6.I: EQU para el equilibrio, A1 para las comprobaciones estructurales (el caso más habitual en edificación), A2 para las geotécnicas.</p><p>Con <strong>EN 1990 genérico</strong> eliges la ecuación: 6.10 única, o la envolvente 6.10a/6.10b. En 6.10b las permanentes desfavorables se reducen mediante el factor ξ, aquí fijado en 0,85 según la recomendación del CEN: <strong>el Anejo Nacional aplicable puede fijar uno distinto</strong>, verifícalo.</p><div class=\"gnote\">Con el Enfoque de Proyecto A2 la herramienta aplica solo los coeficientes sobre las acciones. Una comprobación geotécnica completa requiere además los coeficientes sobre los parámetros del terreno (M1/M2) y sobre las resistencias (R1/R2/R3), que no se generan.</div>", "g.ecnorma.t": "EC0 / NTC — enfoque", "g.ecsisma.b": "<p>Introduce los efectos sísmicos Ex, Ey y Ez ya obtenidos del análisis. Con una sola dirección rellenada se obtienen las dos combinaciones ±E.</p><p>Con varias direcciones, por defecto cada una se considera por separado. Al marcar la <strong>regla del 30%</strong> (NTC 2018 §7.3.5) las componentes se rotan: una con coeficiente 1,00 y las demás con 0,30, con todas las combinaciones de signo.</p><div class=\"gnote\">Ex, Ey y Ez deben ser efectos referidos a la <strong>misma magnitud de comprobación</strong>. La herramienta suma escalares: no está haciendo una composición vectorial de las acciones sísmicas.</div>", "g.ecsisma.t": "EC0 / NTC — sismo", "g.export.b": "<p>La <strong>vista Matriz</strong> pone los casos de carga en columna y las combinaciones en fila, con los coeficientes en las celdas. El botón de copia exporta todo en formato TSV: se pega directamente en Excel o en los software FEM que importan texto tabulado. La tabla en pantalla está truncada por rendimiento, pero la copia contiene siempre todas las combinaciones.</p><p>El <strong>separador decimal</strong> vale para la vista matriz y para la copia: coma para Excel español, punto para los software FEM y para Excel en inglés.</p><p>Los coeficientes se exportan con cuatro decimales, porque son productos de varios factores: ξ·γ<sub>G</sub> vale 1,1475 y redondearlo a 1,15 introduciría un error.</p><p>El <strong>Informe PDF</strong> compone un documento con normativa, hipótesis de generación, casos de carga, coeficientes, ecuaciones utilizadas por extenso y todas las combinaciones, y después abre la ventana de impresión del navegador: elige «Guardar como PDF». Al recoger las ecuaciones por extenso, el documento es verificable por quien lo recibe sin tener la herramienta abierta.</p>", "g.export.t": "Exportar los resultados", "g.ibc.b": "<p>Desde 2021 el IBC ha eliminado del §1605 sus propias copias de las combinaciones de resistencia y de las ASD básicas, remitiendo a ASCE 7. Lo que ha conservado es el conjunto <strong>alternativo</strong> ASD, eq. 16-1 ÷ 16-6, que esta herramienta genera si se solicita. La edición sigue a la de ASCE elegida: 7-16 → IBC 2021, 7-22 → IBC 2024.</p><p>El factor ω se ha <strong>eliminado</strong> del IBC 2021: el viento entra simplemente como 0,6W.</p><p>El aumento de 1/3 de las tensiones admisibles no lo concede el IBC por sí mismo: el §1605.2 remite a la norma de material. AISC 360 (acero) y TMS 402 (fábrica) lo han eliminado, ACI 318 no contempla el ASD. En la práctica queda para la madera, donde sin embargo el mecanismo es el factor C<sub>D</sub> del NDS, y para las capacidades portantes geotécnicas.</p><div class=\"gnote\"><strong>Esta sección está marcada como experimental.</strong> Las ecuaciones 16-1 ÷ 16-4 están verificadas; las 16-5 y 16-6 contienen una interpretación de la herramienta sobre el tratamiento de E<sub>v</sub>. Compáralas con la edición oficial del IBC antes de usarlas en un cálculo.</div>", "g.ibc.t": "IBC — combinaciones ASD alternativas", "g.limiti.b": "<p>Merece la pena ser explícitos sobre los límites.</p><ul><li><strong>No determina las cargas.</strong> Valores característicos, efectos sísmicos, acciones accidentales: los introduces tú, obtenidos del análisis.</li><li><strong>No realiza las comprobaciones</strong> de resistencia, estabilidad o servicio.</li><li><strong>Suma valores escalares</strong> referidos a la misma magnitud. No compone vectores.</li><li><strong>No sabe si un caso de carga es pertinente</strong> para el escenario: expande las alternativas previstas por la ecuación para los tipos que has introducido, pero la aplicabilidad sigue siendo una valoración tuya.</li><li><strong>Para ASCE 7 cubre el núcleo del Chapter 2</strong>: combinaciones básicas (§2.3.1, §2.4.1) y sísmicas (§2.3.6, §2.4.5). Quedan fuera inundación (§2.3.2 / §2.4.2), hielo atmosférico (§2.3.3 / §2.4.3), efectos autotensionantes T (§2.3.4 / §2.4.4), cargas no especificadas (§2.3.5), sucesos extraordinarios (§2.5) e integridad estructural (§2.6).</li><li><strong>Para las comprobaciones geotécnicas</strong> aplica solo los coeficientes sobre las acciones, no los de los parámetros del terreno ni los de las resistencias.</li></ul><div class=\"gnote\">Dos puntos normativos recientes proceden de fuentes institucionales pero no del texto ASCE de pago: el coeficiente 0,1S en la combinación 9 del §2.4.5 de 7-22 (presentación oficial ICC sobre el 2024 IBC / ASCE 7-22, y presentación SEAU) y la Excepción 3 del §2.3.1 sobre el uso de W<sub>T</sub> (guía NIST/FEMA sobre las cargas de tornado). Si el proyecto lo requiere, contrástalos con la copia oficial.</div>", "g.limiti.t": "Lo que la herramienta no hace", "g.start.b": "<p>La herramienta genera las combinaciones de carga para las comprobaciones estructurales. No calcula las cargas y no realiza las comprobaciones: combina valores que le proporcionas tú.</p><ul><li><strong>Elige la normativa</strong> arriba: NTC 2018, EN 1990 genérico, ASCE 7-22 o ASCE 7-16. El panel de la izquierda cambia en consecuencia, porque los dos mundos funcionan de manera distinta.</li><li><strong>Introduce los casos de carga</strong> con su valor característico.</li><li><strong>Lee los resultados</strong> a la derecha: se actualizan con cada modificación, no hay ningún botón «generar».</li><li><strong>Exporta</strong> con la vista Matriz (copia TSV para Excel o para el software FEM) o con el Informe PDF.</li></ul><div class=\"gnote\"><strong>La herramienta suma valores escalares.</strong> Todos los valores introducidos deben referirse a la misma magnitud de comprobación: combinar una reacción con un momento no tiene sentido. Si necesitas la envolvente de varias magnitudes, ejecuta una sesión por magnitud.</div><p>Los datos permanecen en tu navegador y no se envían a ningún servidor. Al cerrar y volver a abrir la página los recuperas.</p>", "g.start.t": "Primeros pasos", "guida.chiudi": "Cerrar", "guida.titolo": "Guía de uso", "help.apri": "Abrir la guía sobre este tema", "hint.asce": "No se ha introducido ningún caso de carga.", "hint.doppioSegno": "No se ha introducido ninguna acción de doble signo.", "hint.matrice": "Columnas = casos de carga · filas = combinaciones · celdas = coeficientes. Pega en Excel o en el software FEM.", "hint.permanenti": "No se ha introducido ninguna acción permanente.", "hint.variabili": "No se ha introducido ninguna acción variable.", "lbl.approccioEC": "Ecuación (EN 1990 Anexo A1)", "lbl.approccioNTC": "Enfoque de Proyecto (Tab. 2.6.I NTC 2018)", "lbl.decimale": "Separador decimal (vista matriz y copia)", "lbl.dominante": "{nome} dominante", "lbl.eccNtc": "Ad + permanentes + acciones variables a ψ2", "lbl.metodo": "Método", "lbl.nessunoParen": "(ninguno)", "lbl.ruoloH": "Papel de H", "lbl.soloPermanenti": "solo permanentes", "lbl.tuttiPsi2": "Todas las acciones variables a ψ2", "lbl.unicaVariabile": "acción variable única", "lbl.unita": "Unidad de medida (solo visualización)", "msg.valoriMancanti": "introduce todos los valores característicos para obtener el resultado numérico", "nota.f": "Los casos de tipo F reciben el mismo factor que la permanente D, como prescriben las notas al §2.3.1 / §2.4.1.", "nota.h": "Para los casos de tipo H la norma distingue tres situaciones: el empuje que incrementa el efecto principal (1,6H en Strength Design, 1,0H en ASD), el permanente y resistente (0,9H / 0,6H) y el resistente pero no permanente, que debe ponerse a cero. Cuál es la correcta depende de la comprobación en estudio y sigue siendo una valoración del proyectista.", "nota.hRuoli": "Papel asignado a los casos H:", "nota.lRidotta": "Aplicada la Excepción 1 del §2.3.1: factor sobre L igual a 0,5 en las combinaciones 3 y 4.", "nota.parentesi722": "En 7-22 los paréntesis ya no están factorizados como grupo: la nieve ya está a nivel último, por lo que cada alternativa lleva su propio coeficiente.", "nota.tornadoASD": "<strong>Excepción tornado aplicada:</strong> en la combinación 6a, donde se usa W<sub>T</sub>, el paréntesis 0,75(L<sub>r</sub> o 0,7S o R) se reduce a 0,75(L<sub>r</sub> o R) — el tornado es un fenómeno de estación cálida y la nieve no es concomitante.", "nota.tornadoLRFD": "<strong>Excepción 3 del §2.3.1 aplicada:</strong> en la combinación 4a, donde se usa W<sub>T</sub>, el paréntesis (0,5L<sub>r</sub> o 0,3S o 0,5R) se reduce a 0,5(L<sub>r</sub> o R) — el tornado es un fenómeno de estación cálida y la nieve no es concomitante.", "nota.troncElenco": "Lista truncada a {cap} combinaciones de {tot} por rendimiento; el máximo y el mínimo de arriba siguen calculados sobre el conjunto completo.", "nota.troncMatrice": "Tabla truncada a {cap} filas de {tot} por rendimiento; el botón de copia exporta en cualquier caso todas las combinaciones.", "note.asceCarichi": "Cada caso está asociado a un tipo normativo: el coeficiente lo decide la ecuación, no tú. Puedes introducir varios casos del mismo tipo: reciben el mismo coeficiente y siguen siendo columnas distintas en la matriz.", "note.asceSis": "En ASCE 7 el sismo no es un dato único: E se compone de E<sub>h</sub> = ρ·Q<sub>E</sub> y E<sub>v</sub> = 0,2·S<sub>DS</sub>·D. Introduce el efecto Q<sub>E</sub> del análisis y los parámetros de aquí abajo.", "note.doppioSegno": "Acciones presentes en <em>todas</em> las combinaciones con coeficiente fijo y sentido ±. Caso típico: las imperfecciones geométricas equivalentes (EN 1993-1-1 §5.3). El coeficiente y la aplicabilidad a cada estado límite siguen siendo una decisión del proyectista.", "note.ds": "Las acciones de doble signo ({g}) entran en todas las combinaciones con ambos sentidos.", "note.geoA2": "Estos son solo los coeficientes sobre las acciones (Tab. 2.6.I, columna A2); una comprobación GEO completa requiere además los coeficientes sobre los parámetros geotécnicos (M1/M2) y sobre las resistencias (R1/R2/R3), no generados por esta herramienta.", "note.gruppiEsc": "Grupos exclusivos ({g}): las alternativas del grupo se excluyen entre sí, como máximo una activa por combinación.", "note.gruppiPerm": "Las acciones permanentes del mismo origen ({g}) toman todas γ,sup o bien todas γ,inf (EN 1990 §6.4.3.2(4)).", "note.gruppiSol": "Grupos solidarios ({g}): las acciones del grupo están siempre activas juntas y con el mismo papel, como si fueran una sola acción.", "note.metodo": "LRFD y ASD son métodos de proyecto <strong>alternativos</strong>: «Ambos» genera los dos conjuntos para comparación o para documentación, no porque una comprobación deba realizarse con los dos a la vez.", "note.omega": "Ω<sub>0</sub> es el <strong>factor de sobrerresistencia</strong> tabulado en la Tab. 12.2-1. La herramienta no lo determina y no aplica el límite de capacidad del §12.4.3.", "note.orto": "El 100/30 <strong>no es una regla universal</strong>: el §12.5 distingue entre procedimiento direccional independiente y combinación ortogonal, y cuál de los dos se aplique depende de la categoría de diseño sísmico y de la configuración de la estructura.", "note.permIndip": "Cada acción permanente se considera favorable o desfavorable independientemente de las demás.", "note.rho": "ρ es el <strong>redundancy factor</strong>: debe determinarse según §12.3.4. La herramienta <strong>no comprueba</strong> las condiciones que permiten ρ = 1,0 y no lo elige por ti.", "note.sismica": "Rellena una sola dirección para una combinación simple (±E), o varias direcciones: por defecto se consideran por separado.", "note.tutteComb": "Se generan todas las combinaciones resultantes (desactivable en el panel de la izquierda).", "note.unTerzo": "El aumento de 1/3 de las tensiones admisibles se admite <em>solo</em> con las alternativas IBC y <em>solo</em> si lo permite la norma de material: AISC 360 y TMS 402 lo han eliminado, ACI 318 no contempla el ASD.", "note.varFond": "Cada acción variable puede ser dominante, concomitante (ψ0) o bien favorable y excluida (0), independientemente de las demás.", "note.varFreq": "Cada acción variable puede ser dominante (ψ1), concomitante (ψ2) o bien favorable y excluida, independientemente de las demás.", "note.varNoDom": "Cada acción variable puede estar activa (ψ2) o bien ser favorable y excluida, independientemente de las demás.", "note.varRara": "Cada acción variable puede ser dominante (valor pleno), concomitante (ψ0) o bien favorable y excluida, independientemente de las demás.", "opt.G1": "G1 — estructural", "opt.G2": "G2 — no estructural", "opt.P": "P — pretensado", "opt.both": "Ambos (LRFD + ASD)", "opt.punto": "Punto — software FEM / Excel con configuración inglesa", "opt.virgola": "Coma — Excel con configuración europea", "ph.ad": "valor Ad", "ph.ex": "valor Ex", "ph.ey": "valor Ey (opc.)", "ph.ez": "valor Ez (opc.)", "ph.gruppo": "grupo — acciones del mismo origen (opcional)", "ph.gruppoEsc": "grupo exclusivo (alternativas)", "ph.gruppoSol": "grupo solidario (siempre juntas)", "ph.nomeDs": "Nombre (p. ej. Imperfecciones)", "ph.nomePerm": "Nombre (p. ej. Peso propio)", "ph.nomeVar": "Nombre (p. ej. Sobrecarga de uso)", "ph.omega": "de Tab. 12.2-1", "ph.qex": "efecto sismo X", "ph.qey": "efecto sismo Y (opc.)", "ph.rho": "de §12.3.4", "ph.sds": "p. ej. 0.85", "ph.valCar": "valor car.", "ph.valCarQk": "valor car. Qk", "ph.valore": "valor", "psi.ec.A": "Categoría A — Zonas residenciales y domésticas", "psi.ec.B": "Categoría B — Zonas de oficinas", "psi.ec.C": "Categoría C — Zonas de reunión de personas", "psi.ec.D": "Categoría D — Zonas comerciales", "psi.ec.E": "Categoría E — Zonas de almacenamiento, uso industrial", "psi.ec.F": "Categoría F — Zonas de tráfico, vehículos ≤ 30 kN", "psi.ec.G": "Categoría G — Zonas de tráfico, 30 kN < vehículos ≤ 160 kN", "psi.ec.H": "Categoría H — Cubiertas", "psi.ec.custom": "Personalizada (ψ manuales)", "psi.ec.neve_altri": "Nieve — otros países CEN", "psi.ec.neve_nordic": "Nieve — Finlandia, Islandia, Noruega, Suecia", "psi.ec.temperatura": "Variaciones térmicas", "psi.ec.vento": "Viento", "psi.ntc.A": "A — Ambientes residenciales", "psi.ntc.B": "B — Oficinas", "psi.ntc.C": "C — Ambientes susceptibles de aglomeración", "psi.ntc.D": "D — Ambientes de uso comercial", "psi.ntc.E": "E — Bibliotecas, archivos, almacenes, uso industrial", "psi.ntc.F": "F — Garajes y aparcamientos (vehículos ≤ 30 kN)", "psi.ntc.G": "G — Garajes y aparcamientos (vehículos > 30 kN)", "psi.ntc.H": "H — Cubiertas (solo mantenimiento)", "psi.ntc.custom": "Personalizada (ψ manuales)", "psi.ntc.neve_gt1000": "Nieve (altitud > 1000 m s.n.m.)", "psi.ntc.neve_le1000": "Nieve (altitud ≤ 1000 m s.n.m.)", "psi.ntc.temperatura": "Variaciones térmicas", "psi.ntc.vento": "Viento", "ref.asce.assunzioni": "Supuestos de la herramienta: combina valores escalares referidos a la misma magnitud de comprobación; E_v se incorpora al coeficiente de las acciones D y no se aplica a las de tipo F; los casos H entran con el papel elegido por el proyectista entre los tres previstos por la norma (1,6H / 1,0H si incrementan el efecto, 0,9H / 0,6H si son permanentes y resistentes, cero si son resistentes pero no permanentes); el límite de capacidad sobre E_mh del §12.4.3 no está aplicado; no se generan las combinaciones con F_a (inundación), D_i / W_i (hielo) ni los efectos autotensionantes T; los datos permanecen solo en este navegador (ningún envío a servidor).", "ref.asce.fonti": "ASCE/SEI 7-16 y ASCE/SEI 7-22, Cap. 2 (§2.3 Strength Design, §2.4 Allowable Stress Design) y Cap. 12 (§12.4, §12.5, Tab. 12.2-1) — IBC §1605.2 para las combinaciones ASD alternativas — ASCE 7-22 Cap. 32 para la carga de tornado W_T.", "ref.asce.prov": "Procedencia de las modificaciones 7-22 más recientes: el coeficiente 0,1S en la combinación 9 del §2.4.5, de la presentación oficial ICC sobre el 2024 IBC / ASCE 7-22 y de la de SEAU; la Excepción 3 del §2.3.1 sobre el uso de W_T, de la guía NIST/FEMA sobre las cargas de tornado. Ninguna de las dos se ha leído en el texto ASCE de pago.", "ref.ec.assunzioni": "Supuestos de la herramienta: combina valores escalares referidos a la misma magnitud de comprobación; los valores característicos introducidos se entienden ya en el sentido que produce el efecto más desfavorable para la comprobación en estudio; el coeficiente γP para el pretensado se fija igual a 1,0 salvo evaluación específica distinta (NTC 2018 §2.6.1); los datos permanecen solo en este navegador (ningún envío a servidor).", "ref.psi": "Coeficientes ψ por categoría de acción variable", "ref.simboli": "Símbolos", "ref.titoloAsce": "Ecuaciones y símbolos utilizados", "ref.titoloEc": "Tablas de los coeficientes utilizados", "rep.asce.assunzioni": "<strong>Supuestos de la herramienta:</strong> la herramienta combina valores ESCALARES que deben referirse todos a la misma magnitud de comprobación; los valores introducidos se entienden ya expresados en el sentido que produce el efecto más desfavorable para la comprobación en estudio. E<sub>v</sub> = 0,2·S<sub>DS</sub>·D se incorpora al coeficiente de las acciones de tipo D y no se aplica a las acciones de tipo F. Para los casos de tipo H el papel lo elige el proyectista caso por caso entre los tres previstos por la norma: empuje que incrementa el efecto principal (1,6H en Strength Design, 1,0H en ASD), empuje permanente y resistente (0,9H / 0,6H) y empuje resistente pero no permanente, que se pone a cero; el papel adoptado se recoge más arriba junto con los casos de carga. Queda también a cargo del proyectista la aplicabilidad de cada caso de carga a la situación en estudio: la herramienta expande las alternativas previstas por la ecuación para los tipos introducidos, pero no sabe si una carga dada es pertinente para el escenario. El límite de capacidad sobre E<sub>mh</sub> previsto por el §12.4.3 no está aplicado. No se generan las combinaciones con cargas de inundación (F<sub>a</sub>, §2.3.2), hielo atmosférico (D<sub>i</sub>, W<sub>i</sub>, §2.3.3) ni los efectos autotensionantes T (§2.3.4 / §2.4.4). La herramienta genera las combinaciones de las cargas: no sustituye las comprobaciones de resistencia ni la determinación de las propias cargas.", "rep.asce.diff": "<strong>Diferencias 7-16 → 7-22 incorporadas:</strong> los mapas de nieve sobre el terreno se han recalibrado a nivel último por categoría de riesgo, por lo que en el Chapter 2 los paréntesis «o» ya no están factorizados como grupo y la nieve lleva su propio coeficiente — 1,6(L<sub>r</sub> o S o R) pasa a (1,6L<sub>r</sub> o 1,0S o 1,6R) y 0,5(…) pasa a (0,5L<sub>r</sub> o 0,3S o 0,5R); en las ASD la nieve aparece como 0,7S. La nieve concomitante en las combinaciones sísmicas de resistencia pasa de 0,2S a 0,15S. Se introduce la carga de tornado W<sub>T</sub>, como alternativa a W solo en las combinaciones en que el viento es la acción principal.", "rep.asce.fonti": "ASCE/SEI 7-16 y ASCE/SEI 7-22, <em>Minimum Design Loads and Associated Criteria for Buildings and Other Structures</em>, Cap. 2 (§2.3 Strength Design, §2.4 Allowable Stress Design) y Cap. 12 (§12.4 efectos sísmicos, §12.5 efectos ortogonales, Tab. 12.2-1 para Ω<sub>0</sub>) — International Building Code, §1605.2 (combinaciones ASD alternativas). La carga de tornado W<sub>T</sub> la introduce ASCE 7-22, Cap. 32.", "rep.asce.prov": "<strong>Procedencia de las dos modificaciones 7-22 más recientes:</strong> el coeficiente 0,1S en la combinación 9 del §2.4.5 (era 0,75S) procede de la presentación oficial ICC sobre el 2024 IBC / ASCE 7-22 y de la de SEAU sobre las modificaciones de 7-22; la Excepción 3 del §2.3.1 sobre el uso de W<sub>T</sub>, de la guía NIST/FEMA sobre las cargas de tornado de ASCE 7-22. Ninguna de las dos se ha leído en el texto ASCE de pago: si el proyecto lo requiere, contrástalas con la copia oficial.", "rep.avvertenza": "Advertencia:", "rep.casiCarico": "Casos de carga", "rep.coefNorma": "Coeficientes de normativa", "rep.coefParziali": "Coeficientes parciales γ (favorable / desfavorable)", "rep.coefPsi": "Coeficientes de combinación ψ por categoría", "rep.combGenerate": "Combinaciones generadas", "rep.compSis": "Componente sísmica", "rep.compSismiche": "Componentes sísmicas", "rep.ec.assunzioni": "<strong>Supuestos de la herramienta:</strong> la herramienta combina valores ESCALARES que deben referirse todos a la misma magnitud de comprobación; los valores característicos introducidos se entienden ya expresados en el sentido que produce el efecto más desfavorable para la comprobación en estudio, y la clasificación favorable/desfavorable es responsabilidad del proyectista para cada comprobación; el coeficiente γP para el pretensado se asume igual a 1,0 salvo evaluación específica distinta (NTC 2018 §2.6.1). La herramienta genera las combinaciones de las acciones: no sustituye las comprobaciones de resistencia ni, para las comprobaciones geotécnicas, los coeficientes sobre los parámetros del terreno y sobre las resistencias.", "rep.ec.fonti": "D.M. 17 gennaio 2018 (NTC 2018), Cap. 2.5–2.6, Tab. 2.5.I y Tab. 2.6.I — EN 1990:2002+A1:2005 (Eurocódigo 0), Anexo A1, Tab. A1.1 y A1.2(B) — EN 1993-1-1 §5.3 para las imperfecciones geométricas equivalentes.", "rep.ec.transizione": "Está en curso la transición a la segunda generación de los Eurocódigos (EN 1990:2023); a día de hoy las NTC 2018 siguen siendo la referencia de obligado cumplimiento en Italia. Verificar siempre la edición aplicable en el propio contexto normativo.", "rep.eccSis": "Acciones accidentales y sísmicas", "rep.equazioni": "Ecuaciones de combinación utilizadas", "rep.ev.nonInserito": "0 (S_DS no introducido)", "rep.ev.zero": "0 (asumido explícitamente)", "rep.fonti": "Fuentes y supuestos", "rep.fontiLbl": "Fuentes:", "rep.generato": "Generado el {d}", "rep.gruppiIncoerenti": "las acciones del grupo solidario «{sol}» resultan asignadas a grupos exclusivos distintos ({esc}); se ha utilizado el grupo exclusivo del primer miembro. Verificar la asignación de los grupos.", "rep.gruppoOrigine": "Las acciones permanentes pertenecientes al mismo grupo de origen ({g}) se consideran una única acción: toman todas γ,sup o bien todas γ,inf, nunca sentidos mixtos (EN 1990 §6.4.3.2(4)).", "rep.inUso": "(en uso)", "rep.ipotesi": "Hipótesis de generación", "rep.lblApproccio": "Enfoque", "rep.lblEquazione": "Ecuación", "rep.matriceTroncataPdf": "Se muestran las primeras {cap} combinaciones de {tot}. La lista completa se puede exportar en formato TSV desde el botón \"Copiar tabla\" en la vista Matriz.", "rep.max": "{n} combinaciones — máximo <strong>{v}</strong> ({id})", "rep.metodo": "Método", "rep.min": "mínimo <strong>{v}</strong> ({id})", "rep.normEC": "EN 1990 (Eurocódigo 0) — valores recomendados del Anexo A1", "rep.normNTC": "NTC 2018 — D.M. 17 gennaio 2018", "rep.normativa": "Normativa de referencia", "rep.notaDoppioSegno": "Presentes en todas las combinaciones con ambos sentidos: n acciones de doble signo multiplican por 2<sup>n</sup> el número de combinaciones. El sentido debe elegirse como aquel que agrava el efecto en estudio. Caso típico: imperfecciones geométricas equivalentes según EN 1993-1-1 §5.3; si el valor procede de cargas ya mayoradas (F = φ·N<sub>Ed</sub>) el coeficiente en ELU es 1,0 y en los ELS vale típicamente 1/γ<sub>Q</sub>. El coeficiente y la aplicabilidad a cada estado límite siguen siendo una decisión del proyectista.", "rep.notaVariabili": "γQ = {gq} en estado límite último para las acciones desfavorables; las acciones variables favorables se excluyen de la combinación (γQ,fav = 0). <em>Grupo solidario</em>: acciones siempre activas juntas y con el mismo papel, contadas como una sola acción. <em>Grupo exclusivo</em>: alternativas entre sí, como máximo una activa por combinación; las alternativas pueden ser también grupos solidarios enteros.", "rep.opz.doppioSegno": "Acciones de doble signo incluidas en todas las combinaciones con ambos sentidos (×2 por cada una)", "rep.opz.ecc": "Combinación accidental incluida", "rep.opz.eccDom": "variable dominante con ψ1 (eq. 6.11a)", "rep.opz.ibc": "Incluidas las combinaciones ASD alternativas del IBC §1605.2 ({ed}), sin el factor ω, eliminado en el IBC 2021.", "rep.opz.lRidotta": "Aplicada la Excepción 1 del §2.3.1: factor sobre L igual a 0,5 en las combinaciones 3 y 4 (admitido donde L₀ ≤ 100 psf, excluidos los aparcamientos y los locales de pública concurrencia).", "rep.opz.listaFissa": "Combinaciones a partir de una lista fija de ecuaciones: ninguna acción dominante por rotación, ningún coeficiente ψ (conceptos que ASCE 7 no utiliza).", "rep.opz.minima": "Incluida la combinación mínima automática (utilidad para levantamiento)", "rep.opz.omega": "Generadas también las combinaciones con sobrerresistencia, E_mh = Ω₀·Q_E con Ω₀ = {om}.", "rep.opz.ortoOff": "Componentes sísmicas consideradas por separado (±cada una), sin combinación ortogonal.", "rep.opz.ortoOn": "Regla ortogonal 100/30 aplicada entre Q_Ex y Q_Ey (§12.5.3), con todas las combinaciones de signo.", "rep.opz.parentesi": "Paréntesis «o» expandidos en todas las alternativas compatibles con los casos de carga introducidos; las ecuaciones que producen la misma combinación numérica se funden en una sola fila, con la lista de los números de ecuación.", "rep.opz.permBlocco": "Permanentes tratadas como un bloque único (todas desfavorables)", "rep.opz.permIndip": "Clasificación independiente favorable/desfavorable para cada acción permanente o grupo de origen (2ⁿ combinaciones)", "rep.opz.r30off": "regla del 30% NO aplicada, componentes consideradas por separado", "rep.opz.r30on": "regla del 30% apli     zh: {"appr.610": "eq. 6.10 — 单一组合", "appr.610ab": "eq. 6.10a / 6.10b — 包络", "appr.A1": "验算途径 1 / A1 — STR 结构验算（建筑中最常见）", "appr.A2": "验算途径 2 / A2 — GEO 岩土验算", "appr.EQU": "EQU — 平衡验算", "aria.normativa": "参考规范", "aria.vista": "结果视图", "asce.nonCoperto": "§2.3.2 / §2.4.2（洪水荷载 F<sub>a</sub>）、§2.3.3 / §2.4.3（大气结冰 D<sub>i</sub> 和 W<sub>i</sub>）、§2.3.4 / §2.4.4（自应力效应 T）、§2.3.5（未规定的荷载）、§2.5（特殊事件）和 §2.6（结构整体性）", "av.gruppiIncoerenti": "配置自相矛盾：联动分组「{sol}」中的作用被分配到了不同的互斥分组（{esc}）。一个联动分组就是一个作用，不能与自身互为替代：现采用第一个成员所属的互斥分组。请修正分组的指定。", "av.nessunCaso": "尚未输入任何荷载工况：请在左侧面板中至少添加一个。", "av.nessunD": "没有 D 类（恒荷载）荷载工况：所有 ASCE 公式都含有 D，所生成的组合并不完整。", "av.omegaMancante": "要求考虑超强，但未输入 Ω<sub>0</sub>（Tab. 12.2-1）：含 Ω<sub>0</sub> 的组合未被生成。", "av.omegaUno": "Ω<sub>0</sub> = 1 并不自动等同于「没有超强」：请按所采用的抗侧力体系核对 Tab. 12.2-1 中的取值。", "av.qeMancante": "已启用地震组合，但未输入任何 Q<sub>E</sub> 值。", "av.rhoMancante": "未输入 ρ：已按 1.0 处理。这是一个需要工程判断的数值，而不是无害的默认值 — 它应按 §12.3.4 确定，该条在若干情况下强制要求 ρ = 1.3。", "av.sdsMancante": "未输入 S<sub>DS</sub>：E<sub>v</sub> 已按零处理。请输入 S<sub>DS</sub>，或明确勾选「E<sub>v</sub> = 0」。", "av.troppeComb": "共 {n} 个组合。请核实作用的独立性是否对应物理上可能出现的情形：不可能同时存在的作用应放入互斥分组，始终同时出现的作用应放入联动分组。", "av.wtSu716": "存在 Wt（龙卷风）类型的荷载工况，但龙卷风荷载只在 ASCE 7-22 中存在：当前选择的是 7-16，该工况被忽略。", "badge.alt": "未参与的备选项", "badge.dom": "主导", "badge.fav": "↓ 有利", "badge.omessa": "已略去（有利）", "badge.sfav": "↑ 不利", "badge.sperimentale": "⚠ 试验性 — 请核实适用性", "blk.approccio": "验算类型", "blk.asceCarichi": "荷载工况", "blk.asceMetodo": "设计方法", "blk.doppioSegno": "双符号作用（±）", "blk.eccezionale": "偶然作用", "blk.output": "结果显示", "blk.permanenti": "永久作用", "blk.sismica": "地震作用", "blk.variabili": "可变作用", "btn.addAsce": "+ 添加荷载工况", "btn.addDs": "+ 添加双符号作用", "btn.addPerm": "+ 添加永久作用", "btn.addVar": "+ 添加可变作用", "btn.coffee": "☕ 请我喝咖啡", "btn.copiaBloccata": "浏览器阻止了复制", "btn.copiaTsv": "复制表格（TSV）", "btn.copiato": "已复制 ✓", "btn.guida": "使用指南", "btn.guidaTitle": "打开本工具的使用指南", "btn.mostraTutte": "显示全部 {n} 个组合", "btn.report": "PDF 报告", "btn.reportTitle": "生成报告并打开打印窗口：请选择「另存为 PDF」", "chip.max": "最大值", "chip.min": "最小值", "chk.asceEvZero": "E<sub>v</sub> = 0（在采用 IBC 替代组合进行基础设计时，以及 §12.4.2.2 的情形下允许）", "chk.asceIbc": "包含 IBC 的 ASD <em>替代</em>组合（§1605.2）", "chk.asceLrid": "组合 3 和 4 中 L 的系数折减为 0.5 — 仅在 L<sub>0</sub> ≤ 100 psf（4.79 kN/m²）时允许，车库和公共集会场所<strong>除外</strong>（§2.3.1 例外 1）", "chk.asceOmega": "同时生成含超强系数的组合（E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub>，§12.4.3）", "chk.asceOrto": "在 Q<sub>Ex</sub> 与 Q<sub>Ey</sub> 之间应用 100/30 正交组合规则", "chk.asceSis": "包含地震组合（§2.3.6 / §2.4.5）", "chk.domPsi1": "主导可变作用取 ψ1 而非 ψ2（EN 1990 eq. 6.11a — 事件「发生期间」的验算，例如火灾持续过程中）", "chk.eccezionale": "偶然作用 — Ad", "chk.minima": "包含自动生成的最小组合（用于上拔的辅助功能）", "chk.permIndip": "对每个永久作用或来源分组独立进行有利/不利分类（2ⁿ 种组合）", "chk.regola30": "在各分量之间应用 30% 规则（§7.3.5）", "chk.sismica": "包含地震组合", "chk.varIndip": "按单个作用分别考虑可变作用的有利/不利（含该作用被排除的工况）", "col.categoria": "类别", "col.coefSLE": "正常使用 / 地震 / 偶然状况系数", "col.coefSLU": "承载能力极限状态系数", "col.combinazione": "组合", "col.componente": "分量", "col.descrTipo": "类型说明", "col.descrizione": "说明", "col.eqOmega": "含超强系数 — E_mh = Ω₀·Q_E（§12.4.3）", "col.eqSismica": "地震公式", "col.equazione": "公式", "col.gammaFav": "γ 有利", "col.gammaSfav": "γ 不利", "col.grEsc": "互斥分组", "col.grSol": "联动分组", "col.gruppoOrigine": "分组（来源）", "col.n": "序号", "col.nome": "名称", "col.risultato": "结果", "col.significato": "含义", "col.simbolo": "符号", "col.tipo": "类型", "col.valCar": "标准值", "col.valore": "数值", "cong.oppure": "或", "disclaimer.footer": "本工具按现状提供，不附带任何担保。所有结果仅供参考：在用于实际项目之前，请务必自行独立核实。本工具不能替代具备资质的工程师的专业判断，也不能替代规范规定的强制性验算。", "disclaimer.report": "本报告由一款免费工具自动生成，仅供参考。它不能替代具备资质的工程师的专业判断，不能替代规范规定的强制性验算，也不能替代项目的技术审查。作者对本文件所含结果在实际项目或任何其他用途中的使用不承担任何责任：使用完全由使用者自行承担风险，并应事先独立核实。", "esempio.perm": "G1 — 结构自重", "esempio.var": "Q1 — 使用活荷载", "g.ascecarichi.b": "<p>每个荷载工况都必须关联到相应的规范荷载类型，因为正是类型决定了它在各个公式中取用哪个系数：</p><ul><li><strong>D</strong> 恒荷载 · <strong>L</strong> 楼面活荷载 · <strong>L<sub>r</sub></strong> 屋面活荷载</li><li><strong>S</strong> 雪荷载 · <strong>R</strong> 雨荷载 · <strong>W</strong> 风荷载 · <strong>W<sub>T</sub></strong> 龙卷风荷载（仅 7-22）</li><li><strong>F</strong> 压力与高度已确定的流体荷载：取与 D 相同的系数</li><li><strong>H</strong> 土压力或地下水压力：见下文</li></ul><p>对于 <strong>H</strong> 类荷载工况，规范区分三种情形，本工具让你逐个荷载工况选择：<em>加大</em>主效应的侧压力（Strength Design 取 1.6H，ASD 取 1.0H）；<em>永久存在且起抗力作用</em>的侧压力（0.9H / 0.6H）；<em>起抗力但非永久存在</em>的侧压力，应取为零。哪一种正确，取决于所进行的具体验算。</p><div class=\"gnote\"><strong>雪荷载在两个版本中的含义不同。</strong>在 7-16 中 S 是名义值；在 7-22 中雪荷载区划图已按极限水平重新标定，因此 S 本身数值更大，在公式中取用的系数也不同。从 FEM 模型导入荷载时务必注意。</div>", "g.ascecarichi.t": "ASCE 7 — 荷载类型", "g.asceecc.b": "<p><strong>L 的系数折减（§2.3.1 例外 1）。</strong>在组合 3 和 4 中，当规范表列可变荷载 L<sub>0</sub> 不超过 100 psf（4.79 kN/m²）时，L 的系数可取 0.5 而非 1.0。车库和公共集会场所<strong>除外</strong>。只有在确认所处理的情况确实符合条件之后，才可勾选此项。</p><p><strong>龙卷风例外。</strong>在 ASCE 7-22 中，采用 W<sub>T</sub> 荷载时，雪荷载退出该组合：龙卷风是暖季现象，与雪荷载不同时出现。本工具在 Strength Design（组合 4a，§2.3.1 例外 3）和 ASD（组合 6a，§2.4.1）中均予以应用。</p><div class=\"gnote\">两个版本在括号写法上的差别并非表面文章。7-16 写作 1.6(L<sub>r</sub> 或 S 或 R)，整组只有一个系数；7-22 写作 (1.6L<sub>r</sub> 或 1.0S 或 1.6R)，每个备选项各有一个系数，因为雪荷载已经是极限水平的值。</div>", "g.asceecc.t": "ASCE 7 — 已实现的例外条款", "g.ascemetodo.b": "<p>美国规范的引擎与欧洲规范<strong>在构造上完全不同</strong>，差别不仅仅在系数上。</p><p>ASCE 7 没有生成式规则，只有一份<strong>固定的公式清单</strong>。荷载之间的同时性已经写进了公式本身，不存在轮换的主导作用，也<strong>不存在 ψ 系数</strong>。NTC 中的 A÷H 类别在这里毫无用处。</p><p>唯一的组合运算是对「或」括号的展开：像 1.2D + 1.6(L<sub>r</sub> 或 S 或 R) 这样的组合会生成与备选项数量相同的若干行，但只针对你实际输入过的荷载类型。</p><p><strong>LRFD</strong>（荷载与抗力系数设计法，§2.3）与 <strong>ASD</strong>（容许应力设计法，§2.4）是互相替代的方法。在 ASD 组合中，伴随可变荷载上的 0.75 系数已经乘进所显示的系数里：0.75 × 0.6W 显示为 0.45W。</p><div class=\"gnote\">采用基本 ASD 组合时，<strong>不允许对容许应力作任何提高</strong>。</div>", "g.ascemetodo.t": "ASCE 7 — 工作原理", "g.asceorto.b": "<p>勾选 100/30 后，两个水平分量会轮换：一个取 100%，另一个取 30%，并考虑全部符号组合。输入两个分量时，每个地震公式会得到八种组合模式。</p><div class=\"gnote\"><strong>这不是一条必须始终应用的规则。</strong>§12.5 区分了独立方向法（§12.5.1.1）与正交组合法（§12.5.1.2），具体采用哪一种取决于抗震设计类别和结构的布置形式（§12.5.3、§12.5.4）。本工具不做此判断：勾选之前请自行核实其适用性。</div>", "g.asceorto.t": "ASCE 7 — 正交效应", "g.ascerho.b": "<p>这是两个<strong>本工具不予确定</strong>、也无法确定的参数：它们取决于结构体系和抗震设计类别。</p><p><strong>ρ — 冗余度系数（§12.3.4）。</strong>应按 §12.3.4 确定，该条在若干情况下强制要求 ρ = 1.3。本工具不校核可取 ρ = 1.0 的条件：它原样使用你输入的数值。若留空则按 1.0 处理并给出提示。</p><p><strong>Ω<sub>0</sub> — 超强系数。</strong>它按抗侧力体系在 Tab. 12.2-1 中列表给出，用于 E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub> 的组合，某些构件必须采用。Ω<sub>0</sub> = 1 并不自动等同于「没有超强」。</p><div class=\"gnote\">§12.4.3 允许把 E<sub>mh</sub> 限制为由屈服构件承载能力所决定的数值。本工具<strong>不应用该上限</strong>。</div>", "g.ascerho.t": "ASCE 7 — ρ 与 Ω₀", "g.ascesisma.b": "<p>在 ASCE 7 中，地震作用不是单一的输入量。效应 E 由两部分组成：</p><ul><li><strong>E<sub>h</sub> = ρ·Q<sub>E</sub></strong> — 水平效应，其中 Q<sub>E</sub> 就是你从分析中得到的结果</li><li><strong>E<sub>v</sub> = 0.2·S<sub>DS</sub>·D</strong> — 竖向效应，它<em>不是</em>一个单独的荷载：它与恒荷载成正比</li></ul><p>因此 E<sub>v</sub> 不会作为单独一列出现：它被并入 D 类作用的系数中，在组合 6、8 和 9 中相加，在组合 7 和 10 中相减。对 F 类作用不予施加。</p><p>若 S<sub>DS</sub> 留空，则 E<sub>v</sub> 按零处理，本工具会给出提示。「E<sub>v</sub> = 0」复选框用于明确声明这一选择，正如在采用 IBC 替代组合进行基础设计以及 §12.4.2.2 的情形下所允许的那样。</p><div class=\"gnote\">Q<sub>Ex</sub> 和 Q<sub>Ey</sub> 必须是已由分析得到、且针对<strong>同一个响应量</strong>的效应。</div>", "g.ascesisma.t": "ASCE 7 — 地震作用", "g.doppiosegno.b": "<p>这类作用出现在<em>每一个</em>组合中，系数固定，且两个方向都要考虑。每一个双符号作用都会使组合数量翻倍：n 个作用使其乘以 2ⁿ。</p><p>典型情况是<strong>等效几何缺陷</strong>（EN 1993-1-1 §5.3），应按使所考察效应更不利的方向施加。若该值由已放大的荷载导出（F = φ·N<sub>Ed</sub>），则承载能力极限状态下系数取 1，正常使用极限状态下通常取 1/γ<sub>Q</sub>。</p><div class=\"gnote\">系数取值及其对各极限状态的适用性<strong>仍由设计人员自行判断</strong>：缺陷的处理方式取决于所采用的分析方法和计算模型。</div>", "g.doppiosegno.t": "双符号作用（±）", "g.ecazioni.b": "<p>每个永久作用都有一个类型：<strong>G1</strong> 结构自重，<strong>G2</strong> 非结构永久荷载，<strong>P</strong> 预应力。类型决定所施加的分项系数。</p><p><strong>来源分组</strong>字段用于实现单一来源原则（EN 1990 §6.4.3.2(4)）：源自同一物理来源的永久作用必须<em>全部</em>取 γ<sub>sup</sub>，或<em>全部</em>取 γ<sub>inf</sub>，不得取向混用。在多个作用上填写相同的分组名称，它们就会一起变化，并在组合运算中按一个作用计。</p><p>对于预应力，分项系数 γ<sub>P</sub> 取 1.0，除非另有专门评估（NTC 2018 §2.6.1；关于局部锚固处 γ<sub>P</sub>=1.2 另见 §4.1.8.1.1）。</p>", "g.ecazioni.t": "EC0 / NTC — 永久作用", "g.eccezionale.b": "<p>A<sub>d</sub> 的取值（撞击、爆炸、火灾）应由针对该偶然作用的专门分析确定：本工具不予确定。</p><p>采用 <strong>NTC 2018</strong> 时，eq. 2.5.6 要求取 ψ<sub>2</sub>，且适用于<em>所有</em>可变作用，不设主导可变作用。</p><p>采用 <strong>EN 1990</strong> 时可以选择：eq. 6.11b 对所有可变作用取 ψ<sub>2</sub>，或 eq. 6.11a 设一个取 ψ<sub>1</sub> 的主导可变作用，后者代表事件「发生期间」的验算 — 例如火灾持续过程中。</p>", "g.eccezionale.t": "偶然组合", "g.ecgruppi.b": "<p>可变作用有<strong>两个相互独立的分组字段</strong>，用途各不相同。</p><ul><li><strong>联动分组</strong>：名称相同的作用始终同时参与，且承担相同的角色，如同一个作用。例如：自动计算的雪荷载与手工施加在部分屋面上的雪荷载。</li><li><strong>互斥分组</strong>：名称相同的作用互为替代，每个组合中至多有一个参与。例如：X 向风与 Y 向风，或温度膨胀与温度收缩。</li></ul><p>两个层级可以叠加使用：一个联动分组可以作为某个互斥分组<em>的一个备选项</em>。把同一联动分组中的作用分配到不同的互斥分组是自相矛盾的，本工具会以红色提示。</p><div class=\"gnote\"><strong>两个独立性复选框</strong>决定了会生成多少个组合。不勾选时得到最小组合集（所有永久作用取不利值，所有可变作用均参与并轮换主导作用）；勾选后，每个作用还可以取有利值或被排除，组合数量按 2ⁿ 增长。在设有互斥分组而未启用独立性时，其中一个备选项<em>始终</em>会出现。</div>", "g.ecgruppi.t": "EC0 / NTC — 可变作用分组", "g.ecminima.b": "<p>这是一个便捷用的组合：永久作用取有利方向并采用最小的 γ，可变作用全部取零。它用于探查包络的下限，通常针对上拔问题。</p><div class=\"gnote\"><strong>它不能替代 EQU 验算。</strong>在平衡验算中，每个作用都必须针对具体的失稳机构判定为稳定作用还是不稳定作用，而且可变作用也可能是稳定作用。本辅助功能不会替你做这件事。</div>", "g.ecminima.t": "EC0 / NTC — 最小组合", "g.ecnorma.b": "<p>欧洲规范引擎是<strong>生成式</strong>的：它应用 γ<sub>G</sub>·G + γ<sub>Q</sub>·Q<sub>k1</sub> + Σ γ<sub>Q</sub>·ψ<sub>0</sub>·Q<sub>ki</sub> 这一规则，并在所有参与的可变作用之间轮换主导可变作用。</p><p>采用 <strong>NTC 2018</strong> 时，按 Tab. 2.6.I 选择验算类型：EQU 用于平衡验算，A1 用于结构验算（建筑中最常见的情况），A2 用于岩土验算。</p><p>采用 <strong>EN 1990 通用</strong>时，选择公式：单一的 6.10，或 6.10a/6.10b 的包络。在 6.10b 中，不利的永久作用由系数 ξ 折减，此处按 CEN 的推荐取 0.85：<strong>适用的国家附录可能规定不同的取值</strong>，请自行核实。</p><div class=\"gnote\">采用 A2 时，本工具只对作用施加分项系数。完整的岩土验算还需要土体参数分项系数（M1/M2）和抗力分项系数（R1/R2/R3），这些本工具不会生成。</div>", "g.ecnorma.t": "EC0 / NTC — 验算类型", "g.ecsisma.b": "<p>输入已由分析得到的地震效应 Ex、Ey 和 Ez。只填写一个方向时，得到 ±E 两个组合。</p><p>填写多个方向时，默认各方向分别单独考虑。勾选 <strong>30% 规则</strong>（NTC 2018 §7.3.5）后，各分量会轮换：一个取系数 1.00，其余取 0.30，并考虑全部符号组合。</p><div class=\"gnote\">Ex、Ey 和 Ez 必须是针对<strong>同一个验算量</strong>的效应。本工具做的是标量叠加：它并不是在对地震作用做矢量合成。</div>", "g.ecsisma.t": "EC0 / NTC — 地震作用", "g.export.b": "<p><strong>矩阵视图</strong>以荷载工况为列、组合为行，单元格中为系数。复制按钮以 TSV 格式导出全部内容：可直接粘贴到 Excel，或粘贴到支持制表符文本导入的 FEM 软件中。屏幕上的表格出于性能考虑作了截断，但复制的内容始终包含全部组合。</p><p><strong>小数分隔符</strong>对矩阵视图和复制内容有效：意大利语版 Excel 用逗号，FEM 软件和英文版 Excel 用点号。</p><p>系数按四位小数导出，因为它们是多个因子的乘积：ξ·γ<sub>G</sub> 等于 1.1475，四舍五入为 1.15 会引入误差。</p><p><strong>PDF 报告</strong>会生成一份文档，包含所采用的规范、生成假定、荷载工况、系数、所用公式的完整写法以及全部组合，随后打开浏览器的打印窗口：请选择「另存为 PDF」。由于公式以完整形式列出，收到文档的人无需打开本工具即可复核。</p>", "g.export.t": "导出结果", "g.ibc.b": "<p>自 2021 年起，IBC 已从 §1605 中删去了自己那份强度设计组合和基本 ASD 组合的副本，转而援引 ASCE 7。保留下来的是 ASD <strong>替代</strong>组合，即 eq. 16-1 ÷ 16-6，本工具可按需生成。版本随所选的 ASCE 版本确定：7-16 → IBC 2021，7-22 → IBC 2024。</p><p>系数 ω 已被 IBC 2021 <strong>取消</strong>：风荷载直接以 0.6W 计入。</p><p>容许应力提高 1/3 并非 IBC 自身给予的：§1605.2 将这一点交由材料规范规定。AISC 360（钢结构）与 TMS 402（砌体结构）已取消该规定，ACI 318 不采用 ASD。实际上它只在木结构中保留下来，但那里的机制是 NDS 的 C<sub>D</sub> 系数，此外还有地基承载力方面。</p><div class=\"gnote\"><strong>本节标记为试验性。</strong>公式 16-1 ÷ 16-4 已经过核对；16-5 和 16-6 中包含本工具对 E<sub>v</sub> 处理方式的一种解读。在用于实际计算之前，请与 IBC 官方版本核对。</div>", "g.ibc.t": "IBC — ASD 替代组合", "g.limiti.b": "<p>有必要把边界讲清楚。</p><ul><li><strong>不确定荷载。</strong>标准值、地震效应、偶然作用：都由你根据分析结果输入。</li><li><strong>不执行验算</strong>，无论是承载力、稳定还是正常使用方面的验算。</li><li><strong>只叠加标量数值</strong>，且这些值必须针对同一个量。它不做矢量合成。</li><li><strong>无法判断某个荷载工况对所考虑的情形是否相关</strong>：它只针对你输入过的荷载类型展开公式规定的各个备选项，适用性仍需由你自行判断。</li><li><strong>对 ASCE 7 仅覆盖 Chapter 2 的核心内容</strong>：基本组合（§2.3.1、§2.4.1）和地震组合（§2.3.6、§2.4.5）。未涵盖洪水（§2.3.2 / §2.4.2）、大气结冰（§2.3.3 / §2.4.3）、自应力效应 T（§2.3.4 / §2.4.4）、未规定的荷载（§2.3.5）、特殊事件（§2.5）以及结构整体性（§2.6）。</li><li><strong>对于岩土验算</strong>，只施加作用的分项系数，不施加土体参数和抗力的分项系数。</li></ul><div class=\"gnote\">有两处较新的规范内容来自官方机构资料，而非付费的 ASCE 正式文本：7-22 §2.4.5 组合 9 中的 0.1S 系数（ICC 关于 2024 IBC / ASCE 7-22 的官方报告，以及 SEAU 的报告），以及 §2.3.1 中关于使用 W<sub>T</sub> 的例外 3（NIST/FEMA 的龙卷风荷载指南）。若项目有此要求，请对照官方正式文本核实。</div>", "g.limiti.t": "本工具不做什么", "g.start.b": "<p>本工具用于生成结构验算所需的荷载组合。它不计算荷载，也不进行验算：它只对你输入的数值进行组合。</p><ul><li><strong>在顶部选择规范</strong>：NTC 2018、EN 1990 通用、ASCE 7-22 或 ASCE 7-16。左侧面板会随之变化，因为这两套体系的运作方式完全不同。</li><li><strong>输入荷载工况</strong>及其标准值。</li><li><strong>在右侧查看结果</strong>：每次修改都会即时更新，没有「生成」按钮。</li><li><strong>导出结果</strong>：使用矩阵视图（复制 TSV 到 Excel 或 FEM 软件），或使用 PDF 报告。</li></ul><div class=\"gnote\"><strong>本工具做的是标量数值的叠加。</strong>所有输入值都必须对应同一个验算量：把支座反力与弯矩组合在一起没有意义。若需要对多个量求包络，请每个量单独运行一次。</div><p>数据保存在你的浏览器中，不会发送到任何服务器。关闭页面后重新打开，数据仍在。</p>", "g.start.t": "快速上手", "guida.chiudi": "关闭", "guida.titolo": "使用指南", "help.apri": "打开该主题的指南", "hint.asce": "尚未输入荷载工况。", "hint.doppioSegno": "尚未输入双符号作用。", "hint.matrice": "列 = 荷载工况 · 行 = 组合 · 单元格 = 系数。可粘贴到 Excel 或 FEM 软件中。", "hint.permanenti": "尚未输入永久作用。", "hint.variabili": "尚未输入可变作用。", "lbl.approccioEC": "公式（EN 1990 Annex A1）", "lbl.approccioNTC": "验算类型（NTC 2018 Tab. 2.6.I）", "lbl.decimale": "小数分隔符（矩阵视图与复制）", "lbl.dominante": "{nome} 主导", "lbl.eccNtc": "Ad + 永久作用 + ψ2 可变作用", "lbl.metodo": "方法", "lbl.nessunoParen": "（无）", "lbl.ruoloH": "H 的角色", "lbl.soloPermanenti": "仅永久作用", "lbl.tuttiPsi2": "全部可变作用取 ψ2", "lbl.unicaVariabile": "单一可变作用", "lbl.unita": "计量单位（仅影响显示）", "msg.valoriMancanti": "请输入全部标准值以得到数值结果", "nota.f": "F 类荷载工况取与恒荷载 D 相同的系数，如 §2.3.1 / §2.4.1 的条文注释所规定。", "nota.h": "对于 H 类荷载工况，规范区分三种情形：加大主效应的侧压力（Strength Design 取 1.6H，ASD 取 1.0H）、永久存在且起抗力作用的侧压力（0.9H / 0.6H），以及起抗力但非永久存在的侧压力，应取为零。哪一种正确取决于所进行的具体验算，仍由设计人员自行判断。", "nota.hRuoli": "H 类荷载工况所指定的角色：", "nota.lRidotta": "已应用 §2.3.1 例外 1：组合 3 和 4 中 L 的系数取 0.5。", "nota.parentesi722": "在 7-22 中，括号不再作为一组整体提取系数：雪荷载已经是极限水平的值，因此每个备选项各自带有自己的系数。", "nota.tornadoASD": "<strong>已应用龙卷风例外：</strong>在使用 W<sub>T</sub> 的组合 6a 中，括号 0.75(L<sub>r</sub> 或 0.7S 或 R) 简化为 0.75(L<sub>r</sub> 或 R) — 龙卷风是暖季现象，与雪荷载不同时出现。", "nota.tornadoLRFD": "<strong>已应用 §2.3.1 例外 3：</strong>在使用 W<sub>T</sub> 的组合 4a 中，括号 (0.5L<sub>r</sub> 或 0.3S 或 0.5R) 简化为 0.5(L<sub>r</sub> 或 R) — 龙卷风是暖季现象，与雪荷载不同时出现。", "nota.troncElenco": "出于性能考虑，列表已由 {tot} 个组合截断为 {cap} 个；上方的最大值和最小值仍按完整集合计算。", "nota.troncMatrice": "出于性能考虑，表格已由 {tot} 行截断为 {cap} 行；复制按钮仍会导出全部组合。", "note.asceCarichi": "每个荷载工况都对应一个规范荷载类型：系数由公式决定，而不是由你决定。同一类型可以输入多个荷载工况：它们取相同的系数，并在矩阵中保持为各自独立的列。", "note.asceSis": "在 ASCE 7 中，地震不是单一的输入量：E 由 E<sub>h</sub> = ρ·Q<sub>E</sub> 与 E<sub>v</sub> = 0.2·S<sub>DS</sub>·D 两部分组成。请输入由分析得到的 Q<sub>E</sub> 效应以及下面的各项参数。", "note.doppioSegno": "在<em>每一个</em>组合中都出现的作用，系数固定、方向取 ±。典型情况：等效几何缺陷（EN 1993-1-1 §5.3）。系数取值及其对各极限状态的适用性，仍由设计人员自行判断。", "note.ds": "双符号作用（{g}）在每一个组合中都以两个方向参与。", "note.geoA2": "这里只是作用上的分项系数（Tab. 2.6.I，A2 列）；完整的 GEO 验算还需要土体参数分项系数（M1/M2）和抗力分项系数（R1/R2/R3），本工具不予生成。", "note.gruppiEsc": "互斥分组（{g}）：组内各备选项互相排斥，每个组合中至多一个参与。", "note.gruppiPerm": "同一来源的永久作用（{g}）全部取 γ,sup 或全部取 γ,inf（EN 1990 §6.4.3.2(4)）。", "note.gruppiSol": "联动分组（{g}）：组内各作用始终同时参与并承担相同角色，如同一个作用。", "note.metodo": "LRFD 与 ASD 是<strong>互相替代</strong>的设计方法：选择「两者」只是同时生成两套结果以便对照或存档，并不意味着一次验算要同时用两种方法进行。", "note.omega": "Ω<sub>0</sub> 是 Tab. 12.2-1 中列表给出的<strong>超强系数</strong>。本工具不确定其取值，也不应用 §12.4.3 的能力上限。", "note.orto": "100/30 <strong>并不是一条普遍适用的规则</strong>：§12.5 区分了独立方向法与正交组合法，具体采用哪一种取决于抗震设计类别和结构的布置形式。", "note.permIndip": "每个永久作用的有利或不利分类都与其他作用相互独立。", "note.rho": "ρ 是<strong>冗余度系数</strong>：应按 §12.3.4 确定。本工具<strong>不校核</strong>可取 ρ = 1.0 的条件，也不会替你作出选择。", "note.sismica": "仅填写一个方向即得到简单组合（±E）；也可填写多个方向：默认各方向分别单独考虑。", "note.tutteComb": "将生成由此产生的全部组合（可在左侧面板中关闭）。", "note.unTerzo": "容许应力提高 1/3 <em>仅</em>在采用 IBC 替代组合时、且<em>仅</em>在相应材料规范允许时才可使用：AISC 360 与 TMS 402 已取消该规定，ACI 318 不采用 ASD。", "note.varFond": "每个可变作用都可以是主导可变作用、伴随可变作用（ψ0），或有利而被排除（0），彼此相互独立。", "note.varFreq": "每个可变作用都可以是主导可变作用（ψ1）、伴随可变作用（ψ2），或有利而被排除，彼此相互独立。", "note.varNoDom": "每个可变作用都可以参与（ψ2），或有利而被排除，彼此相互独立。", "note.varRara": "每个可变作用都可以是主导可变作用（取全值）、伴随可变作用（ψ0），或有利而被排除，彼此相互独立。", "opt.G1": "G1 — 结构自重", "opt.G2": "G2 — 非结构永久荷载", "opt.P": "P — 预应力", "opt.both": "两者（LRFD + ASD）", "opt.punto": "点号 — FEM 软件 / 英文区域设置的 Excel", "opt.virgola": "逗号 — 欧洲区域设置的 Excel", "ph.ad": "Ad 值", "ph.ex": "Ex 值", "ph.ey": "Ey 值（可选）", "ph.ez": "Ez 值（可选）", "ph.gruppo": "分组 — 同一来源的作用（可选）", "ph.gruppoEsc": "互斥分组（互为替代）", "ph.gruppoSol": "联动分组（始终同时参与）", "ph.nomeDs": "名称（例如 几何缺陷）", "ph.nomePerm": "名称（例如 结构自重）", "ph.nomeVar": "名称（例如 使用活荷载）", "ph.omega": "取自 Tab. 12.2-1", "ph.qex": "X 向地震效应", "ph.qey": "Y 向地震效应（可选）", "ph.rho": "取自 §12.3.4", "ph.sds": "例如 0.85", "ph.valCar": "标准值", "ph.valCarQk": "标准值 Qk", "ph.valore": "数值", "psi.ec.A": "A — 住宅用房", "psi.ec.B": "B — 办公用房", "psi.ec.C": "C — 人员密集场所", "psi.ec.D": "D — 商业用房", "psi.ec.E": "E — 库房、工业用房", "psi.ec.F": "F — 车辆交通（车辆 ≤ 30 kN）", "psi.ec.G": "G — 车辆交通（30 kN < 车辆 ≤ 160 kN）", "psi.ec.H": "H — 屋面", "psi.ec.custom": "自定义（手动输入 ψ）", "psi.ec.neve_altri": "雪荷载 — 其他 CEN 成员国", "psi.ec.neve_nordic": "雪荷载 — 芬兰、冰岛、挪威、瑞典", "psi.ec.temperatura": "温度作用", "psi.ec.vento": "风荷载", "psi.ntc.A": "A — 住宅用房", "psi.ntc.B": "B — 办公用房", "psi.ntc.C": "C — 人员密集场所", "psi.ntc.D": "D — 商业用房", "psi.ntc.E": "E — 图书馆、档案室、库房、工业用房", "psi.ntc.F": "F — 车库、停车场（车辆 ≤ 30 kN）", "psi.ntc.G": "G — 车库、停车场（车辆 > 30 kN）", "psi.ntc.H": "H — 屋面（仅供检修）", "psi.ntc.custom": "自定义（手动输入 ψ）", "psi.ntc.neve_gt1000": "雪荷载（海拔 > 1000 m）", "psi.ntc.neve_le1000": "雪荷载（海拔 ≤ 1000 m）", "psi.ntc.temperatura": "温度作用", "psi.ntc.vento": "风荷载", "ref.asce.assunzioni": "本工具的假定：组合的是针对同一个验算量的标量数值；E_v 被并入 D 类作用的系数中，不施加于 F 类作用；H 类荷载工况按设计人员在规范规定的三种情形中所选的角色计入（加大主效应时取 1.6H / 1.0H，永久存在且起抗力时取 0.9H / 0.6H，起抗力但非永久存在时取零）；§12.4.3 规定的 E_mh 承载能力上限未予应用；含 F_a（洪水）、D_i / W_i（结冰）以及自应力效应 T 的组合均未生成；数据仅保存在本浏览器中（不向服务器发送）。", "ref.asce.fonti": "ASCE/SEI 7-16 与 ASCE/SEI 7-22，Cap. 2（§2.3 Strength Design、§2.4 Allowable Stress Design）与 Cap. 12（§12.4、§12.5、Tab. 12.2-1）— ASD 替代组合见 IBC §1605.2 — 龙卷风荷载 W_T 见 ASCE 7-22 Cap. 32。", "ref.asce.prov": "7-22 最新修订的出处：§2.4.5 组合 9 中的系数 0.1S 出自 ICC 关于 2024 IBC / ASCE 7-22 的官方报告以及 SEAU 的报告；§2.3.1 中关于使用 W_T 的例外 3 出自 NIST/FEMA 的龙卷风荷载指南。两者都未在付费的 ASCE 正式文本上核对过。", "ref.ec.assunzioni": "本工具的假定：组合的是针对同一个验算量的标量数值；所输入的标准值应当已经按对所考察验算最不利的方向表达；预应力的分项系数 γP 设为 1.0，除非另有专门评估（NTC 2018 §2.6.1）；数据仅保存在本浏览器中（不向服务器发送）。", "ref.psi": "各类可变作用的组合值系数 ψ", "ref.simboli": "符号", "ref.titoloAsce": "所用公式与符号", "ref.titoloEc": "所用系数表", "rep.asce.assunzioni": "<strong>本工具的假定：</strong>本工具组合的是标量数值，这些数值必须全部针对同一个验算量；所输入的数值应当已经按对所考察验算最不利的方向表达。E<sub>v</sub> = 0.2·S<sub>DS</sub>·D 被并入 D 类作用的系数中，不施加于 F 类作用。对于 H 类荷载工况，其角色由设计人员在规范规定的三种情形中逐个选择：加大主效应的侧压力（Strength Design 取 1.6H，ASD 取 1.0H）、永久存在且起抗力作用的侧压力（0.9H / 0.6H），以及起抗力但非永久存在的侧压力，应取为零；所采用的角色已在上方连同荷载工况一并列出。各荷载工况对所考察情形是否适用，同样由设计人员负责：本工具只针对所输入的荷载类型展开公式规定的各个备选项，但并不知道某个荷载是否与该情景相关。§12.4.3 规定的 E<sub>mh</sub> 承载能力上限未予应用。含洪水荷载（F<sub>a</sub>，§2.3.2）、大气结冰（D<sub>i</sub>、W<sub>i</sub>，§2.3.3）以及自应力效应 T（§2.3.4 / §2.4.4）的组合均未生成。本工具生成的是荷载组合：它不能替代承载力验算，也不能替代荷载本身的确定。", "rep.asce.diff": "<strong>已采纳的 7-16 → 7-22 差别：</strong>地面雪荷载区划图已按风险类别重新标定到极限水平，因此在 Chapter 2 中，「或」括号不再作为一组整体提取系数，雪荷载各自带有自己的系数 — 1.6(L<sub>r</sub> 或 S 或 R) 变为 (1.6L<sub>r</sub> 或 1.0S 或 1.6R)，0.5(…) 变为 (0.5L<sub>r</sub> 或 0.3S 或 0.5R)；在 ASD 组合中雪荷载以 0.7S 出现。强度设计的地震组合中，伴随雪荷载由 0.2S 改为 0.15S。新引入龙卷风荷载 W<sub>T</sub>，仅在以风为主要作用的组合中作为 W 的替代项。", "rep.asce.fonti": "ASCE/SEI 7-16 与 ASCE/SEI 7-22，<em>Minimum Design Loads and Associated Criteria for Buildings and Other Structures</em>，Cap. 2（§2.3 Strength Design、§2.4 Allowable Stress Design）与 Cap. 12（§12.4 地震效应、§12.5 正交效应、Tab. 12.2-1 给出 Ω<sub>0</sub>）— International Building Code，§1605.2（ASD 替代组合）。龙卷风荷载 W<sub>T</sub> 由 ASCE 7-22 Cap. 32 引入。", "rep.asce.prov": "<strong>7-22 两项最新修订的出处：</strong>§2.4.5 组合 9 中的系数 0.1S（原为 0.75S）出自 ICC 关于 2024 IBC / ASCE 7-22 的官方报告以及 SEAU 关于 7-22 修订内容的报告；§2.3.1 中关于使用 W<sub>T</sub> 的例外 3 出自 NIST/FEMA 关于 ASCE 7-22 龙卷风荷载的指南。这两项都未在付费的 ASCE 正式文本上核对过：若项目有此要求，请对照官方正式文本核实。", "rep.avvertenza": "注意：", "rep.casiCarico": "荷载工况", "rep.coefNorma": "规范系数", "rep.coefParziali": "分项系数 γ（有利 / 不利）", "rep.coefPsi": "各类别的组合值系数 ψ", "rep.combGenerate": "所生成的组合", "rep.compSis": "地震分量", "rep.compSismiche": "地震分量", "rep.ec.assunzioni": "<strong>本工具的假定：</strong>本工具组合的是标量数值，这些数值必须全部针对同一个验算量；所输入的标准值应当已经按对所考察验算最不利的方向表达，而有利/不利的分类由设计人员针对每一项验算自行负责；预应力的分项系数 γP 取 1.0，除非另有专门评估（NTC 2018 §2.6.1）。本工具生成的是作用组合：它不能替代承载力验算，对于岩土验算也不能替代土体参数分项系数和抗力分项系数。", "rep.ec.fonti": "D.M. 17 gennaio 2018（NTC 2018），Cap. 2.5–2.6、Tab. 2.5.I 与 Tab. 2.6.I — EN 1990:2002+A1:2005（欧洲规范 0），Annex A1、Tab. A1.1 与 A1.2(B) — 等效几何缺陷见 EN 1993-1-1 §5.3。", "rep.ec.transizione": "向第二代欧洲规范（EN 1990:2023）的过渡正在进行中；截至目前，NTC 2018 在意大利仍是具有强制效力的依据。请务必核实自身规
