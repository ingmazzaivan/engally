  // ---------- Motore di calcolo ----------
  function gammaPermanente(tipo, sfav){
    if (state.normativa==='NTC2018'){
      var ap = approccioCorrente();
      if (tipo==='P') return 1.0;
      var t = ap[tipo];
      return sfav ? t.sfav : t.fav;
    } else {
      if (tipo==='P') return 1.0;
      var ap2 = approccioCorrente();
      return sfav ? ap2.Gsup : ap2.Ginf;
    }
  }
  function gammaQ(sfav){
    if (state.normativa==='NTC2018'){
      var ap = approccioCorrente();
      return sfav ? ap.Q.sfav : ap.Q.fav;
    }
    var ap2 = approccioCorrente();
    return sfav ? ap2.Q : 0;
  }

  // azId: identificatore univoco dell'azione, usato come chiave di colonna nella vista matrice
  // (il solo nome non basta: due azioni possono chiamarsi allo stesso modo).
  function termPerm(a, gamma){
    return { simbolo:'γ'+(a.tipo==='P'?'P':a.tipo)+'·'+a.nome, coef:gamma, nomeAz:a.nome, azId:'P'+a.id, valore:num(a.valore) };
  }
  function termVar(a, coef, psiLabel){
    var sim = psiLabel ? 'γQ·'+psiLabel+'·'+a.nome : 'γQ·'+a.nome;
    return { simbolo:sim, coef:coef, nomeAz:a.nome, azId:'V'+a.id, valore:num(a.valore) };
  }
  function termFisso(nome, valore){
    return { simbolo:nome, coef:1, nomeAz:nome, azId:nome, valore:num(valore) };
  }

  function calcTotale(terms){
    var tot = 0, missing = false;
    terms.forEach(function(t){
      if (t.valore===null){ missing = true; }
      else tot += t.coef * t.valore;
    });
    return missing ? null : tot;
  }
  // Unisce i termini gestendo correttamente i coefficienti negativi (es. −0,30·Ey)
  // invece di mostrare "+ -0,3".
  function joinSignedTerms(terms, mapFn){
    var out = '';
    terms.forEach(function(t, i){
      var neg = t.coef < 0;
      out += (i===0 ? (neg ? '−' : '') : (neg ? ' − ' : ' + ')) + mapFn(t, Math.abs(t.coef));
    });
    return out;
  }
  function formulaHtml(terms){
    return joinSignedTerms(terms, function(t, absCoef){ return fmtCoefT(absCoef)+' · '+escHtml(t.nomeAz); });
  }
  function substHtml(terms){
    return joinSignedTerms(terms, function(t, absCoef){ return fmtCoefT(absCoef)+' × '+(t.valore===null ? '—' : fmt(Math.abs(t.valore))); });
  }
  function escHtml(s){ return String(s==null||s==='' ? '?' : s).replace(/</g,'&lt;'); }

  // Raggruppa le azioni permanenti in "unità": le azioni con lo stesso nome di gruppo sono
  // della stessa origine (EN 1990 §6.4.3.2(4)) e prendono SEMPRE lo stesso verso — tutte
  // γ,sup oppure tutte γ,inf — quindi contano come una sola azione nella combinatoria.
  function permUnits(){
    var gruppi = {}, unita = [];
    state.permanenti.forEach(function(a){
      var g = (a.gruppo||'').trim();
      if (g){
        if (!gruppi[g]){ gruppi[g] = { nome:g, azioni:[] }; unita.push(gruppi[g]); }
        gruppi[g].azioni.push(a);
      } else {
        unita.push({ nome:null, azioni:[a] });
      }
    });
    return unita;
  }
  // Genera tutte le combinazioni favorevole/sfavorevole delle unità permanenti.
  // Se "permIndipendenti" è disattivato, restituisce una sola combinazione con tutte
  // le permanenti nel verso sfavorevole (comportamento a blocco unico).
  function permCombosGeneric(gammaFn){
    var unita = permUnits();
    var n = unita.length;
    var indip = state.permIndipendenti;
    var totalMasks = indip ? Math.pow(2, n) : 1;
    var out = [];
    for (var m=0; m<totalMasks; m++){
      var mask = indip ? m : (Math.pow(2, n) - 1); // blocco unico = tutte sfavorevoli
      var badges = [], terms = [];
      unita.forEach(function(u, idx){
        var sfav = !!(mask & (1<<idx));
        badges.push({ nome: u.nome ? u.nome+' ⋈' : u.azioni[0].nome, sfav:sfav });
        u.azioni.forEach(function(a){ terms.push(termPerm(a, gammaFn(a, sfav))); });
      });
      out.push({ terms:terms, badges: indip ? badges : [] });
    }
    return out;
  }
  function labelDominante(dom){
    if (!dom) return null;
    return state.variabili.length>1 ? t2('lbl.dominante', {nome:(dom.nome||'Q')}) : t('lbl.unicaVariabile');
  }
  // Le azioni variabili vengono organizzate in "slot" su due livelli, così da poter
  // esprimere anche strutture annidate (es. la neve su due falde, solidale al suo interno,
  // ma in alternativa al carico di esercizio):
  //   gruppo solidale  — azioni sempre attive insieme e con lo stesso ruolo: contano come
  //                      una sola azione distribuita su più casi di carico;
  //   gruppo esclusivo — unità alternative fra loro, al più una attiva per combinazione
  //                      (es. vento +X / −X); un'alternativa può essere un gruppo solidale.
  // I gruppi sono sempre rispettati, indipendentemente dal toggle "Variabili favorevoli/
  // sfavorevoli per singola azione"; quel toggle decide solo se le azioni possono anche
  // risultare escluse oppure se sono sempre attive.
  // Passo 1: le azioni con lo stesso "gruppo solidale" si fondono in un'unica unità.
  //          Un'azione senza gruppo solidale è un'unità da sola.
  function varUnits(){
    var sol = {}, ordine = [], unita = [];
    state.variabili.forEach(function(a){
      var g = (a.gruppoSol||'').trim();
      if (g){
        if (!sol[g]){ sol[g] = { azioni:[], esc:(a.gruppoEsc||'').trim() }; ordine.push(g); unita.push(sol[g]); }
        sol[g].azioni.push(a);
      } else {
        unita.push({ azioni:[a], esc:(a.gruppoEsc||'').trim() });
      }
    });
    return unita;
  }
  // Passo 2: le unità con lo stesso "gruppo esclusivo" condividono uno slot e diventano
  //          alternative fra loro. Così un gruppo solidale può a sua volta essere una delle
  //          alternative di un gruppo esclusivo (es. neve A+M insieme, in alternativa all'esercizio).
  function buildVarSlots(){
    var unita = varUnits();
    var esc = {}, ordineEsc = [], slots = [];
    unita.forEach(function(u){
      if (u.esc){
        if (!esc[u.esc]){ esc[u.esc] = []; ordineEsc.push(u.esc); }
        esc[u.esc].push(u);
      } else {
        slots.push(state.varIndipendenti ? { options:[{actions:[]},{actions:u.azioni}] } : { options:[{actions:u.azioni}] });
      }
    });
    ordineEsc.forEach(function(g){
      var alt = esc[g];
      if (alt.length<2){
        slots.push(state.varIndipendenti ? { options:[{actions:[]},{actions:alt[0].azioni}] } : { options:[{actions:alt[0].azioni}] });
        return;
      }
      // L'opzione "nessuna alternativa attiva" esiste solo se le variabili possono essere
      // escluse: con il toggle disattivato una delle alternative è sempre presente.
      var opts = state.varIndipendenti ? [{actions:[]}] : [];
      alt.forEach(function(u){ opts.push({actions:u.azioni}); });
      slots.push({ options:opts });
    });
    return slots;
  }
  // Mappa azione -> gruppo esclusivo della sua unità, per distinguere nei badge un'azione
  // omessa perché favorevole da una semplicemente non scelta fra le alternative del gruppo.
  function escGroupMap(){
    var m = {};
    varUnits().forEach(function(u){ u.azioni.forEach(function(a){ m[a.id] = u.esc || ''; }); });
    return m;
  }
  // Un gruppo solidale non può avere membri assegnati a gruppi esclusivi diversi: il motore
  // userebbe silenziosamente quello del primo membro. Qui li individuo per segnalarli.
  function gruppiIncoerenti(){
    var perSol = {}, out = [];
    state.variabili.forEach(function(a){
      var s = (a.gruppoSol||'').trim();
      if (!s) return;
      (perSol[s] = perSol[s] || []).push((a.gruppoEsc||'').trim());
    });
    Object.keys(perSol).forEach(function(s){
      var distinti = perSol[s].filter(function(v,i,arr){ return arr.indexOf(v)===i; });
      if (distinti.length>1) out.push({ sol:s, esc:distinti.map(function(e){ return e || t('lbl.nessunoParen'); }) });
    });
    return out;
  }
  // Prodotto cartesiano delle opzioni di ogni slot. Restituisce liste di BLOCCHI: ogni blocco
  // è l'insieme di azioni attivate da uno slot (una sola azione, o tutte quelle di un gruppo
  // solidale). Il blocco è l'unità che può assumere il ruolo di dominante.
  function cartesianActiveBlocks(slots){
    var results = [[]];
    slots.forEach(function(slot){
      var next = [];
      results.forEach(function(partial){
        slot.options.forEach(function(opt){
          next.push(opt.actions.length ? partial.concat([opt.actions]) : partial);
        });
      });
      results = next;
    });
    return results;
  }
  // Genera le combinazioni di ruolo (dominante / accompagnamento / esclusa) per le azioni
  // variabili, rispettando i gruppi di esclusione reciproca.
  // allowDominant=true  -> per ogni insieme di azioni attive, ciascuna a turno può essere la
  //                        dominante mentre le altre attive sono di accompagnamento; l'insieme
  //                        vuoto = tutte favorevoli/escluse.
  // allowDominant=false -> (eq. 6.10a, quasi permanente, sismica, eccezionale) nessuna
  //                        dominante: le azioni attive contribuiscono tutte allo stesso modo.
  function varRoleCombos(allowDominant){
    if (state.variabili.length===0) return [[]];
    var blockLists = cartesianActiveBlocks(buildVarSlots());
    var rows = [];
    blockLists.forEach(function(blocks){
      if (!allowDominant){
        var acc = [];
        blocks.forEach(function(b){ b.forEach(function(a){ acc.push({ action:a, role:'acc' }); }); });
        rows.push(acc);
        return;
      }
      if (blocks.length===0){ rows.push([]); return; }
      // la dominante ruota fra i BLOCCHI: un gruppo solidale diventa dominante per intero
      blocks.forEach(function(_, di){
        var r = [];
        blocks.forEach(function(b, bi){
          b.forEach(function(a){ r.push({ action:a, role: bi===di ? 'dom' : 'acc' }); });
        });
        rows.push(r);
      });
    });
    return rows;
  }
  // Costruisce i termini e i badge (per azione) a partire da un elenco di ruoli variabili.
  // gammaDomFn/gammaAccFn sono funzioni dell'azione, per poter usare coefficienti ψ
  // diversi da azione ad azione (es. ψ1/ψ2 nella combinazione frequente).
  function varTermsAndBadges(varCombo, gammaDomFn, gammaAccFn, accLabel){
    var terms = [];
    varCombo.forEach(function(v){
      if (v.role==='dom') terms.push(termVar(v.action, gammaDomFn(v.action), null));
      else terms.push(termVar(v.action, gammaAccFn(v.action), accLabel || 'ψ0'));
    });
    // Distinguo due motivi diversi per cui un'azione non compare nella combinazione:
    //   'alt' — appartiene a un gruppo esclusivo in cui è attiva un'altra alternativa,
    //           quindi è assente per incompatibilità fisica, non per convenienza;
    //   'esc' — è stata omessa perché il suo effetto sarebbe favorevole per la verifica.
    var escMap = escGroupMap(), gruppiAttivi = {};
    varCombo.forEach(function(v){ var g = escMap[v.action.id]; if (g) gruppiAttivi[g] = true; });
    var badges = state.variabili.map(function(a){
      var found = null;
      for (var i=0;i<varCombo.length;i++){ if (varCombo[i].action.id===a.id){ found = varCombo[i]; break; } }
      var kind;
      if (found) kind = found.role;
      else kind = (escMap[a.id] && gruppiAttivi[escMap[a.id]]) ? 'alt' : 'esc';
      return { nome:a.nome, kind:kind, accLabel: accLabel || 'ψ0' };
    });
    return { terms:terms, badges:badges };
  }
  function domEntryOf(varCombo){
    for (var i=0;i<varCombo.length;i++) if (varCombo[i].role==='dom') return varCombo[i].action;
    return null;
  }
  // Combinazione fondamentale SLU (NTC, o EC0 eq. 6.10 unica)
  function combiFondamentaleSemplice(){
    var permCombos = permCombosGeneric(function(a,sfav){ return gammaPermanente(a.tipo, sfav); });
    var varCombos = varRoleCombos(true);
    var rows = [];
    permCombos.forEach(function(pc){
      varCombos.forEach(function(vc){
        var vtb = varTermsAndBadges(vc, function(){ return gammaQ(true); }, function(a){ return gammaQ(true)*num(a.psi0||0); });
        var tag = null;
        if (!state.varIndipendenti){
          tag = labelDominante(domEntryOf(vc)) || (state.variabili.length===0 ? t('lbl.soloPermanenti') : null);
        }
        rows.push({ badges:pc.badges, varBadges: state.varIndipendenti ? vtb.badges : null, tag:tag, terms: pc.terms.concat(vtb.terms) });
      });
    });
    return rows;
  }
  // EC0 6.10a — variabili attive ridotte da ψ0, nessuna dominante
  function combi610a(){
    var ap = approccioCorrente();
    var permCombos = permCombosGeneric(function(a,sfav){ if (a.tipo==='P') return 1.0; return sfav ? ap.Gsup : ap.Ginf; });
    var varCombos = varRoleCombos(false);
    var rows = [];
    permCombos.forEach(function(pc){
      varCombos.forEach(function(vc){
        var vtb = varTermsAndBadges(vc, null, function(a){ return ap.Q*num(a.psi0||0); });
        rows.push({ badges:pc.badges, varBadges: state.varIndipendenti ? vtb.badges : null, tag:'Eq. 6.10a', terms: pc.terms.concat(vtb.terms) });
      });
    });
    return rows;
  }
  // EC0 6.10b — permanenti sfavorevoli ridotti da ξ, variabile dominante a valore pieno
  function combi610b(){
    var ap = approccioCorrente();
    var permCombos = permCombosGeneric(function(a,sfav){ if (a.tipo==='P') return 1.0; return sfav ? ap.xi*ap.Gsup : ap.Ginf; });
    var varCombos = varRoleCombos(true);
    var rows = [];
    permCombos.forEach(function(pc){
      varCombos.forEach(function(vc){
        var vtb = varTermsAndBadges(vc, function(){ return ap.Q; }, function(a){ return ap.Q*num(a.psi0||0); });
        var tag = 'Eq. 6.10b';
        if (!state.varIndipendenti){
          var domTag = labelDominante(domEntryOf(vc)) || (state.variabili.length===0 ? t('lbl.soloPermanenti') : null);
          if (domTag) tag += ' — '+domTag;
        }
        rows.push({ badges:pc.badges, varBadges: state.varIndipendenti ? vtb.badges : null, tag:tag, terms: pc.terms.concat(vtb.terms) });
      });
    });
    return rows;
  }
  // Combinazione minima (equilibrio / sollevamento): permanenti favorevoli, variabili nulle
  function combiMinima(){
    var terms = state.permanenti.map(function(a){ return termPerm(a, gammaPermanente(a.tipo,false)); });
    return [{ tag:t('tag.minima'), terms:terms }];
  }
  // SLE rara — leading a valore pieno, accompagnamento a ψ0, oppure esclusa (favorevole)
  function combiRara(){
    var permTerms = state.permanenti.map(function(a){ return termPerm(a,1); });
    var varCombos = varRoleCombos(true);
    return varCombos.map(function(vc){
      var vtb = varTermsAndBadges(vc, function(){ return 1; }, function(a){ return num(a.psi0||0); }, 'ψ0');
      var tag = state.varIndipendenti ? null : (labelDominante(domEntryOf(vc)) || (state.variabili.length===0 ? t('lbl.soloPermanenti') : null));
      return { varBadges: state.varIndipendenti ? vtb.badges : null, tag:tag, terms: permTerms.concat(vtb.terms) };
    });
  }
  // SLE frequente — leading a ψ1, accompagnamento a ψ2, oppure esclusa (favorevole)
  function combiFrequente(){
    var permTerms = state.permanenti.map(function(a){ return termPerm(a,1); });
    var varCombos = varRoleCombos(true);
    return varCombos.map(function(vc){
      var vtb = varTermsAndBadges(vc, function(a){ return num(a.psi1||0); }, function(a){ return num(a.psi2||0); }, 'ψ2');
      var tag = state.varIndipendenti ? null : (labelDominante(domEntryOf(vc)) || (state.variabili.length===0 ? t('lbl.soloPermanenti') : null));
      return { varBadges: state.varIndipendenti ? vtb.badges : null, tag:tag, terms: permTerms.concat(vtb.terms) };
    });
  }
  // SLE quasi permanente — nessuna dominante: ogni variabile è attiva a ψ2 oppure esclusa (favorevole)
  function combiQuasiPermanente(){
    var permTerms = state.permanenti.map(function(a){ return termPerm(a,1); });
    var varCombos = varRoleCombos(false);
    return varCombos.map(function(vc){
      var vtb = varTermsAndBadges(vc, null, function(a){ return num(a.psi2||0); }, 'ψ2');
      var tag = state.varIndipendenti ? null : t('lbl.tuttiPsi2');
      return { varBadges: state.varIndipendenti ? vtb.badges : null, tag:tag, terms: permTerms.concat(vtb.terms) };
    });
  }
  // Componenti dell'azione sismica effettivamente inserite (solo quelle valorizzate).
  function seismicComponents(){
    var defs = [ {key:'ex', label:'Ex'}, {key:'ey', label:'Ey'}, {key:'ez', label:'Ez'} ];
    var comps = [];
    defs.forEach(function(d){
      var v = num(state.sismica[d.key]);
      if (v !== null) comps.push({ label:d.label, valore:v });
    });
    return comps;
  }
  // Se la regola del 30% non è attiva (o c'è una sola componente), ogni componente
  // sismica inserita viene considerata singolarmente, con le due combinazioni ±E,
  // senza sommarla alle altre.
  // Se la regola del 30% è attiva (NTC 2018 §7.3.5) e ci sono 2+ componenti: a
  // rotazione una assume coefficiente 1,00 e le altre 0,30, con tutte le combinazioni
  // di segno.
  function seismicRows(){
    var comps = seismicComponents();
    var n = comps.length;
    if (n===0) return [];
    if (n===1 || !state.sismica.regola30){
      var simple = [];
      comps.forEach(function(c){
        [1,-1].forEach(function(sign){
          simple.push({ terms:[{ coef:sign, nomeAz:c.label, azId:c.label, valore:c.valore }], tag:(sign<0?'−':'+')+c.label });
        });
      });
      return simple;
    }
    var rows = [];
    for (var dom=0; dom<n; dom++){
      var signCount = Math.pow(2, n);
      for (var s=0; s<signCount; s++){
        var terms = [], tagParts = [];
        for (var i=0;i<n;i++){
          var coefAbs = (i===dom) ? 1.00 : 0.30;
          var sign = (s & (1<<i)) ? -1 : 1;
          terms.push({ coef: coefAbs*sign, nomeAz: comps[i].label, azId: comps[i].label, valore: comps[i].valore });
          tagParts.push((sign<0?'−':'+')+comps[i].label+'·'+fmtG(coefAbs));
        }
        rows.push({ terms:terms, tag: tagParts.join(' ') });
      }
    }
    return rows;
  }
  // Sismica — nessuna dominante tra le variabili: ognuna è attiva a ψ2 oppure esclusa (favorevole).
  // Le componenti sismiche stesse sono combinate con la regola del 30% quando ne sono inserite 2 o più.
  function combiSismica(){
    var seisRows = seismicRows();
    if (seisRows.length===0) seisRows = [{ terms:[], tag:null }];
    var permTerms = state.permanenti.map(function(a){ return termPerm(a,1); });
    var varCombos = varRoleCombos(false);
    var rows = [];
    seisRows.forEach(function(sr){
      varCombos.forEach(function(vc){
        var vtb = varTermsAndBadges(vc, null, function(a){ return num(a.psi2||0); }, 'ψ2');
        rows.push({ varBadges: state.varIndipendenti ? vtb.badges : null, tag: sr.tag, terms: sr.terms.concat(permTerms).concat(vtb.terms) });
      });
    });
    return rows;
  }
  // Eccezionale.
  // NTC 2018 eq. 2.5.6: nessuna dominante, tutte le variabili a ψ2 (unica forma prevista dalla norma italiana).
  // EN 1990 offre invece due varianti (Annex A1, nota sotto eq. 6.11a/6.11b): la 6.11b (equivalente alla NTC,
  // usata "dopo" l'evento accidentale) oppure la 6.11a, in cui la variabile dominante è a ψ1 anziché ψ2
  // (usata "durante" l'evento, es. verifica in corso d'incendio). L'opzione è selezionabile solo in
  // modalità EC0 generico, dove la scelta è demandata al progettista in base alla situazione considerata.
  function combiEccezionale(){
    var useDom = state.normativa==='EC0' && !!state.eccezionale.domPsi1;
    var adTerm = termFisso('Ad', state.eccezionale.valore);
    var permTerms = state.permanenti.map(function(a){ return termPerm(a,1); });
    var varCombos = varRoleCombos(useDom);
    return varCombos.map(function(vc){
      var vtb = useDom
        ? varTermsAndBadges(vc, function(a){ return num(a.psi1||0); }, function(a){ return num(a.psi2||0); }, 'ψ2')
        : varTermsAndBadges(vc, null, function(a){ return num(a.psi2||0); }, 'ψ2');
      var tag;
      if (useDom){
        tag = 'Eq. 6.11a';
        if (!state.varIndipendenti){
          var domTag = labelDominante(domEntryOf(vc)) || (state.variabili.length===0 ? t('lbl.soloPermanenti') : null);
          if (domTag) tag += ' — '+domTag;
        }
      } else {
        tag = state.varIndipendenti ? null : t('lbl.eccNtc');
      }
      return { varBadges: state.varIndipendenti ? vtb.badges : null, tag:tag, terms: [adTerm].concat(permTerms).concat(vtb.terms) };
    });
  }

  // Espande un insieme di combinazioni con tutte le alternative di verso delle azioni a
  // doppio segno: ognuna entra in OGNI combinazione, con il proprio coefficiente e segno ±.
  // n azioni a doppio segno moltiplicano per 2ⁿ il numero di combinazioni.
  // kind: 'slu' usa il coefficiente SLU, 'sle' quello per esercizio/sismica/eccezionale.
  function doppioSegnoAttive(){
    // Come permanenti/variabili: ogni azione a doppio segno inserita dall'utente entra
    // SEMPRE nella matrice/combinazioni (colonna con il proprio coefficiente ±), anche
    // senza un valore numerico — il valore mancante fa comparire "—"/mancante nel
    // risultato totale (calcTotale), non l'esclusione dell'azione dalla matrice.
    return state.doppioSegno;
  }
  function espandiDoppioSegno(rows, kind){
    var list = doppioSegnoAttive();
    if (!list.length) return rows;
    var patterns = [[]];
    list.forEach(function(a){
      var next = [];
      patterns.forEach(function(p){
        next.push(p.concat([{az:a, segno:1}]));
        next.push(p.concat([{az:a, segno:-1}]));
      });
      patterns = next;
    });
    var out = [];
    rows.forEach(function(r){
      patterns.forEach(function(p){
        var extra = p.map(function(e){
          var c = num(kind==='slu' ? e.az.coefSLU : e.az.coefSLE);
          if (c===null) c = 1;
          return { simbolo:e.az.nome, coef:e.segno*c, nomeAz:e.az.nome, azId:'D'+e.az.id, valore:num(e.az.valore) };
        });
        var tagDs = p.map(function(e){ return (e.segno<0?'−':'+')+(e.az.nome||'±'); }).join(' ');
        out.push({
          badges: r.badges, varBadges: r.varBadges,
          tag: r.tag ? (r.tag+' · '+tagDs) : tagDs,
          terms: r.terms.concat(extra)
        });
      });
    });
    return out;
  }

  // ---------- Render risultati ----------
  function permBadgesHtml(badges){
    if (!badges || !badges.length) return '';
    return badges.map(function(b){
      return '<span class="pill '+(b.sfav?'pill-sfav':'pill-fav')+'">'+escHtml(b.nome)+' '+t(b.sfav?'badge.sfav':'badge.fav')+'</span>';
    }).join('');
  }
  function varBadgesHtml(badges){
    if (!badges || !badges.length) return '';
    return badges.map(function(b){
      var cls, txt;
      if (b.kind==='dom'){ cls='pill-sfav'; txt=' '+t('badge.dom'); }
      else if (b.kind==='acc'){ cls='pill-acc'; txt=' '+b.accLabel; }
      else if (b.kind==='alt'){ cls='pill-alt'; txt=' '+t('badge.alt'); }
      else { cls='pill-fav'; txt=' '+t('badge.omessa'); }
      return '<span class="pill '+cls+'">'+escHtml(b.nome)+txt+'</span>';
    }).join('');
  }
  function comboCardHtml(c, chipType){
    var tot = calcTotale(c.terms);
    var resultHtml = tot===null
      ? '<span class="missing">'+t('msg.valoriMancanti')+'</span>'
      : fmt(tot)+' '+escHtml(state.unita);
    var cls = chipType==='max' ? ' governs-max' : (chipType==='min' ? ' governs-min' : '');
    var chipHtml = chipType==='max' ? '<span class="chip ok">'+t('chip.max')+'</span>' : (chipType==='min' ? '<span class="chip">'+t('chip.min')+'</span>' : '');
    return '' +
    '<div class="combo'+cls+'">' +
      '<header>' + permBadgesHtml(c.badges) + varBadgesHtml(c.varBadges) + (c.tag ? '<span class="tag">'+escHtml(c.tag)+'</span>' : '') + chipHtml + '</header>' +
      '<div class="formula mono">'+formulaHtml(c.terms)+'</div>' +
      '<div class="subst mono">'+substHtml(c.terms)+'</div>' +
      '<div class="result">'+resultHtml+'</div>' +
    '</div>';
  }
  function markMinMax(list){
    var maxV=-Infinity, minV=Infinity, maxI=-1, minI=-1;
    list.forEach(function(c,i){
      var t = calcTotale(c.terms);
      if (t!==null){
        if (t>maxV){ maxV=t; maxI=i; }
        if (t<minV){ minV=t; minI=i; }
      }
    });
    return { maxI:maxI, minI: (minI===maxI ? -1 : minI) };
  }
  // ---------- Vista matrice (righe = combinazioni, colonne = casi di carico) ----------
  // Ordine canonico delle colonne: azioni permanenti, azioni variabili (nell'ordine in cui
  // l'utente le ha inserite), azioni a doppio segno, componenti sismiche, azione eccezionale.
  function canonicalColumns(){
    var cols = [];
    if (isAsce()){
      state.asceAzioni.forEach(function(a){ cols.push({ id:'A'+a.id, label:(a.nome||a.tipo)+' ['+a.tipo+']' }); });
      asceQEcomp().forEach(function(c){ cols.push({ id:c.key, label:c.key }); });
      return cols;
    }
    state.permanenti.forEach(function(a){ cols.push({ id:'P'+a.id, label:a.nome||('G'+a.id) }); });
    state.variabili.forEach(function(a){ cols.push({ id:'V'+a.id, label:a.nome||('Q'+a.id) }); });
    state.doppioSegno.forEach(function(a){ cols.push({ id:'D'+a.id, label:a.nome||('±'+a.id) }); });
    seismicComponents().forEach(function(c){ cols.push({ id:c.label, label:c.label }); });
    cols.push({ id:'Ad', label:'Ad' });
    return cols;
  }
  // Solo le colonne che compaiono davvero in almeno una combinazione della sezione.
  function columnsUsed(rows){
    var used = {};
    rows.forEach(function(r){ r.terms.forEach(function(t){ used[t.azId] = true; }); });
    return canonicalColumns().filter(function(c){ return used[c.id]; });
  }
  // I coefficienti sono prodotti di γ e ψ (es. 0,85·1,35 = 1,1475): li arrotondo a 4 decimali
  // per non perdere precisione nell'esportazione, togliendo gli zeri non significativi.
  function fmtCoef(n){
    if (n===0) return '0';
    var s = (Math.round(n*10000)/10000).toString();
    return state.decimale===',' ? s.replace('.',',') : s;
  }
  function fmtRis(n){
    var s = (Math.round(n*100)/100).toString();
    return state.decimale===',' ? s.replace('.',',') : s;
  }
  function matrixData(rows, prefix){
    var cols = columnsUsed(rows);
    var pad = String(rows.length).length;
    return {
      cols: cols,
      rows: rows.map(function(r, i){
        var byId = {};
        r.terms.forEach(function(t){ byId[t.azId] = (byId[t.azId]||0) + t.coef; });
        var n = String(i+1); while (n.length<pad) n = '0'+n;
        return {
          id: prefix+'_'+n,
          coefs: cols.map(function(c){ return (c.id in byId) ? byId[c.id] : 0; }),
          tot: calcTotale(r.terms)
        };
      })
    };
  }
  var MATRIX_CAP = 500;
  function matrixTableHtml(md){
    var head = '<tr><th>'+t('col.combinazione')+'</th>' +
      md.cols.map(function(c){ return '<th>'+escHtml(c.label)+'</th>'; }).join('') +
      '<th>'+t('col.risultato')+' ['+escHtml(state.unita)+']</th></tr>';
    var shown = md.rows.length>MATRIX_CAP ? md.rows.slice(0, MATRIX_CAP) : md.rows;
    var body = shown.map(function(r){
      return '<tr><td>'+escHtml(r.id)+'</td>' +
        r.coefs.map(function(v){ return '<td'+(v===0?' class="zero"':'')+'>'+fmtCoef(v)+'</td>'; }).join('') +
        '<td class="res">'+(r.tot===null ? '—' : fmtRis(r.tot))+'</td></tr>';
    }).join('');
    return '<div class="matrixwrap"><table class="matrix"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
  }
  // TSV: incolla direttamente in Excel (una cella per colonna) o nei SW FEM che importano testo tabulato.
  // Esporta SEMPRE tutte le righe, anche quando la tabella a video è troncata.
  function matrixTsv(md){
    var lines = [ [t('col.combinazione')].concat(md.cols.map(function(c){ return c.label; })).concat([t('col.risultato')+' ['+state.unita+']']).join('\t') ];
    md.rows.forEach(function(r){
      lines.push([r.id].concat(r.coefs.map(function(v){ return fmtCoef(v); })).concat([r.tot===null ? '' : fmtRis(r.tot)]).join('\t'));
    });
    return lines.join('\n');
  }
  var tsvStore = {}, tsvSeq = 0;
  function copyText(txt, btn){
    var old = btn.getAttribute('data-label') || btn.textContent;
    btn.setAttribute('data-label', old);
    function ok(){
      btn.textContent = t('btn.copiato'); btn.classList.add('done');
      setTimeout(function(){ btn.textContent = old; btn.classList.remove('done'); }, 1800);
    }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = txt; ta.setAttribute('readonly','');
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      var done = false;
      try{ done = document.execCommand('copy'); }catch(err){ done = false; }
      document.body.removeChild(ta);
      if (done) ok();
      else {
        btn.textContent = t('btn.copiaBloccata');
        setTimeout(function(){ btn.textContent = old; }, 2600);
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok, fallback);
    } else fallback();
  }

  // Costruisce una sezione: se ci sono più di 4 combinazioni, evidenzia massimo/minimo
  // in cima e racchiude l'elenco completo in un pannello richiudibile.
  function sectionHtml(title, eqRef, note, rows, idPrefix){
    if (!rows.length) return '';
    var mm = rows.length>1 ? markMinMax(rows) : { maxI:-1, minI:-1 };
    var summaryLine = '';
    if (rows.length>1 && (mm.maxI>=0 || mm.minI>=0)){
      var maxTxt = mm.maxI>=0 ? fmt(calcTotale(rows[mm.maxI].terms))+' '+escHtml(state.unita) : '—';
      var minTxt = mm.minI>=0 ? fmt(calcTotale(rows[mm.minI].terms))+' '+escHtml(state.unita) : (mm.maxI>=0 ? maxTxt : '—');
      summaryLine = '<div class="summary-line">'+t2('sec.sintesi', {n:rows.length, max:maxTxt, min:minTxt})+'</div>';
    }
    var body;
    if (state.vista==='matrice'){
      var md = matrixData(rows, idPrefix || 'CMB');
      var key = 'tsv'+(++tsvSeq);
      tsvStore[key] = matrixTsv(md);
      var truncNote = md.rows.length > MATRIX_CAP
        ? '<div class="note">'+t2('nota.troncMatrice', {cap:MATRIX_CAP, tot:md.rows.length})+'</div>'
        : '';
      body = '<div class="matrixhead">' +
               '<button class="copybtn" data-tsv="'+key+'">'+t('btn.copiaTsv')+'</button>' +
               '<span class="hint">'+t('hint.matrice')+'</span>' +
             '</div>' + matrixTableHtml(md) + truncNote;
    } else {
      var RENDER_CAP = 300;
      var toRender = rows.length > RENDER_CAP ? rows.slice(0, RENDER_CAP) : rows;
      var listBody = toRender.map(function(r,i){
        var chip = i===mm.maxI ? 'max' : (i===mm.minI ? 'min' : null);
        return comboCardHtml(r, chip);
      }).join('');
      if (rows.length > RENDER_CAP){
        listBody += '<div class="note">'+t2('nota.troncElenco', {cap:RENDER_CAP, tot:rows.length})+'</div>';
      }
      if (rows.length>4){
        var highlights = '';
        if (mm.maxI>=0) highlights += comboCardHtml(rows[mm.maxI], 'max');
        if (mm.minI>=0) highlights += comboCardHtml(rows[mm.minI], 'min');
        body = highlights + '<details class="combolist"><summary>'+t2('btn.mostraTutte', {n:rows.length})+'</summary>'+listBody+'</details>';
      } else {
        body = listBody;
      }
    }
    return '' +
    '<section class="card">' +
      '<header><h2>'+title+'</h2><span class="eq-ref mono">'+eqRef+'</span></header>' +
      (note ? '<div class="note">'+note+'</div>' : '') +
      summaryLine +
      body +
    '</section>';
  }

  // ============================================================================
  // Motore ASCE 7 — struttura completamente diversa da quella EC0/NTC.
  // EC0 è GENERATIVO: una regola (γG·G + γQ·Qk1 + Σ γQ·ψ0·Qki) e una variabile dominante
  // che ruota. ASCE 7 è una LISTA FISSA di equazioni: la concomitanza è già scritta dentro
  // l'equazione, non esiste azione dominante e non esistono i coefficienti ψ.
  // Qui l'unica combinatoria è l'espansione delle parentesi "or" e dei segni del sisma.
  // ============================================================================
  function isAsce(){ return state.normativa==='ASCE722' || state.normativa==='ASCE716'; }
  function asce22(){ return state.normativa==='ASCE722'; }
  function asceEdLabel(){ return asce22() ? 'ASCE/SEI 7-22' : 'ASCE/SEI 7-16'; }
  // Il perimetro va dichiarato: il Chapter 2 contiene anche §2.3.2/§2.4.2 alluvione,
  // §2.3.3/§2.4.3 ghiaccio atmosferico, §2.3.4/§2.4.4 effetti autotensionanti,
  // §2.3.5 carichi non specificati, §2.5 eventi straordinari e §2.6 integrità strutturale,
  // che questo strumento NON genera. Scrivere solo "ASCE 7-22" farebbe pensare il contrario.
  function asceEdLabelFull(){ return asceEdLabel() + ' — ' + t('sub.ascePerimetro'); }

  var ASCE_TIPI = [
    {t:'D', lk:'tipo.D'},
    {t:'L', lk:'tipo.L'},
    {t:'Lr', lk:'tipo.Lr'},
    {t:'S', lk:'tipo.S'},
    {t:'R', lk:'tipo.R'},
    {t:'W', lk:'tipo.W'},
    {t:'Wt', lk:'tipo.Wt'},
    {t:'F', lk:'tipo.F'},
    {t:'H', lk:'tipo.H'}
  ];
  function asceTipoLabel(tp){
    // La neve va etichettata per edizione: in 7-16 S è il valore nominale, in 7-22 è già a
    // livello ultimo e nelle combinazioni porta coefficienti propri. Chi importa i carichi
    // da un modello FEM deve sapere quale dei due sta inserendo.
    if (tp==='S') return t(asce22() ? 'tipo.S.22' : 'tipo.S.16');
    for (var i=0;i<ASCE_TIPI.length;i++) if (ASCE_TIPI[i].t===tp) return lab(ASCE_TIPI[i]);
    return tp;
  }
  function asceAzioniDi(t){ return state.asceAzioni.filter(function(a){ return a.tipo===t; }); }
  function asceTipoPresente(t){ return asceAzioniDi(t).length>0; }
  function asceTerm(a, c){
    var nome = a.nome || a.tipo;
    return { simbolo:fmtCoefT(c)+'·'+nome, coef:c, nomeAz:nome, azId:'A'+a.id, valore:num(a.valore) };
  }

  // Un'equazione è una lista di GRUPPI; ogni gruppo è una lista di ALTERNATIVE (una sola
  // alternativa = termine fisso); ogni alternativa è una lista di coppie [coefficiente, tipo].
  // In 7-22 le parentesi non sono più fattorizzate come gruppo — la neve è già a livello
  // ultimo — quindi ogni alternativa porta il proprio coefficiente: (0,5Lr | 0,3S | 0,5R).
  function asceEqSet(metodo){
    var e22 = asce22(), eqs = [];
    function p(c,t){ return [c,t]; }
    function f(){ return [ Array.prototype.slice.call(arguments) ]; }
    function alt(){ return Array.prototype.slice.call(arguments); }
    function eq(n, g, o){ o = o || {}; o.n = n; o.g = g; eqs.push(o); }

    if (metodo==='LRFD'){
      if (e22){
        eq('1a', [ f(p(1.4,'D')) ]);
        eq('2a', [ f(p(1.2,'D')), f(p(1.6,'L')), alt([p(0.5,'Lr')],[p(0.3,'S')],[p(0.5,'R')]) ]);
        eq('3a', [ f(p(1.2,'D')), alt([p(1.6,'Lr')],[p(1.0,'S')],[p(1.6,'R')]), alt([p(1.0,'L')],[p(0.5,'W')]) ], {lExc:true});
        eq('4a', [ f(p(1.2,'D')), alt([p(1.0,'W')],[p(1.0,'Wt')]), f(p(1.0,'L')), alt([p(0.5,'Lr')],[p(0.3,'S')],[p(0.5,'R')]) ], {lExc:true, tornadoExc:true});
        eq('5a', [ f(p(0.9,'D')), alt([p(1.0,'W')],[p(1.0,'Wt')]) ]);
      } else {
        eq('1', [ f(p(1.4,'D')) ]);
        eq('2', [ f(p(1.2,'D')), f(p(1.6,'L')), alt([p(0.5,'Lr')],[p(0.5,'S')],[p(0.5,'R')]) ]);
        eq('3', [ f(p(1.2,'D')), alt([p(1.6,'Lr')],[p(1.6,'S')],[p(1.6,'R')]), alt([p(1.0,'L')],[p(0.5,'W')]) ], {lExc:true});
        eq('4', [ f(p(1.2,'D')), f(p(1.0,'W')), f(p(1.0,'L')), alt([p(0.5,'Lr')],[p(0.5,'S')],[p(0.5,'R')]) ], {lExc:true});
        eq('5', [ f(p(0.9,'D')), f(p(1.0,'W')) ]);
      }
    } else {
      if (e22){
        eq('1a', [ f(p(1.0,'D')) ]);
        eq('2a', [ f(p(1.0,'D')), f(p(1.0,'L')) ]);
        eq('3a', [ f(p(1.0,'D')), alt([p(1.0,'Lr')],[p(0.7,'S')],[p(1.0,'R')]) ]);
        eq('4a', [ f(p(1.0,'D')), f(p(0.75,'L')), alt([p(0.75,'Lr')],[p(0.525,'S')],[p(0.75,'R')]) ]);
        eq('5a', [ f(p(1.0,'D')), alt([p(0.6,'W')],[p(0.6,'Wt')]) ]);
        eq('6a', [ f(p(1.0,'D')), f(p(0.75,'L')), alt([p(0.45,'W')],[p(0.45,'Wt')]), alt([p(0.75,'Lr')],[p(0.525,'S')],[p(0.75,'R')]) ], {tornadoExc:true});
        eq('7a', [ f(p(0.6,'D')), alt([p(0.6,'W')],[p(0.6,'Wt')]) ]);
      } else {
        eq('1', [ f(p(1.0,'D')) ]);
        eq('2', [ f(p(1.0,'D')), f(p(1.0,'L')) ]);
        eq('3', [ f(p(1.0,'D')), alt([p(1.0,'Lr')],[p(1.0,'S')],[p(1.0,'R')]) ]);
        eq('4', [ f(p(1.0,'D')), f(p(0.75,'L')), alt([p(0.75,'Lr')],[p(0.75,'S')],[p(0.75,'R')]) ]);
        eq('5', [ f(p(1.0,'D')), f(p(0.6,'W')) ]);
        eq('6', [ f(p(1.0,'D')), f(p(0.75,'L')), f(p(0.45,'W')), alt([p(0.75,'Lr')],[p(0.75,'S')],[p(0.75,'R')]) ]);
        eq('7', [ f(p(0.6,'D')), f(p(0.6,'W')) ]);
      }
    }
    return eqs;
  }

  // Scrittura leggibile di un'equazione: il coefficiente unitario si omette, come nella norma
  // (si scrive "D + L", non "1D + 1L").
  function asceEqTxt(eq){
    return eq.g.map(function(g){
      var parts = g.map(function(a){
        return a.map(function(pr){ return (pr[0]===1 ? '' : fmtCoefT(pr[0]))+pr[1]; }).join(' + ');
      });
      return parts.length>1 ? '('+parts.join(' '+t('cong.oppure')+' ')+')' : parts[0];
    }).join(' + ');
  }
  // UNICA fonte per le combinazioni sismiche: da questa struttura derivano SIA il testo
  // mostrato a video e nel report SIA i coefficienti effettivamente usati nel calcolo.
  // Tenerle separate significava avere due trascrizioni della norma che potevano divergere.
  //   dBase   coefficiente del permanente scritto nell'equazione
  //   evSign  E_v sommato (+1) o sottratto (−1)
  //   k       fattore che scala l'intero effetto sismico E (1 allo Strength Design;
  //           0,7 ≈ 1/1,4 all'ASD per passare a livello di esercizio, 0,525 = 0,75·0,7
  //           dove agisce anche la riduzione 0,75 sui carichi di accompagnamento)
  //   extra   altri carichi dell'equazione, con il proprio coefficiente
  function asceSpecSismiche(metodo){
    if (metodo==='ASD'){
      var snowASD = asce22() ? 0.1 : 0.75;
      return [
        { n:'8',  dBase:1.0, evSign: 1, k:0.7,   extra:{} },
        { n:'9',  dBase:1.0, evSign: 1, k:0.525, extra:{ L:0.75, S:snowASD } },
        { n:'10', dBase:0.6, evSign:-1, k:0.7,   extra:{} }
      ];
    }
    var snowLR = asce22() ? 0.15 : 0.2;
    return [
      { n:'6', dBase:1.2, evSign: 1, k:1, extra:{ L:1.0, S:snowLR } },
      { n:'7', dBase:0.9, evSign:-1, k:1, extra:{} }
    ];
  }
  function asceSpecTxt(sp, simboloEh){
    var kk = sp.k===1 ? '' : fmtCoefT(sp.k);
    var t = (sp.dBase===1 ? 'D' : fmtCoefT(sp.dBase)+'D');
    t += (sp.evSign>0 ? ' + ' : ' − ') + kk + 'E_v';
    t += ' + ' + kk + (simboloEh || 'E_h');
    Object.keys(sp.extra).forEach(function(x){
      t += ' + ' + (sp.extra[x]===1 ? '' : fmtCoefT(sp.extra[x])) + x;
    });
    return t;
  }
  function asceEqSismiche(m, simboloEh){
    return asceSpecSismiche(m).map(function(sp){ return [sp.n, asceSpecTxt(sp, simboloEh)]; });
  }

  // Coefficiente di D scritto nell'equazione (serve anche per F, che per la nota al §2.3.1
  // prende lo stesso fattore del permanente).
  function asceCoefD(eq){
    var c = 0;
    eq.g.forEach(function(g){
      if (g.length===1) g[0].forEach(function(pr){ if (pr[1]==='D') c = pr[0]; });
    });
    return c;
  }
  // §2.3.1 / §2.4.1, note su H. La norma distingue TRE casi, non due:
  //  - H accresce l'effetto principale        → 1,6H (LRFD) / 1,0H (ASD)
  //  - H è PERMANENTE e resiste all'effetto   → 0,9H (LRFD) / 0,6H (ASD)
  //  - H resiste ma non è permanente          → H = 0 (non entra in combinazione)
  function asceCoefH(metodo, ruolo){
    if (ruolo==='zero') return 0;
    if (ruolo==='resist') return metodo==='ASD' ? 0.6 : 0.9;
    return metodo==='ASD' ? 1.0 : 1.6;
  }
  var ASCE_RUOLI_H = [
    {v:'sfav',   lk:'ruoloH.sfav'},
    {v:'resist', lk:'ruoloH.resist'},
    {v:'zero',   lk:'ruoloH.zero'}
  ];
  function asceRuoloH(a){ return (a.ruolo==='resist' || a.ruolo==='zero') ? a.ruolo : 'sfav'; }
  // Aggiunge i termini H alla lista, ciascuno con il fattore del proprio ruolo.
  function asceAddH(terms, metodo){
    asceAzioniDi('H').forEach(function(a){
      var c = asceCoefH(metodo, asceRuoloH(a));
      if (c!==0) terms.push(asceTerm(a, c));
    });
  }

  // Espansione delle parentesi: prodotto cartesiano delle alternative, scartando quelle
  // che rimandano a tipi di carico non inseriti (altrimenti si generano doppioni vuoti).
  function asceExpand(eq){
    var groups = [];
    eq.g.forEach(function(g){
      var disp = g.filter(function(a){
        return a.some(function(pr){ return asceTipoPresente(pr[1]); });
      });
      if (disp.length) groups.push(disp);
    });
    var out = [[]];
    groups.forEach(function(g){
      var next = [];
      out.forEach(function(acc){ g.forEach(function(a){ next.push(acc.concat([a])); }); });
      out = next;
    });
    if (eq.tornadoExc){
      // Eccezione tornado: dove si usa Wt la neve esce dalla combinazione (fenomeno di
      // stagione calda). ATTENZIONE: le fonti consultate divergono sulla formulazione
      // esatta — vedi la nota nella sezione e nel report.
      out = out.filter(function(choice){
        var hasWt = false, hasS = false;
        choice.forEach(function(a){ a.forEach(function(pr){
          if (pr[1]==='Wt') hasWt = true;
          if (pr[1]==='S') hasS = true;
        }); });
        return !(hasWt && hasS);
      });
    }
    return out;
  }

  function asceRowsFromEq(eq, metodo){
    var cD = asceCoefD(eq);
    return asceExpand(eq).map(function(choice){
      var pairs = [];
      choice.forEach(function(a){ a.forEach(function(pr){ pairs.push(pr); }); });
      // §2.3.1 Eccezione 1: il fattore su L nelle combinazioni 3 e 4 può valere 0,5.
      if (eq.lExc && state.asce.lRidotta){
        pairs = pairs.map(function(pr){ return (pr[1]==='L' && pr[0]===1.0) ? [0.5,'L'] : pr; });
      }
      var terms = [];
      pairs.forEach(function(pr){
        asceAzioniDi(pr[1]).forEach(function(a){ terms.push(asceTerm(a, pr[0])); });
      });
      asceAzioniDi('F').forEach(function(a){ if (cD) terms.push(asceTerm(a, cD)); });
      asceAddH(terms, metodo);
      return { terms:terms, tag:eq.n };
    });
  }

  // ---- Sisma ASCE: E non è un dato unico, si compone di Eh = ρ·QE ed Ev = 0,2·SDS·D ----
  function asceEv(){
    if (state.asce.evZero) return 0;
    var s = num(state.asce.sds);
    return s===null ? 0 : 0.2*s;
  }
  function asceRho(){ var r = num(state.asce.rho); return r===null ? 1.0 : r; }
  function asceQEcomp(){
    var out = [];
    if (num(state.asce.qex)!==null) out.push({ key:'QEx', valore:num(state.asce.qex) });
    if (num(state.asce.qey)!==null) out.push({ key:'QEy', valore:num(state.asce.qey) });
    return out;
  }
  // Segni e, se richiesto, combinazione ortogonale 100/30 (§12.5.3).
  function asceSeismicPatterns(){
    var comp = asceQEcomp();
    if (!comp.length) return [];
    var pats = [];
    if (comp.length===1 || !state.asce.orto30){
      comp.forEach(function(c){
        [1,-1].forEach(function(s){ var p = {}; p[c.key] = s; pats.push(p); });
      });
    } else {
      comp.forEach(function(dom){
        var others = comp.filter(function(c){ return c.key!==dom.key; });
        [1,-1].forEach(function(sd){
          [1,-1].forEach(function(so){
            var p = {}; p[dom.key] = sd;
            others.forEach(function(o){ p[o.key] = so*0.3; });
            pats.push(p);
          });
        });
      });
    }
    return pats;
  }
  function asceQEval(key){
    var comp = asceQEcomp();
    for (var i=0;i<comp.length;i++) if (comp[i].key===key) return comp[i].valore;
    return null;
  }
  function asceSeismicRows(metodo, useOmega){
    var om = num(state.asce.omega);
    if (useOmega && om===null) return [];
    var fatt = useOmega ? om : asceRho();
    var ev = asceEv();
    // I coefficienti si ricavano dalla stessa struttura che genera il testo delle equazioni.
    var specs = asceSpecSismiche(metodo).map(function(sp){
      return {
        n:   sp.n,
        cD:  sp.dBase + sp.evSign * sp.k * ev,  // E_v = 0,2·S_DS·D confluisce nel coefficiente di D
        cF:  sp.dBase,                          // E_v non si applica ai fluidi
        cQE: sp.k * fatt,                       // E_h = ρ·Q_E (oppure Ω₀·Q_E)
        extra: sp.extra
      };
    });
    var pats = asceSeismicPatterns(), rows = [];
    var simb = useOmega ? 'Ω₀' : 'ρ';
    specs.forEach(function(sp){
      pats.forEach(function(pat){
        var terms = [];
        asceAzioniDi('D').forEach(function(a){ terms.push(asceTerm(a, sp.cD)); });
        Object.keys(sp.extra).forEach(function(t){
          asceAzioniDi(t).forEach(function(a){ terms.push(asceTerm(a, sp.extra[t])); });
        });
        asceAzioniDi('F').forEach(function(a){ terms.push(asceTerm(a, sp.cF)); });
        asceAddH(terms, metodo);
        Object.keys(pat).forEach(function(k){
          var v = asceQEval(k);
          if (v===null) return;
          terms.push({ simbolo:simb+'·'+k, coef:sp.cQE*pat[k], nomeAz:k, azId:k, valore:v });
        });
        rows.push({ terms:terms, tag: sp.n + (useOmega ? ' · Ω₀' : '') });
      });
    });
    return rows;
  }

  // ---- Combinazioni ASD alternative dell'IBC (§1605.2) ----
  // Il fattore ω è stato ELIMINATO dall'IBC 2021: il vento entra come 0,6W e basta.
  // L'edizione IBC segue quella ASCE scelta: 7-16 → IBC 2021 (neve nominale),
  // 7-22 → IBC 2024 (la neve compare come 0,7S).
  function asceIbcRows(){
    var cs = asce22() ? 0.7 : 1.0;
    var rows = [];
    function build(n, pairs, seis){
      var terms = [];
      pairs.forEach(function(pr){
        asceAzioniDi(pr[1]).forEach(function(a){ terms.push(asceTerm(a, pr[0])); });
      });
      asceAddH(terms, 'ASD');
      if (!seis){ rows.push({ terms:terms, tag:n }); return; }
      asceSeismicPatterns().forEach(function(pat){
        var t2 = terms.slice();
        Object.keys(pat).forEach(function(k){
          var v = asceQEval(k);
          if (v===null) return;
          t2.push({ simbolo:'ρ·'+k+'/1,4', coef:(asceRho()/1.4)*pat[k], nomeAz:k, azId:k, valore:v });
        });
        rows.push({ terms:t2, tag:n });
      });
    }
    var ev = asceEv();
    // 16-1: D + L + (Lr | S | R)  — la parentesi si espande come nelle altre equazioni
    [['Lr',1.0],['S',cs],['R',1.0]].forEach(function(o){
      if (!asceTipoPresente(o[0])) return;
      build('16-1', [[1.0,'D'],[1.0,'L'],[o[1],o[0]]], false);
    });
    if (!asceTipoPresente('Lr') && !asceTipoPresente('S') && !asceTipoPresente('R')){
      build('16-1', [[1.0,'D'],[1.0,'L']], false);
    }
    build('16-2', [[1.0,'D'],[1.0,'L'],[0.6,'W']], false);
    build('16-3', [[1.0,'D'],[1.0,'L'],[0.6,'W'],[cs/2,'S']], false);
    build('16-4', [[1.0,'D'],[1.0,'L'],[cs,'S'],[0.3,'W']], false);
    if (state.asce.sismica){
      build('16-5', [[1.0 + ev/1.4,'D'],[1.0,'L'],[cs,'S']], true);
      build('16-6', [[0.9 - ev/1.4,'D']], true);
    }
    return rows;
  }

  // Equazioni diverse possono produrre la stessa combinazione numerica (tipico quando un
  // tipo di carico non è stato inserito): si fondono in una riga sola, elencando i numeri
  // di tutte le equazioni che la generano, invece di mostrare doppioni.
  function asceDedup(rows){
    var seen = {}, out = [];
    rows.forEach(function(r){
      var sig = r.terms.map(function(t){ return t.azId+':'+Math.round(t.coef*1e6); }).sort().join('|');
      if (seen[sig]!==undefined){
        var prev = out[seen[sig]];
        if ((' '+prev.tag+' ').indexOf(' '+r.tag+' ')<0 && prev.tag!==r.tag) prev.tag += ' · ' + r.tag;
        return;
      }
      seen[sig] = out.length;
      out.push(r);
    });
    return out;
  }
  function asceCombos(metodo){
    if (!state.asceAzioni.length) return [];
    var rows = [];
    asceEqSet(metodo).forEach(function(eq){ rows = rows.concat(asceRowsFromEq(eq, metodo)); });
    return asceDedup(rows);
  }

  function asceMetodi(){
    return state.asce.metodo==='BOTH' ? ['LRFD','ASD'] : [state.asce.metodo];
  }
  function asceAvvisi(){
    var out = [];
    if (!state.asceAzioni.length) out.push(t('av.nessunCaso'));
    if (!asceTipoPresente('D')) out.push(t('av.nessunD'));
    if (asceTipoPresente('Wt') && !asce22()) out.push(t('av.wtSu716'));
    if (state.asce.sismica){
      if (!asceQEcomp().length) out.push(t('av.qeMancante'));
      if (num(state.asce.sds)===null && !state.asce.evZero) out.push(t('av.sdsMancante'));
      if (num(state.asce.rho)===null) out.push(t('av.rhoMancante'));
      if (state.asce.sovraresistenza && num(state.asce.omega)===null) out.push(t('av.omegaMancante'));
      if (state.asce.sovraresistenza && num(state.asce.omega)===1) out.push(t('av.omegaUno'));
    }
    return out;
  }

  function asceSections(){
    var sections = [];
    var edLab = asceEdLabel();
    var hNoteRuoli = asceTipoPresente('H')
      ? ' ' + t('nota.hRuoli') + ' ' + asceAzioniDi('H').map(function(a){
          var r = asceRuoloH(a);
          return escHtml(a.nome||'H')+' → '+t('ruoloH.breve.'+r);
        }).join('; ') + '.'
      : '';
    var lNote = state.asce.lRidotta ? ' '+t('nota.lRidotta') : '';
    var hNote = asceTipoPresente('H') ? ' '+t('nota.h')+hNoteRuoli : '';
    var fNote = asceTipoPresente('F') ? ' '+t('nota.f') : '';
    // L'eccezione tornado esiste in entrambi i metodi, ma con sezione e parentesi diverse:
    // §2.3.1 Ecc. 3 nella 4a allo Strength Design, §2.4.1 nella 6a all'ASD.
    function tornNoteDi(m){
      if (!(asce22() && asceTipoPresente('Wt'))) return '';
      return ' ' + t(m==='ASD' ? 'nota.tornadoASD' : 'nota.tornadoLRFD');
    }

    asceMetodi().forEach(function(m){
      var rows = asceCombos(m);
      if (rows.length){
        sections.push({
          titolo: t(m==='LRFD' ? 'sec.lrfd.t' : 'sec.asd.t'),
          eq: edLab + (m==='LRFD' ? ' §2.3.1' : ' §2.4.1'),
          nota: t(m==='LRFD' ? 'sec.lrfd.n' : 'sec.asd.n')
            + (asce22() ? ' '+t('nota.parentesi722') : '')
            + lNote + fNote + hNote + tornNoteDi(m),
          rows: rows, prefix: m
        });
      }
      if (state.asce.sismica){
        var sRows = asceSeismicRows(m, false);
        if (sRows.length){
          var snowTxt = m==='ASD' ? (asce22() ? '0,1S' : '0,75S') : (asce22() ? '0,15S' : '0,2S');
          var evTxt = state.asce.evZero ? t('sis.evZero')
                    : (num(state.asce.sds)===null ? t('sis.evNonCalc') : t2('sis.evSds', {sds:fmtG(num(state.asce.sds))}));
          var ortoTxt = asceQEcomp().length>1
            ? ' '+t(state.asce.orto30 ? 'sis.ortoOn' : 'sis.ortoOff') : '';
          var medio = (asce22() && m==='ASD') ? ' '+t('sis.fonte01S') : '';
          sections.push({
            titolo: t2('sec.asceSis.t', {m:m}),
            eq: edLab + (m==='LRFD' ? ' §2.3.6' : ' §2.4.5') + ' · §12.4',
            nota: t2('sec.asceSis.n', {rho:fmtG(asceRho()), ev:evTxt, neve:snowTxt}) + ortoTxt + ' ' + t('sis.qeScalari') + medio,
            rows: sRows, prefix: m+'_SIS'
          });
        }
        if (state.asce.sovraresistenza){
          var oRows = asceSeismicRows(m, true);
          if (oRows.length){
            sections.push({
              titolo: t2('sec.asceOmega.t', {m:m}),
              eq: edLab + (m==='LRFD' ? ' §2.3.6' : ' §2.4.5') + ' · §12.4.3',
              nota: t2('sec.asceOmega.n', {om:fmtG(num(state.asce.omega))}),
              rows: oRows, prefix: m+'_OMEGA'
            });
          }
        }
      }
    });

    if (state.asce.ibcAlt && asceMetodi().indexOf('ASD')>=0 && state.asceAzioni.length){
      var ibcEd = asce22() ? 'IBC 2024' : 'IBC 2021';
      sections.push({
        titolo: t2('sec.ibc.t', {ed:ibcEd}) + ' <span class="badge-exp">'+t('badge.sperimentale')+'</span>',
        eq: ibcEd+' §1605.2, eq. 16-1 ÷ 16-6',
        nota: t('sec.ibc.n1') + ' ' + t('sec.ibc.n2') + ' ' + t('sec.ibc.n3') + ' '
            + t(asce22() ? 'sec.ibc.ed22' : 'sec.ibc.ed16') + ' '
            + (state.asce.sismica ? t('sec.ibc.sis')+' ' : '')
            + t('sec.ibc.evZero'),
        rows: asceDedup(asceIbcRows()), prefix:'IBC'
      });
    }
    return sections;
  }

  // Elenco di tutte le sezioni di combinazioni da produrre, con titolo, riferimento normativo,
  // nota esplicativa, righe e prefisso degli identificativi. Usato sia dalla pagina a video
  // (renderResults) sia dal report per la stampa/PDF, così le due restano sempre allineate.
  function allSections(){
    if (isAsce()) return asceSections();
    var sections = [];
    var ap = approccioCorrente();
    var haiVar = state.variabili.length>0;
    var permNote     = (state.permIndipendenti && state.permanenti.length>1) ? ' '+t('note.permIndip') : '';
    var varNoteFond  = (state.varIndipendenti && haiVar) ? ' '+t('note.varFond') : '';
    var varNoteRara  = (state.varIndipendenti && haiVar) ? ' '+t('note.varRara') : '';
    var varNoteFreq  = (state.varIndipendenti && haiVar) ? ' '+t('note.varFreq') : '';
    var varNoteNoDom = (state.varIndipendenti && haiVar) ? ' '+t('note.varNoDom') : '';
    var varNoteEccDom= (state.varIndipendenti && haiVar) ? ' '+t('note.varFreq') : '';

    var cSol = {}, cEsc = {};
    state.variabili.forEach(function(a){
      var g=(a.gruppoSol||'').trim(); if (g) cSol[g]=(cSol[g]||0)+1;
    });
    varUnits().forEach(function(u){ if (u.esc) cEsc[u.esc]=(cEsc[u.esc]||0)+1; });
    var gSol  = Object.keys(cSol).filter(function(k){ return cSol[k]>=2; });
    var gEscl = Object.keys(cEsc).filter(function(k){ return cEsc[k]>=2; });
    var groupNote = '';
    if (gSol.length)  groupNote += ' '+t2('note.gruppiSol', {g:escHtml(gSol.join(', '))});
    if (gEscl.length) groupNote += ' '+t2('note.gruppiEsc', {g:escHtml(gEscl.join(', '))});
    var permGrp = {};
    state.permanenti.forEach(function(a){ var g=(a.gruppo||'').trim(); if (g) permGrp[g]=(permGrp[g]||0)+1; });
    var permGrpNames = Object.keys(permGrp).filter(function(k){ return permGrp[k]>=2; });
    if (permGrpNames.length) groupNote += ' '+t2('note.gruppiPerm', {g:escHtml(permGrpNames.join(', '))});
    if (doppioSegnoAttive().length){
      groupNote += ' '+t2('note.ds', {g:escHtml(doppioSegnoAttive().map(function(a){ return a.nome||'±'; }).join(', '))});
    }
    var combNote = (permNote||varNoteFond||groupNote) ? (permNote+varNoteFond+groupNote+' '+t('note.tutteComb')) : '';
    varNoteRara += groupNote; varNoteFreq += groupNote; varNoteNoDom += groupNote; varNoteEccDom += groupNote;

    if (state.normativa==='EC0' && state.approccio==='610ab'){
      sections.push({ titolo:t('sec.slu.t'), eq:'EN 1990 §6.4.3.2, eq. 6.10a/6.10b',
        nota:t2('sec.slu.n610ab', {xi:fmtG(ap.xi)})+combNote,
        rows: espandiDoppioSegno(combi610a().concat(combi610b()),'slu'), prefix:'SLU' });
    } else {
      var geoNote = (state.normativa==='NTC2018' && state.approccio==='A2') ? ' '+t('note.geoA2') : '';
      sections.push({ titolo:t('sec.slu.t'), eq:'NTC 2018 eq. 2.5.1 / EN 1990 eq. 6.10',
        nota:t2('sec.slu.n', {ap:escHtml(lab(ap))})+geoNote+combNote,
        rows: espandiDoppioSegno(combiFondamentaleSemplice(),'slu'), prefix:'SLU' });
    }

    if (state.includiMinima){
      sections.push({ titolo:t('sec.min.t'), eq:t('sec.min.eq'), nota:t('sec.min.n'),
        rows: espandiDoppioSegno(combiMinima(),'slu'), prefix:'SLU_MIN' });
    }

    sections.push({ titolo:t('sec.rara.t'), eq:'NTC 2018 eq. 2.5.2 / EN 1990 eq. 6.14b',
      nota:t('sec.rara.n')+varNoteRara, rows: espandiDoppioSegno(combiRara(),'sle'), prefix:'SLE_RARA' });
    sections.push({ titolo:t('sec.freq.t'), eq:'NTC 2018 eq. 2.5.3 / EN 1990 eq. 6.15b',
      nota:t('sec.freq.n')+varNoteFreq, rows: espandiDoppioSegno(combiFrequente(),'sle'), prefix:'SLE_FREQ' });
    sections.push({ titolo:t('sec.qp.t'), eq:'NTC 2018 eq. 2.5.4 / EN 1990 eq. 6.16b',
      nota:t('sec.qp.n')+varNoteNoDom, rows: espandiDoppioSegno(combiQuasiPermanente(),'sle'), prefix:'SLE_QP' });

    if (state.sismica.enabled){
      var nComp = seismicComponents().length, seisNote;
      if (nComp===0) seisNote = ' '+t('sis.nessuna');
      else if (nComp===1) seisNote = ' '+t('sis.una');
      else if (state.sismica.regola30) seisNote = ' '+t('sis.r30on');
      else seisNote = ' '+t('sis.r30off');
      sections.push({ titolo:t('sec.sis.t'), eq:'NTC 2018 eq. 2.5.5 e §7.3.5 / EN 1990 eq. 6.12b',
        nota:t('sec.sis.n')+seisNote+varNoteNoDom,
        rows: espandiDoppioSegno(combiSismica(),'sle'), prefix:'SIS' });
    }
    if (state.eccezionale.enabled){
      var domPsi1 = state.normativa==='EC0' && state.eccezionale.domPsi1;
      sections.push({ titolo:t('sec.ecc.t'),
        eq: domPsi1 ? 'EN 1990 eq. 6.11a' : 'NTC 2018 eq. 2.5.6 / EN 1990 eq. 6.11b',
        nota: t('sec.ecc.n') + (domPsi1 ? ' '+t('sec.ecc.nDom')+varNoteEccDom : varNoteNoDom),
        rows: espandiDoppioSegno(combiEccezionale(),'sle'), prefix:'ECC' });
    }
    return sections;
  }

  // Riepilogo in testa ai risultati: quante combinazioni per sezione e quante in totale,
  // più gli avvisi su configurazioni incoerenti o su numeri di combinazioni molto elevati.
  var SOGLIA_AVVISO = 2000;
  function riepilogoHtml(sections){
    var tot = 0;
    var voci = sections.map(function(s){
      tot += s.rows.length;
      // i titoli possono contenere un badge in HTML: nel riepilogo si mostra il solo testo
      var t = s.titolo.replace(/<[^>]*>/g,'').replace(/^(SLU|SLE) — /,'').trim();
      return '<span class="cnt"><em>'+escHtml(t)+'</em> '+s.rows.length+'</span>';
    }).join('');
    var avvisi = '';
    if (isAsce()){
      asceAvvisi().forEach(function(t){ avvisi += '<div class="alert crit">'+t+'</div>'; });
    }
    if (!isAsce()) gruppiIncoerenti().forEach(function(g){
      avvisi += '<div class="alert crit">'+t2('av.gruppiIncoerenti', {sol:escHtml(g.sol), esc:g.esc.map(escHtml).join(', ')})+'</div>';
    });
    if (tot > SOGLIA_AVVISO){
      avvisi += '<div class="alert warn">'+t2('av.troppeComb', {n:tot})+'</div>';
    }
    return '<section class="card riepilogo">' +
      '<header><h2>'+t('sec.riepilogo')+'</h2><span class="eq-ref mono">'+t2('sec.riepilogoTot', {n:tot})+'</span></header>' +
      '<div class="counts">'+voci+'</div>' + avvisi +
    '</section>';
  }

  function renderResults(){
    tsvStore = {}; tsvSeq = 0;
    var sections = allSections();
    var out = riepilogoHtml(sections);
    out += sections.map(function(s){
      return sectionHtml(s.titolo, s.eq, s.nota, s.rows, s.prefix);
    }).join('');
    out += referenceTablesHtml();
    document.getElementById('results').innerHTML = out;
  }

  // ---------- Report per la stampa / PDF ----------
  // Nessuna libreria esterna: il report viene composto in un contenitore nascosto a video e
  // reso visibile solo in stampa (@media print). L'utente sceglie "Salva come PDF" nella
  // finestra di stampa del browser: il PDF risultante è vettoriale e funziona anche offline.
  var PDF_CAP = 1000; // righe di combinazioni per sezione riportate nel PDF
  function dataOra(){
    var d = new Date(), p = function(n){ return (n<10?'0':'')+n; };
    return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  // colCls (opzionale): classe CSS per colonna, es. ['','lft'] per allineare a sinistra
  // la seconda colonna — serve alle tabelle di equazioni, che non sono numeri.
  function rTable(headCells, bodyRows, colCls){
    var cc = colCls || [];
    function k(i){ return cc[i] ? ' class="'+cc[i]+'"' : ''; }
    return '<table class="rtbl"><thead><tr>'+headCells.map(function(h,i){ return '<th'+k(i)+'>'+h+'</th>'; }).join('')+'</tr></thead>' +
           '<tbody>'+bodyRows.map(function(r){ return '<tr>'+r.map(function(c,i){ return '<td'+k(i)+'>'+c+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table>';
  }
  function reportMatrixHtml(md){
    var head = ['Combinazione'].concat(md.cols.map(function(c){ return escHtml(c.label); })).concat(['Risultato ['+escHtml(state.unita)+']']);
    var shown = md.rows.length>PDF_CAP ? md.rows.slice(0, PDF_CAP) : md.rows;
    var body = shown.map(function(r){
      return [escHtml(r.id)].concat(r.coefs.map(function(v){ return fmtCoef(v); })).concat([r.tot===null ? '—' : fmtRis(r.tot)]);
    });
    var out = rTable(head, body);
    if (md.rows.length > PDF_CAP){
      out += '<p class="rnote">'+t2('rep.matriceTroncataPdf', {cap:PDF_CAP, tot:md.rows.length})+'</p>';
    }
    return out;
  }
  // Testata del report nel percorso ASCE: metadati, ipotesi, casi di carico tipizzati e
  // le equazioni effettivamente usate, scritte per esteso così che il report sia verificabile
  // senza avere il tool sotto mano.
  function asceReportHead(u){
    var h = '';
    var metodi = asceMetodi().join(' + ');
    h += '<p class="rmeta">'+t('rep.normativa')+': <strong>'+asceEdLabelFull()+'</strong>' +
         ' · '+t('rep.metodo')+': <strong>'+metodi+'</strong>' +
         ' · '+t('rep.unita')+': <strong>'+u+'</strong> · '+t2('rep.generato', {d:dataOra()})+'</p>';
    h += '<p class="rnote"><strong>'+t('rep.perimetro.t')+'</strong> '+t('rep.perimetro.b')+
         (state.asce.ibcAlt && asceMetodi().indexOf('ASD')>=0 ? ' '+t('rep.perimetro.ibc') : '')+
         ' '+t2('rep.perimetro.no', {sez:t('asce.nonCoperto')})+'</p>';

    var opz = [];
    opz.push(t('rep.opz.listaFissa'));
    opz.push(t('rep.opz.parentesi'));
    if (state.asce.lRidotta) opz.push(t('rep.opz.lRidotta'));
    if (state.asce.sismica){
      opz.push(t2('rep.opz.sismica', {rho:fmtG(asceRho()),
        ev:(state.asce.evZero ? t('rep.ev.zero') : (num(state.asce.sds)===null ? t('rep.ev.nonInserito') : '0,2·'+fmtG(num(state.asce.sds))+'·D'))}));
      if (asceQEcomp().length>1) opz.push(t(state.asce.orto30 ? 'rep.opz.ortoOn' : 'rep.opz.ortoOff'));
      if (state.asce.sovraresistenza && num(state.asce.omega)!==null) opz.push(t2('rep.opz.omega', {om:fmtG(num(state.asce.omega))}));
    }
    if (state.asce.ibcAlt && asceMetodi().indexOf('ASD')>=0) opz.push(t2('rep.opz.ibc', {ed:(asce22()?'IBC 2024':'IBC 2021')}));
    h += '<h2>'+t('rep.ipotesi')+'</h2><ul class="rlist">'+opz.map(function(o){ return '<li>'+o+'</li>'; }).join('')+'</ul>';
    asceAvvisi().forEach(function(msg){ h += '<p class="rnote"><strong>'+t('rep.avvertenza')+'</strong> '+msg+'</p>'; });

    h += '<h2>'+t('rep.casiCarico')+'</h2>';
    if (state.asceAzioni.length){
      h += rTable([t('col.nome'),t('col.tipo'),t('col.descrTipo'),t('col.valore')+' ['+u+']'],
        state.asceAzioni.map(function(a){
          return [ escHtml(a.nome), escHtml(a.tipo), escHtml(asceTipoLabel(a.tipo).replace(/^[A-Za-z]+ — /,'')),
                   (num(a.valore)===null ? '—' : fmtRis(num(a.valore))) ];
        }));
    }
    if (state.asce.sismica && asceQEcomp().length){
      h += '<h3>'+t('rep.compSismiche')+'</h3>';
      h += rTable([t('col.componente'),t('col.valore')+' ['+u+']'], asceQEcomp().map(function(c){ return [ c.key, fmtRis(c.valore) ]; }));
    }

    h += '<h2>'+t('rep.equazioni')+'</h2>';
    asceMetodi().forEach(function(m){
      h += '<h3>'+m+' — '+asceEdLabel()+(m==='LRFD'?' §2.3.1':' §2.4.1')+'</h3>';
      h += rTable([t('col.n'),t('col.equazione')], asceEqSet(m).map(function(eq){
        return [ eq.n, '<span class="mono">'+asceEqTxt(eq)+'</span>' ];
      }), ['','lft']);
      if (state.asce.sismica){
        h += rTable([t('col.n'),t('col.eqSismica')+' '+(m==='LRFD'?'§2.3.6':'§2.4.5')],
          asceEqSismiche(m).map(function(r){ return [r[0], '<span class="mono">'+r[1]+'</span>']; }), ['','lft']);
        if (state.asce.sovraresistenza && num(state.asce.omega)!==null){
          h += rTable([t('col.n'),t('col.eqOmega')],
            asceEqSismiche(m,'E_mh').map(function(r){ return [r[0]+' Ω₀', '<span class="mono">'+r[1]+'</span>']; }), ['','lft']);
        }
      }
    });
    return h;
  }

  function buildReport(){
    var ap = approccioCorrente();
    var u = escHtml(state.unita);
    var html = '';

    html += '<h1>'+t(isAsce() ? 'rep.titoloAsce' : 'rep.titoloEc')+'</h1>';
    html += '<p class="rnote"><strong>'+t('disclaimer.report')+'</strong></p>';
    if (isAsce()){ html += asceReportHead(u); } else {
    html += '<p class="rmeta">'+t('rep.normativa')+': <strong>'+t(state.normativa==='NTC2018' ? 'rep.normNTC' : 'rep.normEC')+'</strong>' +
            ' · '+t(state.normativa==='NTC2018' ? 'rep.lblApproccio' : 'rep.lblEquazione')+': <strong>'+escHtml(lab(ap))+'</strong>' +
            ' · '+t('rep.unita')+': <strong>'+u+'</strong> · '+t2('rep.generato', {d:dataOra()})+'</p>';

    // --- Opzioni di generazione ---
    var opz = [];
    opz.push(t(state.permIndipendenti ? 'rep.opz.permIndip' : 'rep.opz.permBlocco'));
    opz.push(t(state.varIndipendenti ? 'rep.opz.varIndip' : 'rep.opz.varSempre'));
    if (state.includiMinima) opz.push(t('rep.opz.minima'));
    if (doppioSegnoAttive().length) opz.push(t('rep.opz.doppioSegno'));
    if (state.sismica.enabled) opz.push(t('rep.opz.sisEc') + (seismicComponents().length>1 ? ' — '+t(state.sismica.regola30 ? 'rep.opz.r30on' : 'rep.opz.r30off') : ''));
    if (state.eccezionale.enabled) opz.push(t('rep.opz.ecc') + (state.normativa==='EC0' && state.eccezionale.domPsi1 ? ' — '+t('rep.opz.eccDom') : ''));
    html += '<h2>'+t('rep.ipotesi')+'</h2><ul class="rlist">'+opz.map(function(o){ return '<li>'+o+'</li>'; }).join('')+'</ul>';
    gruppiIncoerenti().forEach(function(g){
      html += '<p class="rnote"><strong>'+t('rep.avvertenza')+'</strong> '+t2('rep.gruppiIncoerenti', {sol:escHtml(g.sol), esc:g.esc.map(escHtml).join(', ')})+'</p>';
    });

    // --- Casi di carico: permanenti ---
    html += '<h2>'+t('rep.casiCarico')+'</h2>';
    if (state.permanenti.length){
      var xiNota = (state.normativa==='EC0' && state.approccio==='610ab');
      html += '<h3>'+t('blk.permanenti')+'</h3>';
      html += rTable([t('col.nome'),t('col.tipo'),t('col.gruppoOrigine'),t('col.valCar')+' ['+u+']',t('col.gammaFav'),t('col.gammaSfav')],
        state.permanenti.map(function(a){
          return [ escHtml(a.nome), escHtml(a.tipo), (a.gruppo||'').trim() ? escHtml(a.gruppo) : '—',
                   (num(a.valore)===null ? '—' : fmtRis(num(a.valore))),
                   fmtCoef(gammaPermanente(a.tipo,false)), fmtCoef(gammaPermanente(a.tipo,true)) ];
        }));
      var pg = {};
      state.permanenti.forEach(function(a){ var g=(a.gruppo||'').trim(); if(g) pg[g]=(pg[g]||0)+1; });
      var pgn = Object.keys(pg).filter(function(k){ return pg[k]>=2; });
      if (pgn.length) html += '<p class="rnote">'+t2('rep.gruppoOrigine', {g:escHtml(pgn.join(', '))})+'</p>';
      if (xiNota) html += '<p class="rnote">'+t2('rep.xiNota', {xi:fmtG(ap.xi)})+'</p>';
    }
    // --- Casi di carico: variabili ---
    if (state.variabili.length){
      html += '<h3>'+t('blk.variabili')+'</h3>';
      html += rTable([t('col.nome'),t('col.categoria'),t('col.grSol'),t('col.grEsc'),'Qk ['+u+']','ψ0','ψ1','ψ2'],
        state.variabili.map(function(a){
          return [ escHtml(a.nome), escHtml(lab(psiByKey(a.categoria))),
                   (a.gruppoSol||'').trim() ? escHtml(a.gruppoSol) : '—',
                   (a.gruppoEsc||'').trim() ? escHtml(a.gruppoEsc) : '—',
                   (num(a.valore)===null ? '—' : fmtRis(num(a.valore))),
                   fmtCoef(num(a.psi0)||0), fmtCoef(num(a.psi1)||0), fmtCoef(num(a.psi2)||0) ];
        }));
      html += '<p class="rnote">'+t2('rep.notaVariabili', {gq:fmtCoef(gammaQ(true))})+'</p>';
    }
    // --- Azioni a doppio segno ---
    if (doppioSegnoAttive().length){
      html += '<h3>'+t('blk.doppioSegno')+'</h3>';
      html += rTable([t('col.nome'),t('col.valore')+' ['+u+']',t('col.coefSLU'),t('col.coefSLE')],
        doppioSegnoAttive().map(function(a){
          var cu=num(a.coefSLU), ce=num(a.coefSLE);
          return [ escHtml(a.nome), (num(a.valore)===null ? '—' : fmtRis(num(a.valore))), '±'+fmtCoef(cu===null?1:cu), '±'+fmtCoef(ce===null?1:ce) ];
        }));
      html += '<p class="rnote">'+t('rep.notaDoppioSegno')+'</p>';
    }
    // --- Azioni sismica / eccezionale ---
    var extra = [];
    seismicComponents().forEach(function(c){ if (state.sismica.enabled) extra.push([c.label, t('rep.compSis'), fmtRis(c.valore)]); });
    if (state.eccezionale.enabled && num(state.eccezionale.valore)!==null) extra.push(['Ad', t('blk.eccezionale'), fmtRis(num(state.eccezionale.valore))]);
    if (extra.length){
      html += '<h3>'+t('rep.eccSis')+'</h3>' + rTable([t('col.simbolo'),t('col.descrizione'),t('col.valore')+' ['+u+']'], extra);
    }

    // --- Coefficienti di normativa ---
    html += '<h2>'+t('rep.coefNorma')+'</h2>';
    html += '<h3>'+t('rep.coefParziali')+'</h3>';
    if (state.normativa==='NTC2018'){
      html += rTable([t('rep.lblApproccio'),'G1','G2','Q'], NTC_APPROCCI.map(function(x){
        return [ escHtml(lab(x))+(x.key===state.approccio?' <strong>'+t('rep.inUso')+'</strong>':''),
                 fmtG(x.G1.fav)+' / '+fmtG(x.G1.sfav), fmtG(x.G2.fav)+' / '+fmtG(x.G2.sfav), fmtG(x.Q.fav)+' / '+fmtG(x.Q.sfav) ];
      }));
    } else {
      html += rTable([t('rep.lblEquazione'),'G1 + G2','Q','ξ'], EC0_APPROCCI.map(function(x){
        return [ escHtml(lab(x))+(x.key===state.approccio?' <strong>'+t('rep.inUso')+'</strong>':''),
                 fmtG(x.Ginf)+' / '+fmtG(x.Gsup), '0 / '+fmtG(x.Q), x.xi===null ? '—' : fmtG(x.xi) ];
      }));
    }
    html += '<h3>'+t('rep.coefPsi')+'</h3>';
    html += rTable([t('col.categoria'),'ψ0','ψ1','ψ2'], psiTable().map(function(c){
      return [ escHtml(lab(c)), fmtG(c.psi0), fmtG(c.psi1), fmtG(c.psi2) ];
    }));

    }

    // --- Combinazioni, una sezione per stato limite ---
    html += '<h2>'+t('rep.combGenerate')+'</h2>';
    allSections().forEach(function(s){
      var md = matrixData(s.rows, s.prefix);
      var mm = s.rows.length>1 ? markMinMax(s.rows) : { maxI:-1, minI:-1 };
      html += '<div class="rsection">';
      html += '<h3>'+s.titolo+' <span class="reqref">'+s.eq+'</span></h3>';
      html += '<p class="rnote">'+s.nota+'</p>';
      if (s.rows.length>1 && mm.maxI>=0){
        var maxT = fmtRis(calcTotale(s.rows[mm.maxI].terms)), maxId = md.rows[mm.maxI].id;
        var minTxt = mm.minI>=0 ? (' · '+t2('rep.min', {v:fmtRis(calcTotale(s.rows[mm.minI].terms))+' '+u, id:md.rows[mm.minI].id})) : '';
        html += '<p class="rsummary">'+t2('rep.max', {n:s.rows.length, v:maxT+' '+u, id:maxId})+minTxt+'</p>';
      }
      html += reportMatrixHtml(md);
      html += '</div>';
    });

    // --- Fonti e assunzioni ---
    if (isAsce()){
      html += '<h2>'+t('rep.fonti')+'</h2>' +
        '<p class="rnote"><strong>'+t('rep.fontiLbl')+'</strong> '+t('rep.asce.fonti')+'</p>' +
        '<p class="rnote">'+t('rep.asce.diff')+'</p>' +
        '<p class="rnote">'+t('rep.asce.prov')+'</p>' +
        '<p class="rnote">'+t('rep.asce.assunzioni')+'</p>';
    } else {
      html += '<h2>'+t('rep.fonti')+'</h2>' +
        '<p class="rnote"><strong>'+t('rep.fontiLbl')+'</strong> '+t('rep.ec.fonti')+'</p>' +
        '<p class="rnote">'+t('rep.ec.transizione')+'</p>' +
        '<p class="rnote">'+t('rep.ec.assunzioni')+'</p>';
    }

    document.getElementById('report').innerHTML = html;
  }

  // Pannello di riferimento a video nel percorso ASCE: le equazioni per esteso e i simboli,
  // perché qui i "coefficienti" non stanno in una tabella ma dentro le equazioni stesse.
  function asceReferenceHtml(){
    var blocchi = '';
    asceMetodi().forEach(function(m){
      var righe = asceEqSet(m).map(function(eq){
        return '<tr><td class="mono">'+eq.n+'</td><td class="mono">'+asceEqTxt(eq)+'</td></tr>';
      }).join('');
      if (state.asce.sismica){
        righe += asceEqSismiche(m).map(function(r){
          return '<tr><td class="mono">'+r[0]+'</td><td class="mono">'+r[1]+'</td></tr>';
        }).join('');
        if (state.asce.sovraresistenza && num(state.asce.omega)!==null){
          righe += asceEqSismiche(m,'E_mh').map(function(r){
            return '<tr><td class="mono">'+r[0]+' Ω₀</td><td class="mono">'+r[1]+'</td></tr>';
          }).join('');
        }
      }
      blocchi += '<div class="tblwrap">' +
        '<h4>'+m+' — '+asceEdLabel()+(m==='LRFD'?' §2.3.1 / §2.3.6':' §2.4.1 / §2.4.5')+'</h4>' +
        '<table class="tbl"><thead><tr><th>'+t('col.n')+'</th><th>'+t('col.equazione')+'</th></tr></thead><tbody>'+righe+'</tbody></table>' +
      '</div>';
    });
    var simboli = ASCE_TIPI.map(function(x){
      return '<tr><td class="mono">'+x.t+'</td><td>'+escHtml(asceTipoLabel(x.t).replace(/^[A-Za-z]+ — /,''))+'</td></tr>';
    }).join('') +
    '<tr><td class="mono">E_h</td><td>'+t('sim.eh')+'</td></tr>' +
    '<tr><td class="mono">E_v</td><td>'+t('sim.ev')+'</td></tr>' +
    '<tr><td class="mono">E_mh</td><td>'+t('sim.emh')+'</td></tr>';

    return '' +
    '<details class="reftable">' +
      '<summary>'+t('ref.titoloAsce')+'</summary>' +
      '<div class="refbody">' +
        blocchi +
        '<div class="tblwrap">' +
          '<h4>'+t('ref.simboli')+'</h4>' +
          '<table class="tbl"><thead><tr><th>'+t('col.simbolo')+'</th><th>'+t('col.significato')+'</th></tr></thead><tbody>'+simboli+'</tbody></table>' +
        '</div>' +
        '<footer class="src">' +
          '<strong>'+t('rep.fontiLbl')+'</strong> '+t('ref.asce.fonti')+'<br>' +
          t('ref.asce.prov')+'<br>' +
          t('ref.asce.assunzioni') +
        '</footer>' +
      '</div>' +
    '</details>';
  }

  // ---------- Guida ----------
  // Le spiegazioni lunghe vivono qui e non più dentro le note di sezione: il pannello
  // di sinistra resta leggibile e il testo da mantenere (e tradurre) sta in un posto solo.
  var GUIDA_SEZ = ['start','ecnorma','ecazioni','ecgruppi','ecminima','doppiosegno','ecsisma',
                   'eccezionale','ascemetodo','ascecarichi','asceecc','ascesisma','ascerho',
                   'asceorto','ibc','export','limiti'];
  var guidaSezCorrente = 'start';
  function renderGuida(sez){
    guidaSezCorrente = sez || guidaSezCorrente;
    document.getElementById('guidaNav').innerHTML = GUIDA_SEZ.map(function(s){
      return '<button data-sez="'+s+'"'+(s===guidaSezCorrente?' class="active"':'')+'>'+t('g.'+s+'.t')+'</button>';
    }).join('');
    document.getElementById('guidaBody').innerHTML =
      '<h3>'+t('g.'+guidaSezCorrente+'.t')+'</h3>' + t('g.'+guidaSezCorrente+'.b');
    document.getElementById('guidaBody').scrollTop = 0;
  }
  function apriGuida(sez){
    renderGuida(sez);
    document.getElementById('guidaOverlay').hidden = false;
  }
  function chiudiGuida(){ document.getElementById('guidaOverlay').hidden = true; }

  document.getElementById('btnGuida').addEventListener('click', function(){ apriGuida('start'); });
  document.getElementById('btnGuidaChiudi').addEventListener('click', chiudiGuida);
  document.getElementById('guidaOverlay').addEventListener('click', function(e){
    if (e.target === this) chiudiGuida();
  });
  document.getElementById('guidaNav').addEventListener('click', function(e){
    var b = e.target.closest('button[data-sez]');
    if (b) renderGuida(b.getAttribute('data-sez'));
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !document.getElementById('guidaOverlay').hidden) chiudiGuida();
  });
  // I pulsanti «?» aprono la guida già sull'argomento pertinente.
  document.addEventListener('click', function(e){
    var b = e.target.closest('.helpbtn[data-help]');
    if (!b) return;
    e.preventDefault();
    apriGuida(b.getAttribute('data-help'));
  });

    state.varIndipendenti = e.target.checked; saveState(); renderResults();

  document.getElementById('chkMinima').addEventListener('change', function(e){

  });
  // Copia TSV: delega sul contenitore dei risultati, che viene rigenerato a ogni render.
  document.getElementById('results').addEventListener('click', function(e){
    var btn = e.target.closest('.copybtn');
    if (!btn) return;
    var txt = tsvStore[btn.getAttribute('data-tsv')];
    if (txt) copyText(txt, btn);
  });
  document.getElementById('chkSismica').addEventListener('change', function(e){
    state.sismica.enabled = e.target.checked;
    ['valEx','valEy','valEz'].forEach(function(id){ document.getElementById(id).disabled = !state.sismica.enabled; });
    saveState(); renderResults();
  });
  document.getElementById('chkRegola30').addEventListener('change', function(e){
    state.sismica.regola30 = e.target.checked; saveState(); renderResults();
  });
  document.getElementById('valEx').addEventListener('input', function(e){ state.sismica.ex = e.target.value; saveState(); renderResults(); });
  document.getElementById('valEy').addEventListener('input', function(e){ state.sismica.ey = e.target.value; saveState(); renderResults(); });
  document.getElementById('valEz').addEventListener('input', function(e){ state.sismica.ez = e.target.value; saveState(); renderResults(); });
  document.getElementById('chkEccezionale').addEventListener('change', function(e){
    state.eccezionale.enabled = e.target.checked;
    document.getElementById('valEccezionale').disabled = !state.eccezionale.enabled;
    saveState(); renderResults();
  });
  document.getElementById('valEccezionale').addEventListener('input', function(e){
    state.eccezionale.valore = e.target.value; saveState(); renderResults();
  });
  document.getElementById('chkDomPsi1').addEventListener('change', function(e){
    state.eccezionale.domPsi1 = e.target.checked; saveState(); renderResults();
  });

  document.getElementById('btnAddPermanente').addEventListener('click', function(){
    state.permanenti.push({ id:uid++, nome:'G'+(state.permanenti.length+1), tipo:'G1', gruppo:'', valore:'' });
    saveState(); renderControls(); renderResults();
  });
  document.getElementById('btnAddVariabile').addEventListener('click', function(){
    var def = psiByKey('A');
    state.variabili.push({ id:uid++, nome:'Q'+(state.variabili.length+1), categoria:'A', gruppoSol:'', gruppoEsc:'', valore:'', psi0:def.psi0, psi1:def.psi1, psi2:def.psi2 });
    saveState(); renderControls(); renderResults();
  });
  document.getElementById('btnAddDoppioSegno').addEventListener('click', function(){
    state.doppioSegno.push({ id:uid++, nome:'Imperfezioni '+(state.doppioSegno.length+1), valore:'', coefSLU:1, coefSLE:1 });
    saveState(); renderControls(); renderResults();
  });

  // ---------- Avvio ----------
  LANG = linguaIniziale();
  document.getElementById('selLingua').value = LANG;
  applyI18n();
  loadState();
  if (state.permanenti.length===0 && state.variabili.length===0){
    state.permanenti.push({ id:uid++, nome:t('esempio.perm'), tipo:'G1', gruppo:'', valore:'' });
    state.variabili.push({ id:uid++, nome:t('esempio.var'), categoria:'A', gruppoSol:'', gruppoEsc:'', valore:'', psi0:0.7, psi1:0.5, psi2:0.3 });
  }
  renderControls();
  renderResults();

})();
</script>

</body>
</html>
