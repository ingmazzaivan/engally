组独立进行有利/不利分类（2ⁿ 种组合）", "rep.opz.r30off": "未应用 30% 规则，各分量单独考虑", "rep.opz.r30on": "已应用 30% 规则（§7.3.5）", "rep.opz.sisEc": "已包含地震组合", "rep.opz.sismica": "已包含地震组合：E_h = ρ·Q_E，其中 ρ = {rho}；E_v = {ev}。", "rep.opz.varIndip": "可变作用取独立状态（主导 / 伴随 / 排除）", "rep.opz.varSempre": "可变作用始终参与，主导作用轮换", "rep.perimetro.b": "已生成基本组合（§2.3.1 Strength Design、§2.4.1 Allowable Stress Design）以及地震组合（§2.3.6、§2.4.5，包括含超强系数的组合）。", "rep.perimetro.ibc": "同时包含 IBC §1605.2 的 ASD 替代组合。", "rep.perimetro.no": "Chapter 2 中其余的组合未予生成：{sez}。若其中某一项与本项目相关，须另行补充。", "rep.perimetro.t": "本文档的涵盖范围。", "rep.titoloAsce": "荷载组合", "rep.titoloEc": "作用组合", "rep.unita": "计量单位", "rep.xiNota": "在公式 6.10b 中，不利作用的系数还要再由系数 ξ = {xi} 折减（不适用于 P 类作用）。", "ruoloH.breve.resist": "永久存在且起抗力作用", "ruoloH.breve.sfav": "加大主效应", "ruoloH.breve.zero": "起抗力但非永久存在，取零", "ruoloH.resist": "永久存在且起抗力作用（0.9H / 0.6H）", "ruoloH.sfav": "加大主效应（1.6H / 1.0H）", "ruoloH.zero": "起抗力但非永久存在（H = 0）", "sec.asceOmega.n": "E<sub>h</sub> 由 E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub> 取代，其中 Ω<sub>0</sub> = {om}（取自 Tab. 12.2-1，取决于所选的抗侧力体系）。§12.4.3 允许把 E<sub>mh</sub> 限制为由屈服构件承载能力所决定的数值：此处不应用该上限。", "sec.asceOmega.t": "{m} — 含超强系数的地震组合", "sec.asceSis.n": "E<sub>h</sub> = ρ·Q<sub>E</sub>，其中 ρ = {rho}；E<sub>v</sub> = 0.2·S<sub>DS</sub>·D {ev}：E<sub>v</sub> 被并入 D 类作用的系数中（在组合 6/8/9 中相加，在 7/10 中相减）。伴随雪荷载取 {neve}。", "sec.asceSis.t": "{m} — 地震组合", "sec.asd.n": "按使用荷载建立的组合。伴随可变荷载上的 0.75 系数已经乘进所显示的系数里（例如 0.75 × 0.6W = 0.45W）。采用这些基本组合时，不允许对容许应力作任何提高。", "sec.asd.t": "ASD — 容许应力组合", "sec.ecc.n": "Ad 的取值（例如撞击、爆炸、火灾）应由针对该偶然作用的专门分析确定。", "sec.ecc.nDom": "主导可变作用取 ψ1（偶然事件「发生期间」的情形），在参与的可变作用之间轮换，其余取 ψ2。", "sec.ecc.t": "偶然组合", "sec.freq.n": "用于可逆的正常使用极限状态。", "sec.freq.t": "正常使用极限状态 — 频遇组合", "sec.ibc.ed16": "该版本与 ASCE 7-16 对应，雪荷载为名义值。", "sec.ibc.ed22": "该版本与 ASCE 7-22 对应，因此雪荷载以 0.7S 出现。", "sec.ibc.evZero": "采用这些组合进行基础设计时，IBC 允许取 E<sub>v</sub> = 0（左侧面板中的复选框）。", "sec.ibc.n1": "<strong>本节尚未逐条验证</strong>，在用于实际计算之前应与 IBC 官方版本核对：公式 16-1 ÷ 16-4 已由多个来源确认，而 16-5 和 16-6 中包含本工具对 E<sub>v</sub> 处理方式的一种解读。", "sec.ibc.n2": "当强度设计组合和基本 ASD 组合从 §1605 中删去并转而援引 ASCE 7 之后，IBC 保留下来的一套替代组合。系数 ω 已被 IBC 2021 取消：风荷载以 0.6W 计入。", "sec.ibc.n3": "容许应力提高 1/3 并非 IBC 自身给予的：§1605.2 将这一点交由材料规范规定，而 AISC 360（钢结构）与 TMS 402（砌体结构）已取消该规定，ACI 318 则不采用 ASD。", "sec.ibc.sis": "在 eq. 16-5 和 16-6 中，地震以 E/1.4 计入；在 16-6 中 E<sub>v</sub> 已从永久作用中扣除，这一解读与 ASCE 7 的组合 10 一致 — 若该组合在你的情形中起控制作用，<strong>请自行核实</strong>。", "sec.ibc.t": "ASD 替代组合 — {ed}", "sec.lrfd.n": "固定的公式清单：同时性已经写进公式本身，不存在主导可变荷载，也不存在 ψ 系数。「或」括号会展开为与所输入荷载工况相容的全部备选项。", "sec.lrfd.t": "LRFD — 强度设计组合", "sec.min.eq": "用于上拔 / 包络的辅助功能", "sec.min.n": "永久作用取有利方向（γ 取最小值），可变作用取零（γQ,fav = 0）。这是一个便于探查包络下限的辅助组合：它并不能替代完整的 EQU 验算定义 — 在 EQU 验算中，每个作用都必须针对具体的失稳机构判定为稳定作用还是不稳定作用，而且可变作用也可能是稳定作用。", "sec.min.t": "承载能力极限状态 — 自动生成的最小组合", "sec.qp.n": "用于长期效应及结构外观。", "sec.qp.t": "正常使用极限状态 — 准永久组合", "sec.rara.n": "用于不可逆的正常使用极限状态。", "sec.rara.t": "正常使用极限状态 — 标准组合（罕遇组合）", "sec.riepilogo": "汇总", "sec.riepilogoTot": "已生成 {n} 个组合", "sec.sintesi": "已生成 {n} 个组合 — 最大值 <strong>{max}</strong> · 最小值 <strong>{min}</strong>", "sec.sis.n": "Ex、Ey、Ez 的取值应由地震分析确定，并且必须是针对同一个验算量的效应：本工具做的是标量叠加。", "sec.sis.t": "地震组合", "sec.slu.n": "永久作用与可变作用均按对所考察效应不利的方向取值。验算类型：{ap}。", "sec.slu.n610ab": "6.10a（可变作用全部由 ψ0 折减）与 6.10b（不利的永久作用由系数 ξ = {xi} 折减，主导可变作用取全值）两者的包络。ξ 取值为 EN 1990 中 CEN 的推荐值：适用的国家附录可能规定不同的取值 — 请自行核实。", "sec.slu.t": "承载能力极限状态 — 基本组合", "seg.ec0": "EC0 通用", "seg.matrice": "矩阵", "seg.testo": "文本", "sim.eh": "水平地震效应 = ρ·Q_E（eq. 12.4-3）", "sim.emh": "含超强系数的水平地震效应 = Ω₀·Q_E（eq. 12.4-7）", "sim.ev": "竖向地震效应 = 0.2·S_DS·D（eq. 12.4-4a）", "sis.evNonCalc": "无法计算（缺少 S<sub>DS</sub>），按零处理", "sis.evSds": "取 S<sub>DS</sub> = {sds}", "sis.evZero": "按要求取为零", "sis.fonte01S": "组合 9 中雪荷载的系数 0.1（在 7-16 中为 0.75S）出自 ICC 关于 2024 IBC / ASCE 7-22 的官方报告，以及 SEAU 关于 7-22 修订内容的报告。", "sis.nessuna": "请至少输入 Ex 才能生成组合。", "sis.ortoOff": "各分量单独考虑（各取 ±）：如需将其组合，请在左侧面板勾选 100/30 规则。", "sis.ortoOn": "已应用 100/30 正交规则（§12.5.3），并考虑全部符号组合。", "sis.qeScalari": "Q<sub>E</sub> 的取值必须是针对同一个验算量的效应。", "sis.r30off": "未应用 30% 规则：每个输入的分量均单独考虑（各取 ±），不与其他分量相加。", "sis.r30on": "已对输入的各分量应用 30% 规则（NTC 2018 §7.3.5）：各分量轮换，一个取系数 1.00，其余取 0.30，并考虑全部符号组合。", "sis.una": "已生成 ±E 两个组合。", "sub.ascePerimetro": "基本组合与地震组合（Chapter 2 核心内容）", "sub.ec": "作用组合 — 欧洲规范 EC0", "tag.minima": "永久作用取有利方向，可变作用取零", "tipo.D": "D — 恒荷载（dead）", "tipo.F": "F — 压力与高度已确定的流体荷载", "tipo.H": "H — 土压力 / 地下水压力", "tipo.L": "L — 楼面活荷载（live）", "tipo.Lr": "Lr — 屋面活荷载（roof live）", "tipo.R": "R — 雨荷载（rain）", "tipo.S": "S — 雪荷载（snow）", "tipo.S.16": "S — 雪荷载（snow）— 名义值，按 7-16 处理", "tipo.S.22": "S — 雪荷载（snow）— 极限水平取值，按 7-22 处理", "tipo.W": "W — 风荷载（wind）", "tipo.Wt": "Wt — 龙卷风荷载（仅 7-22）", "ttl.csle": "正常使用极限状态、地震及偶然状况下的系数", "ttl.cslu": "承载能力极限状态下的系数", "ttl.gruppo": "EN 1990 §6.4.3.2(4)：同一来源的永久作用全部取 γ,sup 或全部取 γ,inf。分组名称相同的作用按一个作用处理。", "ttl.gruppoEsc": "互为替代的作用：每个组合中至多一个参与（例如风 +X / −X）。其中也可以包含整个联动分组。", "ttl.gruppoSol": "始终同时参与且承担相同角色的作用：该分组按一个作用计，只是分布在多个荷载工况上（例如不同屋面坡面上的雪荷载）。", "ttl.rimuovi": "删除"},
    ru: {"appr.610": "Eq. 6.10 — одно сочетание", "appr.610ab": "Eq. 6.10a / 6.10b — огибающая", "appr.A1": "Подход 1 / A1 — STR (наиболее частый для зданий)", "appr.A2": "Подход 2 / A2 — GEO", "appr.EQU": "EQU — равновесие", "aria.normativa": "Нормативный документ", "aria.vista": "Представление результатов", "asce.nonCoperto": "§2.3.2 / §2.4.2 (нагрузки от паводка F<sub>a</sub>), §2.3.3 / §2.4.3 (атмосферное обледенение D<sub>i</sub> и W<sub>i</sub>), §2.3.4 / §2.4.4 (эффекты стеснённых деформаций T), §2.3.5 (неуказанные нагрузки), §2.5 (чрезвычайные события) и §2.6 (живучесть — сопротивление прогрессирующему обрушению)", "av.gruppiIncoerenti": "Несогласованная конфигурация: воздействия связанной группы «{sol}» отнесены к разным взаимоисключающим группам ({esc}). Связанная группа — это одно воздействие, и оно не может быть альтернативой самому себе: используется взаимоисключающая группа первого члена. Исправьте назначение.", "av.nessunCaso": "Загружения не заданы: добавьте хотя бы одно на панели слева.", "av.nessunD": "Нет загружений типа D (постоянная нагрузка): все уравнения ASCE содержат D, сочетания получаются неполными.", "av.omegaMancante": "Запрошены сочетания со сверхпрочностью, но Ω<sub>0</sub> не введено (Tab. 12.2-1): сочетания с Ω<sub>0</sub> не сформированы.", "av.omegaUno": "Ω<sub>0</sub> = 1 не означает автоматически «отсутствие сверхпрочности»: проверьте значение по Tab. 12.2-1 для принятой несущей системы.", "av.qeMancante": "Сейсмические сочетания включены, но значение Q<sub>E</sub> не введено.", "av.rhoMancante": "ρ не введено: принято равным 1,0. Это инженерное значение, а не безобидное значение по умолчанию — оно должно определяться по §12.3.4, который в ряде случаев предписывает ρ = 1,3.", "av.sdsMancante": "S<sub>DS</sub> не введено: E<sub>v</sub> принято равным нулю. Введите S<sub>DS</sub> либо явно отметьте «E<sub>v</sub> = 0».", "av.troppeComb": "Всего сочетаний: {n}. Проверьте, что независимость воздействий отражает физически возможные сценарии: воздействия, которые не могут сосуществовать, следует помещать во взаимоисключающую группу, а всегда сопутствующие друг другу — в связанную группу.", "av.wtSu716": "Задано загружение типа Wt (торнадо), однако нагрузка от торнадо существует только в ASCE 7-22: при выбранной редакции 7-16 оно игнорируется.", "badge.alt": "альтернатива не активна", "badge.dom": "доминирующее", "badge.fav": "↓ благопр.", "badge.omessa": "исключено (благоприятное)", "badge.sfav": "↑ неблагопр.", "badge.sperimentale": "⚠ экспериментально — проверьте применимость", "blk.approccio": "Расчётный подход", "blk.asceCarichi": "Загружения", "blk.asceMetodo": "Метод расчёта", "blk.doppioSegno": "Знакопеременные воздействия (±)", "blk.eccezionale": "Особое воздействие", "blk.output": "Представление результатов", "blk.permanenti": "Постоянные воздействия", "blk.sismica": "Сейсмическое воздействие", "blk.variabili": "Переменные воздействия", "btn.addAsce": "+ Добавить загружение", "btn.addDs": "+ Добавить знакопеременное воздействие", "btn.addPerm": "+ Добавить постоянное воздействие", "btn.addVar": "+ Добавить переменное воздействие", "btn.coffee": "☕ Угостить кофе", "btn.copiaBloccata": "Копирование заблокировано браузером", "btn.copiaTsv": "Копировать таблицу (TSV)", "btn.copiato": "Скопировано ✓", "btn.guida": "Руководство", "btn.guidaTitle": "Открывает руководство по работе с инструментом", "btn.mostraTutte": "Показать все сочетания ({n})", "btn.report": "Отчёт PDF", "btn.reportTitle": "Формирует отчёт и открывает окно печати: выберите «Сохранить как PDF»", "chip.max": "Максимум", "chip.min": "Минимум", "chk.asceEvZero": "E<sub>v</sub> = 0 (допускается при расчёте фундаментов по альтернативным сочетаниям IBC и в случаях §12.4.2.2)", "chk.asceIbc": "Включить <em>альтернативные</em> сочетания ASD по IBC (§1605.2)", "chk.asceLrid": "Коэффициент при L снижен до 0,5 в сочетаниях 3 и 4 — допускается там, где L<sub>0</sub> ≤ 100 psf (4,79 кН/м²), <strong>кроме</strong> автостоянок и помещений с массовым пребыванием людей (§2.3.1, искл. 1)", "chk.asceOmega": "Формировать также сочетания со сверхпрочностью (E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub>, §12.4.3)", "chk.asceOrto": "Применять ортогональную процедуру 100/30 для Q<sub>Ex</sub> и Q<sub>Ey</sub>", "chk.asceSis": "Включить сейсмические сочетания (§2.3.6 / §2.4.5)", "chk.domPsi1": "Доминирующее переменное воздействие с ψ1 вместо ψ2 (EN 1990 eq. 6.11a — расчёт «во время» события, например при продолжающемся пожаре)", "chk.eccezionale": "Особое — Ad", "chk.minima": "Включить автоматическое минимальное сочетание (вспомогательное, для задач отрыва)", "chk.permIndip": "Независимая классификация «благоприятное/неблагоприятное» для каждого постоянного воздействия или группы одного происхождения (2ⁿ сочетаний)", "chk.regola30": "Применять правило 30 % между компонентами (§7.3.5)", "chk.sismica": "Включить сейсмическое сочетание", "chk.varIndip": "Переменные воздействия благоприятные/неблагоприятные по отдельности (включая случай исключения воздействия)", "col.categoria": "Категория", "col.coefSLE": "Коэффициент, вторая группа / сейсм. / особое", "col.coefSLU": "Коэффициент, первая группа", "col.combinazione": "Сочетание", "col.componente": "Компонента", "col.descrTipo": "Описание типа", "col.descrizione": "Описание", "col.eqOmega": "Со сверхпрочностью — E_mh = Ω₀·Q_E (§12.4.3)", "col.eqSismica": "Сейсмическое уравнение", "col.equazione": "Уравнение", "col.gammaFav": "γ благоприятное", "col.gammaSfav": "γ неблагоприятное", "col.grEsc": "Взаимоискл. группа", "col.grSol": "Связ. группа", "col.gruppoOrigine": "Группа (происхождение)", "col.n": "№", "col.nome": "Название", "col.risultato": "Результат", "col.significato": "Расшифровка", "col.simbolo": "Обозначение", "col.tipo": "Тип", "col.valCar": "Нормативное значение", "col.valore": "Значение", "cong.oppure": "или", "disclaimer.footer": "Инструмент предоставляется «как есть», без каких-либо гарантий. Результаты приведены исключительно в информационных целях: всегда проверяйте их самостоятельно перед использованием в реальном проекте. Инструмент не заменяет профессиональное заключение квалифицированного инженера и обязательные нормативные проверки.", "disclaimer.report": "Этот отчёт формируется автоматически бесплатным инструментом исключительно в информационных целях. Он не заменяет профессиональное заключение квалифицированного инженера, обязательные нормативные проверки или техническую экспертизу проекта. Автор не несёт никакой ответственности за использование результатов, содержащихся в этом документе, в реальном проекте или в любом другом применении: использование осуществляется полностью на собственный риск, при условии самостоятельной проверки.", "esempio.perm": "G1 — собственный вес", "esempio.var": "Q1 — полезная нагрузка", "g.ascecarichi.b": "<p>Каждое загружение необходимо отнести к своему нормативному типу, поскольку именно тип определяет, какой коэффициент оно получает в каждом уравнении:</p><ul><li><strong>D</strong> постоянная · <strong>L</strong> переменная нагрузка на перекрытия · <strong>L<sub>r</sub></strong> переменная нагрузка на покрытие</li><li><strong>S</strong> снеговая · <strong>R</strong> дождевая · <strong>W</strong> ветровая · <strong>W<sub>T</sub></strong> торнадо (только 7-22)</li><li><strong>F</strong> жидкости с известными давлением и высотой уровня: получают тот же коэффициент, что и D</li><li><strong>H</strong> давление грунта или грунтовых вод: см. ниже</li></ul><p>Для загружений типа <strong>H</strong> норма различает три ситуации, и инструмент предлагает выбрать нужную в каждом случае: давление, <em>усиливающее</em> основной эффект (1,6H для Strength Design, 1,0H для ASD); давление <em>постоянное и сопротивляющееся</em> (0,9H / 0,6H); давление <em>сопротивляющееся, но непостоянное</em>, которое следует принимать равным нулю. Какая из ситуаций верна, зависит от рассматриваемой проверки.</p><div class=\"gnote\"><strong>Снеговая нагрузка меняет смысл между двумя редакциями.</strong> В 7-16 S — нормативное значение; в 7-22 карты пересчитаны на уровень предельного состояния, поэтому S уже само по себе больше и входит в уравнения с другими коэффициентами. Будьте внимательны при импорте нагрузок из МКЭ-модели.</div>", "g.ascecarichi.t": "ASCE 7 — типы нагрузок", "g.asceecc.b": "<p><strong>Сниженный коэффициент при L (§2.3.1, искл. 1).</strong> В сочетаниях 3 и 4 коэффициент при L может приниматься равным 0,5 вместо 1,0 там, где табличная переменная нагрузка L<sub>0</sub> не превышает 100 psf (4,79 кН/м²). <strong>Исключаются</strong> автостоянки и помещения с массовым пребыванием людей. Флажок следует включать только после проверки того, что рассматриваемый случай подпадает под это условие.</p><p><strong>Исключение для торнадо.</strong> В ASCE 7-22 там, где используется нагрузка W<sub>T</sub>, снеговая нагрузка выходит из сочетания: торнадо — явление тёплого сезона, и снег с ним не совместен. Инструмент применяет это как для Strength Design (соч. 4a, §2.3.1, искл. 3), так и для ASD (соч. 6a, §2.4.1).</p><div class=\"gnote\">Различие между редакциями в записи скобок не косметическое. В 7-16 записано 1,6(L<sub>r</sub> или S или R), с единым коэффициентом для всей группы; в 7-22 записано (1,6L<sub>r</sub> или 1,0S или 1,6R), с отдельным коэффициентом для каждой альтернативы, поскольку снеговая нагрузка уже приведена к уровню предельного состояния.</div>", "g.asceecc.t": "ASCE 7 — применяемые исключения", "g.ascemetodo.b": "<p>Американский расчётный модуль построен <strong>совершенно иначе</strong>, чем европейский, и разница не только в значениях коэффициентов.</p><p>В ASCE 7 нет порождающего правила: есть <strong>фиксированный перечень уравнений</strong>. Одновременность нагрузок уже заложена в само уравнение, никакого доминирующего воздействия с поочерёдной сменой не существует, и <strong>коэффициентов ψ здесь нет</strong>. Категории A÷H из NTC здесь совершенно бесполезны.</p><p>Единственный перебор — это раскрытие скобок «или»: сочетание вида 1,2D + 1,6(L<sub>r</sub> или S или R) порождает столько строк, сколько имеется альтернатив, но только для тех типов нагрузок, которые вы действительно задали.</p><p><strong>LRFD</strong> (§2.3) и <strong>ASD</strong> (§2.4) — альтернативные методы. В сочетаниях ASD множитель 0,75 для сопутствующих нагрузок уже учтён в показываемых коэффициентах: 0,75 × 0,6W отображается как 0,45W.</p><div class=\"gnote\">С базовыми сочетаниями ASD <strong>никакое повышение допускаемых напряжений не разрешается</strong>.</div>", "g.ascemetodo.t": "ASCE 7 — как это работает", "g.asceorto.b": "<p>Флажок 100/30 заставляет чередовать две горизонтальные компоненты: одна берётся со 100 %, другая с 30 %, со всеми комбинациями знаков. При двух заданных компонентах для каждого сейсмического уравнения получается восемь схем.</p><div class=\"gnote\"><strong>Это правило применимо не всегда.</strong> §12.5 различает независимую направленную процедуру (§12.5.1.1) и ортогональное сочетание (§12.5.1.2), а какая из них применима — зависит от категории сейсмического проектирования и от конфигурации сооружения (§12.5.3, §12.5.4). Инструмент этого не решает: проверьте применимость, прежде чем ставить флажок.</div>", "g.asceorto.t": "ASCE 7 — ортогональные эффекты", "g.ascerho.b": "<p>Это два параметра, которые <strong>инструмент не определяет</strong> и определить не может: они зависят от конструктивной системы и от категории сейсмического проектирования.</p><p><strong>ρ — redundancy factor, коэффициент избыточности несущей системы (§12.3.4).</strong> Должен быть получен по §12.3.4, который в ряде случаев предписывает ρ = 1,3. Инструмент не проверяет условия, при которых допускается ρ = 1,0: он использует введённое вами значение как есть. Если оставить поле пустым, принимается 1,0 и выводится предупреждение.</p><p><strong>Ω<sub>0</sub> — коэффициент сверхпрочности.</strong> Приведён в Tab. 12.2-1 в зависимости от несущей системы. Он нужен для сочетаний с E<sub>mh</sub> = Ω<sub>0</sub>·Q<sub>E</sub>, требуемых для некоторых элементов. Ω<sub>0</sub> = 1 не означает автоматически «отсутствие сверхпрочности».</p><div class=\"gnote\">§12.4.3 допускает ограничивать E<sub>mh</sub> значением, вытекающим из несущей способности пластифицирующегося элемента. <strong>Это ограничение инструментом не применяется</strong>.</div>", "g.ascerho.t": "ASCE 7 — ρ и Ω₀", "g.ascesisma.b": "<p>В ASCE 7 сейсмическое воздействие не задаётся одной величиной. Эффект E складывается из двух частей:</p><ul><li><strong>E<sub>h</sub> = ρ·Q<sub>E</sub></strong> — горизонтальный эффект, где Q<sub>E</sub> — то, что вы получаете из расчёта</li><li><strong>E<sub>v</sub> = 0,2·S<sub>DS</sub>·D</strong> — вертикальный эффект, который <em>не</em> является отдельной нагрузкой: он пропорционален постоянной</li></ul><p>Поэтому E<sub>v</sub> не выводится отдельным столбцом: он включается в коэффициент воздействий типа D, прибавляясь в сочетаниях 6, 8 и 9 и вычитаясь в 7 и 10. К воздействиям типа F он не применяется.</p><p>Если оставить S<sub>DS</sub> пустым, E<sub>v</sub> принимается равным нулю, и инструмент сообщает об этом. Флажок «E<sub>v</sub> = 0» служит для явного объявления этого выбора, как это допускается для фундаментов при альтернативных сочетаниях IBC и в случаях §12.4.2.2.</p><div class=\"gnote\">Q<sub>Ex</sub> и Q<sub>Ey</sub> должны быть эффектами, уже полученными из расчёта и отнесёнными к <strong>одной и той же величине отклика</strong>.</div>", "g.ascesisma.t": "ASCE 7 — сейсмика", "g.doppiosegno.b": "<p>Это воздействия, входящие в <em>каждое</em> сочетание с фиксированным коэффициентом и в обоих направлениях. Каждое знакопеременное воздействие удваивает число сочетаний: n таких воздействий умножают его на 2ⁿ.</p><p>Типичный случай — <strong>эквивалентные геометрические несовершенства</strong> (EN 1993-1-1 §5.3), которые следует прикладывать в направлении, усугубляющем рассматриваемый эффект. Если значение получено из уже умноженных на коэффициенты нагрузок (F = φ·N<sub>Ed</sub>), то коэффициент для предельных состояний по несущей способности равен 1, а для предельных состояний по эксплуатационной пригодности обычно составляет 1/γ<sub>Q</sub>.</p><div class=\"gnote\">Значение коэффициента и применимость к каждому предельному состоянию <strong>остаются решением проектировщика</strong>: учёт несовершенств зависит от метода расчёта и от принятой модели.</div>", "g.doppiosegno.t": "Знакопеременные воздействия (±)", "g.ecazioni.b": "<p>Каждое постоянное воздействие имеет тип: <strong>G1</strong> — конструктивное, <strong>G2</strong> — неконструктивное, <strong>P</strong> — предварительное напряжение. Тип определяет применяемые частные коэффициенты надёжности.</p><p>Поле <strong>группа происхождения</strong> служит для реализации принципа единого источника (EN 1990 §6.4.3.2(4)): постоянные воздействия, имеющие одно и то же физическое происхождение, должны получать <em>все</em> γ<sub>sup</sub> либо <em>все</em> γ<sub>inf</sub>, смешение направлений недопустимо. Если нескольким воздействиям задано одно и то же имя группы, они меняются вместе и в переборе учитываются как одно.</p><p>Для предварительного напряжения коэффициент γ<sub>P</sub> принят равным 1,0, если специальной оценкой не установлено иное (NTC 2018 §2.6.1; см. также §4.1.8.1.1 для γ<sub>P</sub>=1,2 на локальных анкеровках).</p>", "g.ecazioni.t": "EC0 / NTC — постоянные воздействия", "g.eccezionale.b": "<p>Значение A<sub>d</sub> (удар, взрыв, пожар) должно быть определено специальным анализом особого воздействия: инструмент его не определяет.</p><p>Для <strong>NTC 2018</strong> уравнение 2.5.6 предписывает ψ<sub>2</sub> для <em>всех</em> переменных воздействий, без доминирующего переменного.</p><p>Для <strong>EN 1990</strong> есть выбор: eq. 6.11b с ψ<sub>2</sub> для всех либо eq. 6.11a с одним доминирующим переменным воздействием при ψ<sub>1</sub>, что соответствует расчёту «во время» события — например, при продолжающемся пожаре.</p>", "g.eccezionale.t": "Особое сочетание", "g.ecgruppi.b": "<p>У переменных воздействий есть <strong>два независимых поля группы</strong>, которые служат разным целям.</p><ul><li><strong>Связанная группа</strong>: воздействия с одинаковым именем всегда действуют совместно и в одной и той же роли, как если бы это было одно воздействие. Пример: снеговая нагрузка, рассчитанная автоматически, и снеговая нагрузка, заданная вручную на части покрытия.</li><li><strong>Взаимоисключающая группа</strong>: воздействия с одинаковым именем являются альтернативами друг другу, в сочетании активно не более одного. Пример: ветер в направлении X и ветер в направлении Y либо температурное расширение и укорочение.</li></ul><p>Два уровня сочетаются между собой: связанная группа может быть <em>одной из альтернатив</em> взаимоисключающей группы. Отнесение воздействий одной связанной группы к разным взаимоисключающим группам противоречиво, и инструмент помечает это красным.</p><div class=\"gnote\"><strong>Два флажка независимости</strong> определяют, сколько сочетаний будет создано. При их отключении получается минимальный набор (все постоянные воздействия неблагоприятные, все переменные активны с поочерёдной сменой доминирующего); при их включении каждое воздействие может быть также благоприятным или исключённым, и число сочетаний растёт как 2ⁿ. При наличии взаимоисключающей группы и отключённой независимости одна из альтернатив присутствует <em>всегда</em>.</div>", "g.ecgruppi.t": "EC0 / NTC — группы переменных воздействий", "g.ecminima.b": "<p>Это вспомогательное сочетание: постоянные воздействия в благоприятном направлении с минимальными γ, все переменные равны нулю. Оно нужно для исследования минимума огибающей, обычно в задачах отрыва.</p><div class=\"gnote\"><strong>Оно не заменяет расчёт EQU.</strong> При проверке равновесия каждое воздействие должно быть классифицировано как стабилизирующее или дестабилизирующее применительно к конкретному механизму, причём стабилизирующими могут быть и переменные воздействия. Эта вспомогательная функция не делает этого за вас.</div>", "g.ecminima.t": "EC0 / NTC — минимальное сочетание", "g.ecnorma.b": "<p>Европейский расчётный модуль <strong>генеративный</strong>: он применяет правило γ<sub>G</sub>·G + γ<sub>Q</sub>·Q<sub>k1</sub> + Σ γ<sub>Q</sub>·ψ<sub>0</sub>·Q<sub>ki</sub>, поочерёдно назначая доминирующим каждое из активных переменных воздействий.</p><p>Для <strong>NTC 2018</strong> подход выбирается по Tab. 2.6.I: EQU — для равновесия, A1 — для расчётов конструкций (наиболее частый случай для зданий), A2 — для геотехнических расчётов.</p><p>Для <strong>EN 1990 (общий случай)</strong> выбирается уравнение: одно 6.10 либо огибающая 6.10a/6.10b. В 6.10b неблагоприятные постоянные воздействия снижаются коэффициентом ξ, здесь принятым равным 0,85 по рекомендации CEN: <strong>применимое Национальное приложение может задать иное значение</strong>, проверьте это.</p><div class=\"gnote\">При подходе A2 инструмент применяет только коэффициенты к воздействиям. Полный геотехнический расчёт требует также коэффициентов к характеристикам грунта (M1/M2) и к сопротивлениям (R1/R2/R3), которые здесь не формируются.</div>", "g.ecnorma.t": "EC0 / NTC — подход", "g.ecsisma.b": "<p>Введите сейсмические эффекты Ex, Ey и Ez, уже полученные из расчёта. При заполнении только одного направления получаются два сочетания ±E.</p><p>При нескольких направлениях по умолчанию каждое рассматривается раздельно. При включении <strong>правила 30 %</strong> (NTC 2018 §7.3.5) компоненты чередуются: одна с коэффициентом 1,00, остальные с 0,30, со всеми комбинациями знаков.</p><div class=\"gnote\">Ex, Ey и Ez должны быть эффектами, отнесёнными к <strong>одной и той же расчётной величине</strong>. Инструмент складывает скаляры: он не выполняет векторного сложения сейсмических воздействий.</div>", "g.ecsisma.t": "EC0 / NTC — сейсмика", "g.export.b": "<p>В <strong>представлении «Матрица»</strong> загружения размещаются по столбцам, а сочетания по строкам, коэффициенты — в ячейках. Кнопка копирования выгружает всё в формате TSV: результат вставляется прямо в Excel или в МКЭ-программы, которые импортируют текст с табуляцией. Таблица на экране усечена из соображений производительности, но в копируемые данные всегда попадают все сочетания.</p><p><strong>Десятичный разделитель</strong> действует для представления «Матрица» и для копирования: запятая — для Excel русской/европейской локали, точка — для МКЭ-программ и для Excel английской локали.</p><p>Коэффициенты выгружаются с четырьмя знаками после разделителя, поскольку они являются произведениями нескольких множителей: ξ·γ<sub>G</sub> равно 1,1475, и округление до 1,15 внесло бы ошибку.</p><p><strong>Отчёт PDF</strong> формирует документ с указанием нормативного документа, принятых при генерации допущений, загружений, коэффициентов, использованных уравнений в развёрнутом виде и всех сочетаний, после чего открывает окно печати браузера: выберите «Сохранить как PDF». Благодаря приведённым в развёрнутом виде уравнениям документ поддаётся проверке получателем без доступа к самому инструменту.</p>", "g.export.t": "Экспорт результатов", "g.ibc.b": "<p>С 2021 года IBC исключил из §1605 собственные копии сочетаний по прочности и базовых сочетаний ASD, отослав к ASCE 7. Сохранён <strong>альтернативный</strong> набор ASD, eq. 16-1 ÷ 16-6, который данный инструмент формирует по запросу. Редакция следует выбранной редакции ASCE: 7-16 → IBC 2021, 7-22 → IBC 2024.</p><p>Множитель ω из IBC 2021 <strong>исключён</strong>: ветер входит просто как 0,6W.</p><p>Повышение допускаемых напряжений на 1/3 самим IBC не предоставляется: §1605.2 отсылает к норме по материалу. AISC 360 (сталь) и TMS 402 (каменная кладка) его отменили, ACI 318 метод ASD не предусматривает. На практике оно сохраняется для древесины, где, однако, механизм реализуется коэффициентом C<sub>D</sub> по NDS, и для несущей способности оснований.</p><div class=\"gnote\"><strong>Этот раздел помечен как экспериментальный.</strong> Уравнения 16-1 ÷ 16-4 проверены; 16-5 и 16-6 содержат собственную трактовку инструмента в части учёта E<sub>v</sub>. Сверьте их с официальной редакцией IBC, прежде чем использовать в расчёте.</div>", "g.ibc.t": "IBC — альтернативные сочетания ASD", "g.limiti.b": "<p>Границы применения стоит обозначить прямо.</p><ul><li><strong>Не определяет нагрузки.</strong> Нормативные значения, сейсмические эффекты, особые воздействия задаёте вы, получая их из расчёта.</li><li><strong>Не выполняет проверок</strong> прочности, устойчивости или эксплуатационной пригодности.</li><li><strong>Складывает скалярные величины</strong>, отнесённые к одной и той же величине. Векторов не складывает.</li><li><strong>Не знает, уместно ли то или иное загружение</strong> в данном сценарии: он раскрывает предусмотренные уравнением альтернативы для заданных вами типов, но применимость остаётся вашей оценкой.</li><li><strong>Для ASCE 7 охватывает ядро Chapter 2</strong>: базовые сочетания (§2.3.1, §2.4.1) и сейсмические (§2.3.6, §2.4.5). Вне охвата остаются паводок (§2.3.2 / §2.4.2), атмосферное обледенение (§2.3.3 / §2.4.3), эффекты стеснённых деформаций T (§2.3.4 / §2.4.4), неуказанные нагрузки (§2.3.5), чрезвычайные события (§2.5) и живучесть — сопротивление прогрессирующему обрушению (§2.6).</li><li><strong>Для геотехнических расчётов</strong> применяет только коэффициенты к воздействиям, но не к характеристикам грунта и не к сопротивлениям.</li></ul><div class=\"gnote\">Два недавних нормативных положения взяты из институциональных источников, а не из платного текста ASCE: коэффициент 0,1S в сочетании 9 по §2.4.5 редакции 7-22 (официальная презентация ICC по 2024 IBC / ASCE 7-22 и презентация SEAU) и Исключение 3 к §2.3.1 об использовании W<sub>T</sub> (руководство NIST/FEMA по нагрузкам от торнадо). Если того требует проект, сверьте их с официальным изданием.</div>", "g.limiti.t": "Чего инструмент не делает", "g.start.b": "<p>Инструмент формирует сочетания нагрузок для расчётов конструкций. Он не вычисляет нагрузки и не выполняет проверок: он комбинирует значения, которые задаёте вы.</p><ul><li><strong>Выберите нормативный документ</strong> вверху: NTC 2018, EN 1990 (общий случай), ASCE 7-22 или ASCE 7-16. Панель слева изменится соответственно, поскольку эти два подхода устроены по-разному.</li><li><strong>Введите загружения</strong> с их нормативными значениями.</li><li><strong>Смотрите результаты</strong> справа: они обновляются при каждом изменении, кнопки «сформировать» нет.</li><li><strong>Экспортируйте</strong> через представление «Матрица» (копирование в формате TSV для Excel или для МКЭ-программы) либо через отчёт PDF.</li></ul><div class=\"gnote\"><strong>Инструмент складывает скалярные величины.</strong> Все введённые значения должны относиться к одной и той же расчётной величине: складывать реакцию с моментом бессмысленно. Если нужна огибающая по нескольким величинам, выполните отдельный сеанс для каждой величины.</div><p>Данные остаются в вашем браузере и не передаются ни на какой сервер. После закрытия и повторного открытия страницы вы найдёте их на месте.</p>", "g.start.t": "Первые шаги", "guida.chiudi": "Закрыть", "guida.titolo": "Руководство пользователя", "help.apri": "Открыть руководство по этому разделу", "hint.asce": "Загружения не заданы.", "hint.doppioSegno": "Знакопеременные воздействия не заданы.", "hint.matrice": "Столбцы = загружения · строки = сочетания · ячейки = коэффициенты. Вставьте в Excel или в МКЭ-программу.", "hint.permanenti": "Постоянные воздействия не заданы.", "hint.variabili": "Переменные воздействия не заданы.", "lbl.approccioEC": "Уравнение (EN 1990, Annex A1)", "lbl.approccioNTC": "Подход (Tab. 2.6.I NTC 2018)", "lbl.decimale": "Десятичный разделитель (представление «Матрица» и копирование)", "lbl.dominante": "{nome} доминирующее", "lbl.eccNtc": "Ad + постоянные + переменные при ψ2", "lbl.metodo": "Метод", "lbl.nessunoParen": "(нет)", "lbl.ruoloH": "Роль H", "lbl.soloPermanenti": "только постоянные", "lbl.tuttiPsi2": "Все переменные воздействия при ψ2", "lbl.unicaVariabile": "единственное переменное воздействие", "lbl.unita": "Единицы измерения (только отображение)", "msg.valoriMancanti": "введите все нормативные значения для получения численного результата", "nota.f": "Загружения типа F получают тот же коэффициент, что и постоянная нагрузка D, как предписано примечаниями к §2.3.1 / §2.4.1.", "nota.h": "Для загружений типа H норма различает три ситуации: давление, усиливающее основной эффект (1,6H для Strength Design, 1,0H для ASD), давление постоянное и сопротивляющееся (0,9H / 0,6H) и давление сопротивляющееся, но непостоянное, которое следует принимать равным нулю. Какая из них верна, зависит от рассматриваемой проверки и остаётся оценкой проектировщика.", "nota.hRuoli": "Роль, назначенная загружениям H:", "nota.lRidotta": "Применено Исключение 1 к §2.3.1: коэффициент при L равен 0,5 в сочетаниях 3 и 4.", "nota.parentesi722": "В 7-22 скобки больше не выносятся за общий множитель: снеговая нагрузка уже приведена к уровню предельного состояния, поэтому каждая альтернатива несёт собственный коэффициент.", "nota.tornadoASD": "<strong>Применено исключение по торнадо:</strong> в сочетании 6a, где используется W<sub>T</sub>, скобка 0,75(L<sub>r</sub> или 0,7S или R) сводится к 0,75(L<sub>r</sub> или R) — торнадо является явлением тёплого сезона, и снеговая нагрузка с ним не совместна.", "nota.tornadoLRFD": "<strong>Применено Исключение 3 к §2.3.1:</strong> в сочетании 4a, где используется W<sub>T</sub>, скобка (0,5L<sub>r</sub> или 0,3S или 0,5R) сводится к 0,5(L<sub>r</sub> или R) — торнадо является явлением тёплого сезона, и снеговая нагрузка с ним не совместна.", "nota.troncElenco": "Список усечён до {cap} сочетаний из {tot} из соображений производительности; максимум и минимум выше вычислены по полному набору.", "nota.troncMatrice": "Таблица усечена до {cap} строк из {tot} из соображений производительности; кнопка копирования всё равно выгружает все сочетания.", "note.asceCarichi": "Каждому загружению назначается нормативный тип: коэффициент определяется уравнением, а не вами. Можно задать несколько загружений одного типа: они получают одинаковый коэффициент и остаются отдельными столбцами матрицы.", "note.asceSis": "В ASCE 7 сейсмика не задаётся одной величиной: E складывается из E<sub>h</sub> = ρ·Q<sub>E</sub> и E<sub>v</sub> = 0,2·S<sub>DS</sub>·D. Введите полученный из расчёта эффект Q<sub>E</sub> и параметры ниже.", "note.doppioSegno": "Воздействия, входящие в <em>каждое</em> сочетание с фиксированным коэффициентом и в обоих направлениях (±). Типичный случай — эквивалентные геометрические несовершенства (EN 1993-1-1 §5.3). Значение коэффициента и применимость к каждому предельному состоянию остаются решением проектировщика.", "note.ds": "Знакопеременные воздействия ({g}) входят в каждое сочетание в обоих направлениях.", "note.geoA2": "Это только коэффициенты к воздействиям (Tab. 2.6.I, столбец A2); полный расчёт GEO требует также коэффициентов к характеристикам грунта (M1/M2) и к сопротивлениям (R1/R2/R3), которые данным инструментом не формируются.", "note.gruppiEsc": "Взаимоисключающие группы ({g}): альтернативы группы исключают друг друга, в сочетании активно не более одной.", "note.gruppiPerm": "Постоянные воздействия одного происхождения ({g}) получают все γ,sup либо все γ,inf (EN 1990 §6.4.3.2(4)).", "note.gruppiSol": "Связанные группы ({g}): воздействия группы всегда действуют совместно и в одной и той же роли, как если бы это было одно воздействие.", "note.metodo": "LRFD и ASD — <strong>взаимоисключающие</strong> методы расчёта: «Оба» формирует два набора для сравнения или для документации, а не потому, что проверку надо вести по обоим сразу.", "note.omega": "Ω<sub>0</sub> — <strong>коэффициент сверхпрочности</strong>, приведённый в Tab. 12.2-1. Инструмент его не определяет и не применяет ограничение по несущей способности согласно §12.4.3.", "note.orto": "Правило 100/30 <strong>не является универсальным</strong>: §12.5 различает независимую направленную процедуру и ортогональное сочетание, а какая из них применима — зависит от категории сейсмического проектирования и от конфигурации сооружения.", "note.permIndip": "Каждое постоянное воздействие рассматривается как благоприятное или неблагоприятное независимо от остальных.", "note.rho": "ρ — это <strong>redundancy factor</strong> (коэффициент избыточности несущей системы): определяется по §12.3.4. Инструмент <strong>не проверяет</strong> условия, при которых допускается ρ = 1,0, и не выбирает его за вас.", "note.sismica": "Заполните одно направление для простого сочетания (±E) либо несколько направлений: по умолчанию они рассматриваются раздельно.", "note.tutteComb": "Формируются все получающиеся сочетания (отключается на панели слева).", "note.unTerzo": "Повышение допускаемых напряжений на 1/3 разрешено <em>только</em> с альтернативными сочетаниями IBC и <em>только</em> если это допускает норма по материалу: AISC 360 и TMS 402 его отменили, ACI 318 метод ASD не предусматривает.", "note.varFond": "Каждое переменное воздействие может быть доминирующим, сопутствующим (ψ0) либо благоприятным и исключённым (0), независимо от остальных.", "note.varFreq": "Каждое переменное воздействие может быть доминирующим (ψ1), сопутствующим (ψ2) либо благоприятным и исключённым, независимо от остальных.", "note.varNoDom": "Каждое переменное воздействие может быть активным (ψ2) либо благоприятным и исключённым, независимо от остальных.", "note.varRara": "Каждое переменное воздействие может быть доминирующим (полное значение), сопутствующим (ψ0) либо благоприятным и исключённым, независимо от остальных.", "opt.G1": "G1 — конструктивное", "opt.G2": "G2 — неконструктивное", "opt.P": "P — предварительное напряжение", "opt.both": "Оба (LRFD + ASD)", "opt.punto": "Точка — МКЭ-программы / Excel с английской локалью", "opt.virgola": "Запятая — Excel с европейской локалью", "ph.ad": "значение Ad", "ph.ex": "значение Ex", "ph.ey": "значение Ey (необяз.)", "ph.ez": "значение Ez (необяз.)", "ph.gruppo": "группа — воздействия одного происхождения (необяз.)", "ph.gruppoEsc": "взаимоисключающая группа (альтернативы)", "ph.gruppoSol": "связанная группа (всегда совместно)", "ph.nomeDs": "Название (напр. Несовершенства)", "ph.nomePerm": "Название (напр. Собственный вес)", "ph.nomeVar": "Название (напр. Полезная нагрузка)", "ph.omega": "по Tab. 12.2-1", "ph.qex": "сейсмический эффект X", "ph.qey": "сейсмический эффект Y (необяз.)", "ph.rho": "по §12.3.4", "ph.sds": "напр. 0.85", "ph.valCar": "норм. значение", "ph.valCarQk": "норм. значение Qk", "ph.valore": "значение", "psi.ec.A": "A — Жилые помещения", "psi.ec.B": "B — Офисные помещения", "psi.ec.C": "C — Помещения с массовым пребыванием людей", "psi.ec.D": "D — Помещения торгового назначения", "psi.ec.E": "E — Склады, производственные помещения", "psi.ec.F": "F — Движение автомобилей весом ≤ 30 кН", "psi.ec.G": "G — Движение автомобилей весом свыше 30 кН до 160 кН", "psi.ec.H": "H — Покрытия", "psi.ec.custom": "Задаётся пользователем (ψ вручную)", "psi.ec.neve_altri": "Снеговая нагрузка — прочие страны CEN", "psi.ec.neve_nordic": "Снеговая нагрузка — Финляндия, Исландия, Норвегия, Швеция", "psi.ec.temperatura": "Температурные воздействия", "psi.ec.vento": "Ветровая нагрузка", "psi.ntc.A": "A — Жилые помещения", "psi.ntc.B": "B — Офисные помещения", "psi.ntc.C": "C — Помещения с массовым пребыванием людей", "psi.ntc.D": "D — Помещения торгового назначения", "psi.ntc.E": "E — Библиотеки, архивы, склады, производственные помещения", "psi.ntc.F": "F — Гаражи, автостоянки (автомобили ≤ 30 кН)", "psi.ntc.G": "G — Гаражи, автостоянки (автомобили > 30 кН)", "psi.ntc.H": "H — Покрытия (только обслуживание)", "psi.ntc.custom": "Задаётся пользователем (ψ вручную)", "psi.ntc.neve_gt1000": "Снеговая нагрузка (высота > 1000 м над уровнем моря)", "psi.ntc.neve_le1000": "Снеговая нагрузка (высота ≤ 1000 м над уровнем моря)", "psi.ntc.temperatura": "Температурные воздействия", "psi.ntc.vento": "Ветровая нагрузка", "ref.asce.assunzioni": "Допущения инструмента: комбинирует скалярные величины, отнесённые к одной и той же расчётной величине; E_v включено в коэффициент воздействий типа D и не применяется к воздействиям типа F; загружения H входят с ролью, выбранной проектировщиком из трёх предусмотренных нормой (1,6H / 1,0H, если усиливают эффект; 0,9H / 0,6H, если постоянные и сопротивляющиеся; ноль, если сопротивляющиеся, но непостоянные); ограничение E_mh по несущей способности согласно §12.4.3 не применяется; не формируются сочетания с F_a (паводок), D_i / W_i (обледенение) и с эффектами стеснённых деформаций T; данные остаются только в этом браузере (без передачи на сервер).", "ref.asce.fonti": "ASCE/SEI 7-16 и ASCE/SEI 7-22, Chapter 2 (§2.3 Strength Design, §2.4 Allowable Stress Design) и Chapter 12 (§12.4, §12.5, Tab. 12.2-1) — IBC §1605.2 для альтернативных сочетаний ASD — ASCE 7-22 Chapter 32 для нагрузки от торнадо W_T.", "ref.asce.prov": "Происхождение наиболее недавних изменений 7-22: коэффициент 0,1S в сочетании 9 по §2.4.5 — из официальной презентации ICC о 2024 IBC / ASCE 7-22 и из презентации SEAU; Исключение 3 к §2.3.1 об использовании W_T — из руководства NIST/FEMA по нагрузкам от торнадо. Ни то, ни другое не прочитано по платному тексту ASCE.", "ref.ec.assunzioni": "Допущения инструмента: комбинирует скалярные величины, отнесённые к одной и той же расчётной величине; введённые нормативные значения считаются уже выраженными в направлении, дающем наиболее неблагоприятный эффект для рассматриваемой проверки; коэффициент γP для предварительного напряжения принят равным 1,0, если специальной оценкой не установлено иное (NTC 2018 §2.6.1); данные остаются только в этом браузере (без передачи на сервер).", "ref.psi": "Коэффициенты сочетаний ψ по категориям переменных воздействий", "ref.simboli": "Обозначения", "ref.titoloAsce": "Использованные уравнения и обозначения", "ref.titoloEc": "Таблицы использованных коэффициентов", "rep.asce.assunzioni": "<strong>Допущения инструмента:</strong> инструмент комбинирует СКАЛЯРНЫЕ величины, которые все должны относиться к одной и той же расчётной величине; введённые значения считаются уже выраженными в направлении, дающем наиболее неблагоприятный эффект для рассматриваемой проверки. E<sub>v</sub> = 0,2·S<sub>DS</sub>·D включено в коэффициент воздействий типа D и не применяется к воздействиям типа F. Для загружений типа H роль выбирается проектировщиком в каждом случае из трёх предусмотренных нормой: давление, усиливающее основной эффект (1,6H для Strength Design, 1,0H для ASD), давление постоянное и сопротивляющееся (0,9H / 0,6H) и давление сопротивляющееся, но непостоянное, которое принимается равным нулю; принятая роль приведена выше вместе с загружениями. На проектировщике остаётся и применимость каждого загружения к рассматриваемой ситуации: инструмент раскрывает предусмотренные уравнением альтернативы для заданных типов, но не знает, уместна ли та или иная нагрузка в данном сценарии. Ограничение E<sub>mh</sub> по несущей способности, предусмотренное §12.4.3, не применяется. Не формируются сочетания с паводковыми нагрузками (F<sub>a</sub>, §2.3.2), с атмосферным обледенением (D<sub>i</sub>, W<sub>i</sub>, §2.3.3) и с эффектами стеснённых деформаций T (§2.3.4 / §2.4.4). Инструмент формирует сочетания нагрузок: он не заменяет ни проверок несущей способности, ни определения самих нагрузок.", "rep.asce.diff": "<strong>Учтённые различия 7-16 → 7-22:</strong> карты снеговой нагрузки на грунт пересчитаны на уровень предельного состояния по категориям риска, поэтому в Chapter 2 скобки «или» больше не выносятся за общий множитель и снеговая нагрузка несёт собственный коэффициент — 1,6(L<sub>r</sub> или S или R) превращается в (1,6L<sub>r</sub> или 1,0S или 1,6R), а 0,5(…) — в (0,5L<sub>r</sub> или 0,3S или 0,5R); в сочетаниях ASD снеговая нагрузка входит как 0,7S. Сопутствующая снеговая нагрузка в сейсмических сочетаниях по прочности меняется с 0,2S на 0,15S. Введена нагрузка от торнадо W<sub>T</sub> как альтернатива W только в тех сочетаниях, где ветер является основной нагрузкой.", "rep.asce.fonti": "ASCE/SEI 7-16 и ASCE/SEI 7-22, <em>Minimum Design Loads and Associated Criteria for Buildings and Other Structures</em>, Chapter 2 (§2.3 Strength Design, §2.4 Allowable Stress Design) и Chapter 12 (§12.4 сейсмические эффекты, §12.5 ортогональные эффекты, Tab. 12.2-1 для Ω<sub>0</sub>) — International Building Code, §1605.2 (альтернативные сочетания ASD). Нагрузка от торнадо W<sub>T</sub> введена в ASCE 7-22, Chapter 32.", "rep.asce.prov": "<strong>Происхождение двух наиболее недавних изменений 7-22:</strong> коэффициент 0,1S в сочетании 9 по §2.4.5 (было 0,75S) взят из официальной презентации ICC о 2024 IBC / ASCE 7-22 и из презентации SEAU об изменениях 7-22; Исключение 3 к §2.3.1 об использовании W<sub>T</sub> — из руководства NIST/FEMA по нагрузкам от торнадо ASCE 7-22. Ни то, ни другое не было прочитано по платному тексту ASCE: если того требует проект, сверьте их с официальным изданием.", "rep.avvertenza": "Предупреждение:", "rep.casiCarico": "Загружения", "rep.coefNorma": "Нормативные коэффициенты", "rep.coefParziali": "Частные коэффициенты надёжности γ (благоприятное / неблагоприятное)", "rep.coefPsi": "Коэффициенты сочетаний ψ по категориям", "rep.combGenerate": "Сформированные сочетания", "rep.compSis": "Сейсмическая компонента", "rep.compSismiche": "Сейсмические компоненты", "rep.ec.assunzioni": "<strong>Допущения инструмента:</strong> инструмент комбинирует СКАЛЯРНЫЕ величины, которые все должны относиться к одной и той же расчётной величине; введённые нормативные значения считаются уже выраженными в направлении, дающем наиболее неблагоприятный эффект для рассматриваемой проверки, а классификация «благоприятное/неблагоприятное» является ответственностью проектировщика для каждой проверки; коэффициент γP для предварительного напряжения принят равным 1,0, если специальной оценкой не установлено иное (NTC 2018 §2.6.1). Инструмент формирует сочетания воздействий: он не заменяет ни проверок несущей способности, ни — для геотехнических расчётов — коэффициентов к характеристикам грунта и к сопротивлениям.", "rep.ec.fonti": "D.M. от 17 января 2018 г. (NTC 2018), Cap. 2.5–2.6, Tab. 2.5.I и Tab. 2.6.I — EN 1990:2002+A1:2005 (Еврокод 0), Annex A1, Tab. A1.1 и A1.2(B) — EN 1993-1-1 §5.3 для эквивалентных геометрических несовершенств.", "rep.ec.transizione": "Идёт переход ко второму поколению Еврокодов (EN 1990:2023); на сегодняшний день NTC 2018 остаются обязательным документом в Италии. Всегда проверяйте редакцию, применимую в вашем нормативном контексте.", "rep.eccSis": "Особые и сейсмические воздействия", "rep.equazioni": "Использованные уравнения сочетаний", "rep.ev.nonInserito": "0 (S_DS не введено)", "rep.ev.zero": "0 (принято явно)", "rep.fonti": "Источники и допущения", "rep.fontiLbl": "Источники:", "rep.generato": "Сформировано {d}", "rep.gruppiIncoerenti": "воздействия связанной группы «{sol}» оказались отнесены к разным взаимоисключающим группам ({esc}); использована взаимоисключающая группа первого члена. Проверьте назначение групп.", "rep.gruppoOrigine": "Постоянные воздействия, относящиеся к одной группе происхождения ({g}), рассматриваются как одно воздействие: они получают все γ,sup либо все γ,inf, смешение направлений недопустимо (EN 1990 §6.4.3.2(4)).", "rep.inUso": "(применяется)", "rep.ipotesi": "Допущения, принятые при формировании", "rep.lblApproccio": "Подход", "rep.lblEquazione": "Уравнение", "rep.matriceTroncataPdf": "Показаны первые {cap} сочетаний из {tot}. Полный список можно экспортировать в формате TSV с помощью кнопки «Копировать таблицу» в виде Матрица.", "rep.max": "{n} сочетаний — максимум <strong>{v}</strong> ({id})", "rep.metodo": "Метод", "rep.min": "минимум <strong>{v}</strong> ({id})", "rep.normEC": "EN 1990 (Еврокод 0) — рекомендуемые значения Annex A1", "rep.normNTC": "NTC 2018 — D.M. от 17 января 2018 г.", "rep.normativa": "Нормативный документ", "rep.notaDoppioSegno": "Входят в каждое сочетание в обоих направлениях: n знакопеременных воздействий умножают число сочетаний на 2<sup>n</sup>. Направление следует выбирать таким, которое усугубляет рассматриваемый эффект. Типичный случай — эквивалентные геометрические несовершенства по EN 1993-1-1 §5.3; если значение получено из уже умноженных на коэффициенты нагрузок (F = φ·N<sub>Ed</sub>), коэффициент для предельных состояний по несущей способности равен 1,0, а для предельных состояний по эксплуатационной пригодности обычно составляет 1/γ<sub>Q</sub>. Значение коэффициента и применимость к каждому предельному состоянию остаются решением проектировщика.", "rep.notaVariabili": "γQ = {gq} для предельных состояний по несущей способности при неблагоприятных воздействиях; благоприятные переменные воздействия исключаются из сочетания (γQ,fav = 0). <em>Связанная группа</em>: воздействия, всегда действующие совместно и в одной и той же роли, учитываемые как одно воздействие. <em>Взаимоисключающая группа</em>: взаимные альтернативы, в сочетании активно не более одной; альтернативами могут быть и целые связанные группы.", "rep.opz.doppioSegno": "Знакопеременные воздействия входят в каждое сочетание в обоих направлениях (×2 на каждое)", "rep.opz.ecc": "Включено особое сочетание", "rep.opz.eccDom": "доминирующее переменное воздействие с ψ1 (eq. 6.11a)", "rep.opz.ibc": "Включены альтернативные сочетания ASD по IBC §1605.2 ({ed}), без множителя ω, исключённого в IBC 2021.", "rep.opz.lRidotta": "Применено Исключение 1 к §2.3.1: коэффициент при L равен 0,5 в сочетаниях 3 и 4 (допускается там, где L₀ ≤ 100 psf, кроме автостоянок и помещений с массовым пребыванием людей).", "rep.opz.listaFissa": "Сочетания по фиксированному перечню уравнений: нет поочерёдной смены доминирующего воздействия, нет коэффициентов ψ (понятий, которые ASCE 7 не использует).", "rep.opz.minima": "Включено автоматическое минимальное сочетание (вспомогательное, для задач отрыва)", "rep.opz.omega": "Сформированы также сочетания со сверхпрочностью, E_mh = Ω₀·Q_E при Ω₀ = {om}.", "rep.opz.ortoOff": "Сейсмические компоненты рассматриваются раздельно (±каждая), без ортогонального сочетания.", "rep.opz.ortoOn": "Применено ортогональное правило 100/30 между Q_Ex и Q_Ey (§12.5.3), со всеми комбинациями знаков.", "rep.opz.parentesi": "Скобки «или» раскрыты во все альтернативы, совместимые с заданными загружениями; уравнения, дающие одно и то же численное сочетание, объединены в одну строку с перечнем номеров уравнений.", "rep.opz.permBlocco": "Постоянные воздействия рассматриваются единым блоком (все неблагоприятные)", "rep.opz.permIndip": "Независимая классификация «благоприятное/неблагоприятное» для каждого постоянного воздействия или группы одного происхождения (2ⁿ сочетаний)", "rep.opz.r30off": "правило 30 % НЕ применено, компоненты рассматриваются по отдельности", "rep.opz.r30on": "правило 30 % применено (§7.3.5)", "rep.opz.sisEc": "Включено сейсмическое сочетание", "rep.opz.sismica": "Включены сейсмические сочетания: E_h = ρ·Q_E при ρ = {rho}; E_v = {ev}.", "rep.opz.varIndip": "Переменные воздействия с независимым состоянием (доминирующее / сопутствующее / исключённое)", "rep.opz.varSempre": "Переменные воздействия всегда активны, доминирующее назначается поочерёдно", "rep.perimetro.b": "Формируются базовые сочетания (§2.3.1 Strength Design, §2.4.1 Allowable Stress Design) и сейсмические (§2.3.6, §2.4.5, включая сочетания со сверхпрочностью).", "rep.perimetro.ibc": "Включены также альтернативные сочетания ASD по IBC §1605.2.", "rep.perimetro.no": "НЕ формируются остальные сочетания Chapter 2: {sez}. Если какое-либо из них относится к проекту, его следует добавить отдельно.", "rep.perimetro.t": "Область охвата настоящего документа.", "rep.titoloAsce": "Сочетания нагрузок", "rep.titoloEc": "Сочетания воздействий", "rep.unita": "Единицы измерения", "rep.xiNota": "В уравнении 6.10b неблагоприятный коэффициент дополнительно снижается множителем ξ = {xi} (не применяется к воздействиям типа P).", "ruoloH.breve.resist": "постоянное и сопротивляющее   /*__I18N_END__*/
  var LANG = 'it';

  function t(k){
    var d = I18N[LANG];
    if (d && d[k] !== undefined) return d[k];
    if (I18N.it[k] !== undefined) return I18N.it[k];
    return '⟨'+k+'⟩';
  }
  // Sostituzione di segnaposto: t2('avviso.x', {n:12})
  function t2(k, vars){
    var s = t(k);
    if (vars) Object.keys(vars).forEach(function(v){
      s = s.split('{'+v+'}').join(vars[v]);
    });
    return s;
  }
  function applyI18n(root){
    (root||document).querySelectorAll('[data-i18n]').forEach(function(el){
      el.innerHTML = t(el.getAttribute('data-i18n'));
    });
    (root||document).querySelectorAll('[data-i18n-title]').forEach(function(el){
      el.setAttribute('title', t(el.getAttribute('data-i18n-title')));
    });
    (root||document).querySelectorAll('[data-i18n-aria]').forEach(function(el){
      el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria')));
    });
    (root||document).querySelectorAll('[data-i18n-ph]').forEach(function(el){
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
    });
    document.documentElement.setAttribute('lang', LANG);
  }
  // Lingua iniziale: quella del browser se disponibile, altrimenti italiano.
  function linguaIniziale(){
    try{
      var salvata = localStorage.getItem('ec0-combinatore-lang');
      if (salvata && I18N[salvata]) return salvata;
    }catch(e){}
    return 'en'; // default pubblico del sito: inglese, indipendentemente dalla lingua del browser
  }

  function loadState(){
    try{
      var raw = localStorage.getItem('ec0-combinatore-v1');
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (saved && typeof saved === 'object'){
        Object.keys(state).forEach(function(k){ if (k in saved) state[k] = saved[k]; });
        var maxId = 0;
        state.permanenti.concat(state.variabili).forEach(function(a){ if (a.id > maxId) maxId = a.id; });
        uid = maxId + 1;
        // migrazione da versioni precedenti: sismica aveva un solo campo "valore" (diventa Ex)
        if (state.sismica && state.sismica.valore !== undefined && state.sismica.ex === undefined){
          state.sismica.ex = state.sismica.valore; state.sismica.ey = ''; state.sismica.ez = '';
        }
        state.sismica.ex = state.sismica.ex || ''; state.sismica.ey = state.sismica.ey || ''; state.sismica.ez = state.sismica.ez || '';
        if (state.eccezionale) state.eccezionale.domPsi1 = !!state.eccezionale.domPsi1;
        if (state.vista !== 'matrice') state.vista = 'testo';
        if (state.decimale !== '.') state.decimale = ',';
        // migrazione: campi introdotti dopo le prime versioni salvate
        if (!Array.isArray(state.doppioSegno)) state.doppioSegno = [];
        state.permanenti.forEach(function(a){ if (a.gruppo===undefined) a.gruppo=''; });
        state.variabili.forEach(function(a){
          // migrazione dal vecchio campo unico "gruppo" ai due campi solidale/esclusivo
          if (a.gruppo!==undefined && a.gruppoSol===undefined && a.gruppoEsc===undefined){
            if (a.tipoGruppo==='solidale'){ a.gruppoSol=a.gruppo; a.gruppoEsc=''; }
            else { a.gruppoEsc=a.gruppo; a.gruppoSol=''; }
            delete a.gruppo; delete a.tipoGruppo;
          }
          if (a.gruppoSol===undefined) a.gruppoSol='';
          if (a.gruppoEsc===undefined) a.gruppoEsc='';
        });
        state.doppioSegno.forEach(function(a){ if (a.id>=uid) uid=a.id+1; });
        // migrazione: modulo ASCE introdotto dopo le prime versioni salvate
        if (!state.asce || typeof state.asce !== 'object') state.asce = {};
        var asceDef = { metodo:'LRFD', lRidotta:false, ibcAlt:false, sismica:false,
                        qex:'', qey:'', sds:'', rho:'', omega:'',
                        sovraresistenza:false, orto30:false, evZero:false };
        Object.keys(asceDef).forEach(function(k){ if (state.asce[k]===undefined) state.asce[k] = asceDef[k]; });
        if (['LRFD','ASD','BOTH'].indexOf(state.asce.metodo)<0) state.asce.metodo = 'LRFD';
        if (!Array.isArray(state.asceAzioni)) state.asceAzioni = [];
        state.asceAzioni.forEach(function(a){
          if (a.id>=uid) uid=a.id+1;
          // migrazione: il ruolo di H (accresce / resiste / nullo) è introdotto in R07
          if (a.ruolo===undefined) a.ruolo = 'sfav';
        });
        // una normativa salvata che non esiste più torna al default
        if (['NTC2018','EC0','ASCE722','ASCE716'].indexOf(state.normativa)<0) state.normativa = 'EC0';
      }
    }catch(e){ /* localStorage non disponibile: si riparte da zero, nessun problema */ }
  }

  // ---------- Helpers numerici ----------
  function num(v){ var n = parseFloat(v); return isNaN(n) ? null : n; }
  function fmt(n, d){ if (d===undefined) d=2; return (Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toString().replace('.',','); }
  function fmtG(n){ return fmt(n, (n%1===0)?0:2); }
  // I COEFFICIENTI non vanno arrotondati a 2 decimali come i risultati: a 2 decimali
  // 0,525 diventa 0,53 e ξ·γG = 1,1475 diventa 1,15, e il numero mostrato non coincide
  // più con quello usato nel calcolo. Qui si tiene la stessa precisione della vista
  // matrice (4 decimali, zeri non significativi rimossi).
  function fmtCoefT(n){ var s = (Math.round(n*10000)/10000).toString(); return state.decimale===',' ? s.replace('.', ',') : s; }
